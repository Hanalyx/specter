name: Pre-Release Test Suite

# Runs the full 3-tier test suite before releases.
# Tier 1: Unit tests (go vet, go test, build)
# Tier 2: Dogfood (specter validates its own specs)
# Tier 3: Real-world validation against 12 open-source repos

on:
  # Tag push: catch-all safety net before the GitHub Release publishes.
  push:
    tags:
      - "v*"
  # PR to main: gates every working-branch → main merge before the tag exists.
  # Closes the ordering gap where Tier 3 (real-world matrix) only ran AFTER
  # tagging, by which time release.yml had already started building artifacts.
  pull_request:
    branches: [main]
    paths: ['specter/**', '.github/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: specter

jobs:
  # --- Tier 1: Unit Tests ---
  tier1-unit:
    name: "Tier 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: specter/go.mod
          cache-dependency-path: specter/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name "*.go" | grep -v vendor))
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.6.2
          working-directory: specter

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: go build -o bin/specter ./cmd/specter/

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specter-binary
          path: specter/bin/specter

  # --- Tier 2: Dogfood ---
  tier2-dogfood:
    name: "Tier 2: Dogfood"
    needs: tier1-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: specter-binary
          path: specter/bin

      - name: Make binary executable
        run: chmod +x bin/specter

      - name: Parse all specs
        run: bin/specter parse specs/*.spec.yaml

      - name: Resolve dependency graph
        run: bin/specter resolve

      - name: Run structural checks
        run: bin/specter check

      - name: Coverage thresholds
        # spec-coverage 1.15.0 C-31: coverage inherits manifest
        # settings.strictness (default `threshold`), which requires
        # .specter-results.json — same routing as sync below. Explicit
        # --strictness annotation keeps this step independent of the
        # results file.
        run: bin/specter coverage --strictness annotation

      - name: Full sync gate
        # spec-sync C-06/C-07: sync inherits manifest's
        # settings.strictness (default `threshold`), which under C-08
        # requires .specter-results.json. This Tier 2 gate is the
        # lightweight non-strict variant; Tier 1 (make dogfood-strict
        # via the ci.yml job, plus the unit-test job above) covers the
        # strict path via ingest → coverage --strict. Explicit
        # --strictness annotation keeps this step independent of the
        # results file.
        run: bin/specter sync --strictness annotation

  # --- Tier 3: Real-World Validation ---
  tier3-realworld:
    name: "Tier 3: ${{ matrix.repo }}"
    needs: tier1-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go repos
          - repo: go-chi/chi
            adapter: go
            path: "."
            min_specs: 40
            min_assertions: 50
          - repo: gofiber/fiber
            adapter: go
            path: "."
            min_specs: 85
            min_assertions: 1200
          - repo: go-playground/validator
            adapter: go
            path: "."
            min_specs: 30
            min_assertions: 100
          # Python repos
          - repo: fastapi/full-stack-fastapi-template
            adapter: python
            path: "."
            min_specs: 20
            min_assertions: 55
          - repo: pydantic/pydantic
            adapter: python
            path: "."
            min_specs: 240
            min_assertions: 4200
          - repo: django/django
            adapter: python
            path: "."
            min_specs: 700
            min_assertions: 8500
          # TypeScript/Next.js/React repos
          - repo: calcom/cal.com
            adapter: typescript
            path: packages/prisma
            min_specs: 3
            min_assertions: 20
          - repo: t3-oss/create-t3-app
            adapter: typescript
            path: "."
            min_specs: 23
            min_assertions: 0
          - repo: payloadcms/payload
            adapter: typescript
            path: packages/payload/src
            min_specs: 44
            min_assertions: 400
          - repo: trpc/trpc
            adapter: typescript
            path: packages
            min_specs: 225
            min_assertions: 1100
          - repo: TanStack/router
            adapter: typescript
            path: packages/router-core
            min_specs: 28
            min_assertions: 470
          - repo: refinedev/refine
            adapter: typescript
            path: packages/core
            min_specs: 130
            min_assertions: 1100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: specter-binary
          path: specter/bin

      - name: Make binary executable
        run: chmod +x bin/specter

      - name: Clone target repo
        run: git clone --depth 1 https://github.com/${{ matrix.repo }}.git /tmp/target-repo

      - name: Run reverse compiler
        id: reverse
        run: |
          bin/specter reverse \
            --adapter=${{ matrix.adapter }} \
            --dry-run \
            --json \
            /tmp/target-repo/${{ matrix.path }} > /tmp/result.json 2>&1 || true

      - name: Validate results
        run: |
          echo "=== Specter Reverse Compiler Results: ${{ matrix.repo }} ==="

          # Extract metrics
          SPECS=$(cat /tmp/result.json | python3 -c "import json,sys; print(json.load(sys.stdin)['summary']['SpecsGenerated'])")
          ASSERTIONS=$(cat /tmp/result.json | python3 -c "import json,sys; print(json.load(sys.stdin)['summary']['AssertionsFound'])")
          VF=$(cat /tmp/result.json | python3 -c "import json,sys; print(sum(1 for d in json.load(sys.stdin)['diagnostics'] if d['Kind']=='validation_failed'))")

          echo "Specs generated: $SPECS (min: ${{ matrix.min_specs }})"
          echo "Assertions found: $ASSERTIONS (min: ${{ matrix.min_assertions }})"
          echo "Validation failures: $VF (must be 0)"

          # Assert zero validation failures (P0 — Specter must never reject its own output)
          if [ "$VF" != "0" ]; then
            echo "::error::VALIDATION FAILURES DETECTED: $VF specs rejected"
            exit 1
          fi

          # Assert minimum spec count (catches regressions)
          if [ "$SPECS" -lt "${{ matrix.min_specs }}" ]; then
            echo "::error::REGRESSION: Only $SPECS specs generated (minimum: ${{ matrix.min_specs }})"
            exit 1
          fi

          # Assert minimum assertion count (catches regressions)
          if [ "$ASSERTIONS" -lt "${{ matrix.min_assertions }}" ]; then
            echo "::error::REGRESSION: Only $ASSERTIONS assertions found (minimum: ${{ matrix.min_assertions }})"
            exit 1
          fi

          echo "PASS: ${{ matrix.repo }} — $SPECS specs, $ASSERTIONS assertions, 0 validation failures"
