spec:
  id: spec-resolve
  version: "1.3.0"
  status: approved
  tier: 1

  context:
    system: Specter toolchain
    feature: Dependency graph builder
    description: >
      Builds a directed acyclic graph from the depends_on fields across all specs
      in a project. Detects structural graph issues that would cause downstream
      tools to produce incorrect results.
    dependencies:
      - "@dagrejs/graphlib (4.x)"
      - "semver (7.x)"
    related_specs:
      - "spec-parse.spec.yaml"
    assumptions:
      - "All input specs have been validated by spec-parse"
      - "depends_on references use spec IDs, not file paths"

  objective:
    summary: >
      Build, validate, and operate on the spec dependency graph from all
      .spec.yaml files in a project. Detect and report circular
      dependencies, dangling references, and semver version
      incompatibilities. Support read-only graph queries via flat
      sub-subcommands of `specter resolve`.
    scope:
      includes:
        - "Discover all .spec.yaml files recursively from project root"
        - "Parse each spec using spec-parse"
        - "Build directed graph (nodes = specs, edges = depends_on)"
        - "Detect circular dependencies"
        - "Detect dangling references (depends_on non-existent spec)"
        - "Detect semver range mismatches"
        - "Output: SpecGraph + diagnostics list"
        - "DOT graph output (--dot)"
        - "Mermaid graph output (--mermaid, renders in GitHub PRs)"
        - "Dangling-reference suggestions: Levenshtein closest match + suggested fix path"
        - "Read-only graph queries via `specter resolve <op>` flat sub-subcommands. First operation: `dependents <spec-id>` (reverse traversal — which specs depend on this one). Bare `specter resolve` keeps current build-and-validate behavior; presence of a sub-subcommand switches to query mode."
      excludes:
        - "Semantic conflict detection (that is spec-check)"
        - "Transitive dependency flattening"
        - "Lock file generation"

  constraints:
    - id: C-01
      description: "MUST discover .spec.yaml files recursively from the project root"
      type: technical
      enforcement: error

    - id: C-02
      description: "SHOULD respect .specterignore file if present (glob patterns, like .gitignore)"
      type: technical
      enforcement: warning

    - id: C-03
      description: "MUST detect ALL circular dependencies, not just the first one found — including overlapping cycles that share an edge or a node, and disjoint cycles. Reporting MUST be deterministic regardless of input order or map iteration order: each cycle path is rotated to start at its lexicographically smallest spec ID, and the set of cycles is sorted lexicographically. Simple-cycle enumeration is capped at 1000 cycles per resolve (dense SCCs can contain exponentially many simple cycles); the cap is deterministic because enumeration order is deterministic."
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST report the full cycle path for each circular dependency (e.g., A -> B -> C -> A)"
      type: technical
      enforcement: error

    - id: C-05
      description: "MUST detect dangling references where depends_on.spec_id does not match any discovered spec"
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST validate semver ranges in depends_on.version_range against actual spec versions"
      type: technical
      enforcement: error

    - id: C-07
      description: "MUST produce a typed SpecGraph object with nodes, edges, and topological ordering"
      type: technical
      enforcement: error

    - id: C-08
      description: "MUST NOT depend on any CLI framework — pure function from SpecAST[] to SpecGraph|Diagnostic[]"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST support --mermaid output flag that renders the dependency graph in Mermaid flowchart syntax (graph BT) for native GitHub PR rendering"
      type: technical
      enforcement: warning

    - id: C-10
      description: "MUST enrich dangling_reference diagnostics with: list of existing spec IDs, Levenshtein-distance closest match(es), and a suggested fix file path"
      type: technical
      enforcement: error

    - id: C-11
      description: "MUST support `specter resolve <op> <args...>` flat sub-subcommands for read-only graph queries. Operations land as sibling subcommands of `resolve`; the FIRST operation is `dependents <spec-id>` which performs reverse traversal of the dependency graph (returns all specs whose `depends_on` includes the given spec id). Bare `specter resolve` (no sub-subcommand) preserves the v1.x build-and-validate behavior — backward compat for v1.x callers. Cobra subcommand registration handles dispatch. Architectural decision: graph queries MUST NOT be implemented as flags on `resolve` (e.g., `--dependents`, `--callers-of`); they MUST land as sub-subcommands here. Future operations (`dependencies`, `cycles`, `roots`, etc.) follow the same pattern. Reference: `docs/roadmap/v0.13.0.md` Design Note 'Graph queries nest under specter resolve'."
      type: technical
      enforcement: error

    - id: C-12
      description: "`specter resolve dependents <spec-id>` MUST output the set of spec IDs whose `depends_on` includes `<spec-id>` (direct dependents only; transitive ancestors are NOT included in v0.13 — a future flag may add `--transitive`). When `<spec-id>` has no dependents, exit 0 with no output (an empty set is a valid result). When `<spec-id>` does not exist in the resolved graph, fail with `error: spec '<spec-id>' not found in graph` and exit non-zero. Output format: one spec_id per line, sorted lexicographically. Supports `--json` for structured output: `{\"spec_id\": \"<id>\", \"dependents\": [\"<id1>\", \"<id2>\", ...]}`."
      type: technical
      enforcement: error

    - id: C-13
      description: "MUST implement DependentsOf as a pure function in internal/resolver — no I/O, no subprocess calls. Takes (graph, spec_id) and returns []string of direct dependents."
      type: technical
      enforcement: error

  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires

  acceptance_criteria:
    - id: AC-01
      description: "Three specs with valid linear dependencies produce a correct graph"
      inputs:
        specs: ["a.spec.yaml (depends on b)", "b.spec.yaml (depends on c)", "c.spec.yaml (no deps)"]
      expected_output:
        type: "SpecGraph"
        node_count: 3
        edge_count: 2
        topological_order: ["c", "b", "a"]
      references_constraints: ["C-01", "C-02", "C-07", "C-08"]
      priority: critical

    - id: AC-02
      description: "Two specs in a cycle produce a CircularDependency diagnostic"
      inputs:
        specs: ["a.spec.yaml (depends on b)", "b.spec.yaml (depends on a)"]
      expected_output:
        type: "Diagnostic"
        kind: "circular_dependency"
        cycle_path: ["a", "b", "a"]
      references_constraints: ["C-03", "C-04"]
      priority: critical

    - id: AC-03
      description: "Spec depending on non-existent ID produces DanglingReference diagnostic with missing_dep set"
      inputs:
        specs: ["a.spec.yaml (depends on nonexistent)"]
      expected_output:
        type: "Diagnostic"
        kind: "dangling_reference"
        spec_id: "a"
        missing_dep: "nonexistent"
      references_constraints: ["C-05", "C-10"]
      priority: critical

    - id: AC-04
      description: "Spec depending on B@^1.0.0 when B is at 2.0.0 produces VersionMismatch diagnostic"
      inputs:
        specs: ["a.spec.yaml (depends on b@^1.0.0)", "b.spec.yaml (version 2.0.0)"]
      expected_output:
        type: "Diagnostic"
        kind: "version_mismatch"
        spec_id: "a"
        dependency: "b"
        required: "^1.0.0"
        actual: "2.0.0"
      references_constraints: ["C-06"]
      priority: high

    - id: AC-05
      description: "Specs with no depends_on fields produce a graph with no edges"
      inputs:
        specs: ["a.spec.yaml (no deps)", "b.spec.yaml (no deps)"]
      expected_output:
        type: "SpecGraph"
        node_count: 2
        edge_count: 0
      references_constraints: ["C-07"]
      priority: medium

    - id: AC-06
      description: "Three-node cycle (A->B->C->A) is detected with full path"
      inputs:
        specs: ["a.spec.yaml (depends on b)", "b.spec.yaml (depends on c)", "c.spec.yaml (depends on a)"]
      expected_output:
        type: "Diagnostic"
        kind: "circular_dependency"
        cycle_includes: ["a", "b", "c"]
      references_constraints: ["C-03", "C-04"]
      priority: high

    - id: AC-07
      description: "Two duplicate spec IDs produce DuplicateId diagnostic"
      inputs:
        specs: ["file1.spec.yaml (id: user-auth)", "file2.spec.yaml (id: user-auth)"]
      expected_output:
        type: "Diagnostic"
        kind: "duplicate_id"
        duplicate_id: "user-auth"
      references_constraints: ["C-07"]
      priority: high

    - id: AC-08
      description: "resolve --mermaid outputs a valid Mermaid flowchart with graph BT, node definitions, and labeled edges"
      inputs:
        specs: ["a.spec.yaml (depends on b@^1.0.0)", "b.spec.yaml (v1.0.0)"]
        flag: "--mermaid"
      expected_output:
        starts_with: "graph BT"
        contains_node_a: true
        contains_edge_with_label: "^1.0.0"
      references_constraints: ["C-09"]
      priority: high

    - id: AC-09
      description: "Dangling reference with close existing spec ID includes suggestion in diagnostic"
      inputs:
        specs: ["a.spec.yaml (depends on handler-interfac)", "handler-interface.spec.yaml"]
      expected_output:
        diagnostic_kind: "dangling_reference"
        suggestions_non_empty: true
        suggestion_includes: "handler-interface"
      references_constraints: ["C-10"]
      priority: high

    - id: AC-10
      description: "`specter resolve dependents <spec-id>` returns the set of direct dependents (specs whose depends_on includes the given spec_id), one per line sorted lexicographically. Exit 0."
      inputs:
        graph:
          - "spec-a depends_on: []"
          - "spec-b depends_on: [spec-a]"
          - "spec-c depends_on: [spec-a, spec-b]"
        command: "specter resolve dependents spec-a"
      expected_output:
        stdout_lines: ["spec-b", "spec-c"]
        exit_code: 0
      references_constraints: ["C-11", "C-12"]
      priority: critical

    - id: AC-11
      description: "`specter resolve dependents <spec-id>` for a spec with no dependents (a leaf node in the dependents-tree, i.e., nothing depends on it) emits no output and exits 0. An empty set is a valid result, not an error."
      inputs:
        graph:
          - "spec-a depends_on: []"
          - "spec-b depends_on: [spec-a]"
        command: "specter resolve dependents spec-b"
      expected_output:
        stdout_lines: []
        exit_code: 0
      references_constraints: ["C-12"]
      priority: high

    - id: AC-12
      description: "`specter resolve dependents <unknown-spec-id>` emits `error: spec '<id>' not found in graph` to stderr and exits non-zero. Unknown spec IDs are operator errors, not empty sets."
      inputs:
        graph:
          - "spec-a depends_on: []"
        command: "specter resolve dependents spec-z"
      expected_output:
        stderr_contains: "not found in graph"
        exit_code_nonzero: true
      references_constraints: ["C-12"]
      priority: high

    - id: AC-13
      description: "Bare `specter resolve` (no sub-subcommand) preserves the v1.x build-and-validate behavior. Backward compat with v1.x callers — the dependents subcommand MUST NOT shadow the parent command's existing RunE."
      inputs:
        graph: "valid 3-spec graph"
        command: "specter resolve"
      expected_output:
        builds_graph_and_emits_diagnostics: true
        no_breaking_change_for_v1_callers: true
      references_constraints: ["C-11"]
      priority: critical

    - id: AC-14
      description: "DependentsOf(graph, spec_id) is a pure function returning []string of direct dependents — no I/O, no subprocess calls. Mirrors the C-13 purity contract."
      inputs:
        graph: "in-memory SpecGraph"
        spec_id: "spec-a"
      expected_output:
        return_type: "[]string"
        determinism: "sorted lexicographically"
      references_constraints: ["C-13"]
      priority: high

    - id: AC-15
      description: "Two cycles sharing an edge (theta graph: a->x->b->a and a->y->b->a share edge b->a) are BOTH reported as separate circular_dependency diagnostics, deterministically — independent of map iteration order. Cycle paths are canonical: each path starts (and ends) at the lexicographically smallest spec ID in its cycle, and the set of cycles is sorted lexicographically. The same guarantee applies to cycles sharing a node and to disjoint cycles."
      inputs:
        specs: ["a.spec.yaml (depends on x, y)", "x.spec.yaml (depends on b)", "y.spec.yaml (depends on b)", "b.spec.yaml (depends on a)"]
      expected_output:
        type: "Diagnostic[]"
        kind: "circular_dependency"
        cycle_paths: [["a", "x", "b", "a"], ["a", "y", "b", "a"]]
        deterministic_across_runs: true
      references_constraints: ["C-03", "C-04"]
      priority: critical

  changelog:
    - version: "1.3.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: "Strengthen C-03 and add AC-15 — overlapping cycles. The previous white/grey/black DFS silently skipped edges into fully-processed (black) nodes, so two cycles sharing an edge (theta graph) dropped one cycle depending on map iteration order. C-03 now requires ALL simple cycles including edge-sharing, node-sharing, and disjoint overlaps, with deterministic canonical output (cycles rotated to start at lexicographically smallest spec ID, sorted lexicographically) and a documented enumeration cap of 1000 simple cycles per resolve."
    - version: "1.2.0"
      date: "2026-05-15"
      author: "specter-team"
      type: minor
      description: "v0.13 C4 — add `specter resolve dependents <spec-id>` query operation. Adds C-11/C-12/C-13 and AC-10..AC-14: flat sub-subcommand for read-only graph queries (reverse traversal of depends_on); bare `specter resolve` keeps v1.x build-and-validate behavior. First operation: `dependents`; future ops (`dependencies`, `cycles`, `roots`) follow the same pattern. No new top-level verb — preserves pipeline grammar parse → resolve → check → coverage → sync."
    - version: "1.1.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-09/AC-08 --mermaid output, C-10/AC-09 dangling-reference suggestions with Levenshtein matching"
    - version: "1.0.0"
      date: "2026-03-28"
      author: "specter-team"
      type: initial
      description: "Initial spec for the Specter dependency graph builder"
