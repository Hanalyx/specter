spec:
  id: spec-sync
  version: "2.1.0"
  status: approved
  tier: 2

  context:
    system: Specter toolchain
    feature: CI enforcer
    description: >
      Orchestrates all Specter tools in a single pass for CI integration.
      Runs parse, resolve, check, and coverage in sequence, reporting a
      unified pass/fail result with tier-based enforcement.
    related_specs:
      - "spec-parse.spec.yaml"
      - "spec-resolve.spec.yaml"
      - "spec-check.spec.yaml"
      - "spec-coverage.spec.yaml"

  objective:
    summary: >
      Run the full Specter validation pipeline (parse, resolve, check, coverage)
      and produce a unified pass/fail result suitable for CI gating.
    scope:
      includes:
        - "Run spec-parse on all discovered specs"
        - "Run spec-resolve on parsed specs"
        - "Run spec-check on resolved graph"
        - "Run spec-coverage on specs + test files"
        - "Unified exit code (0 = pass, 1 = fail)"
        - "Summary report of all phases"
        - "Strictness routing: `sync --strictness <level>` matches `coverage --strictness <level>` semantics for the coverage phase; `sync --strict` is an alias for `--strictness zero-tolerance` retained for backward compatibility"
        - "Sync's coverage phase delegates to the strict coverage path (`BuildCoverageReportStrict`), not the weaker `BuildCoverageReportWithResults`; ACs whose annotated tests did not pass (per `.specter-results.json`) demote, matching `coverage --strict` exactly"
        - "Missing `.specter-results.json` under strict modes (`threshold` or `zero-tolerance`) fails the coverage phase with a message naming the active strictness mode and the two remedies — run `specter ingest`, or use `--strictness annotation` for structural coverage — without attributing the requirement to a `--strict` flag the operator may not have passed"
      excludes:
        - "Git diff analysis (future: only check changed specs)"
        - "PR comment generation"
        - "Auto-fixing"

  constraints:
    - id: C-01
      description: "MUST run all four phases in order: parse, resolve, check, coverage"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST stop at the first phase that has errors (no point checking if parse fails) — unless --only <phase> is specified, in which case prerequisite phases run without halting"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST exit with code 0 only if all phases pass"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST report results from all completed phases"
      type: technical
      enforcement: error

    - id: C-05
      description: "MUST support --only <phase> flag that runs prerequisite phases silently (without halting on their failures) then runs the target phase; exit code is based solely on the target phase result"
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST support `--strictness <level>` flag accepting `annotation` | `threshold` | `zero-tolerance`. Semantics match `coverage --strictness` exactly: `annotation` counts source-comment @ac as covered (no test-result enforcement); `threshold` requires annotated ACs to have passing test results AND tier thresholds met; `zero-tolerance` requires every annotated AC's test to pass regardless of tier. The legacy `--strict` boolean flag remains as an alias for `--strictness zero-tolerance` for backward compatibility. When neither flag is provided, the strictness comes from `settings.strictness` in the manifest (default: `threshold`, per spec-manifest C-24). When both `--strict` and `--strictness` are passed, `--strictness` wins."
      type: technical
      enforcement: error

    - id: C-07
      description: "Under any strict mode (`threshold` or `zero-tolerance`), the coverage phase MUST delegate to `BuildCoverageReportStrict` — the same path `coverage --strictness <level>` uses — not to the weaker `BuildCoverageReportWithResults` path. A workspace whose annotated ACs have failing or missing test results MUST demote in `sync`'s coverage report identically to `coverage --strictness <level>`'s report."
      type: technical
      enforcement: error

    - id: C-08
      description: "Under any strict mode, if `.specter-results.json` is missing, `sync`'s coverage phase MUST fail with a message that (a) names the active strictness mode (`threshold` or `zero-tolerance`) and (b) directs the operator to EITHER run `specter ingest` first OR use `--strictness annotation` for structural coverage. The message MUST NOT attribute the requirement to a `--strict` flag: in `sync` the strictness usually comes from the manifest default rather than an explicit flag, so the `coverage --strict` wording (`--strict requires .specter-results.json`) — correct for `coverage --strict`, where the operator did pass `--strict` — misdirects the fix here. Under `annotation` mode (or when no strict flag is set), missing results is NOT an error — the manifest-level annotation-counting path proceeds."
      type: technical
      enforcement: error

    - id: C-09
      description: "Under an effective strictness of `zero-tolerance`, sync's coverage phase MUST enforce the same two zero-tolerance gates `coverage` enforces (spec-coverage C-25/C-26), in the same order: (a) any annotated AC with a results-file status other than `passed` fails the coverage phase and the process exits with code 2, even when every spec meets its tier coverage threshold; (b) any AC carrying `approval_gate: true` with an unset `approval_date` is demoted in the coverage report (spec-coverage C-39 — the report and the exit signal agree) and, when no code-2 violation is present, the process exits with code 3. Both gates apply identically under `--json` (mirroring spec-coverage C-29's text/JSON exit parity). C-03's contract is unchanged — exit 0 still means all phases passed; codes 2 and 3 refine the failure exit so CI can distinguish violation classes exactly as it can with `coverage`. Rationale: pre-1.4.0, sync routed zero-tolerance through the strict report path but gated only on tier thresholds (Summary.Failing), so a Tier 3 spec with one passing and one failing annotated AC passed sync at 50% while `coverage --strictness zero-tolerance` exited 2 on the same workspace — a false-green in the primary CI command, contradicting C-06 and AC-09."
      type: business
      enforcement: error

    - id: C-10
      description: "Sync's test-file discovery MUST apply the same per-file size cap as `check --test` (spec-check C-12, `checker.MaxTestFileBytes`, 4 MiB). Each discovered test file is stat-guarded BEFORE it is read — an oversized file is never buffered into memory. A file over the cap is skipped per-file with a stderr warning naming the file, the limit, and the actual size; the skip MUST NOT fail the run. A test file that cannot be read (I/O error) is likewise skipped with a stderr warning, not fatal. Spec files are exempt: neither `check` nor `coverage` caps spec-file reads, and sync matches that parity."
      type: technical
      enforcement: error


    - id: C-11
      description: "Exit codes MUST propagate from `coverage` to `sync` identically. For any workspace, the code `specter sync` returns for a coverage-contract failure MUST equal the code `specter coverage` returns on the same workspace, and the stderr line naming the cause MUST name the same cause. `sync` is the CI entry point, so a code that fires on `coverage` and not on `sync` means CI is told a different story from the developer who ran `coverage` locally. Rationale, per roadmap item 1A3 and `docs/EXIT_CODES.md`: a gate is fully wired only when it appears in the check, the phase result, the exit mapping, AND its ordering relative to gates that already exist. A gate wired into `coverage` alone has the first three and fails here, and the build still fails, so nothing in a normal review notices. It fails with the wrong number and the wrong sentence."
      type: technical
      enforcement: error

    - id: C-12
      description: "Every exit code the binary can emit MUST appear in `docs/EXIT_CODES.md`, and no code may be emitted from a band the document does not allocate to that purpose. This is a registry-parity rule, not a behavior rule: it fails when the code and the document disagree, in either direction. Rationale, per roadmap item 1A: three design tracks began allocating exit codes independently, which is the mechanism that double-books them. A registry nobody checks is a document, not an authority."
      type: technical
      enforcement: error
  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires
    - spec_id: spec-resolve
      version_range: "^1.0.0"
      relationship: requires
    - spec_id: spec-check
      version_range: "^1.0.0"
      relationship: requires
    - spec_id: spec-coverage
      version_range: "^1.0.0"
      relationship: requires

  acceptance_criteria:
    - id: AC-01
      description: "Valid specs with full coverage produce exit code 0"
      references_constraints: ["C-01", "C-03"]
      priority: critical

    - id: AC-02
      description: "Parse errors stop the pipeline and produce exit code 1"
      references_constraints: ["C-02", "C-03"]
      priority: critical

    - id: AC-03
      description: "Dependency errors stop the pipeline after resolve phase"
      references_constraints: ["C-02", "C-03"]
      priority: high

    - id: AC-04
      description: "Check diagnostics (errors) produce exit code 1"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-05
      description: "Coverage below tier threshold produces exit code 1"
      references_constraints: ["C-03", "C-04"]
      priority: high

    - id: AC-06
      description: "--only coverage runs all four phases but does not halt on parse/resolve/check failures; exit code reflects coverage phase only"
      inputs:
        specs: ["spec with dangling reference (resolve fails)", "coverage annotation present"]
        flag: "--only coverage"
      expected_output:
        phases_run: ["parse", "resolve", "check", "coverage"]
        exit_based_on: "coverage"
      references_constraints: ["C-05"]
      priority: high

    - id: AC-07
      description: "--only check runs parse and resolve as prerequisites without halting, then runs check; exit code reflects check phase only"
      inputs:
        specs: ["spec with parse error (parse fails)", "valid spec"]
        flag: "--only check"
      expected_output:
        phases_run_includes: ["parse", "resolve", "check"]
        exit_based_on: "check"
      references_constraints: ["C-05"]
      priority: high

    - id: AC-08
      description: "`specter sync --strictness <level>` is accepted for level ∈ {annotation, threshold, zero-tolerance}. The coverage phase uses that strictness. `sync --strict` is accepted and treated as `--strictness zero-tolerance`. When both flags are passed, `--strictness` wins."
      inputs:
        flags_tested: ["--strictness annotation", "--strictness threshold", "--strictness zero-tolerance", "--strict", "--strict --strictness threshold"]
      expected_output:
        annotation: { coverage_path: "BuildCoverageReportWithResults_or_annotation_only", strict_demotion: false }
        threshold: { coverage_path: "BuildCoverageReportStrict", strict_demotion: true }
        zero_tolerance: { coverage_path: "BuildCoverageReportStrict", strict_demotion: true, ignores_tier_thresholds: true }
        legacy_strict_alias: "treated as zero-tolerance"
        both_flags: "--strictness wins"
      references_constraints: ["C-06"]
      priority: critical

    - id: AC-09
      description: "Under `--strictness threshold` or `--strictness zero-tolerance`, sync's coverage phase produces a report identical to `coverage --strictness <level>`'s report — same demotions, same exit semantics, same per-AC status."
      inputs:
        workspace: "annotated ACs with mixed pass/fail/missing test results in .specter-results.json"
        commands_compared: ["specter coverage --strictness zero-tolerance", "specter sync --strictness zero-tolerance"]
      expected_output:
        per_ac_status_matches: true
        coverage_report_identical: true
      references_constraints: ["C-07"]
      priority: critical

    - id: AC-10
      description: "Under `--strictness threshold` or `--strictness zero-tolerance`, when `.specter-results.json` is missing, sync's coverage phase fails with a message that (a) names the active strictness mode, (b) references `specter ingest` as one remedy, and (c) offers `--strictness annotation` as the alternative remedy. The message MUST NOT claim `--strict` was required, since the strictness may come from the manifest default."
      inputs:
        workspace: "valid specs, annotated tests, NO .specter-results.json file"
        command: "specter sync --strictness zero-tolerance"
      expected_output:
        exit_code_nonzero: true
        message_names_strictness_mode: true
        message_mentions_specter_ingest: true
        message_offers_strictness_annotation: true
        message_does_not_reference_strict_flag: true
      references_constraints: ["C-08"]
      priority: critical

    - id: AC-11
      description: "Under `--strictness annotation` (or with no strict flag set), missing `.specter-results.json` is NOT an error. The annotation-counting coverage path proceeds and the command succeeds if annotation thresholds are met."
      inputs:
        workspace: "valid specs, annotated tests, NO .specter-results.json file, --strictness annotation"
      expected_output:
        exit_code_zero_when_annotation_thresholds_met: true
        no_missing_results_error: true
      references_constraints: ["C-06", "C-08"]
      priority: high

    - id: AC-12
      description: "Tier 3 spec with two annotated ACs where `.specter-results.json` marks AC-01 `passed` and AC-02 `failed`: `specter sync --strictness zero-tolerance` fails the coverage phase and exits with code 2, even though 50% coverage meets the Tier 3 threshold. The phase message names the zero-tolerance violation (not a threshold failure). `specter coverage --strictness zero-tolerance` on the same workspace also exits 2 — the two commands agree. Under `--strictness threshold`, the same workspace passes sync (demoted coverage 50% meets the Tier 3 threshold of 50%)."
      inputs:
        workspace: "Tier 3 spec, ACs AC-01 (passed) + AC-02 (failed in results), both annotated"
        commands: ["sync --strictness zero-tolerance", "sync --strictness zero-tolerance --json", "coverage --strictness zero-tolerance"]
      expected_output:
        sync_exit_code: 2
        json_exit_code: 2
        phase_message_names_zero_tolerance: true
        matches_coverage_exit: true
        threshold_mode_passes: true
      references_constraints: ["C-06", "C-09"]
      priority: critical

    - id: AC-13
      description: "Workspace where every annotated AC's test passed but one AC carries `approval_gate: true` with an unset `approval_date`: `specter sync --strictness zero-tolerance` demotes that AC in the coverage report, fails the coverage phase, and exits with code 3. `specter coverage --strictness zero-tolerance` on the same workspace also exits 3. Under `--strictness threshold`, `approval_gate` remains metadata-only and sync passes."
      inputs:
        workspace: "spec with AC-01 approval_gate: true, no approval_date; results mark AC-01 passed"
        commands: ["sync --strictness zero-tolerance", "sync --strictness zero-tolerance --json", "coverage --strictness zero-tolerance"]
      expected_output:
        sync_exit_code: 3
        json_exit_code: 3
        report_demotes_gated_ac: true
        matches_coverage_exit: true
        threshold_mode_passes: true
      references_constraints: ["C-07", "C-09"]
      priority: critical

    - id: AC-14
      description: "A discovered test file larger than `checker.MaxTestFileBytes` (4 MiB) is skipped by `sync` with a stderr warning that names the file and contains `exceeds` and `skipping`; the file is never read into memory. The run does not fail because of the skip: sync exits 0 and the coverage phase counts annotations from the remaining (in-cap) test files."
      inputs:
        workspace: "valid spec with AC-01, one test file > 4 MiB, one small test file annotating AC-01"
        command: "specter sync --strictness annotation"
      expected_output:
        exit_code: 0
        warning_names_oversized_file: true
        warning_contains: ["exceeds", "skipping"]
        coverage_counts_remaining_files: true
      references_constraints: ["C-10"]
      priority: high


    - id: AC-15
      description: "A coverage-contract exit code fires identically on `sync` and on `coverage`. The assertion runs both commands on one workspace and compares the integer AND the stderr line naming the cause, for each condition that produces a code above 1. Conditions covered: under `settings.strictness: zero-tolerance`, an annotated criterion whose result is not `passed`, which is code 2; and under a declared `settings.annotation` block with `permissive: false`, a criterion with no test at all, which is also code 2 with a different cause. Comparing the integer alone is not sufficient and the criterion says so: two different causes share code 2, so an implementation that returns the right number for the wrong reason passes an integer check. This is what `bugs/SP-SP-058` records: the annotation rule returned 2 on `coverage` and 1 on `sync` for the same workspace."
      inputs:
        workspace: "one spec, one annotated criterion with a failing result, one criterion with no test"
        conditions: ["strictness: zero-tolerance", "annotation block with permissive: false"]
      expected_output:
        sync_code_equals_coverage_code: true
        sync_cause_line_equals_coverage_cause_line: true
      references_constraints: ["C-11"]
      priority: critical

    - id: AC-16
      description: "Every exit code the binary can emit is registered. The assertion scans `cmd/specter/` for `os.Exit` calls, resolves each argument to an integer per AC-17, collects the distinct values, and asserts each appears as a row in `docs/EXIT_CODES.md`. It also asserts the converse for the codes the document marks Stable: each must be reachable from some `os.Exit` in the tree. The scan's scope is stated here because it is a static scan: it reads `cmd/specter/*.go` excluding `_test.go` files, which is where every exit in this binary is made. A code emitted from `internal/` would not be found, and that is a known limit rather than an oversight; if one is ever added there, this criterion must widen with it."
      inputs:
        scan_scope: "cmd/specter/*.go excluding _test.go, every os.Exit call with its argument resolved per AC-17"
        registry: "docs/EXIT_CODES.md rows"
      expected_output:
        every_emitted_code_is_registered: true
        every_stable_registered_code_is_emitted: true
      references_constraints: ["C-12"]
      priority: high

    - id: AC-17
      description: "The scan resolves an `os.Exit` argument that is a named constant, and refuses one it cannot resolve. An argument that is a bare identifier is looked up among the `const` declarations in the scan scope and contributes that constant's value. An argument the scan cannot resolve to an integer fails the scan with an error naming the site, and is never skipped. The scan also reports how many exit sites it resolved, and that count MUST equal the number of `os.Exit(` calls in scope, so a site that matched nothing cannot pass as a site that was checked. Rationale, per `bugs/SP-SP-069`: the first implementation matched `os.Exit(` followed by literal digits only. `specter diff --exit-code` returns the named constant `exitDiffBreaking`, so that site was invisible, C-12 went unenforced for it, and `docs/EXIT_CODES.md` came to contradict the binary in five places while this criterion reported green. A scan that skips what it cannot read is indistinguishable from a scan that found nothing to skip, which is why refusal rather than omission is the rule."
      inputs:
        exit_argument_kinds: ["integer literal", "named constant declared in scope", "unresolvable expression"]
        scan_scope: "cmd/specter/*.go excluding _test.go"
      expected_output:
        named_constant_resolves_to_its_value: true
        unresolvable_argument_fails_the_scan: true
        resolved_site_count_equals_exit_call_count: true
      references_constraints: ["C-12"]
      priority: high

    - id: AC-18
      description: "The registry-parity converse is decidable, and the rules it needs are stated here rather than left to the test that runs them. Three rules. (a) A row counts as Stable when its Standing cell is exactly `Stable`. A substring match is wrong: `Shipped, overloaded, frozen` and `Accidental collision` are the other values in use, and neither is a weaker form of stable. (b) A code is required to be reachable when at least one of its rows is Stable. Standing is a property of a row while the converse is a claim about a code, and code 2 carries three rows of which two are Stable and one is an accidental collision. Requiring every row to be Stable would exempt code 2, which is emitted and must be required. (c) Code 0 is exempt, because success is returned by `RunE` returning nil and never through `os.Exit`, so no scan of exit calls can reach it. The exemption MUST be guarded: the assertion fails if code 0 ever appears in the scanned set, because an `os.Exit(0)` would make the exemption wrong and nothing else would say so. The converse is green against a correct registry, so it MUST carry a differential precondition: the same check, run against a registry holding a Stable row that no scan can reach, MUST report that row, and the assertion MUST fail loudly rather than skip when the control does not fire. Rationale, per `bugs/SP-SP-070`: AC-16 claimed this direction in its expected_output and no test implemented it, so the pair read as enforced while half of it was not."
      inputs:
        registry_table: "docs/EXIT_CODES.md Section 1, the Code/Commands/Condition/Standing rows"
        emitted_codes: "the set the AC-17 scan produces"
      expected_output:
        stable_is_an_exact_match: true
        any_stable_row_requires_reachability: true
        code_zero_exempt_and_the_exemption_guarded: true
        control_case_reports_an_unreachable_stable_row: true
      references_constraints: ["C-12"]
      priority: high
  changelog:
    - version: "2.1.0"
      date: "2026-08-25"
      author: "specter-team"
      type: minor
      description: "AC-18 states the three rules the registry-parity converse needs, so the test that runs it is not the place they are decided. Stable is an exact match on the Standing cell, any Stable row makes its code required-reachable, and code 0 is exempt with the exemption guarded by an assertion that fails if anything ever emits it. The converse is green against a correct registry, which is why the criterion also requires a differential precondition: a control registry holding an unreachable Stable row must be reported, and the assertion must fail loudly rather than skip when the control does not fire. Per `bugs/SP-SP-070`: AC-16 claimed this direction and nothing implemented it. AC-16 is untouched, so this is additive rather than another major."
    - version: "2.0.0"
      date: "2026-08-25"
      author: "specter-team"
      type: major
      description: "AC-17 states how an `os.Exit` argument that is not an integer literal is handled: a bare identifier resolves through the `const` declarations in scope, an argument that cannot be resolved fails the scan rather than being skipped, and the resolved site count MUST equal the number of `os.Exit(` calls in scope. Major rather than minor because of one field: AC-16's `inputs.scan_scope` read `literal os.Exit(N)`, and a test conforming to that input contract does not conform to the new one. `specter diff` classifies the change as breaking on that field alone; the same edit to the description classifies as patch, and AC-17 on its own classifies as additive. Filed as `bugs/SP-SP-069`: the literal-only scan could not see `os.Exit(exitDiffBreaking)`, so C-12 went unenforced for code 10 and `docs/EXIT_CODES.md` came to contradict the binary in five places while AC-16 reported green. AC-16's `every_stable_registered_code_is_emitted` claim is deliberately left untouched. No test implements it, which is a separate defect and not this one."
    - version: "1.7.0"
      date: "2026-08-23"
      author: "specter-team"
      type: patch
      description: "C-09(b) cited `spec-coverage GH #94 semantics` for a rule spec-coverage did not state. spec-coverage 1.19.0 states it as C-39, and the reference now points there. No behavior change; the dangling citation is the defect."
    - version: "1.6.0"
      date: "2026-08-22"
      author: "specter-team"
      type: minor
      description: "Roadmap item 1A4, the exit-code parity test. C-11 states the propagation contract 1A3 recorded: a coverage-contract code fires identically on sync and on coverage, cause line included. C-12 states the registry-parity rule: every code the binary emits appears in docs/EXIT_CODES.md, and every Stable row is reachable. AC-15 compares the cause line and not only the integer, because two conditions now share code 2 and an integer check would pass an implementation returning the right number for the wrong reason. AC-16 states its scan scope in its own text, since it is a static scan and its blind spot is a property of that scope. AC-15 is red on arrival: bugs/SP-SP-058 records that the annotation rule returns 2 on coverage and 1 on sync for the same workspace, which is the eighth instance of the un-swept fix pattern and was found by running this criterion before writing it."
    - version: "1.5.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: "Add C-10/AC-14: sync's test-file discovery applies the same per-file size cap as `check --test` (spec-check C-12, checker.MaxTestFileBytes, 4 MiB) — stat-guard before read, skip oversized files per-file with a stderr warning, never fail the run on the skip. Also: unreadable test files warn and skip instead of being silently ignored. Closes the gap left by the v0.13 hardening commit (8b76961), which guarded check, coverage, and explain but never touched sync's read loop — a large test artifact could OOM the primary CI command. Spec files remain uncapped, matching check/coverage parity."
    - version: "1.4.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: "Add C-09 + AC-12/AC-13 — close the zero-tolerance false-green gap. Pre-1.4.0, sync routed `zero-tolerance` through BuildCoverageReportStrict (C-07) but its only coverage gate was the tier-threshold check (Summary.Failing > 0): a Tier 3 spec with one passing and one failing annotated AC passed sync at 50% while `coverage --strictness zero-tolerance` exited 2 on the same workspace, and approval_gate violations (spec-coverage C-26) were never checked or demoted in sync at all. C-09 requires sync's coverage phase to enforce both zero-tolerance gates with the same exit codes (2 for non-passed annotated ACs, 3 for approval_gate violations), the same report demotion, and the same text/JSON parity as coverage — making AC-09's 'same exit semantics' explicit and mechanical. Found during the 2026-06-11 six-finding review (finding 1)."
    - version: "1.3.0"
      date: "2026-06-10"
      author: "specter-team"
      type: minor
      description: "Amend C-08/AC-10: sync's missing-.specter-results.json message now names the active strictness mode and offers `--strictness annotation` as an alternative remedy, instead of reusing coverage's `--strict requires ...` wording verbatim. The old message attributed the requirement to a `--strict` flag the operator never passed — under sync the strictness usually comes from the manifest default `threshold` — which misdirected the fix. Also corrects C-06's stale parenthetical: the manifest default is `threshold` (per spec-manifest C-24), not `annotation`. Driven by external adopter (Kensa) feedback on the v0.13 sync strict-coverage explainer. Behavior of `coverage --strict` is unchanged."
    - version: "1.2.0"
      date: "2026-05-15"
      author: "specter-team"
      type: minor
      description: "Add C-06/C-07/C-08 and AC-08..AC-11 — close the strict-mode gap between sync and coverage. sync now supports --strictness <annotation|threshold|zero-tolerance> matching coverage --strictness semantics; --strict remains as zero-tolerance alias. The coverage phase delegates to BuildCoverageReportStrict under any strict mode (was BuildCoverageReportWithResults, the weaker path). Missing .specter-results.json under strict modes fails with the same error message as coverage --strict. v0.13 cycle Section B."
    - version: "1.1.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-05/AC-06/AC-07: --only <phase> flag for targeted phase execution without halting on prerequisites"
    - version: "1.0.0"
      date: "2026-03-28"
      author: "specter-team"
      type: initial
      description: "Initial spec for the Specter CI enforcer"
