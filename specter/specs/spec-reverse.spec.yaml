spec:
  id: spec-reverse
  version: "1.7.0"
  status: draft
  tier: 2

  context:
    system: Specter toolchain
    feature: Reverse compiler — extract draft specs from existing code
    description: >
      Solves the cold-start problem for SDD adoption. Given existing source code
      and test files, the reverse compiler extracts draft .spec.yaml files by
      detecting validation schemas, test assertions, route definitions, and
      import relationships. Uses a plugin adapter architecture so each language
      (TypeScript, Python, Go) has its own extraction logic while the core
      engine handles assembly, gap detection, and validation.
    dependencies:
      - "gopkg.in/yaml.v3 (YAML output)"
      - "internal/parser (round-trip validation)"
      - "internal/schema (SpecAST types)"
    related_specs:
      - "spec-parse"
      - "spec-coverage"
    assumptions:
      - "Source code uses well-known frameworks (Zod, Pydantic, Go struct tags)"
      - "Test files follow standard naming conventions per language"
      - "Extraction is regex-based for v1.0 — no AST parsing, no AI"
      - "Generated specs always have status: draft and require human review"

  objective:
    summary: >
      Extract draft .spec.yaml files from existing codebases by analyzing source
      code for validation constraints, test files for acceptance criteria, and
      import graphs for dependencies. Flag untested constraints as gaps.
    scope:
      includes:
        - "Adapter interface for language-specific extraction"
        - "TypeScript adapter: Zod schemas, Jest/Vitest tests, Next.js/Express routes"
        - "Python adapter: Pydantic models, pytest tests, FastAPI/Django routes"
        - "Go adapter: struct validate tags, _test.go files, net/http/gin/chi routes"
        - "Core engine: assemble SpecAST from adapter output"
        - "Gap detection: constraints without corresponding test assertions"
        - "Spec ID generation from file/module names"
        - "Provenance tracking via generated_from metadata"
        - "Output validation via parser.ParseSpec() round-trip"
        - "Auto-detection of language adapter from file extensions"
        - "Summary report after extraction: counts of constraints, assertions, gaps, and files needing attention"
        - "Handoff line pointing first-time users at `specter explain <spec-id>` to triage gaps in each generated draft"
      excludes:
        - "AI-assisted gap filling or context generation"
        - "Tree-sitter or full AST parsing"
        - "Custom adapter plugins loaded at runtime"
        - "OpenAPI/Swagger ingestion"
        - "Database schema extraction"
        - "Watch/incremental mode"

  constraints:
    - id: C-01
      description: "MUST define an Adapter interface with methods: Name, Detect, IsTestFile, SourceKeyForTest, ExtractRoutes, ExtractConstraints, ExtractAssertions, ExtractImports, InferSystemName"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST assemble valid schema.SpecAST objects from adapter output with all required fields populated (id, version, status, tier, context, objective, constraints, acceptance_criteria)"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST set status to 'draft' and populate generated_from metadata (source_file, test_files, extraction_date) on all reverse-compiled specs"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST detect gaps — constraints found in code that have no corresponding test assertion — and generate ACs with gap: true"
      type: business
      enforcement: error

    - id: C-05
      description: "MUST generate spec IDs in kebab-case matching pattern ^[a-z][a-z0-9-]*$ from file or module names"
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST validate all generated YAML by round-tripping through parser.ParseSpec() before output"
      type: technical
      enforcement: error

    - id: C-07
      description: "MUST auto-detect the appropriate adapter from file extensions when no --adapter flag is provided"
      type: technical
      enforcement: error

    - id: C-08
      description: "MUST NOT depend on any CLI framework or perform I/O — pure function from []SourceFile to ReverseResult"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST support three built-in adapters: typescript, python, go"
      type: business
      enforcement: error

    - id: C-10
      description: "MUST generate auto-numbered constraint IDs (C-01, C-02) and AC IDs (AC-01, AC-02) with no gaps"
      type: technical
      enforcement: error

    - id: C-11
      description: "MUST correctly extract test descriptions containing escaped quotes (e.g., it(\"user's token is valid\") or it('reject \"admin\" role'))"
      type: technical
      enforcement: error

    - id: C-12
      description: "MUST set FileName to a path that mirrors the source directory structure relative to the scan root — e.g. a source file at src/auth/login.ts produces FileName 'auth/login.spec.yaml', not 'login.spec.yaml'"
      type: technical
      enforcement: error

    - id: C-13
      description: "After successful extraction (non-empty result, not --json mode), `specter reverse` MUST emit a single-line summary to stdout AFTER the per-spec output blocks: `Found N constraints, M assertions, K gaps across P file(s).` where N is the total constraint count across all generated specs, M is the total assertion (AC reference) count, K is the count of ACs with `gap: true`, P is the number of source files that produced at least one spec. Counts are zero when nothing was extracted; in that case the summary line is omitted (the existing 'no specs extracted' messaging already covers the empty case)."
      type: business
      enforcement: error

    - id: C-14
      description: "After the C-13 summary line (and only when at least one spec was generated, non-empty result), `specter reverse` MUST emit a handoff line: `Run \\`specter explain <first-spec-id>\\` to triage gaps in each generated draft.` where <first-spec-id> is the id of the lexicographically-first generated spec (or any deterministic choice; first-by-creation-order is acceptable as long as the choice is reproducible across runs over identical input). The line is suppressed under --json output to keep machine-readable output clean. Rationale: closes the v0.2 carry-over UX gap where `reverse` ended silently and left first-time users without a next-step."
      type: business
      enforcement: warning

    - id: C-15
      description: "Every constraint `specter reverse` writes MUST omit the `enforcement` key, so the tier default applies. This covers both the constraints extracted from source and the placeholder constraint synthesized when extraction found none (the schema requires `minItems: 1`). Rationale: `enforcement` overrides the tier-based severity `spec-check` assigns to a diagnostic about that constraint, and the schema documents it as opt-in (\"Omit to use the tier default\"). Generated specs are `status: draft` and `tier: 3`, both of which say the spec is not yet load-bearing; stamping `enforcement: error` contradicts that and makes every unreferenced generated constraint fail `check` at error severity. A constraint that no acceptance criterion references is an expected state of a draft, not a build failure. An author who later decides a specific constraint is always-error sets the key themselves."
      type: technical
      enforcement: error

    - id: C-16
      description: "Spec ids MUST be unique within a single `specter reverse` run. When two groups produce the same id, every member of the colliding set is disambiguated by prepending parent directory segments of its source path, adding one segment at a time until the set is distinct, and skipping any segment the id already carries so a generic-filename id is not doubled. A path with no segments left takes a numeric suffix instead. Disambiguation MUST be deterministic: the same set of files produces the same ids regardless of the order they were supplied in. Each id that changes MUST produce an `id_collision` diagnostic at warning severity naming the original id and the files involved, because the operator's id no longer matches the obvious basename and nothing else would tell them."
      type: technical
      enforcement: error

    - id: C-17
      description: "Under file grouping, a test file MUST be grouped with the source file it tests, when the adapter can name that source and that source is present in the input. The adapter names it through `SourceKeyForTest`, which returns the source path, or an empty string when it cannot map the test. A test file whose mapping is unknown, or whose named source is absent from the input, forms its own group as it does today. Rationale: gap detection (C-04) runs over one group, so a source file grouped apart from its test is compared against zero assertions and every constraint it carries is reported UNTESTED even when a test for it exists in the tree. Directory grouping already places colocated files in one group and is unchanged. A test file held in a separate `__tests__` or `tests` directory is out of scope for this constraint, because directory grouping puts it in a group of its own."
      type: technical
      enforcement: error

    - id: C-18
      description: "`--json` selects the report format and MUST NOT decide whether files are written. Only `--dry-run` suppresses writing. `specter reverse --json` therefore writes generated specs to the output directory exactly as a non-JSON run does, including the default output directory when `-o` is not given, and honors the existing skip-on-exists rule. `--json --dry-run` writes nothing and still reports. Under `--json`, stdout MUST carry exactly one JSON document and no other bytes: the per-spec GENERATED and SKIPPED lines go to stderr, which extends AC-19's pure machine-readable output to the write path. A write error is reported on stderr and exits non-zero with no JSON on stdout, matching what the non-JSON path does when a write fails mid-loop. Rationale: `-o` was accepted and silently ignored under `--json`, so the command reported specs generated and left the directory empty, at exit 0."
      type: technical
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: "Go source file with struct validate tags produces spec with constraints"
      inputs:
        source_file: "handler.go with `validate:\"required,min=1,max=100\"` struct tags"
        adapter: "go"
      expected_output:
        constraints_count: 3
        constraint_rules: ["required", "min", "max"]
        status: "draft"
      references_constraints: ["C-01", "C-02", "C-09"]
      priority: critical

    - id: AC-02
      description: "Go test file with t.Run sub-tests produces ACs"
      inputs:
        test_file: "handler_test.go with t.Run(\"returns 200 on valid input\", ...)"
        adapter: "go"
      expected_output:
        ac_count: 1
        ac_description: "returns 200 on valid input"
      references_constraints: ["C-01", "C-02"]
      priority: critical

    - id: AC-03
      description: "TypeScript Zod schema produces constraints with field names and rules"
      inputs:
        source_file: "schema.ts with z.object({ email: z.string().email(), age: z.number().min(18) })"
        adapter: "typescript"
      expected_output:
        constraints_count: 2
        fields: ["email", "age"]
        rules: ["format", "min"]
      references_constraints: ["C-01", "C-02", "C-09"]
      priority: critical

    - id: AC-04
      description: "Jest test with describe/it blocks produces ACs"
      inputs:
        test_file: "auth.test.ts with it('returns 401 when unauthorized', ...)"
        adapter: "typescript"
      expected_output:
        ac_count: 1
        ac_description: "returns 401 when unauthorized"
      references_constraints: ["C-01", "C-02"]
      priority: critical

    - id: AC-05
      description: "Python Pydantic model with Field validators produces constraints"
      inputs:
        source_file: "models.py with name: str = Field(min_length=1, max_length=255)"
        adapter: "python"
      expected_output:
        constraints_count: 2
        rules: ["min", "max"]
      references_constraints: ["C-01", "C-02", "C-09"]
      priority: critical

    - id: AC-06
      description: "Pytest function produces AC"
      inputs:
        test_file: "test_auth.py with def test_returns_403_for_non_admin():"
        adapter: "python"
      expected_output:
        ac_count: 1
        ac_description: "returns 403 for non admin"
      references_constraints: ["C-01", "C-02"]
      priority: critical

    - id: AC-07
      description: "Constraint without matching test assertion produces gap AC"
      inputs:
        source_file: "schema.ts with z.string().email()"
        test_file: "schema.test.ts with NO email validation test"
      expected_output:
        gap_ac_count: 1
        gap: true
        priority: "high"
      references_constraints: ["C-04"]
      priority: critical

    - id: AC-08
      description: "Spec ID generated from file path in kebab-case"
      inputs:
        file_path: "src/UserRegistration.ts"
      expected_output:
        spec_id: "user-registration"
      references_constraints: ["C-05"]
      priority: high

    - id: AC-09
      description: "Generated YAML passes parser.ParseSpec() validation"
      inputs:
        source_file: "any valid source with at least one constraint and one test"
      expected_output:
        parse_result_ok: true
      references_constraints: ["C-06"]
      priority: critical

    - id: AC-10
      description: "Generated spec includes generated_from provenance metadata"
      inputs:
        source_file: "handler.go"
        test_files: ["handler_test.go"]
      expected_output:
        generated_from:
          source_file: "handler.go"
          test_files: ["handler_test.go"]
          extraction_date: "2026-04-02"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-11
      description: "Auto-detect selects Go adapter for directory with .go files"
      inputs:
        files: ["main.go", "handler.go", "handler_test.go"]
      expected_output:
        adapter: "go"
      references_constraints: ["C-07"]
      priority: high

    - id: AC-12
      description: "Auto-detect selects TypeScript adapter for directory with .ts files"
      inputs:
        files: ["index.ts", "schema.ts", "auth.test.ts"]
      expected_output:
        adapter: "typescript"
      references_constraints: ["C-07"]
      priority: high

    - id: AC-13
      description: "Constraint and AC IDs are auto-numbered sequentially"
      inputs:
        source_file: "file with 3 constraints and 2 tests"
      expected_output:
        constraint_ids: ["C-01", "C-02", "C-03"]
        ac_ids: ["AC-01", "AC-02"]
      references_constraints: ["C-10"]
      priority: high

    - id: AC-14
      description: "Core engine is a pure function with no I/O"
      inputs:
        function: "reverse.Reverse()"
      expected_output:
        no_file_reads: true
        no_cli_deps: true
      references_constraints: ["C-08"]
      priority: high

    - id: AC-15
      description: "Jest/Vitest test descriptions with escaped or embedded quotes are extracted correctly"
      inputs:
        test_file: "auth.test.ts with it(\"user's token is valid\") and it('reject \\\"admin\\\" role')"
      expected_output:
        ac_descriptions: ["user's token is valid", "reject \"admin\" role"]
      references_constraints: ["C-11"]
      priority: high

    - id: AC-16
      description: "Source file in a subdirectory produces FileName with mirrored subdirectory path"
      inputs:
        source_file: "auth/login.ts (relative to scan root)"
        group_by: "file"
      expected_output:
        file_name: "auth/login.spec.yaml"
      references_constraints: ["C-12"]
      priority: high

    - id: AC-17
      description: "After extracting 2 specs from 2 source files (total: 5 constraints, 8 assertions, 1 gap), `specter reverse` (non-JSON mode) emits a single line `Found 5 constraints, 8 assertions, 1 gap across 2 file(s).` AFTER the per-spec output blocks."
      inputs:
        extracted_specs:
          - "auth.spec.yaml: 3 constraints, 5 assertions, 0 gaps, source=auth/login.ts"
          - "users.spec.yaml: 2 constraints, 3 assertions, 1 gap, source=users/list.ts"
      expected_output:
        summary_line: "Found 5 constraints, 8 assertions, 1 gap across 2 file(s)."
        position: "after per-spec output, before handoff"
      references_constraints: ["C-13"]
      priority: high

    - id: AC-18
      description: "When at least one spec is generated and the command is not --json, `specter reverse` MUST emit a handoff line directing the operator at `specter explain <id>` for gap triage."
      inputs:
        extracted_specs: ["auth.spec.yaml", "users.spec.yaml"]
        json_mode: false
      expected_output:
        handoff_line_emitted: true
        handoff_line_contains: "specter explain"
        handoff_references_a_generated_spec_id: true
      references_constraints: ["C-14"]
      priority: high

    - id: AC-19
      description: "Under --json output mode, the C-13 summary line and C-14 handoff line are BOTH suppressed — JSON callers consume the structured payload only. Pure machine-readable output."
      inputs:
        extracted_specs: ["auth.spec.yaml"]
        json_mode: true
      expected_output:
        summary_line_emitted: false
        handoff_line_emitted: false
      references_constraints: ["C-13", "C-14"]
      priority: high

    - id: AC-20
      description: "Generated spec YAML carries no `enforcement` key on any constraint, on both the extracted-constraint path and the synthesized-placeholder path. Asserted against the marshaled YAML rather than the struct field, because an empty string field and an absent key are different documents and only the second one takes the tier default."
      inputs:
        case_a: "source file with validation rules, so constraints are extracted from it"
        case_b: "source file with no extractable constraints, so the minItems placeholder is synthesized"
      expected_output:
        yaml_contains_enforcement_key: false
        placeholder_constraint_emitted: true
        constraint_count_minimum: 1
      references_constraints: ["C-15"]
      priority: high

    - id: AC-21
      description: "Two source files with the same basename in different directories produce two distinct spec ids, and the resulting set of specs contains no duplicate id."
      inputs:
        source_files: ["internal/coverage/coverage.go", "internal/diff/coverage.go"]
        both_yield_basename: "coverage"
      expected_output:
        distinct_ids: true
        duplicate_ids_in_result: 0
        ids_derive_from_path_segments: true
      references_constraints: ["C-16"]
      priority: high

    - id: AC-22
      description: "Disambiguation is deterministic. The same set of files supplied in a different order produces the same id for the same file, so a second run over an unchanged tree does not rename anything."
      inputs:
        run_a_order: ["internal/coverage/coverage.go", "internal/diff/coverage.go"]
        run_b_order: ["internal/diff/coverage.go", "internal/coverage/coverage.go"]
      expected_output:
        id_per_source_file_is_identical_across_runs: true
      references_constraints: ["C-16"]
      priority: high

    - id: AC-23
      description: "Every id changed by disambiguation produces an `id_collision` diagnostic at warning severity, naming the id that collided. Without it the operator has no way to learn that the generated id is not the basename."
      inputs:
        source_files: ["internal/coverage/coverage.go", "internal/diff/coverage.go"]
      expected_output:
        diagnostic_kind: "id_collision"
        diagnostic_severity: "warning"
        diagnostic_names_original_id: "coverage"
      references_constraints: ["C-16"]
      priority: high

    - id: AC-24
      description: "A source file and its test produce one spec, not two, and that spec carries both the constraints extracted from the source and the acceptance criteria derived from the test's assertions. A test file whose source is absent from the input still produces its own spec."
      inputs:
        source_files: ["user.go with two validate tags"]
        test_files: ["user_test.go asserting one of them", "orphan_test.go whose source is not supplied"]
      expected_output:
        spec_count: 2
        merged_spec_has_constraints: true
        merged_spec_has_test_derived_criteria: true
        orphan_test_still_produces_a_spec: true
      references_constraints: ["C-17"]
      priority: high

    - id: AC-25
      description: "A constraint whose test is present in the input is not reported as a gap. Grouped apart from its assertions, gap detection compares the constraint against an empty assertion list and marks it UNTESTED, which is a false gap rather than a missing one."
      inputs:
        source_file: "user.go declaring Name as required"
        test_file: "user_test.go with a case asserting a missing name is rejected"
      expected_output:
        gap_count_for_the_tested_constraint: 0
      references_constraints: ["C-17", "C-04"]
      priority: high

    - id: AC-26
      description: "`specter reverse --json -o DIR` writes the generated spec files to DIR, and stdout parses as exactly one JSON document with no other bytes preceding or following it."
      inputs:
        flags: ["--json", "-o DIR"]
        source_files: ["a source file the adapter can extract from"]
      expected_output:
        files_written_to_dir: true
        stdout_is_exactly_one_json_document: true
        per_spec_lines_on_stdout: false
      references_constraints: ["C-18"]
      priority: high

    - id: AC-27
      description: "`specter reverse --json --dry-run -o DIR` writes nothing and still emits the JSON report. `--dry-run` is the only flag that suppresses writing."
      inputs:
        flags: ["--json", "--dry-run", "-o DIR"]
      expected_output:
        files_written_to_dir: false
        json_report_emitted: true
      references_constraints: ["C-18"]
      priority: high

    - id: AC-28
      description: "When a write fails under `--json`, the error goes to stderr and the command exits non-zero with no JSON document on stdout, so a consumer cannot read a partial run as a successful one."
      inputs:
        flags: ["--json", "-o DIR"]
        condition: "DIR cannot be created, because a plain file occupies its path"
      expected_output:
        exit_code_nonzero: true
        stdout_empty: true
        error_on_stderr: true
      references_constraints: ["C-18"]
      priority: medium

  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires

  changelog:
    - version: "1.7.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-18/AC-26..28: `--json` selects the report format and does not suppress writing; only `--dry-run` does. Closes SP-061. `--json` returned above the write loop, so `reverse --json -o DIR` reported SpecsGenerated and wrote nothing, at exit 0. Stdout stays a single JSON document because the per-spec lines move to stderr."
    - version: "1.6.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-17/AC-24/AC-25 and extend C-01 with SourceKeyForTest: under file grouping a test file joins the source it tests. Closes SP-063. Every file was its own group, so a source file's constraints were compared against zero assertions and all of them were reported UNTESTED. Measured on the 12-repo corpus: go-playground/validator reported 86 constraints, 105 assertions and 86 gaps, every constraint flagged untested in a repository that tests them."
    - version: "1.5.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-16/AC-21..23: spec ids are unique within a run, disambiguated deterministically by path, and each rename is reported. Closes SP-060. Ids came from the file basename, with the parent directory prepended only for basenames on a hardcoded allowlist of generic names. Collisions come from domain vocabulary the allowlist cannot anticipate. Measured on the 12-repo real-world corpus: 10 of 12 repositories produced a workspace `resolve` rejected, 422 colliding ids in one of them."
    - version: "1.4.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-15/AC-20: generated constraints omit `enforcement` so the tier default applies. Closes SP-062. `reverse` stamped `enforcement: error` on every constraint it wrote, including the synthesized placeholder, which overrode the tier-3 `info` default and made every unreferenced generated constraint an error. Measured on the 12-repo real-world corpus: the two repositories whose output cleared `resolve` both failed `check`, 37 and 61 diagnostics, all `orphan_constraint`, none at info."
    - version: "1.3.0"
      date: "2026-05-15"
      author: "specter-team"
      type: minor
      description: "v0.13 C5+C6 — `specter reverse` UX polish. Add C-13/AC-17 (summary line after extraction: counts of constraints, assertions, gaps, file count). Add C-14/AC-18 (handoff line pointing at `specter explain <id>` for gap triage). Both suppressed under --json (AC-19). Closes the pre-v0.3 carry-over where `reverse` ended silently and left first-time users without a next step."
    - version: "1.2.0"
      date: "2026-04-16"
      author: "specter-team"
      type: minor
      description: "Add C-12/AC-16: FileName must mirror source directory structure to avoid flat-file sprawl"
    - version: "1.1.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-11/AC-15: correct extraction of test descriptions with embedded or escaped quotes"
    - version: "1.0.0"
      date: "2026-04-02"
      author: "specter-team"
      type: initial
      description: "Initial spec for the reverse compiler with adapter plugin architecture"
