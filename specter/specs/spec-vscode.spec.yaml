spec:
  id: spec-vscode
  version: "5.1.0"
  status: draft
  tier: 2

  context:
    system: Specter toolchain
    feature: VS Code extension for spec-driven development
    description: >
      A VS Code extension that makes Specter a first-class citizen in the editor.
      The core tension it resolves: AI agents naturally consume Specter's
      machine-readable output; human developers need a richer, more contextual
      representation of the same information. The extension serves both — it is
      the human collaborator's window into AI-native specification infrastructure.

      Architecture: TypeScript extension (~800 lines), thin wrapper over the specter
      CLI JSON API. No LSP process. Per-workspace SpecterClient instances. On-save
      full diagnostics, on-type parse-only feedback, transparent binary auto-download.

    assumptions:
      - "The specter CLI is the source of truth — extension logic never reimplements pipeline rules"
      - "All AI features degrade gracefully when no LM API is available"
      - "The extension activates only in workspaces containing specter.yaml or *.spec.yaml"
      - "TypeScript is the implementation language; no bundled Go binary"
      - ".spec.yaml files remain valid YAML — no custom language ID required"
    dependencies:
      - "vscode engine ^1.85.0"
      - "fsnotify (via specter binary)"
      - "github.com/fsnotify/fsnotify (already in specter binary)"
    related_specs:
      - "spec-parse"
      - "spec-coverage"
      - "spec-check"
      - "spec-diff"
      - "spec-sync"
      - "spec-explain"

  objective:
    summary: >
      Provide inline coverage indicators, spec diagnostics, annotation assistance,
      intent drift detection, and an AI context bridge directly in the editor —
      making the spec-to-test-to-AI feedback loop visible and actionable without
      leaving VS Code.
    scope:
      includes:
        - "Specter binary discovery and auto-download from GitHub Releases"
        - "On-save diagnostics for .spec.yaml files (parse + check)"
        - "On-type parse-only feedback with 400ms debounce"
        - "Coverage gutter decorations on both spec and test files"
        - "Hover providers: constraint linkage, AC description, spec context"
        - "Annotation completions (@spec, @ac) in test files"
        - "Go-to-definition for depends_on.spec_id and references_constraints"
        - "Tree view panel: specs → ACs → test files"
        - "Status bar item: spec count, coverage %, failing count"
        - "Human-readable insight WebviewPanel with per-spec health cards"
        - "Intent drift detection: surfaces when a spec AC changed since annotation was added"
        - "Annotation quick-fix: CodeAction to insert @spec/@ac above unannotated test functions"
        - "Copy spec context for AI command (clipboard-formatted prompt preamble)"
        - "AC suggestion heuristic (tf-idf against spec corpus, no LM call)"
        - "Frictionless onboarding walkthrough for projects with no specs"
        - "File decoration provider: tier badges and coverage health in Explorer"
      excludes:
        - "LSP server (deferred — TypeScript extension API is sufficient for v1)"
        - "JetBrains / Neovim support (separate effort)"
        - "Publishing to Open VSX (v2)"
        - "Multi-agent spec locking (requires coordination layer)"
        - "Coverage trend sparklines (v2 — needs persistent result storage)"
        - "AI confidence scoring (v2 — needs calibration data)"
        - "Human vs AI authorship indicators (v2 — git blame heuristics fragile)"

  constraints:
    - id: C-01
      description: "MUST discover the specter binary in this resolution order: workspace setting specter.binaryPath → PATH → ~/.specter/bin/specter → auto-download from GitHub Releases. MUST verify SHA256 checksum on auto-download. MUST validate the resolved binary (magic-byte check and `--version` probe) regardless of resolution source; a corrupt file on PATH must not slip through as a valid binary. MUST expose a `Specter: Re-download CLI` command and MUST surface CLI invocation failures via an output channel reachable from the status bar (never leave the UI stuck on an indefinite loading state)."
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST activate only on workspaceContains:**/specter.yaml or workspaceContains:**/*.spec.yaml — MUST NOT activate on every YAML file"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST use document selector {language: 'yaml', pattern: '**/*.spec.yaml'} — MUST NOT register a new language ID, preserving existing YAML tooling"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST run specter parse --json on type (debounced 400ms) and specter check --json + specter coverage --json on save. MUST serialize invocations per-workspace — never two concurrent specter processes against the same manifest."
      type: technical
      enforcement: error

    - id: C-05
      description: "MUST replace (not append) diagnostics atomically on each run. MUST delete diagnostics on file rename or delete. MUST maintain one DiagnosticCollection per workspace folder."
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST discover specter.yaml by walking up from the open file's directory. MUST maintain one SpecterClient per workspace folder for multi-root workspace support."
      type: technical
      enforcement: error

    - id: C-07
      description: "MUST render coverage status on each AC line in spec files: green (covered), red (uncovered). MUST render gutter icons on test functions annotated with @spec/@ac. The gray-dash rendering for `gap: true` was retracted in 5.0.0 and is deliberately absent: no code path could produce it, because `coverage --json` emits no gap criterion ids, and the extension's only caller passed an empty list. Making the promise true would render a signal that is mostly wrong, since a constraint counts as covered only when an assertion's text contains its field name (`bugs/SP-SP-064`), so most `gap: true` values on a real repository are false. This spec is the source of truth and the code is normally the thing that is wrong; here the spec promised what no code path could deliver, so the spec was the defect (`bugs/SP-SP-019`)."
      type: business
      enforcement: error

    - id: C-08
      description: "MUST provide CompletionItemProvider for // @spec and // @ac in test files, ranked by directory proximity and filename token match against spec IDs."
      type: business
      enforcement: error

    - id: C-09
      description: "MUST provide DefinitionProvider: depends_on[].spec_id → target .spec.yaml file; references_constraints[] → constraint line within current spec."
      type: business
      enforcement: error

    - id: C-10
      description: "MUST provide a TreeDataProvider panel (Specter sidebar) with hierarchy: spec file → AC nodes (with coverage icon) → test files. MUST provide a status bar item showing spec count, coverage %, and failing count. Status bar MUST use statusBarItem.warningBackground when any T1/T2 spec fails threshold."
      type: business
      enforcement: error

    - id: C-11
      description: "MUST provide a WebviewPanel (Specter Insights) rendering per-spec health cards in human language: sentence summary of what needs to be done, AC list with descriptions (not just IDs), constraint callout for uncovered ACs, last-change context from specter diff output."
      type: business
      enforcement: error

    - id: C-12
      description: "MUST detect intent drift: when a @ac annotation references an AC whose spec file has changed since the annotation was last git-committed, surface a distinct gutter icon with a hover showing the AC description at both the baseline commit and HEAD, classified as breaking/additive/patch via specter diff."
      type: business
      enforcement: error

    - id: C-13
      description: "MUST provide a CodeActionsProvider for unannotated test functions (DiagnosticSeverity.Information, not Warning). Quick fix inserts // @spec <best-guess> + // @ac AC- snippet with tab stop."
      type: business
      enforcement: error

    - id: C-14
      description: "MUST provide a 'Copy spec context for AI' command that formats the current spec's ACs and constraints as a markdown prompt preamble and copies to clipboard. MUST work with zero network calls."
      type: business
      enforcement: error

    - id: C-15
      description: "MUST provide a frictionless onboarding walkthrough (vscode Walkthrough contribution) for workspaces with no .spec.yaml files. MUST NOT show the walkthrough if specs already exist."
      type: business
      enforcement: warning

    - id: C-16
      description: "MUST provide HoverProvider for constraint IDs in spec files showing: constraint text, which ACs reference it, and whether those ACs are covered. MUST warn prominently if no AC references the constraint."
      type: business
      enforcement: error

    - id: C-17
      description: "MUST provide FileDecorationProvider for .spec.yaml nodes in the Explorer showing tier badge (T1/T2/T3) and coverage health color. MUST use VS Code ThemeIcon identifiers where available, custom SVG only for tier badges."
      type: business
      enforcement: warning

    - id: C-18
      description: "On-save diagnostic target: under 800ms for parse + check on a single file in repos under 500 specs. Coverage may complete asynchronously in a second pass. MUST use AbortController to cancel in-flight processes on deactivation."
      type: technical
      enforcement: error

    - id: C-19
      description: "MUST use non-modal notifications. Status bar update only for transient errors. showInformationMessage (non-modal, rate-limited 1/spec/60s) for T2/T3 threshold drops. showWarningMessage for breaking spec changes. showErrorMessage modal only for binary-not-found at startup."
      type: business
      enforcement: error

    - id: C-20
      description: "MUST provide AC suggestion heuristic using tf-idf scoring against the loaded spec corpus. Suggestions surface as CodeLens above unannotated test functions. MUST NOT require an LM API call or network access for this feature."
      type: technical
      enforcement: warning

    - id: C-21
      description: "The Coverage tree view MUST render a visible state message when there is no coverage data to display — whether because no specter.yaml was found in the workspace, no .spec.yaml files exist, or every spec failed to parse. The panel MUST NOT remain silently empty. The message MUST name the reason (missing manifest / no specs / parse failures) and point the user at a concrete action (specter init, specter reverse, or the Problems panel). This is the same discipline applied to the CLI's 'No .spec.yaml files found' message in v0.7.1 — no dead-end output."
      type: technical
      enforcement: error

    - id: C-22
      description: "Every command declared in package.json contributes.commands[].command MUST have a corresponding vscode.commands.registerCommand(id, handler) call in extension.ts. Parity MUST be enforced by an automated test that runs in CI. Rationale: the 'declared but unregistered' failure mode has shipped three times in seven days (specter.revealInTree, specter.runReverse, specter.openQuickStart) — a one-time test eliminates the class."
      type: technical
      enforcement: error

    - id: C-23
      description: "Every disposable resource returned by a VS Code factory function (createTextEditorDecorationType, createOutputChannel, createStatusBarItem, createTreeView, createDiagnosticCollection, createWebviewPanel, createFileSystemWatcher, registerCommand, registerHoverProvider, registerCompletionItemProvider, registerCodeLensProvider, registerDefinitionProvider, registerCodeActionsProvider, workspace.onDid*, window.onDid*) MUST be pushed to ctx.subscriptions so it is disposed on extension deactivation. Rationale: orphan disposables leak across Developer: Reload Window cycles and can produce subtle duplicate-event bugs."
      type: technical
      enforcement: error

    - id: C-24
      description: "Auto-downloaded CLI binaries MUST be installed only after SHA256 checksum verification succeeds against the checksums.txt accompanying the GitHub release. If checksums.txt is unreachable, malformed, or does not contain an entry for the exact archive being downloaded, installation MUST fail with a modal error — silent fallback to 'install without verifying' is prohibited. Rationale: the prior fallback let a MITM attacker selectively block checksums.txt while delivering a tampered archive; the extension would install it."
      type: business
      enforcement: error

    - id: C-25
      description: "Extension activation MUST resolve the CLI binary (including auto-download, subject to specter.autoDownload) even when the current workspace contains no .spec.yaml files and no specter.yaml. Commands like specter.runReverse are meaningful in an empty workspace — the user invokes them to bootstrap. Activation MUST also fire the onboarding walkthrough when the workspace has no specs and no manifest; the gate MUST NOT be placed behind a mutually-exclusive activation check."
      type: technical
      enforcement: error

    - id: C-26
      description: "Async and synchronous error paths in editor hooks (onDidChangeTextDocument, onDidSaveTextDocument, onDidChangeActiveTextEditor, hover/completion/codeLens providers, drift scanner) MUST route caught errors to the Specter Output channel with a timestamp and context string, NOT silently discard them. `catch {}`, `catch (_) {}`, and `.catch(() => {})` on promise chains that can hide real failures are prohibited."
      type: business
      enforcement: error

    - id: C-27
      description: "The CLI auto-download MUST default to the CLI version matching the extension's own version — a v0.10.0 extension fetches v0.10.0 CLI, not whatever GitHub's /releases/latest currently returns. The extension reads its own version via ctx.extension.packageJSON.version at download time. Users MAY override via specter.version: set to 'latest' to track GitHub's newest release, or pin a specific semver (e.g. '0.9.2'). Default-to-latest is prohibited because the CLI release and extension Marketplace publish are decoupled — a GoReleaser-produced CLI release fires on tag push, but the matching extension may publish days later (or not at all), creating split-brain installs where users run an older extension against a newer CLI."
      type: business
      enforcement: error

    - id: C-28
      description: "When a Specter parse diagnostic on a `.spec.yaml` file carries a message matching `Unknown field '<fieldName>'` AND `<fieldName>` is in the known-removed-fields list (initial v0.12 list: `trust_level`), the extension MUST offer a CodeAction quick-fix titled `Remove deprecated field '<fieldName>'` that, when invoked, deletes the offending line. The quick-fix applies to the single diagnostic; batch `Fix all in workspace` is a future addition. Pairs with `specter doctor --fix` for the CLI path — both apply the same `strip-trust-level` repair so editor and CLI workflows stay consistent. The matching helper MUST be runtime-free (no `vscode` imports) so it can be unit-tested without a vscode runtime shim."
      type: business
      enforcement: error

    - id: C-29
      description: "Before offering the C-28 `Remove deprecated field` CodeAction, the provider MUST inspect the diagnostic's line in the document and refuse the action when the line ends with a YAML block-scalar indicator (`: |`, `: >`, with optional chomp/indent modifiers), an empty value (key-followed-by-newline introducing a sequence/mapping), or an unterminated multi-line quoted string. Refusal MUST be silent — no action offered, no diagnostic emitted — because a delete-the-line edit on these shapes would orphan continuation lines and corrupt the file. Mirrors the migrate package's `canSafelyStripTrustLevel` predicate (spec-doctor C-15) so editor and CLI behavior agree on what is safe to auto-repair. The shape-detection helper MUST be runtime-free (no `vscode` imports)."
      type: business
      enforcement: error

    - id: C-30
      description: "Every invocation of the specter CLI that requests a machine-readable document with `--json` MUST use an invocation path that resolves on a non-zero process exit and hands the caller stdout, stderr, and the exit code. A non-zero exit MUST NOT by itself discard the document. The CLI exits non-zero whenever a run reports error-severity diagnostics, in JSON mode as well as text mode (spec-check C-14, spec-coverage C-29), so the workspace that most needs its diagnostics is the workspace whose exit code is non-zero. The rule covers every `--json` invocation the extension makes, currently `parse --json`, `check --json`, and `coverage --json`, and any added later. Invocations that read the exit code as their verdict instead of reading a document, such as the C-01 `--version` probe, are out of scope and MUST NOT be swept into this rule. The failure predicate is the absence of a parseable document, not the exit code. When stdout carries a document the client can parse, the invocation succeeded, and the document MUST be acted on rather than merely parsed: the diagnostics it reports MUST reach the per-folder DiagnosticCollection exactly as they would on a zero exit. When stdout carries no parseable document, at any exit code, the invocation failed: the client MUST route the failure to the Specter Output channel with a timestamp and context (C-26), MUST leave the existing diagnostics in place instead of replacing them with an empty set, and MUST NOT show a notification. An empty collection after a failed invocation asserts that the workspace has no problems, which is a false claim. This bounds C-05: a run that yields a parseable document replaces the collection atomically whatever its exit code, and an invocation that yields no parseable document is not such a run and MUST NOT touch the collection. A process that fails to spawn never produced a document and MUST take the same failure path; the tolerant invocation path MUST NOT absorb a spawn failure into a normal result. Deliberate cancellation through the C-18 AbortController on deactivation is not a failure and MUST NOT be reported as one. Ordinary error-severity diagnostics MUST stay silent beyond the Problems panel: no notification fires because a workspace has errors, since that would fire on every save in exactly the workspaces this rule serves. Rationale (SP-SP-023): the v0.14 `check --json` exit-code fix reached users while the client still rejected on a non-zero exit, so a workspace with one error-severity diagnostic lost its on-save diagnostics entirely, and an empty catch at the call site made the loss silent. The same defect is pre-armed on `parse --json` for when SP-SP-022 is fixed."
      type: technical
      enforcement: error

    - id: C-31
      description: >-
        Every array-valued field of a specter `--json` document MUST be an
        array on the object a `SpecterClient` method returns, and no caller of
        one of those methods MUST receive `null` or `undefined` in an array
        position.

        The guarantee is stated at that boundary rather than at "any consumer
        in the extension", which is where it used to sit and which this spec
        cannot honestly promise. Code downstream of the client rebuilds
        documents: `merged()` reconstructs a multi-root report field by field
        rather than spreading it, so a field it does not name is gone by the
        time a sidebar renders. Normalization owns the parse boundary. What
        happens to a document after a consumer starts reassembling one is that
        consumer's contract, and a rule claiming otherwise would be false at
        the first aggregation. The CLI is
        written in Go, and Go marshals a nil slice as `null` rather than `[]`
        and drops a field carrying `omitempty` rather than emitting an empty
        one. A workspace with nothing wrong in it therefore produces
        `{"diagnostics": null, "summary": {...}}` from `check --json` at exit
        0, and a spec that parses cleanly produces `{"errors": null, "file":
        ..., "ok": true, "value": {...}}` from `parse --json` at exit 0. A
        workspace where no spec parses produces `{"entries": null, ...}` from
        `coverage --json`, and a workspace where every spec parses omits
        `parse_errors` entirely. The extension MUST normalize these at the
        single point where it parses stdout into a document, before the
        document is returned to any caller, so that no consumer receives
        `null` or `undefined` where the CLI means empty. The fields are
        `diagnostics` on the check document, `errors` on the parse document,
        and `entries`, `parse_errors`, `parse_error_patterns`,
        `diagnostic_hints`, `invalid_status_warnings`, and
        `results_validation_errors` on the coverage document. The last arrives
        with `spec-coverage` 1.23.0 and C-44, which requires a stream-validation
        refusal to appear inside the emitted document rather than replacing it.
        It is converted to `resultsValidationErrors` and declared on the one
        coverage type, not merely preserved as an untyped snake-case field, because a consumer that has to reach for a
        raw key is a consumer the type does not describe.

        **Declared once, in `types.ts`.** `client.coverage()` returns
        `CoverageResult` and the extension casts that through `unknown` to
        `CoverageReport`, a separate declaration of the same document. The
        defect is compile-time contract drift, not runtime loss: a cast erases
        type information and no fields, and `normalizeReportPaths` spreads the
        object, so the value does survive. What does not survive is the
        guarantee. Two declarations of one document drift, and the `unknown`
        cast is what lets them, because it silences the compiler that would
        otherwise report the divergence. A field added to one is invisible to
        every consumer typed against the other.

        So the error element type and the array MUST be declared in `types.ts`,
        `CoverageReport` MUST carry the array, the client MUST return that
        imported type, and `CoverageResult` and the `as unknown as` bridge MUST
        both go. This is the pattern parse errors already follow.

        This criterion deliberately claims nothing about what a multi-root
        workspace does with these errors. `merged()` reconstructs the report
        field by field rather than spreading it, so an aggregated report would
        drop them, and whether validation errors from several folders should be
        concatenated, deduplicated or reported per folder is a question 3A5 does
        not answer. Recorded here so the gap reads as deferred rather than
        missed. Consumers MUST also tolerate `null` and `undefined` in those
        positions and treat them as empty, so a caller that reaches a builder
        without passing through normalization cannot throw. A document whose
        array fields are `null` is a parseable document, so it takes the C-30
        success path: a run that reports no diagnostics replaces the folder's
        collection with the empty set, exactly as a run reporting `[]` would.
        Routing a null-array document to the C-30 no-document failure path is
        prohibited, because the Problems panel would then never clear after
        the user fixes the last error. This rule is independent of whether the
        CLI later emits `[]` for an empty slice, which is a JSON-contract
        decision scheduled separately. If that lands, normalization becomes a
        no-op and nothing here changes. The guarantee is observable at one
        place, the document each client method returns. On the parse document
        that is `errors`, on the check document `diagnostics`, and on the
        coverage document the six fields named above, each under the name it
        carries after whatever key conversion the method applies. Two of the
        six, `diagnostic_hints` and `invalid_status_warnings`, have no consumer
        in the extension today and are not declared in `types.ts`. They are
        normalized anyway, so the first consumer inherits the guarantee instead
        of re-learning it. Rationale (SP-SP-025): the parse half
        was iterated with no guard from the extension's first commit on
        2026-04-16, so every save of a spec that parses cleanly threw
        `TypeError: input.parseErrors is not iterable`, a catch swallowed it,
        and the Problems panel was never populated from the on-save path. The
        check half is independently sufficient to throw on the next line.
        Every fixture in the extension's suite supplies `[]` or a populated
        array, so 273 passing tests certify a clean workspace in the one shape
        a clean workspace never has.
      type: technical
      enforcement: error

    - id: C-32
      description: >-
        Every VS Code range the extension derives from a CLI diagnostic MUST
        carry finite, non-negative integers in all four of its line and
        character positions, whatever the diagnostic omits. A parse error
        carries `path`, `type`, and `message` on every error, carries `line`
        only for a YAML syntax error, and never carries `column`, because no
        code path in the parser assigns that field. A check diagnostic carries
        `kind`, `severity`, `message`, and the spec id on every diagnostic,
        carries `constraint_id`, `constraint_type`, and `details` only when
        non-empty, and carries no position of any kind. `change_type` was in
        this list until 2026-08-27 and no longer exists: `spec-check` 2.0.0
        retracted version-change classification, so no check diagnostic can
        carry it (`bugs/SP-SP-018`).
        Where a position field is absent the extension MUST use 0, giving a
        range at the start of the file, rather than arithmetic on `undefined`.
        The extension MUST NOT read `col` or `code` from a parse error under
        those names, because the CLI names the corresponding fields `column`
        and `type`. The extension's declared TypeScript types for CLI
        documents MUST NOT declare a field the CLI never emits, and MUST NOT
        declare as required a field the CLI may omit. A declaration reads as a
        guarantee, and `tsc` then certifies code that reads `undefined`. The
        rule binds on the exact name. A declared member whose name differs
        from the key the CLI emits is a member the CLI never emits, whatever
        it was meant to mirror, unless the extension converts the document's
        keys before returning it. Both paths convert: the coverage path always
        did, and the check path gained `snakeToCamelCheck` in v0.15.0. Before
        that the check path did not, so the same declared name was correct on
        one document and wrong on the other, and every read of
        `diagnostic.specID` returned undefined. That is history, not the
        current shape, and this clause stated it in the present tense until
        2026-08-28 while requiring the conversion four sentences later. A range
        the extension publishes as a
        diagnostic, meaning a range that reaches a DiagnosticCollection and so
        the Problems panel, MUST end on the same line as its start, at
        character `Number.MAX_SAFE_INTEGER`, so the editor highlights from the
        start position to the end of that line. The rule covers the three
        places the extension builds a diagnostic range from a CLI document: a
        parse error, a check diagnostic, and a coverage parse error. Inside
        that scope a range whose end equals its start is prohibited. Ranges
        the extension builds for any other purpose are out of scope and keep
        their own shapes. A range passed as the `selection` argument of
        `vscode.open`, which the AC-39 insights cards and the AC-36 sidebar
        both build from a CLI-reported line, places a cursor rather than
        marking an extent, and zero-width is correct there. A zero-width
        range is claimed to widen to the word it lands on, but that claim is
        the code author's and was never checked in an editor, so no part of
        this rule may rest on it. A range that ends at the end of the line is
        visible whatever the editor does with an empty one. The uniform rule
        also settles a case no single site can settle alone: the same schema
        parse error reaches the Problems panel by two paths, the on-save `parse
        --json` run and the `coverage --json` refresh, so a per-site decision
        renders one error two ways depending on which run produced it. The
        check document's keys MUST be converted the way the coverage
        document's are, covering `spec_id`, `constraint_id`, and
        `constraint_type`. The last two have no consumer in the extension
        today. They are converted because `types.ts` declares `constraintID`
        and `constraintType`, and a declared member no document carries is the
        false guarantee this rule exists to prevent. That rule cuts both ways,
        which is why `change_type` came out rather than staying as a harmless
        extra: `spec-check` 2.0.0 retracted version-change classification, so
        `types.ts` MUST NOT declare `changeType`, and no conversion the client
        performs MUST produce a `changeType` key on a returned document
        (`bugs/SP-SP-018`). **The rule binds on what is declared and what is
        produced, not on the contents of a private constant.** An entry in the
        key map that maps `change_type` to itself is permitted, because it is
        observationally identical to no entry: the converter resolves an
        unmapped key to itself, so an identity entry changes no document and
        asserts nothing about one.

        **Every input key this constraint does not require to be renamed MUST
        reach the caller under its original name, and the conversion MUST NOT
        add a key to the returned object.** The renamed set is the one named
        above, `spec_id`, `constraint_id` and `constraint_type` for the check
        document; every other key passes through as itself.

        The rule is stated against the set this constraint owns, not against
        what an implementation happens to rename. "A key the conversion does
        not rename" is what this said until it was corrected, and it is
        circular: an implementation that renames `change_type` to a third name
        puts the key outside the clause by the act the clause exists to forbid,
        so the rule excuses exactly the violation it is meant to catch.

        Both halves are load-bearing, and neither implies the other. Without
        the pass-through half, forbidding only the production of `changeType`
        permits dropping `change_type` or renaming it to a third name. Without
        the no-invention half, a converter may preserve `change_type` and emit
        an extra key beside it. In each case the returned object carries a
        member `types.ts` does not declare, which is the same false-guarantee
        failure this constraint already forbids, read from the object rather
        than from the declaration. Stating this as "the key map MUST NOT carry
        `change_type`" is what the clause said until 2026-08-28, and it is a
        rule about representation that no observation can enforce and no
        reviewer can check without reading a module-private table. This spec
        has been bitten twice by exactly that: the guard for this clause was
        written first as a text search and then as a comment-stripped text
        search, and both were lexical approximations of a semantic claim.
        Rationale
        (SP-SP-025): `SpecterParseError`
        declared `col` and `code` where the CLI emits `column` and `type`, and
        `SpecterCheckDiagnostic` declared `specID`, `file`, and `line` as
        required against a document that carries `spec_id` and no position of
        any kind. The arithmetic on those fields yields `NaN`, and no test
        could see it, because the mock always supplied `line: 7` and
        `column: 3` and the suite's comparison helper never read `col`.
      type: technical
      enforcement: error

    - id: C-33
      description: >-
        The extension MUST read `stop_reason` on a coverage report before it
        interprets `entries` or `summary`, and MUST NOT present a run that
        carried one as an empty workspace or as a fully covered one.

        `spec-coverage` C-10 chose the additive shape: a refused run still emits
        `entries: []` and a zeroed summary, and those are uncomputed
        placeholders rather than measurements. That shape is indistinguishable
        from a clean empty workspace on every field except `stop_reason`, and
        this extension already keys its empty state on exactly that pair, an
        empty `entries` with no parse errors. So the producer's fix arrives here
        as a new way to be wrong: the sidebar would report "nothing to show" for
        a workspace whose manifest was rejected.

        A rule stated for a consumer inside the producer's spec is a rule
        nothing checks, which is why it is restated here against the surface
        that has to honor it. The state MUST be distinguishable to the user from
        both an empty workspace and a parse failure, and the reason MUST reach
        the Output channel, because an operator who cannot see which of the
        seven refusals fired cannot act on it.

        **The field crosses the wire boundary like every other.** The CLI emits
        `stop_reason` with `kind` and `message`; this extension speaks
        camelCase, so `SpecterClient` MUST convert it to `stopReason` through
        the same explicit map that carries `spec_id` and `parse_errors`, the
        typed `CoverageReport` MUST declare it, and the raw key MUST NOT survive
        the conversion. A document handed straight to the tree builder without
        passing through the client is not evidence: it would carry a field the
        real client never produces, and the criterion would pass while the
        product returned an untyped raw key. This is the defect the field map's
        own comment records for `spec_id`, where every access silently returned
        undefined.

        **A refusal is owned by the folder it came from.** The multi-root store
        merges per-folder reports into one, reconstructing it field by field, so
        a field not named there is dropped. One refused folder MUST NOT erase a
        successful one, and MUST remain visible with its folder named. The
        merged report therefore carries a per-folder map of refusals rather than
        a single `stopReason`: a lone reason on an aggregate has no owner, and
        concatenating several loses which folder each belongs to, which is what
        an operator needs in order to fix one.

        **The shapes are declared here, not left to a test to invent.** One
        exported type carries the reason:

        ```ts
        interface CoverageStopReason {
          kind: 'manifest_error' | 'invalid_flag' | 'unknown_scope' | 'unmet_precondition';
          message: string;
        }
        ```

        `CoverageReport.stopReason` is an optional `CoverageStopReason`, present
        only on a refused run. The aggregate is a distinct
        `MergedCoverageReport`, so a single-folder report and a merged one are
        not the same type wearing different fields, and it carries
        `folderStopReasons`, an optional map from the store's folder key, the
        value `createClientKey(folder.uri.fsPath)` produces, to the same
        `CoverageStopReason`. The key is the store's own identity rather than a
        display name, because that is what the caller already holds when it
        needs to act on one folder.

        **The four kinds are declared once.** No second literal union, no
        widening to `string`, and no private copy in a test fixture: a duplicate
        declaration is a copy of policy that will not know when the set changes,
        which is the failure this repository records eight times over. A test
        MUST reject an unknown kind, MUST reject a `kind` widened to `string`,
        and MUST reject a merged report whose reason survives without its
        folder, since that last shape is the one the aggregate exists to
        prevent.
      type: technical
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: "Extension activates in a workspace containing specter.yaml; does NOT activate in a workspace with only generic YAML files"
      references_constraints: ["C-02"]
      priority: critical

    - id: AC-02
      description: "specter.binaryPath workspace setting overrides PATH lookup; if neither resolves, extension auto-downloads from GitHub Releases with SHA256 verification and shows progress notification"
      references_constraints: ["C-01"]
      priority: critical

    - id: AC-03
      description: "Typing in a .spec.yaml file triggers specter parse --json after 400ms debounce; errors appear in the Problems panel within 800ms of stopping typing"
      references_constraints: ["C-03", "C-04", "C-18"]
      priority: critical

    - id: AC-04
      description: "Saving a .spec.yaml file triggers specter check --json and specter coverage --json; diagnostics are replaced atomically (no duplicates or stale entries)"
      references_constraints: ["C-04", "C-05"]
      priority: critical

    - id: AC-05
      description: "Each AC line in a spec file shows a gutter icon: green circle (covered) or red circle (uncovered). End-of-line text decoration shows test count for covered ACs. The gray dash for `gap: true` was retracted in 5.0.0 with C-07; the decoration kind, its builder branch and its test are removed with it, so the repository does not keep an unowned private feature that no criterion claims."
      references_constraints: ["C-07"]
      priority: critical

    - id: AC-06
      description: "Hovering over a constraint ID (e.g., C-01) in a spec file shows: constraint description, which ACs reference it, and coverage status of those ACs. If no AC references it, hover card says 'No AC references this constraint.'"
      references_constraints: ["C-16"]
      priority: high

    - id: AC-07
      description: "Typing // @spec in a test file triggers completions showing spec IDs ranked by directory proximity; selecting a completion inserts the spec ID"
      references_constraints: ["C-08"]
      priority: critical

    - id: AC-08
      description: "Typing // @ac in a test file triggers completions showing AC IDs and descriptions from the spec referenced by the nearest @spec annotation above"
      references_constraints: ["C-08"]
      priority: critical

    - id: AC-09
      description: "Hovering over @ac AC-01 in a test file shows the full AC description, whether it is currently covered, and which other test files also cover it"
      references_constraints: ["C-08"]
      priority: high

    - id: AC-10
      description: "Go-to-definition on a spec_id in depends_on navigates to the target .spec.yaml file; Go-to-definition on a constraint ID in references_constraints jumps to that constraint's line in the current spec"
      references_constraints: ["C-09"]
      priority: high

    - id: AC-11
      description: "Specter sidebar tree view shows: spec files as root nodes, AC children with green/red/grey icons and test count, test file leaves. Clicking a tree node opens the corresponding file at the correct line."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-12
      description: "Status bar item shows 'Specter: N specs · X% · F failing'. Background is statusBarItem.warningBackground when any T1/T2 spec fails threshold. Clicking the item opens the Specter sidebar."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-13
      description: "Specter Insights panel (opened from the status bar or tree view) shows a health card per failing spec with: sentence summary ('spec-payment has 3 uncovered ACs. Tier 1 requires 100%.'), AC list with full descriptions, constraint callout for uncovered ACs, and last-change context."
      references_constraints: ["C-11"]
      priority: high

    - id: AC-14
      description: "When a test file is opened and a @ac annotation references an AC whose spec has changed since the annotation was last committed, a 'spec drifted' gutter icon appears. Hovering shows the AC description at baseline and HEAD, classified as breaking/additive/patch."
      references_constraints: ["C-12"]
      priority: high

    - id: AC-15
      description: "A test function with no @spec annotation shows a DiagnosticSeverity.Information diagnostic. The associated quick fix inserts '// @spec <best-guess>' and '// @ac AC-' with a tab stop above the function."
      references_constraints: ["C-13"]
      priority: high

    - id: AC-16
      description: "'Copy spec context for AI' command formats the current spec's tier, objective, constraints, and AC list as a markdown ## Spec Contract block and copies to clipboard. Works with no network access."
      references_constraints: ["C-14"]
      priority: critical

    - id: AC-17
      description: "In a workspace with no .spec.yaml files, a VS Code walkthrough appears with steps: discover specs → run specter reverse → annotate first test → run specter sync. Walkthrough does NOT appear if specs already exist."
      references_constraints: ["C-15"]
      priority: medium

    - id: AC-18
      description: "A T1/T2 spec dropping below threshold after a test file save triggers a non-modal showInformationMessage. Same spec fires at most once per 60 seconds. T3 threshold drops produce only a status bar update, no toast."
      references_constraints: ["C-19"]
      priority: high

    - id: AC-19
      description: "A breaking spec change detected via specter diff after a .spec.yaml save triggers a non-modal showWarningMessage with 'View Diff' and 'Dismiss' actions. Binary-not-found at startup triggers a modal showErrorMessage."
      references_constraints: ["C-19"]
      priority: high

    - id: AC-20
      description: ".spec.yaml files in the Explorer panel show a tier badge (T1/T2/T3) and a coverage health color decoration without opening the Specter sidebar"
      references_constraints: ["C-17"]
      priority: medium

    - id: AC-21
      description: "CodeLens above unannotated test functions shows top-2 AC suggestions ranked by tf-idf against the spec corpus. Suggestions are computed offline with no LM API call. Clicking a suggestion inserts the annotation."
      references_constraints: ["C-20"]
      priority: medium

    - id: AC-22
      description: "Multi-root workspace: each workspace folder has its own SpecterClient, DiagnosticCollection, manifest, and coverage report (see AC-54). Diagnostics from folder A do not appear in folder B."
      references_constraints: ["C-06"]
      priority: high

    - id: AC-23
      description: "A corrupt text file at ~/.specter/bin/specter (e.g. an HTTP error body saved as the binary) with chmod +x is rejected as invalid regardless of how it was resolved (cache, PATH, workspaceSetting). isBinaryFile returns false for files that do not start with ELF/Mach-O/PE magic bytes."
      references_constraints: ["C-01"]
      priority: critical

    - id: AC-24
      description: "When specter coverage fails at runtime, the status bar exits the 'loading…' state and shows an error indicator. Clicking the indicator opens the Specter output channel with the failure details. A `Specter: Re-download CLI` command is available in the command palette to recover from a corrupt cached binary."
      references_constraints: ["C-01"]
      priority: high

    - id: AC-25
      description: "A `Specter: Add CLI to Shell PATH` command detects the user's shell ($SHELL env) and maps bash→.bashrc (or .bash_profile on darwin), zsh→.zshrc, fish→config.fish. Fish uses fish_add_path syntax; bash/zsh use export PATH. Unknown shells return null so the handler falls back to clipboard-copying the manual export line."
      references_constraints: ["C-01"]
      priority: high

    - id: AC-26
      description: "Appending to the shell rc file is idempotent — isPathAlreadyPresent ignores commented lines and detects an existing reference to the bin dir in any non-comment line, so running the command twice adds only one block."
      references_constraints: ["C-01"]
      priority: high

    - id: AC-27
      description: "On activation, when the cached CLI is at ~/.specter/bin and the detected shell's rc file exists but does not reference that dir, the extension shows a non-modal info prompt offering to add the CLI to shell PATH. The prompt offers 'Add to PATH' (runs specter.addCliToShellPath) and 'Don't show again' (persists an opt-out flag in globalState so future activations skip the prompt). Unknown shells, missing rc files, and already-present references suppress the prompt without user interaction."
      references_constraints: ["C-01"]
      priority: medium

    - id: AC-28
      description: "When the Coverage tree provider is queried and no CoverageReport is loaded, getChildren() returns exactly one synthetic 'message' node. The message text explains that coverage data is not available and names one or more concrete next steps (e.g. 'Run specter init' or 'Open Problems panel'). Tested via the pure buildTreeNodes-equivalent function, not via VS Code runtime mocks."
      references_constraints: ["C-21"]
      priority: high

    - id: AC-29
      description: "When the loaded CoverageReport has parseErrors[] non-empty (CLI ran but specs failed to parse), the tree provider returns one synthetic 'message' node whose text names the parse-failure count and points at the Problems panel / Output channel. Distinguished from AC-28 (not-yet-run) and AC-30 (no-specs-yet) by the presence of structured parse failures in the report."
      references_constraints: ["C-21"]
      priority: high

    - id: AC-30
      description: "When the loaded CoverageReport has entries.length === 0 and parseErrors is empty or absent (CLI ran successfully but there are no specs in the workspace), the tree provider returns one synthetic 'message' node suggesting `specter init` or `specter reverse src/`. Distinct from AC-28: coverage has been run; distinct from AC-29: no specs failed, there just aren't any."
      references_constraints: ["C-21"]
      priority: high

    - id: AC-31
      description: "`specter.runSync` emits a completion message that honestly reflects the outcome. If every folder's coverage step succeeded, the user sees 'Specter sync complete.' If any folder entered the error state (CLI failed or parseErrors returned), the completion message is phrased as a failure ('Specter sync finished with errors — see Output channel.') and surfaces via a warning-level notification rather than an info toast."
      references_constraints: ["C-19"]
      priority: high

    - id: AC-32
      description: "Hovering an `@ac AC-XX` annotation in a test file produces a hover that lists the actual covering test files for that AC — read from the workspace's current CoverageReport entry's testFiles, filtered to files whose annotations reference this (spec, AC) pair. The hover is 'uncovered' only when the AC is genuinely absent from the report's coveredACs. Fixes the v0.8.x regression where hovers always showed the empty-state content because the caller passed coveredByFiles: []."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-33
      description: "Clicking a spec node or a test-file leaf in the Coverage sidebar opens the corresponding file in an editor tab. The spec node uses the path from CoverageReport entries[*].specFile (new in coverage v1.5.0); the test-file leaf uses entry.testFiles[i]. Relative paths emitted by the CLI are resolved against the OWNING workspace folder — the folder whose coverage run produced the report, specifically the directory of that folder's specter.yaml manifest, which is the CLI's working directory — once, at report-ingestion time, so stored reports carry absolute paths. In a single-folder workspace this is indistinguishable from resolving against the first workspace folder (the pre-1.7.0 behavior); in a multi-root workspace, resolving against the first folder produces URIs inside the wrong folder and is prohibited. Previously, test-file leaves rendered as undefined/null (runtime shape mismatch) or passed a relative path straight to Uri.file, which produced a non-existent '/watch_test.go' URI and the 'file not found' editor error."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-34
      description: "When `specter coverage --json` returns parseErrors, the extension pushes one VS Code diagnostic per error into the per-folder DiagnosticCollection (keyed by the absolute file URI after resolving relative CLI paths). VS Code's Problems panel shows one clickable entry per broken spec, positioned at the reported line/column, labelled with the error type prefix. Previously the Problems panel stayed empty even when the sidebar said '22 parse errors' — users could see there was a problem but not which files. The diagnostic collection is cleared before re-populating so stale errors don't accumulate across coverage runs."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-35
      description: "The Coverage sidebar's parse-error message uses CoverageReport.specCandidatesCount and parseErrorPatterns to diagnose the shape of failure. When every discovered spec file hit the same parse error pattern (count == spec_candidates_count > 1), the message names this as `schema version drift` and points at `specter doctor`. When patterns are heterogeneous, the generic `open the Problems panel` guidance applies. When specCandidatesCount > 0 and parseErrors is empty but entries is also empty, the message names a manifest-misconfiguration case (domains excluding the specs) instead of suggesting `specter init`."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-36
      description: "When the CoverageReport contains both `entries` (parsed specs) and `parseErrors` (failed files), the Coverage sidebar renders them together: a collapsible `Failed to parse` group lists each failing file as a clickable leaf (opens the file at the reported line), followed by the normal spec tree nodes for every entry. Replaces the v0.8.x behavior where parse errors hid every passing spec behind a single banner. When only parseErrors exist (no entries), the group is the only root. When only entries exist (no parseErrors), the group is omitted."
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-37
      description: "The Insights panel (`specter.openInsights`) never renders 'All specs passing ✓' when CoverageReport.parseErrors is non-empty. When parse errors exist, the panel shows a `Parse failures` section listing each failing file with its error message, plus the normal `Coverage gaps` section for specs that did parse. Header text reflects the true mixed state (e.g. '17 parse error(s), 4 spec(s) parsing cleanly'). Previously the panel either crashed with `entries is not iterable` or — once the crash was fixed — defaulted to the 'all passing' headline when entries was empty, silently erasing the parse failures from the user's mental model."  # <!-- doc-style: allow --> maintainer-cleared: quotes the product string rendered at insights.ts:144
      references_constraints: ["C-10"]
      priority: high

    - id: AC-38
      description: "The `specter.revealInTree` command (exposed via command palette and file-context menu) takes the active editor's file and reveals the matching node in the Coverage sidebar — expanding any collapsed ancestors and focusing the leaf. Priority: (1) spec entry whose specFile is the active file, (2) parse-error leaf for an unparsable spec, (3) test-file leaf under an AC. Requires the tree to be registered via createTreeView so .reveal() is available; registerTreeDataProvider alone is not enough. Previously the command was declared in package.json but never registered, surfacing to users as `command 'specter.revealInTree' not found`."
      references_constraints: ["C-10"]
      priority: high

    - id: AC-39
      description: "In the Insights panel, each Parse-failures card's file-path header is a clickable link that opens the corresponding file at the reported line. Implemented via webview postMessage with an `{openFile, line}` payload routed through vscode.open on the extension host. Previously the file paths were plain text, forcing users to switch back to the Coverage sidebar or Problems panel to reach the file."
      references_constraints: ["C-10"]
      priority: medium

    - id: AC-40
      description: "The on-change and on-save diagnostic hooks skip any document whose path does not end in `.spec.yaml`. The specter.yaml manifest, a test file open in the editor, or any other YAML document is not parsed against the spec schema. Previously the hooks ran `specter parse` on every YAML document, producing false 'Missing required field spec' and 'Unknown field settings' diagnostics on the manifest whose shape is `system: / settings: / domains:`. Gate is a path-suffix check (not languageId) because YAML language registration is shared across all .yaml files."
      inputs:
        doc_a: "specter.yaml (manifest — system:, settings:)"
        doc_b: "specs/auth.spec.yaml (real spec)"
      expected_output:
        doc_a_parse_invoked: false
        doc_b_parse_invoked: true
      references_constraints: ["C-10"]
      priority: high

    - id: AC-41
      description: "An automated test reads vscode-extension/package.json, extracts every `contributes.commands[].command` identifier, extracts every id passed to `vscode.commands.registerCommand(id, ...)` in vscode-extension/src/extension.ts (and any file it imports from), and asserts set equality. Missing registrations fail the build. The test runs in CI (jest or equivalent) so the gap cannot ship. Prevents the 'declared but unregistered' class demonstrated by specter.revealInTree (v0.9.0), specter.runReverse (v0.9.1), and specter.openQuickStart (v0.9.1)."
      references_constraints: ["C-22"]
      priority: critical

    - id: AC-42
      description: "`driftDecorationType` (created via vscode.window.createTextEditorDecorationType at extension activation) is pushed to ctx.subscriptions immediately after creation, so it is disposed on extension deactivation. An automated test verifies this by running activation against a stub ExtensionContext and asserting the decoration type appears in subscriptions. The same test pattern extends to every disposable covered by C-23."
      references_constraints: ["C-23"]
      priority: high

    - id: AC-43
      description: "`specter.runReverse` is registered via vscode.commands.registerCommand. The handler opens the integrated terminal with `specter reverse` prefilled, or runs the CLI directly and streams output to the Specter Output channel. Invoking the command from the command palette or from a walkthrough link (command:specter.runReverse) does not produce 'command not found'."
      inputs:
        invocation: "vscode.commands.executeCommand('specter.runReverse')"
      expected_output:
        registered: true
        raises_not_found: false
      references_constraints: ["C-22"]
      priority: critical

    - id: AC-44
      description: "`specter.openQuickStart` is either implemented as a registered command (opens a QuickStart walkthrough/webview) OR its declaration is removed from package.json contributes.commands. An orphan declaration is prohibited. Verified by the same parity test as AC-41."
      references_constraints: ["C-22"]
      priority: high

    - id: AC-45
      description: "When the extension activates in a workspace with no .spec.yaml and no specter.yaml, the CLI binary is still resolved (auto-download if specter.autoDownload is true, modal error if false and no binary found). Commands like specter.runReverse, specter.init (via terminal), and specter.showOutput are usable in a fresh workspace before any spec exists. The v0.8.x behavior where the extension silently sat dormant until specs appeared is prohibited."
      inputs:
        workspace_state: "no specter.yaml, no .spec.yaml, specter.autoDownload=true, binary not present"
      expected_output:
        binary_download_attempted: true
        runReverse_command_usable: true
      references_constraints: ["C-25"]
      priority: high

    - id: AC-46
      description: "The onboarding walkthrough (`specter.gettingStarted`) fires when `shouldShowWalkthrough({ specFiles: [], hasSpecterManifest: false })` returns true. The check MUST execute; it MUST NOT be placed after an early-return gated on a condition mutually exclusive with the walkthrough's own (i.e., 'has specs or manifest')."
      inputs:
        workspace_state: "no specs, no manifest, extension just installed"
      expected_output:
        walkthrough_opened: true
      references_constraints: ["C-25"]
      priority: high

    - id: AC-47
      description: "Auto-downloaded CLI installation refuses to write the binary to disk unless SHA256 verification succeeds. Test cases: (1) checksums.txt is 404 — installation fails with modal error, no partial binary on disk; (2) checksums.txt is valid but does not contain an entry for the downloaded archive name — installation fails; (3) checksums.txt contains a mismatched hash — installation fails. Only case where installation succeeds is when the archive's computed SHA256 matches the expected hash. No silent fallback under any condition."
      inputs:
        case_a: "checksums.txt 404"
        case_b: "checksums.txt missing archive entry"
        case_c: "checksums.txt has wrong hash"
        case_d: "checksums.txt has correct hash"
      expected_output:
        case_a_installs: false
        case_b_installs: false
        case_c_installs: false
        case_d_installs: true
      references_constraints: ["C-24"]
      priority: critical

    - id: AC-48
      description: "The on-type debounce handler in onDidChangeTextDocument catches parse errors and writes a `[timestamp] parse failed for <file>: <message>` line to the Specter Output channel. The user editing a .spec.yaml and introducing invalid YAML can open the Output channel and see the failure, rather than observing nothing."
      references_constraints: ["C-26"]
      priority: medium

    - id: AC-49
      description: "Drift-scan failures in both hooks (onDidChangeActiveTextEditor and onDidSaveTextDocument) write a `[timestamp] drift scan failed for <file>: <message>` line to the Specter Output channel. Previously both sites had `.catch(() => {})`, silently discarding failures. The Output channel is the authoritative place to see them."
      references_constraints: ["C-26"]
      priority: medium

    - id: AC-50
      description: "With specter.version unset (the default empty string), downloadBinary resolves the target version by reading ctx.extension.packageJSON.version — a v0.10.0 VSIX fetches specter_0.10.0_<os>_<arch>.<ext>, not whatever /releases/latest returns. With specter.version='latest', downloadBinary queries /releases/latest (previous default behavior, now explicit opt-in). With specter.version pinned to a semver like '0.9.2', downloadBinary uses that string verbatim. package.json declares the config default as the empty string, not 'latest'."
      references_constraints: ["C-27"]
      priority: high

    - id: AC-51
      description: "The pure helper `matchRemovedFieldDiagnostic(message)` returns the field name when given `Unknown field 'trust_level'` (in the known-removed list), returns null when given `Unknown field 'some_unknown_field'` (not in the list), and returns null when given any non-matching message (e.g. `Missing required field 'id'`). The helper is runtime-free: no VS Code imports, testable without a vscode runtime shim. The known-removed-fields list MUST include `trust_level` (the v0.6.5 removal seed) and is exported so tests can assert membership."
      inputs:
        case_known_removed: "Unknown field 'trust_level'"
        case_unknown: "Unknown field 'totally_new_field'"
        case_non_matching: "Missing required field 'id'"
      expected_output:
        known_removed_returns: "trust_level"
        unknown_returns: null
        non_matching_returns: null
      references_constraints: ["C-28"]
      priority: critical

    - id: AC-52
      description: "`extension.ts` MUST register a `CodeActionProvider` against a yaml-typed selector during activation (either an inline `'yaml'` document selector or a named `DocumentSelector` constant whose `language` field equals `'yaml'`). The provider's `provideCodeActions` method consults `matchRemovedFieldDiagnostic` for each diagnostic in the requested range; for each match, it returns a `CodeAction` of kind `QuickFix` whose title is `Remove deprecated field '<fieldName>'` and whose edit deletes the diagnostic's line. Static-analysis test (no vscode runtime spin-up): grep `extension.ts` for the `registerCodeActionsProvider` call AND verify the bound document selector resolves to `language: 'yaml'`. Test MUST accept either form (inline literal or named constant) — implementation choice does not change the contract."
      inputs:
        invocation: "static analysis of extension.ts source"
      expected_output:
        contains_register_call: true
        bound_selector_resolves_to_yaml: true
      references_constraints: ["C-28"]
      priority: high

    - id: AC-53
      description: "`isLineSafeToDelete(documentText, lineIndex)` (a runtime-free helper) returns true for lines of the form `<indent>trust_level: <plain-scalar>` and false for: (a) block scalar with `|` or `>` indicator, including chomp/indent suffixes such as `|-`, `|+`, `>2`; (b) a `<key>:` followed by no value on the same line (next-line introduces a sequence or mapping); (c) an unterminated double- or single-quoted string on the line. The CodeActionProvider MUST call this helper before offering the C-28 action and MUST NOT offer the action when it returns false. Tests cover at least: plain scalar (true), `: |` (false), `: |-` (false), `: >` (false), `:` end-of-line (false), `: \"unterminated` (false), `: 0.5` (true)."
      inputs:
        cases:
          - "  trust_level: high → true (plain scalar)"
          - "  trust_level: \"high\" → true (closed double-quoted)"
          - "  trust_level: 0.5 → true (numeric scalar)"
          - "  trust_level: | → false (block scalar literal)"
          - "  trust_level: |- → false (block scalar with strip chomp)"
          - "  trust_level: > → false (block scalar folded)"
          - "  trust_level: → false (next-line value)"
          - "  trust_level: \"unterminated → false"
      expected_output:
        plain_scalar_returns: true
        block_scalar_returns: false
        empty_value_returns: false
        unterminated_quote_returns: false
      references_constraints: ["C-29"]
      priority: critical

    - id: AC-54
      description: "Multi-root workspace: coverage reports are isolated per workspace folder. Folder B's coverage run does not overwrite folder A's report — each folder's report is stored under the same per-folder key as its SpecterClient and DiagnosticCollection. Paths inside a folder's report (entries[*].specFile, entries[*].testFiles[*], parseErrors[*].file) are resolved into the owning folder at ingestion time, so folder B's coverage parse-error diagnostics carry URIs inside folder B — never folder A. Aggregate views (status bar, Coverage sidebar, Insights) render the merged entries and parse errors of all stored reports. Removing a workspace folder removes its report from the store. With a single workspace folder, the merged view is identical to that folder's report — single-root behavior is unchanged."
      inputs:
        folder_a: "/ws/alpha (manifest at /ws/alpha/specter.yaml, spec spec-a, parse error in specs/broken.spec.yaml)"
        folder_b: "/ws/beta (manifest at /ws/beta/specter.yaml, spec spec-b)"
      expected_output:
        folder_a_report_survives_folder_b_run: true
        folder_a_parse_error_uri: "/ws/alpha/specs/broken.spec.yaml"
        merged_view_contains: ["spec-a", "spec-b"]
      references_constraints: ["C-05", "C-06"]
      priority: high

    - id: AC-55
      description: "Saving a .spec.yaml file re-runs `specter coverage --json` for the saved file's workspace folder and replaces that folder's stored report wholesale — through the same ingestion path the initial activation load uses (path normalization, parse-error diagnostics, status bar and tree refresh). Per-entry splicing is prohibited: the pre-1.7.0 implementation extracted entries[0] of the fresh whole-workspace report and wrote it into the saved spec's slot, corrupting the report (and the status bar and notifications derived from it) whenever the saved spec was not the report's first entry, and pushing duplicate entries when the spec ID matched nothing. Gating the refresh on a `// @spec` slash-comment regex over the saved YAML is likewise prohibited — normal `#`-commented spec files never match that shape, so the refresh only fired (incorrectly) for specs whose prose happened to embed slash-comment examples. The below-threshold notification (AC-18) is evaluated against the fresh report's entry whose specFile matches the saved document's path."
      inputs:
        workspace: "specs spec-alpha and spec-zulu; user saves spec-zulu.spec.yaml"
      expected_output:
        folder_report_replaced_wholesale: true
        spec_alpha_entry_overwritten_by_splice: false
        notification_entry_matched_by: "specFile == saved document path"
      references_constraints: ["C-04", "C-19"]
      priority: high

    - id: AC-56
      description: "On save in a workspace whose `specter check --json` run reports at least one error-severity diagnostic, the CLI exits non-zero and writes a complete JSON document to stdout. The extension publishes the diagnostics from that document into the saved folder's DiagnosticCollection. The resulting collection is identical to the one produced by the same document with a zero exit, because the exit code is not an input to whether diagnostics are published. No Output-channel error line and no notification are produced: a workspace with errors is a normal outcome, and the Problems panel is the surfacing."
      inputs:
        workspace: "one .spec.yaml producing one error-severity diagnostic (tier 1 orphan constraint)"
        cli_exit_code: 1
        cli_stdout: "complete check --json document reporting that diagnostic"
      expected_output:
        diagnostics_published: true
        collection_matches_exit_0_run: true
        invocation_treated_as_failure: false
        output_channel_error_line: false
        notification_shown: false
      references_constraints: ["C-30", "C-04", "C-05"]
      priority: critical

    - id: AC-57
      description: "The rule holds for every `--json` invocation, not only `check`. With the CLI exiting non-zero while writing a complete document, `specter parse --json` on type still publishes its parse diagnostics and `specter coverage --json` on save still replaces the folder's stored report. Neither discards the document because of the exit code. `parse --json` does not yet exit non-zero on error-severity diagnostics (SP-SP-022); the client MUST already behave correctly for when it does, so that fix does not break on-type feedback."
      inputs:
        row_parse: "parse --json on type, exit 1, complete document with one error-severity diagnostic"
        row_coverage: "coverage --json on save, exit 1, complete report document"
      expected_output:
        row_parse: { document_consumed: true, diagnostics_published: true }
        row_coverage: { document_consumed: true, report_stored: true }
      references_constraints: ["C-30", "C-04"]
      priority: critical

    - id: AC-58
      description: "An automated test asserts that no `--json` invocation in the extension's CLI client module routes through an invocation path that rejects on a non-zero exit. The test locates every call site that passes `--json` and verifies each one uses a path that resolves with stdout, stderr, and the exit code. Any implementation form is accepted, following the AC-52 precedent: the contract is the routing, not the name of the helper. A `--json` invocation added later on the rejecting path fails the build. This closes the class instead of the instance. The same correct fix was applied to `coverage` alone in v0.13 and left `parse` and `check` behind, which is how SP-SP-023 shipped."
      inputs:
        invocation: "static analysis of the extension's CLI client module"
      expected_output:
        json_call_sites_on_rejecting_path: 0
        new_rejecting_json_call_site_fails_build: true
      references_constraints: ["C-30"]
      priority: critical

    - id: AC-59
      description: "When an invocation returns no parseable document on stdout, it is a failure whatever its exit code. The extension writes a timestamped `<command> failed for <file or folder>: <message>` line to the Specter Output channel, leaves the folder's existing diagnostics untouched rather than replacing them with an empty set, and puts the status bar in its error indicator state (AC-24). Empty stdout with a non-zero exit and unparseable stdout with a zero exit are the same case and take the same path. Clearing the collection here is prohibited, because an empty Problems panel would report a clean workspace that was never checked."
      inputs:
        case_a: "check --json, exit 1, stdout empty"
        case_b: "check --json, exit 1, stdout truncated JSON"
        case_c: "check --json, exit 0, stdout not JSON"
      expected_output:
        output_channel_line_written: true
        existing_diagnostics_cleared: false
        status_bar_error_state: true
        notification_shown: false
      references_constraints: ["C-30", "C-26", "C-05"]
      priority: high

    - id: AC-60
      description: "When the CLI process fails to spawn, no document was produced and the extension takes the AC-59 failure path rather than a success path. The tolerant invocation path MUST NOT absorb a spawn failure into a normal result. Distinguished from AC-59 by the Output-channel message naming the spawn error (ENOENT for a missing binary, EACCES for a non-executable one) rather than a document-parse failure."
      inputs:
        case_enoent: "resolved binary path does not exist"
        case_eacces: "resolved binary path exists but is not executable"
      expected_output:
        invocation_treated_as_failure: true
        output_channel_line_names_spawn_error: true
        existing_diagnostics_cleared: false
        status_bar_error_state: true
      references_constraints: ["C-30", "C-01", "C-26"]
      priority: high

    - id: AC-61
      description: >-
        Saving a spec in a workspace with nothing wrong in it clears the
        Problems panel instead of throwing. `check --json` writes
        `{"diagnostics": null, ...}` and exits 0, which is the shape a clean
        workspace produces on every save. The client returns the document with
        `diagnostics` as an empty array rather than `null`, the builder
        produces zero diagnostics without throwing, and the folder's
        collection is replaced with the empty set, so the one diagnostic left
        by the previous save is gone. The run MUST NOT be routed to the C-30
        no-document failure path, which leaves a document parseable and
        discarded and would keep the stale diagnostic on screen forever.
      inputs:
        cli_stdout: |-
          {"diagnostics": null, "summary": {"errors": 0, "warnings": 0, "info": 0}}
        cli_exit_code: 0
        collection_before: "one diagnostic, left by the previous save"
      expected_output:
        document_consumed: true
        returned_diagnostics_is_array: true
        diagnostics_built: 0
        collection_after_replacement: "empty"
        threw: false
        routed_to_no_document_failure_path: false
      references_constraints: ["C-31", "C-30", "C-05"]
      priority: critical

    - id: AC-62
      description: >-
        A null check half does not suppress a populated parse half. Given a
        check document whose `diagnostics` is `null` and a parse document
        carrying two errors, the builder produces two diagnostics, one per
        parse error, in the order the document lists them. Two errors rather
        than one, because a rule that aggregates is only pinned by a case with
        more than one item. The two halves reach the builder exactly as parsed
        from stdout, not normalized first, so this criterion pins the
        builder's own tolerance rather than the client's normalization.
      inputs:
        check_stdout: |-
          {"diagnostics": null, "summary": {"errors": 0, "warnings": 0, "info": 0}}
        parse_stdout: |-
          {"errors": [
            {"path": "spec", "type": "required",
             "message": "Missing required field 'objective'. Add an objective block with a summary"},
            {"path": "spec", "type": "additionalProperties",
             "message": "Unknown field 'trust_level'. Remove it or check for a typo in the field name."}
          ], "file": "specs/b.spec.yaml", "ok": false, "value": null}
      expected_output:
        diagnostics_built: 2
        first_message_contains: "Missing required field 'objective'"
        second_message_contains: "Unknown field 'trust_level'"
        threw: false
      references_constraints: ["C-31"]
      priority: critical

    - id: AC-63
      description: >-
        The mirror of AC-62. A null parse half does not suppress a populated
        check half. Given a parse document whose `errors` is `null` and a
        check document carrying two error-severity diagnostics, the builder
        produces two diagnostics. This is the pair the on-save handler passes
        together, and either half being null is independently sufficient to
        throw, so both directions need their own criterion. The two halves
        reach the builder exactly as parsed from stdout, not normalized first.
      inputs:
        parse_stdout: |-
          {"errors": null, "file": "specs/o.spec.yaml", "ok": true, "value": {"id": "spec-o"}}
        check_stdout: |-
          {"diagnostics": [
            {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
             "constraint_id": "C-02", "constraint_type": "technical",
             "message": "Constraint C-02 in \"spec-o\" is not referenced by any acceptance criterion"},
            {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
             "constraint_id": "C-03", "constraint_type": "technical",
             "message": "Constraint C-03 in \"spec-o\" is not referenced by any acceptance criterion"}
          ], "summary": {"errors": 2, "warnings": 0, "info": 0}}
      expected_output:
        diagnostics_built: 2
        first_message_contains: "Constraint C-02"
        second_message_contains: "Constraint C-03"
        threw: false
      references_constraints: ["C-31"]
      priority: critical

    - id: AC-64
      description: >-
        A parse error that carries no position produces a diagnostic at the
        start of the file, not a `NaN` range. Every schema validation error
        the CLI emits is this shape: it has `path`, `type`, and `message`, and
        neither `line` nor `column`. The resulting range starts at line 0,
        character 0 and ends at line 0, character `Number.MAX_SAFE_INTEGER`,
        which highlights the first line of the file, and all four numbers are
        finite integers. The nameable assertions are the four literal
        comparisons and `Number.isFinite` returning true on each.
        Amended at 1.10.0 (SP-SP-034). The end was `0` at 1.9.0, which was a
        deliberate choice made while AC-71's end was unstated. The same schema
        parse error reaches the Problems panel by two paths, this one and the
        coverage refresh of AC-71, so the two ends have to be decided together
        or the same error renders two ways depending on which run produced it.
      inputs:
        parse_error: |-
          {"path": "spec", "type": "required",
           "message": "Missing required field 'objective'. Add an objective block with a summary"}
      expected_output:
        diagnostics_built: 1
        range_start_line: 0
        range_start_character: 0
        range_end_line: 0
        range_end_character: 9007199254740991
        all_four_range_numbers_finite: true
        message_contains: "Missing required field 'objective'"
      references_constraints: ["C-32"]
      priority: critical

    - id: AC-65
      description: >-
        A parse error that carries a line and no column converts the line and
        defaults the column. A YAML syntax error is the only parse error the
        CLI emits with a `line`, and it never carries a `column`, because no
        code path in the parser assigns that field. The CLI's line is 1-based
        and VS Code is 0-based, so line 3 becomes 2, while the absent column
        becomes character 0. Kept separate from AC-64 because an
        implementation that defaults every position to 0 satisfies AC-64 and
        fails this one. The range ends on the same line it starts on, at
        character `Number.MAX_SAFE_INTEGER`, so the highlight covers the line
        the CLI reported. Amended at 1.10.0 (SP-SP-034): the end was unstated
        at 1.9.0, which is the gap that let a test choose it.
      inputs:
        parse_error: |-
          {"path": "", "type": "yaml_syntax",
           "message": "yaml: line 3: mapping values are not allowed in this context",
           "line": 3}
      expected_output:
        diagnostics_built: 1
        range_start_line: 2
        range_start_character: 0
        range_end_line: 2
        range_end_character: 9007199254740991
        all_four_range_numbers_finite: true
      references_constraints: ["C-32"]
      priority: high

    - id: AC-66
      description: >-
        A check diagnostic produces a diagnostic at the start of the file, not
        a `NaN` range. Check diagnostics carry no position of any kind and no
        file: the CLI emits `kind`, `severity`, `message`, and the spec id on
        every one, and the optional fields are all descriptive. The resulting
        range starts at line 0, character 0 and ends at line 0, character
        `Number.MAX_SAFE_INTEGER`, all four numbers finite, and the severity
        maps to error. This is the check-side mirror of AC-64 and is the
        criterion that fails if the declared but never-emitted `line` field is
        read. Amended at 1.10.0 (SP-SP-034): the end was unstated at 1.9.0 and
        a test chose `0` for it. A check diagnostic carries no position, so its
        range is a placeholder either way, and it takes the same end as the
        other two sites rather than a third shape of its own.
      inputs:
        check_diagnostic: |-
          {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
           "constraint_id": "C-02", "constraint_type": "technical",
           "message": "Constraint C-02 in \"spec-o\" is not referenced by any acceptance criterion"}
      expected_output:
        diagnostics_built: 1
        severity: "error"
        range_start_line: 0
        range_start_character: 0
        range_end_line: 0
        range_end_character: 9007199254740991
        all_four_range_numbers_finite: true
      references_constraints: ["C-32"]
      priority: high

    - id: AC-67
      description: >-
        The declared types do not assert what the CLI does not emit. A static
        test parses `vscode-extension/src/types.ts` with the TypeScript
        compiler API, following the precedent already set in
        `clientExitCode.test.ts`, and reads the members of exactly two
        interface declarations in that one file, `SpecterParseError` and
        `SpecterCheckDiagnostic`. The scan is bounded to those two
        declarations in that file, and asserts three things. Neither `col` nor
        `code` is declared on `SpecterParseError`, because the CLI names the
        corresponding fields `column` and `type`. `line` is not declared as
        required on either interface, because the CLI omits it on every schema
        error and emits no position at all on a check diagnostic. And
        `message` is declared on both, because the CLI emits it on every
        error and every diagnostic. The scan stops at names the CLI emits
        under no name at all, which is why it does not assert on `specID` or
        on `file`. Either of those could be made correct by an extension-side
        choice, converting the document's keys the way the coverage path
        already does, or stamping the saved file's path onto each diagnostic,
        and a static assertion naming them would then fail a correct fix. Both
        are covered behaviorally instead, by AC-72 and AC-73.
      inputs:
        scan_target: "vscode-extension/src/types.ts, interfaces SpecterParseError and SpecterCheckDiagnostic"
      expected_output:
        parse_error_declares_col: false
        parse_error_declares_code: false
        line_declared_required_on_either: false
        message_declared_on_both: true
      references_constraints: ["C-32"]
      priority: high

    - id: AC-68
      description: >-
        A coverage document whose `entries` is `null` is normalized to an
        empty array. This is what the CLI emits when every spec in the
        workspace fails to parse: `entries` is `null`, `parse_errors` carries
        one object per failing file, and the process exits 1. The client
        returns `entries` as an empty array and `parse_errors` with both
        objects, so the sidebar's parse-failure path (AC-29) and the
        parse-error diagnostics (AC-34) run on a report that can be iterated.
        Two failing files rather than one, so the count is pinned.
      inputs:
        cli_stdout: |-
          {"entries": null,
           "summary": {"total_specs": 0, "fully_covered": 0, "partially_covered": 0,
                       "uncovered": 0, "passing": 0, "failing": 0},
           "parse_errors": [
             {"file": "specs/b.spec.yaml", "path": "spec", "type": "required",
              "message": "Missing required field 'objective'. Add an objective block with a summary"},
             {"file": "specs/c.spec.yaml", "path": "", "type": "yaml_syntax",
              "message": "yaml: line 3: mapping values are not allowed in this context", "line": 3}
           ],
           "spec_candidates_count": 2}
        cli_exit_code: 1
      expected_output:
        returned_entries_is_array: true
        returned_entries_length: 0
        returned_parse_errors_length: 2
        threw: false
      references_constraints: ["C-31", "C-30"]
      priority: high

    - id: AC-69
      description: >-
        A coverage document that omits `parse_errors` is normalized to an
        empty array. The CLI drops the field rather than emitting `[]` when no
        spec failed to parse, which is the shape a healthy workspace produces
        on every save. Absent and `null` are different inputs and this one is
        the common case, so it gets its own criterion rather than riding on
        AC-68.
      inputs:
        cli_stdout: |-
          {"entries": [
             {"spec_id": "spec-a", "tier": 3, "total_acs": 1, "covered_acs": [],
              "uncovered_acs": ["AC-01"], "coverage_pct": 0, "threshold": 50,
              "passes_threshold": false, "test_files": [], "spec_file": "specs/a.spec.yaml"}
           ],
           "summary": {"total_specs": 1, "fully_covered": 0, "partially_covered": 0,
                       "uncovered": 1, "passing": 0, "failing": 1},
           "spec_candidates_count": 1}
      expected_output:
        returned_parse_errors_is_array: true
        returned_parse_errors_length: 0
        returned_entries_length: 1
        threw: false
      references_constraints: ["C-31"]
      priority: high

    - id: AC-70
      description: >-
        A parse document for a spec that failed to parse carries `value` as
        `null`, and the client returns it without throwing. The CLI builds
        this document field by field rather than marshaling its result struct,
        so `value` is present and `null` whenever `ok` is false, and `errors`
        holds one object per validation failure. The returned document keeps
        `ok` false, keeps `value` null, and exposes both errors as an
        iterable array.
      inputs:
        cli_stdout: |-
          {"errors": [
            {"path": "spec", "type": "required",
             "message": "Missing required field 'objective'. Add an objective block with a summary"},
            {"path": "spec", "type": "additionalProperties",
             "message": "Unknown field 'trust_level'. Remove it or check for a typo in the field name."}
          ], "file": "specs/b.spec.yaml", "ok": false, "value": null}
        cli_exit_code: 0
      expected_output:
        returned_ok: false
        returned_value: null
        returned_errors_is_array: true
        returned_errors_length: 2
        threw: false
      references_constraints: ["C-31"]
      priority: high

    - id: AC-71
      description: >-
        A coverage parse error that carries no position produces a diagnostic
        at the start of the file, not a `NaN` range. This is the second
        consumer of CLI positions, and it feeds the Problems-panel entries of
        AC-34, which says the entries are positioned at the reported line and
        column and says nothing about their absence. Absence is the common
        case. The CLI emits `line` on a coverage parse error only when the
        failure is a YAML syntax error, and never emits `column` at all: no
        code path in either the parser or the coverage package assigns that
        field. The resulting range starts at line 0, character 0 and ends at
        line 0, character `Number.MAX_SAFE_INTEGER`, all four numbers finite,
        and the diagnostic still names the file. Amended at 1.10.0
        (SP-SP-034): the end was unstated at 1.9.0, a test pinned it to `0`,
        and the implementation was changed to match, which removed a highlight
        users had. AC-78 is the same path with a line reported.
      inputs:
        coverage_parse_error: |-
          {"file": "specs/b.spec.yaml", "path": "spec", "type": "required",
           "message": "Missing required field 'objective'. Add an objective block with a summary"}
      expected_output:
        diagnostics_built: 1
        diagnostic_file: "specs/b.spec.yaml"
        range_start_line: 0
        range_start_character: 0
        range_end_line: 0
        range_end_character: 9007199254740991
        all_four_range_numbers_finite: true
      references_constraints: ["C-32", "C-10"]
      priority: high

    - id: AC-72
      description: >-
        Every member declared required on `SpecterCheckDiagnostic` is present
        on the object the client returns. The test takes the required member
        names from that one interface in `vscode-extension/src/types.ts`,
        using the same TypeScript compiler API pass as AC-67, drives
        `client.check()` against a stubbed process emitting the CLI's document
        verbatim, and asserts each of those names is present and not
        `undefined` on the first returned diagnostic. Three fail today.
        `specID` fails because the CLI emits `spec_id` and the check path does
        no key conversion, unlike the coverage path. `file` and `line` fail
        because a check diagnostic carries neither in any form. Any correct
        fix passes: converting the document's keys, renaming the declared
        members to the names the CLI uses, stamping the saved file's path, or
        marking a member optional. The contract is that the declaration and
        the object agree, not which side moves, following the AC-52
        precedent. Amended at 1.10.0 (SP-SP-033): the presence assertion MUST
        read the returned object through an untyped view, such as
        `Record<string, unknown>`, and MUST NOT read it through the declared
        interface. A criterion about a declaration cannot have its own file
        stop compiling when the declaration changes, because a compile error
        takes down every criterion in the file with it. This makes the
        criterion's own red a runtime assertion. It does not stop a
        declaration change from failing a different module that reads those
        members, which no criterion wording can prevent under one tsconfig.
      inputs:
        interface: "SpecterCheckDiagnostic in vscode-extension/src/types.ts"
        cli_stdout: |-
          {"diagnostics": [
            {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
             "constraint_id": "C-02", "constraint_type": "technical",
             "message": "Constraint C-02 in \"spec-o\" is not referenced by any acceptance criterion"}
          ], "summary": {"errors": 1, "warnings": 0, "info": 0}}
        cli_exit_code: 1
      expected_output:
        declared_required_members_missing_at_runtime: 0
        spec_id_readable_under_its_declared_name: "spec-o"
      references_constraints: ["C-32"]
      priority: high

    - id: AC-73
      description: >-
        The same rule on the parse side. Every member declared required on
        `SpecterParseError` is present on each element of the `errors` array
        the client returns. The document is a schema validation failure, which
        is the shape most parse errors take and the one that omits the most:
        it carries `path`, `type`, and `message`, and no position at all. Four
        members fail today. `col` and `code` fail because the CLI names those
        fields `column` and `type`, `line` fails because a schema error omits
        it, and `file` fails because the CLI puts the file name on the
        document rather than on each error inside it. Kept separate from
        AC-72 because the two interfaces are fed by different commands and a
        fix applied to one has repeatedly been left off the other. Amended at
        1.10.0 (SP-SP-033) with the same untyped-view requirement AC-72
        carries, and with an honest note about its reach. The parse path
        applies no key conversion, so against today's implementation this
        criterion can fail only through a change to `types.ts`. It is a guard
        for the change that has not happened yet: the check path gained a
        converter this cycle, the parse path is the obvious next candidate,
        and a converter with a wrong map fails this criterion at runtime. A
        guard reads as a tautology against the code it guards. That is what a
        guard looks like before it fires.
      inputs:
        interface: "SpecterParseError in vscode-extension/src/types.ts"
        cli_stdout: |-
          {"errors": [
            {"path": "spec", "type": "required",
             "message": "Missing required field 'objective'. Add an objective block with a summary"}
          ], "file": "specs/b.spec.yaml", "ok": false, "value": null}
        cli_exit_code: 0
      expected_output:
        declared_required_members_missing_at_runtime: 0
        message_readable_under_its_declared_name: "Missing required field 'objective'. Add an objective block with a summary"
      references_constraints: ["C-32"]
      priority: high

    - id: AC-74
      description: >-
        The parse document's `errors` is an array on the object
        `client.parse()` returns, for the document a clean parse produces.
        `parse --json` emits `{"errors": null, ...}` with `ok` true whenever a
        spec passes validation, which is every save of a working spec. The
        client returns `errors` as an array of length 0. This is the exact
        field whose absence caused SP-SP-025, at the layer the fix lives, and
        it is the criterion AC-62 and AC-63 do not provide: both feed a
        document straight to the builder and never reach the client, so an
        implementation that normalizes nothing on the parse path satisfies
        them. The nameable assertions are `Array.isArray` on the returned
        `errors` and its length. This criterion fails if `errors` is dropped
        from the client's list of array fields, and it fails if normalization
        is moved out of the single point where stdout becomes a document into
        the per-command key converters, because the parse path has no
        converter to move it into.
      inputs:
        cli_stdout: |-
          {"errors": null, "file": "specs/a.spec.yaml", "ok": true,
           "value": {"id": "spec-a", "version": "1.0.0"}}
        cli_exit_code: 0
        client_method: "parse"
      expected_output:
        returned_errors_is_array: true
        returned_errors_length: 0
        returned_ok: true
        threw: false
      references_constraints: ["C-31"]
      priority: critical

    - id: AC-75
      description: >-
        Every array field C-31 names on the coverage document is an array on
        the object `client.coverage()` returns, in one document that exercises
        both branches of the normalizer. `entries`, `parse_errors`, and
        `parse_error_patterns` arrive as `null`, and `diagnostic_hints` and
        `invalid_status_warnings` are absent, because Go marshals a nil slice
        as `null` and drops a field carrying `omitempty`. All six come back
        as arrays of length 0, `results_validation_errors` among them, and that
        one is also asserted to arrive as `resultsValidationErrors` on the
        returned object and to be typed on the imported `CoverageReport`
        rather than reached for by its CLI spelling.

        A second document, populated, is required beside the empty one. An
        empty-array assertion proves normalization and nothing about
        conversion, and a type assertion proves a declaration exists while the
        converter still hands back `stream_index` inside each element. So a
        populated fixture asserts the outer key becomes
        `resultsValidationErrors`, that `stream_index` and `result_index`
        become `streamIndex` and `resultIndex` inside the elements, and that
        neither snake-case spelling survives at either level. The element type
        is a discriminated union on `kind`: `undeclared_stream` requires
        `resultIndex` and forbids `streamIndex`, and every other kind requires
        `streamIndex` and forbids `resultIndex`, so `spec-coverage` C-44's
        exactly-one-coordinate rule is a thing the compiler enforces rather
        than a sentence a reviewer checks. The names to assert on are the names the
        document carries after key conversion: `entries`, `parseErrors`, and
        `parseErrorPatterns` are converted, and `diagnostic_hints` and
        `invalid_status_warnings` keep their CLI spelling because the coverage
        key map does not name them. AC-68 and AC-69 cover `entries` and
        `parse_errors` only, so four of the six fields C-31 names had no
        criterion. One criterion covers all six rather than six criteria,
        because the observable behavior is one: the returned coverage document
        is iterable at every position C-31 names.
      inputs:
        cli_stdout: |-
          {"entries": null,
           "summary": {"total_specs": 0, "fully_covered": 0, "partially_covered": 0,
                       "uncovered": 0, "passing": 0, "failing": 0},
           "parse_errors": null,
           "parse_error_patterns": null,
           "spec_candidates_count": 0}
        absent_fields: "diagnostic_hints, invalid_status_warnings and results_validation_errors are not present in the document at all"
        cli_exit_code: 1
        client_method: "coverage"
        populated_stdout: |-
          {"entries": [],
           "summary": {"total_specs": 1, "fully_covered": 0, "partially_covered": 0,
                       "uncovered": 1, "passing": 0, "failing": 1},
           "results_validation_errors": [
             {"kind": "empty_stream_name", "stream": "", "stream_index": 0,
              "message": "streams[0] declares an empty name"},
             {"kind": "undeclared_stream", "stream": "js", "result_index": 0,
              "message": "results[0] names stream js, which the block does not declare"}]}
      expected_output:
        entries_is_array_length_0: true
        parseErrors_is_array_length_0: true
        parseErrorPatterns_is_array_length_0: true
        diagnostic_hints_is_array_length_0: true
        invalid_status_warnings_is_array_length_0: true
        resultsValidationErrors_is_array_length_0: true
        raw_results_validation_errors_is_absent: true
        CoverageReport_declares_resultsValidationErrors: true
        element_type_declares_kind_stream_message_and_both_coordinate_names_across_the_union: true
        element_type_requires_exactly_one_coordinate: true
        populated_outer_key_is_resultsValidationErrors: true
        populated_stream_index_becomes_streamIndex: true
        populated_result_index_becomes_resultIndex: true
        no_snake_case_key_survives_at_either_level: true
        type_is_a_discriminated_union_on_kind: true
        the_element_type_is_declared_in_types_ts: true
        CoverageReport_carries_the_array: true
        client_returns_the_shared_type: true
        no_unknown_cast_between_client_and_consumer: true
        undeclared_stream_requires_resultIndex_and_forbids_streamIndex: true
        other_kinds_require_streamIndex_and_forbid_resultIndex: true
        threw: false
      references_constraints: ["C-31"]
      priority: high

    - id: AC-76
      description: >-
        Normalization happens at one point, so a `--json` command added later
        cannot skip it. A static test parses `vscode-extension/src/client.ts`
        with the TypeScript compiler API, following the precedent of AC-58 and
        AC-67. The scan is bounded to that one file. It finds every call
        expression whose argument list contains the string literal `--json`,
        walks to the handler that receives that invocation's result, and
        collects the name of the callee that takes `stdout` as an argument.
        The scan asserts two things. It finds at least three such `--json`
        invocations, which is the positive control: a scan that matches
        nothing must fail rather than pass. And the set of collected callee
        names has exactly one member, so every `--json` document passes
        through the same function on its way out. AC-74 kills a normalizer
        moved into the existing converters. This kills a fourth command that
        never reaches the normalizer at all, which is the shape that has bitten
        this project three times as an unswept sweep.
      inputs:
        scan_target: "vscode-extension/src/client.ts, every call expression carrying the string literal --json"
      expected_output:
        json_invocations_found_at_least: 3
        distinct_stdout_consuming_callees: 1
      references_constraints: ["C-31"]
      priority: high

    - id: AC-77
      description: >-
        **Two cases, and both are declared: a conversion case and a retraction
        case.** They need separate documents, because the second turns on a key
        the first must not contain.

        **Conversion.** The check document's keys are converted, all three of
        them. Given a check diagnostic carrying `spec_id`, `constraint_id`, and
        `constraint_type`, the object `client.check()` returns exposes
        `specID`, `constraintID`, and `constraintType` with the CLI's values,
        and carries none of **those three** snake-case keys. The count is
        qualified deliberately: it is zero of the three converted keys, not
        zero snake-case keys of any kind. The retraction case below returns a
        document that legitimately carries `change_type`, which is snake case
        and must survive, so an unqualified count would put the two cases in
        contradiction. AC-72 pins `spec_id`
        alone, through the members `types.ts` declares required, so deleting
        either of the other two entries from the check key map changes nothing
        any criterion reads. Asserting the absence of the snake-case keys is
        the half that fails when the check document is converted with the
        coverage map instead, which would map `spec_id` and leave the other two
        untouched. Nothing in the extension reads `constraintID` or
        `constraintType` today. The criterion is about the document the client
        returns, not about a rendered effect, and C-32 requires the conversion
        because `types.ts` declares those two members. **This said four keys
        until 2026-08-27.** `change_type` was the fourth, and `spec-check` 2.0.0
        retracted the classification that produced it, so the `changeType`
        member goes from `types.ts` (`bugs/SP-SP-018`).

        **Retraction.** The criterion also asserts what happens to a
        `change_type` key that arrives anyway, and it asserts it as **the
        complete key set of the returned object**: every level of it, not the first diagnostic alone.

        A set rather than a list of separate claims, because C-32 makes two
        requirements and no combination of single-key assertions covers both.
        Absence of `changeType` alone is satisfied by renaming the key to a
        third name. Pass-through alone is satisfied by an identity entry, which
        is fine, **and also by a converter that preserves `change_type` and
        emits an extra key beside it**, which is not: a rename consumes the
        original key, but a duplication does not, so pass-through says nothing
        about invention. That is why no-invention is a separate requirement.
        This paragraph claimed pass-through was satisfied "by nothing else"
        until 2026-08-28, and the preserve-and-duplicate case disproves it.

        **Every level, because C-32 binds the returned object and not one
        diagnostic.** A conversion that adds a key beside `diagnostics` and
        `summary` violates the constraint as plainly as one that adds a key
        beside `constraintID`, and a criterion that reads only
        `diagnostics[0]` cannot see it.

        **Both cases bind their key sets, not the retraction case alone.**
        C-32's no-invention half applies to every input, and one case cannot
        stand in for the other: a converter that adds a key only when
        `change_type` is absent is invisible to the retraction fixture, which
        always carries it. The conversion case therefore declares its own three
        sets above. Added 2026-08-28 after exactly that converter passed every
        assertion this criterion then had.

        **The map entry itself is not the subject.** This said "the map entry
        goes" until 2026-08-28, which contradicted C-32's explicit permission
        for an entry mapping `change_type` to itself. That entry is
        observationally identical to no entry, and the criterion binds the
        document the client returns rather than a module-private table.
      inputs:
        conversion_cli_stdout: |-
          {"diagnostics": [
            {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
             "constraint_id": "C-02", "constraint_type": "technical",
             "message": "Constraint C-02 in \"spec-o\" is not referenced by any acceptance criterion"}
          ], "summary": {"errors": 1, "warnings": 0, "info": 0}}
        retraction_cli_stdout: |-
          {"diagnostics": [
            {"kind": "orphan_constraint", "severity": "error", "spec_id": "spec-o",
             "constraint_id": "C-02", "constraint_type": "technical",
             "change_type": "constraint_removed",
             "message": "Constraint C-02 in \"spec-o\" is not referenced by any acceptance criterion"}
          ], "summary": {"errors": 1, "warnings": 0, "info": 0}}
        cli_exit_code: 1
        client_method: "check"
      expected_output:
        conversion_specID: "spec-o"
        conversion_constraintID: "C-02"
        conversion_constraintType: "technical"
        conversion_converted_snake_case_keys_present: 0
        conversion_returned_keys: "diagnostics, summary"
        conversion_summary_keys: "errors, warnings, info"
        conversion_diagnostic_keys: "constraintID, constraintType, kind, message, severity, specID"
        retraction_returned_keys: "diagnostics, summary"
        retraction_summary_keys: "errors, warnings, info"
        retraction_diagnostic_keys: "change_type, constraintID, constraintType, kind, message, severity, specID"
      references_constraints: ["C-32"]
      priority: high

    - id: AC-78
      description: >-
        A coverage parse error that carries a line highlights that line. This
        is the path SP-SP-034 reports: a YAML syntax error is the one coverage
        parse error the CLI positions, it reports a 1-based line and no
        column, and the diagnostic ran from the start of that line to the end
        of it until an implementation change made the range empty. The range
        starts at line 2 for a reported line 3 and ends at line 2, character
        `Number.MAX_SAFE_INTEGER`. Kept separate from AC-71 because an
        implementation that puts every coverage parse error at the start of the
        file satisfies AC-71 and fails this one, which is the AC-64 and AC-65
        split applied to the coverage path.
      inputs:
        coverage_parse_error: |-
          {"file": "specs/c.spec.yaml", "path": "", "type": "yaml_syntax",
           "message": "yaml: line 3: mapping values are not allowed in this context",
           "line": 3}
      expected_output:
        diagnostics_built: 1
        diagnostic_file: "specs/c.spec.yaml"
        range_start_line: 2
        range_start_character: 0
        range_end_line: 2
        range_end_character: 9007199254740991
        all_four_range_numbers_finite: true
      references_constraints: ["C-32", "C-10"]
      priority: high

    - id: AC-79
      description: >-
        A coverage report carrying `stop_reason` is not rendered as an empty
        workspace. Given a report with `stop_reason` set, `entries: []`, a
        zeroed summary and no parse errors, the sidebar shows a state distinct
        from both the nothing-to-show state and the parse-failed state, and the
        reason text reaches the Output channel.

        The negative control is the point: the same document without
        `stop_reason` must still render as nothing-to-show, because that is a
        real empty workspace and the two are identical on every other field.
        Asserting only the refusal case would pass on an implementation that
        renamed the empty state.
      inputs:
        refused: "a raw CLI document with stop_reason {kind, message}, entries [], summary zeroed, parse_errors []"
        empty_workspace: "the same document with no stop_reason"
        parse_failed: "entries [], no stop_reason, parse_errors non-empty"
        through_the_client: "the refused document read through SpecterClient rather than handed to the tree builder"
        multi_root: "two folders, one reaching its report and one refused"
      expected_output:
        raw_stop_reason_converts_to_stopReason: true
        raw_snake_case_key_does_not_survive: true
        typed_report_declares_the_field: true
        refused_state_differs_from_nothing_to_show: true
        refused_state_differs_from_parse_failed: true
        empty_workspace_still_renders_nothing_to_show: true
        stop_reason_text_reaches_the_output_channel: true
        merged_report_keeps_the_refusal: true
        merged_refusal_names_its_folder: true
        merged_refusal_is_keyed_by_the_store_folder_key: true
        successful_folder_entries_survive_the_merge: true
        unknown_kind_is_rejected: true
        kind_widened_to_string_is_rejected: true
        reason_without_its_folder_is_rejected: true
        four_kinds_declared_once: true
      references_constraints: ["C-33"]
      priority: critical

  depends_on:
    - spec_id: spec-parse
      version_range: "^1.1.0"
      relationship: requires
    - spec_id: spec-check
      version_range: "^4.0.0"
      relationship: requires
    - spec_id: spec-coverage
      version_range: "^1.26.0"
      relationship: requires
    - spec_id: spec-diff
      version_range: ">=1.0.0 <3.0.0"
      relationship: requires
    - spec_id: spec-explain
      version_range: "^1.0.0"
      relationship: requires

  changelog:
    - version: "5.1.0"
      date: "2026-08-30"
      author: "specter-team"
      type: minor
      description: "C-33 and AC-79 carry the consumer half of spec-coverage C-10. That constraint chose the additive shape for a refused coverage run: the document still emits entries [] and a zeroed summary, as uncomputed placeholders, with stop_reason as the only field that distinguishes them. This extension keys its empty state on exactly that pair, an empty entries list with no parse errors, so the producer fix arrives here as a new way to be wrong: the sidebar would report nothing to show for a workspace whose manifest was rejected, which leaves bugs/SP-SP-032 semantically open while the CLI half is closed. C-33 requires stop_reason to be read before entries or summary are interpreted, requires the state to be distinguishable from both the empty and the parse-failed states, and requires the reason to reach the Output channel so an operator can tell which of the seven refusals fired. AC-79 carries a negative control: the same document without stop_reason must still render as nothing to show, since the two are identical on every other field and asserting only the refusal case would pass on an implementation that merely renamed the empty state. The spec-coverage floor rises from ^1.23.0 to ^1.26.0, because stop_reason does not exist below it. C-33 also binds the two boundaries the first draft left open. The wire boundary: the CLI emits stop_reason and this extension speaks camelCase, and client.ts FIELD_MAP had no entry for it, so the raw key would have survived untyped and AC-79 could have passed while the real client returned it. The criterion now reads the document through SpecterClient rather than handing it to the tree builder, which is the only way to see that. The multi-root boundary: the store merges per-folder reports by reconstructing the document field by field, so a field not named there is silently dropped. One refused folder must not erase a successful one, and the merged report carries a per-folder map of refusals rather than one aggregate reason, because a lone reason on an aggregate has no owner and concatenating several loses which folder each belongs to. Both shapes are declared in the constraint rather than left to a test to invent: an exported CoverageStopReason with kind and message, an optional stopReason on CoverageReport, and a distinct MergedCoverageReport carrying folderStopReasons keyed by the store's own folder key, the value createClientKey produces. A distinct merged type keeps a single-folder report and an aggregate from being one type wearing different fields. The four kinds are declared once, with no second union, no widening to string, and no private copy in a fixture, because a duplicate declaration is a copy of policy that will not know when the set changes. Minor per the classifier: specter diff reports [additive]."

    - version: "5.0.2"
      date: "2026-08-30"
      author: "specter-team"
      type: patch
      description: "Raises the spec-check floor from ^3.0.0 to ^4.0.0. spec-check 4.0.0 strengthens AC-46 so the check document must name the diagnostic that stopped the run, and specter diff classifies an expected_output change as breaking, so the major was taken from the classifier. The old range excluded the version this spec is now checked against, and check reported version_mismatch. Patch: only the dependency range moved, with no constraint or criterion touched on this spec."
    - version: "5.0.1"
      date: "2026-08-29"
      author: "specter-team"
      type: patch
      description: "Raise the `spec-check` dependency floor to `^3.0.0`. `spec-check` 3.0.0 widens C-07's non-promotable set to include `unreachable_annotation_unknown`, and `^2.0.0` does not admit a 3.x version, so `resolve` would report a version mismatch on an unchanged workspace. No behavior of this spec changes."
    - version: "5.0.0"
      date: "2026-08-28"
      author: "specter-team"
      type: major
      description: "Retract the gray-dash `gap: true` rendering from C-07 and AC-05. The extension could not produce it: `coverage --json` emits no gap criterion ids, so the only caller passed an empty list and the builder branch never ran (`bugs/SP-SP-019`). Retracted rather than implemented, because making the promise true would render a mostly wrong signal: a constraint counts as covered only when an assertion's text contains its field name, so most `gap: true` values on a real repository are false (`bugs/SP-SP-064`, deferred). The dead plumbing goes with the promise, so no unowned private feature is left behind. Major. `specter diff` reports patch, because it sees description text; `docs/SPEC_SCHEMA_REFERENCE.md` reserves PATCH for non-functional changes that do not alter meaning, and removing a normative promise alters meaning. The doc lists removing a constraint or criterion as MAJOR without an impact test, and this is the same act one level down. Recorded honestly: no implementation is invalidated, because none produced the decoration, so the conservative reading is chosen rather than an argued-down one."
    - version: "4.0.0"
      date: "2026-08-28"
      author: "specter-team"
      type: major
      description: "C-32 gains two requirements about the returned document: every input key the constraint does not require to be renamed reaches the caller under its original name, and the conversion adds no key. Neither implies the other. Without pass-through, forbidding only the production of `changeType` permits dropping `change_type` or renaming it to a third name. Without no-invention, a converter may preserve `change_type` and emit an extra key beside it. In both cases the returned object carries a member `types.ts` does not declare, which is the false guarantee this constraint already forbids, read from the object rather than the declaration. Stated against the renamed set this constraint owns rather than against what an implementation happens to rename: the earlier wording, \"a key the conversion does not rename\", was circular, because renaming `change_type` to a third name put it outside the clause by the act the clause forbids. AC-77 said the map entry goes, contradicting 3.0.2's permission for an entry mapping `change_type` to itself; it now binds the returned document. AC-77 binds the exact key set at every level of the returned object in **both** of its cases, because a converter that invents a key only when `change_type` is absent is invisible to the retraction fixture, which always carries it. AC-77 also gains the case it was already being tested against: it declared one input, without `change_type`, while its test supplied an undeclared second document carrying the key. Both are now declared, a conversion case and a retraction case, with the retraction case binding the complete key set at every level of the returned object rather than the first diagnostic alone, because a conversion that adds a key beside `diagnostics` and `summary` breaks the constraint as plainly as one that adds a key beside `constraintID`. The conversion case's zero snake-case count is qualified to the three converted keys, since the retraction document legitimately carries `change_type`. And AC-77 said pass-through is satisfied by an identity entry \"and by nothing else\", which the preserve-and-duplicate case disproves and which is the reason no-invention is a separate requirement. Major, not the minor first written and not the patch `specter diff` reports: `docs/SPEC_SCHEMA_REFERENCE.md` sets MAJOR for a change that could break downstream specs **or implementations**, and lists narrowing scope in a way that invalidates existing implementations. A new MUST makes a previously conforming converter nonconforming. No spec depends on `spec-vscode`, so nothing cascades, which affects blast radius and not classification."
    - version: "3.0.2"
      date: "2026-08-28"
      author: "specter-team"
      type: patch
      description: "Move C-32's retraction clause from representation to observable semantics, no behavior change. It said the client's key map MUST NOT carry `change_type`. That is a rule about the contents of a module-private constant, and no observation enforces it: the converter resolves an unmapped key to itself, so an entry mapping `change_type` to itself is observationally identical to no entry. A guard written against the old wording passed on that mutant while reporting that it killed every mapping. The clause now binds what is declared and what is produced, which is what the rule was ever about, and permits an identity entry explicitly. Recorded here because the same clause has now produced three failed guards, two of them lexical searches over source text."
    - version: "3.0.1"
      date: "2026-08-28"
      author: "specter-team"
      type: patch
      description: "Correct a self-contradiction in C-32, no behavior change. The constraint required the check document's keys to be converted, and four sentences earlier said in the present tense that the coverage path converts and the check path does not. The check path gained `snakeToCamelCheck` in v0.15.0 and `client.ts` calls it, so the clause described a shape the code had already left. Reworded as history, which is what it was: before v0.15.0 the same declared name was correct on the coverage document and wrong on the check document, and every read of `diagnostic.specID` returned undefined."
    - version: "3.0.0"
      date: "2026-08-27"
      author: "specter-team"
      type: major
      description: "Drop `change_type` from the check document contract. `spec-check` 2.0.0 retracted version-change classification (`bugs/SP-SP-018`), so no check diagnostic can carry the field and the extension must not declare it. Amend C-32 to remove `change_type` from both the carries list and the key-conversion list, and to say plainly that leaving `changeType` in `types.ts` would be the same false guarantee C-32 already forbids, pointed the other way: a declared member against a document that can never carry the field. Amend AC-77 from four converted keys to three, and replace its fixture, which used `kind: breaking_change`, a diagnostic kind that no longer exists. Raise the `spec-check` dependency floor to `^2.0.0`, because `^1.1.0` does not admit 2.0.0. Major because a documented field is removed from the contract."
    - version: "2.0.0"
      date: "2026-08-26"
      author: "specter-team"
      type: major
      description: "C-31 and AC-75 gain `results_validation_errors`, the sixth array on the coverage document, arriving with `spec-coverage` 1.23.0 and C-44. The client's array-field table enumerates fields rather than deriving them, so a new top-level array missing from it is normalized wrongly, which is the declared-but-unregistered pattern the parity tests exist to catch. The field is converted to `resultsValidationErrors` and typed on `CoverageReport` rather than preserved as a raw snake-case key, because a consumer reaching for a raw key is one the type does not describe. AC-75 carries a populated document beside the empty one, since an empty-array assertion proves normalization and nothing about conversion, and asserts the nested coordinates convert too. The type is declared in `types.ts` and carried on `CoverageReport`, and `CoverageResult` and the `unknown` cast both go. The defect is compile-time contract drift rather than runtime loss: the cast erases type information and no fields, so the value survives while the guarantee does not, and two declarations of one document drift with the compiler silenced. What a multi-root workspace should do with these errors is deliberately not answered here, because `merged()` reconstructs the report field by field and aggregating them is its own question. The element type is a discriminated union on `kind`, so `spec-coverage` C-44's exactly-one-coordinate rule is enforced by the compiler rather than checked by a reviewer. The obligation is stated here rather than in `spec-coverage` AC-72, where an earlier draft put it: this spec owns the client. The `spec-coverage` floor rises from ^1.5.0 to ^1.23.0, the version that introduces the field. Major rather than minor: AC-75 gains an input, and `specter diff` classifies an inputs change as breaking. Reported as such and followed rather than reasoned around, which is the mistake this cycle already made once on `spec-coverage` 1.22.0. No spec depends on `spec-vscode`, so nothing cascades."

    - version: "1.10.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: >
        SP-SP-033 and SP-SP-034, both from the phase 4 mutation review of
        SP-SP-025. Amend C-31 to say where its guarantee is observable: the
        document each client method returns, under the name that document
        carries after key conversion. Two of the six fields it names,
        `diagnostic_hints` and `invalid_status_warnings`, have no consumer and
        no declaration in `types.ts`, and the amendment says so rather than
        implying an effect nothing produces. Add AC-74: `client.parse()`
        against `{"errors": null, ..., "ok": true}` returns `errors` as an
        empty array. Deleting `errors` from the client's array-field list
        passed all 286 tests, and so did moving normalization out of the
        single parse point into the per-command key converters, which leaves
        the parse document unnormalized. AC-62 and AC-63 feed documents
        straight to the builder and never reach the client, so neither could
        catch either. Add AC-75: all five coverage array fields are arrays on
        the returned document, in one document where three arrive `null` and
        two are absent. `parse_error_patterns`, `diagnostic_hints`, and
        `invalid_status_warnings` had no criterion. Add AC-76, a static scan
        of `client.ts` asserting that every `--json` invocation hands stdout
        to the same one function, with a fail-if-fewer-than-three positive
        control, so a fourth `--json` command cannot skip normalization. Add
        AC-77: all four check key-map entries are pinned at the client
        boundary. Only `spec_id` was pinned, so deleting `constraint_id`,
        `constraint_type`, or `change_type` passed, as did converting the
        check document with the coverage map.
        SP-SP-034 is a range end no criterion stated, so a test chose it and
        an implementation was changed to match, which removed a highlight
        users had. Amend C-32 to decide it once: every range derived from a
        CLI diagnostic ends on the start line at `Number.MAX_SAFE_INTEGER`,
        highlighting to the end of that line, and an end equal to the start is
        prohibited. The rule is uniform across all three sites rather than
        per-site, because the same schema parse error reaches the Problems
        panel by two paths, the on-save `parse --json` run and the `coverage
        --json` refresh, so a per-site decision renders one error two ways
        depending on which run produced it. The 1.9.0 authors could not weigh
        that when they set AC-64's end, because AC-71's end was unstated at the
        time. The rule also does not rest on the unverified claim that VS Code
        widens a zero-width range to the word it lands on. Amend AC-64, AC-65,
        AC-66, and AC-71 to state all four range numbers. Add AC-78: a
        coverage parse error carrying a line highlights that line, which is
        the path that regressed and the one AC-71 does not reach. Amend AC-72
        and AC-73 to require the presence assertion read the returned object
        through an untyped view, so a change to the interface it guards cannot
        stop its own file compiling and take every criterion in that file down
        with it. Under one tsconfig that is the whole fix available in the
        spec: it does not stop an interface change from failing a different
        module that reads those members.
    - version: "1.9.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: >
        SP-SP-025, P0. Add C-31: every array-valued field of a `--json`
        document MUST be an array by the time any consumer sees it,
        normalized at the single point where stdout is parsed. Go marshals a
        nil slice as `null` and drops an `omitempty` field, so a clean
        workspace emits `{"diagnostics": null, ...}` from `check --json` at
        exit 0 and `{"errors": null, ..., "ok": true}` from `parse --json` at
        exit 0. The extension iterated both without a guard from its first
        commit on 2026-04-16, so every save of a spec that parses cleanly
        threw, a catch swallowed it, and the Problems panel was never
        populated from the on-save path. C-31 also settles the interaction
        with C-30: a null-array document is a parseable document and takes
        the success path, so a clean run replaces the collection with the
        empty set rather than leaving the previous run's entries on screen.
        The rule is written independently of the CLI-side decision about
        emitting `[]`, which is scheduled separately; if that lands,
        normalization becomes a no-op. Add C-32: every range derived from a
        CLI diagnostic carries finite integers, absent positions default to
        0, and the declared TypeScript types may not assert fields the CLI
        does not emit. `SpecterParseError` declared `col` and `code` where
        the CLI emits `column` and `type`, and `SpecterCheckDiagnostic`
        declared `line` as required though check diagnostics carry no
        position at all, so the arithmetic yielded `NaN` and `tsc` certified
        it. Add AC-61 (clean-workspace save clears the panel instead of
        throwing), AC-62 and AC-63 (a null half does not suppress a populated
        half of two, in both directions), AC-64 and AC-65 (no position
        defaults to 0, a 1-based line converts and an absent column still
        defaults), AC-66 (a check diagnostic yields a finite range at the
        start of the file), AC-67 (static scan of two interfaces in
        `types.ts`: no `col`, no `code`, `line` not required), AC-68
        (`entries: null` normalizes to an empty array), AC-69
        (`parse_errors` absent normalizes to an empty array), AC-70
        (`value: null` on a failed parse is returned without throwing), and
        AC-71 (the same finite-range rule on the coverage parse-error path,
        which is the second consumer of CLI positions and feeds AC-34). Add
        AC-72 and AC-73: every member declared required on
        `SpecterCheckDiagnostic` and on `SpecterParseError` is present on the
        object the client returns for the CLI's own document. Three fail today
        on the check side, `specID`, `file`, and `line`, and four on the parse
        side, `col`, `code`, `line`, and `file`. Both are written so that any
        correct fix passes, whether the extension converts the document's
        keys, renames the declared members, stamps the file name, or marks a
        member optional. AC-67 stays a static scan and stops at the names no
        CLI field maps to, because a static assertion on `specID` or `file`
        would fail a fix that converts or stamps.
    - version: "1.8.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: >
        SP-SP-023, release blocker. Add C-30: a non-zero CLI exit does not
        discard a `--json` document. Every `--json` invocation the extension
        makes MUST route through an invocation path that resolves on a
        non-zero exit, and the document MUST be acted on exactly as it would
        be on a zero exit. Written as a general rule rather than a `check`
        fix, because the same correct fix was applied to `coverage` alone in
        v0.13 and is now the third instance of an unswept sweep. It therefore
        pre-covers `parse --json` for when SP-SP-022 lands. C-30 also settles
        three things the old text left open. The failure predicate is the
        absence of a parseable document, not the exit code, so unparseable
        stdout on a zero exit fails the same way. A failed invocation MUST
        leave the existing diagnostics in place rather than replace them with
        an empty set, which bounds C-05's "on each run" to runs that produced
        a document. A spawn failure takes the failure path and MUST NOT be
        absorbed as a normal result. Add AC-56 (check exits non-zero with a
        valid document, diagnostics still published, collection identical to
        the zero-exit run, no notification), AC-57 (same for `parse --json`
        and `coverage --json`), AC-58 (static parity test: zero `--json` call
        sites on a rejecting path, so a later one fails the build), AC-59 (no
        parseable document at any exit code routes to the Output channel,
        does not clear diagnostics, sets the status bar error state), and
        AC-60 (spawn failure takes the AC-59 path, named as a spawn error).
    - version: "1.7.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: >
        Multi-root coverage isolation + on-save whole-report refresh.
        Amend AC-33: CLI-emitted relative paths resolve against the OWNING
        workspace folder (the manifest's directory — the CLI's cwd) once at
        report-ingestion time, not against the first workspace folder. The
        prior wording said "the workspace folder root" without naming which
        folder in a multi-root workspace; the implementation read it as
        workspaceFolders[0], sending folder B's paths into folder A. Amend
        AC-22 to name the per-folder coverage report alongside the
        per-folder client, collection, and manifest. Add AC-54 (per-folder
        report isolation: folder B's run does not overwrite folder A's
        report; parse-error diagnostics resolve into the owning folder;
        aggregate views merge all folders' reports; removing a folder
        removes its report; single-root behavior unchanged). Add AC-55
        (saving a spec replaces the saved file's folder report wholesale
        via the same ingestion path as the initial load; the entries[0]
        splice and the slash-comment regex trigger are prohibited; the
        AC-18 notification evaluates the fresh entry matched by specFile).
    - version: "1.6.0"
      date: "2026-04-28"
      author: "specter-team"
      type: minor
      description: "v0.12 review fix — shape-aware quick-fix refusal. Add C-29/AC-53: before offering the `Remove deprecated field` CodeAction, the provider inspects the diagnostic's line and refuses when the value is a block scalar (`| / >`), a next-line sequence/mapping value, or an unterminated quoted string — line-deletion on these shapes would orphan continuation lines and corrupt the file. Mirrors the migrate package's yaml-aware refusal (spec-doctor C-15) so editor and CLI workflows agree on what is safe. AC-52 wording reworded to accept either an inline `'yaml'` selector or a named `DocumentSelector` constant whose `language` field equals `'yaml'` — the prior wording over-specified the implementation, causing the static-grep test to fail against the variable form."
    - version: "1.5.0"
      date: "2026-04-27"
      author: "specter-team"
      type: minor
      description: "v0.12 — VS Code quick-fix for known-removed fields. Add C-28/AC-51/AC-52: when a parse diagnostic on a .spec.yaml file matches `Unknown field '<X>'` and `<X>` is in the known-removed-fields list (initial v0.12 list: `trust_level`), the extension offers a `Remove deprecated field` CodeAction that deletes the offending line. The matching helper is runtime-free (no vscode imports) so unit tests don't need a vscode shim. Pairs with `specter doctor --fix` (spec-doctor 1.3.0+) for the CLI path — both apply the same `strip-trust-level` repair."
    - version: "1.3.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: >
        v0.9.1 post-ship audit fixes (see research/SPECTER_AUDIT_2026-04-19.md).
        Add C-22/AC-41 (package.json ↔ extension.ts command parity enforced by
        CI test — eliminates the declared-but-unregistered class that shipped
        three times in v0.9.0/v0.9.1). Add C-23/AC-42 (disposables pushed to
        ctx.subscriptions; specifically fixes driftDecorationType leak). Add
        C-22/AC-43 (register specter.runReverse) and C-22/AC-44 (resolve the
        specter.openQuickStart orphan declaration). Add C-24/AC-47 (mandatory
        checksum verification — no silent fallback when checksums.txt is
        unreachable). Add C-25/AC-45 (binary resolution runs even in empty
        workspaces) and C-25/AC-46 (walkthrough reachable when its condition
        is true). Add C-26/AC-48 (on-type parse errors to Output channel) and
        C-26/AC-49 (drift-scan errors to Output channel).
    - version: "1.2.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: >
        v0.9.0 coherent failure-handling. Rewrite AC-29 against the new
        spec-coverage 1.5.0 parse_errors contract. Add AC-30 (no-specs-yet
        distinct from parse-failure), AC-31 (runSync emits honest completion
        message), AC-32 (hover populates coveredByFiles from the real
        report instead of passing []), AC-33 (Coverage sidebar is clickable
        — spec nodes open the .spec.yaml, test-file leaves open the test
        file, with relative paths resolved against the workspace root),
        AC-34 (parse errors push to VS Code Problems panel as diagnostics,
        one per broken file, clickable), AC-35 (sidebar diagnostic message
        uses spec_candidates_count + parse_error_patterns to name schema
        drift explicitly when every spec hit the same failure), AC-36
        (sidebar renders passing specs AND a Failed-to-parse group in the
        same tree so users can act on both without one hiding the other),
        AC-37 (Insights panel no longer claims `All specs passing` when
        parse failures exist — renders a Parse-failures section alongside
        coverage cards, with an honest mixed-state header), AC-38
        (specter.revealInTree command wired end-to-end: active editor →
        matching tree node, previously declared in package.json but never
        registered), AC-39 (Insights parse-failure cards have clickable
        file-path headers that open the file at the reported line),
        AC-40 (on-change/on-save parse hooks gated to .spec.yaml so the
        manifest specter.yaml stops receiving spurious `Missing required
        field 'spec'` diagnostics).
        Addresses quality-audit BLOCKER B1 and HIGHs H1/H3.
    - version: "1.1.0"
      date: "2026-04-18"
      author: "specter-team"
      type: minor
      description: >
        Add C-21/AC-28/AC-29: Coverage sidebar renders a state message node
        when no coverage data is available (missing manifest / no specs / all
        specs failed to parse). Prevents the silent-empty-panel dead-end.
        Also add AC-23..AC-27 retroactively covering v0.6.5–v0.6.9 extension
