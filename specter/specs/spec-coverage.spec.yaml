        two_runs: "the same workspace, twice"
      expected_output:
        ran_and_empty_is_visible: true
        never_ran_is_distinguishable_from_ran_and_empty: true
        streams_array_is_byte_identical_across_runs: true
      references_constraints: ["C-42"]
      priority: critical

    - id: AC-70
      description: "The covered rule, in both directions. A criterion with one entry reporting `passed` in one stream and one entry reporting `failed` in another is NOT covered, because every stream holding an entry must report passed. A criterion with entries reporting `passed` in two streams IS covered. A criterion that no stream reported on is NOT covered, and this is the case that a rule written without C-43's first clause gets wrong: it would be vacuously covered over an empty set. Asserted directly rather than through a percentage, because the vacuous-truth failure changes a verdict and can leave a percentage looking plausible."
      inputs:
