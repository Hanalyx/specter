      description: "A spec with 2 of 3 criteria covered reads the same on all three surfaces. `coverage --json` reports coverage_pct 66.7, the coverage table prints `66%` in the Coverage column, and `specter explain` prints `Coverage: 66% (2/3 ACs)`. Before this change the three surfaces read 66.6, 67, and 66."
      inputs:
        spec: "3 criteria declared, AC-01 and AC-02 annotated, AC-03 not"
      expected_output:
        coverage_pct: 66.7
        table_coverage_cell: "66%"
        explain_line_contains: "Coverage: 66% (2/3 ACs)"
      references_constraints: ["C-35"]
      priority: critical

    - id: AC-45
      description: "On that same 2-of-3 workspace, `coverage_threshold: 66` passes and `coverage_threshold: 67` fails, so the integer the table printed is an integer that passes. Before this change the table printed 67 and 67 failed."
      inputs:
        workspace: "one spec, 3 criteria, 2 annotated"
        case_a: "coverage_threshold: 66"
        case_b: "coverage_threshold: 67"
      expected_output:
        case_a_passes_threshold: true
        case_a_exit_code: 0
        case_b_passes_threshold: false
        case_b_exit_code: 1
      references_constraints: ["C-35"]
      priority: critical

    - id: AC-46
      description: "FormatCoveragePct floors and does not round. A spec with 7 of 9 criteria covered reports coverage_pct 77.8 and prints `77%` in the coverage table, where a formatter built on Go's `%.0f` prints 78%. A spec with 5 of 8 criteria covered reports 62.5 and prints `62%`, which fixes the tie direction against a round-half-up formatter."
      inputs:
        case_a: "covered 7, total 9"
        case_b: "covered 5, total 8"
      expected_output:
        case_a_pct: 77.8
        case_a_formatted: "77%"
        case_b_pct: 62.5
        case_b_formatted: "62%"
      references_constraints: ["C-35"]
      priority: high

    - id: AC-47
      description: "CoveragePercent never reports 100 for an incomplete spec, and never divides by zero. CoveragePercent(2999, 3000) returns 99.9 rather than 100.0 and formats as `99%`, while CoveragePercent(3000, 3000) returns 100.0 and formats as `100%`. A Tier 1 spec with one uncovered criterion therefore fails its threshold of 100 however many criteria it declares. CoveragePercent(0, 0) returns 0, not NaN."
      inputs:
        case_incomplete: "covered 2999, total 3000"
        case_complete: "covered 3000, total 3000"
        case_empty: "covered 0, total 0"
      expected_output:
        incomplete_pct: 99.9
        incomplete_formatted: "99%"
        complete_pct: 100.0
        complete_formatted: "100%"
        empty_pct: 0
      references_constraints: ["C-35"]
      priority: high

    - id: AC-48
      description: "The C-16 summary header takes the floor of the mean of the entries' coverage_pct values, so it never disagrees with the column below it. A report of one spec at 66.7 reads `Spec Coverage Report — 1 specs · 66% avg coverage` above a table cell of `66%`, where before this change the header rounded and read 67%. A report of two specs, one at 66.7 and one at 100, has a mean of 83.35 and reads `Spec Coverage Report — 2 specs · 83% avg coverage`. Both values are unchanged by the exact-mean rule of C-35(e), which moves only the cases where a float sum lands below the true mean; AC-59 covers one of those."
      inputs:
        case_single: "1 spec, 2 of 3 criteria covered"
        case_multiple: "2 specs, coverage_pct 66.7 and 100"
      expected_output:
        single_header_line: "Spec Coverage Report — 1 specs · 66% avg coverage"
        single_table_cell: "66%"
        multiple_header_line: "Spec Coverage Report — 2 specs · 83% avg coverage"
      references_constraints: ["C-35", "C-16"]
      priority: medium

    - id: AC-49
      description: "A Tier 1 spec declaring `coverage_threshold: 0` with 0 of 2 criteria covered passes. `coverage --json` reports threshold 0 and passes_threshold true, and the run exits 0. Before this change the same spec reported threshold 100 and failed."
      inputs:
        spec: "tier 1, coverage_threshold: 0, 2 criteria, none annotated"
      expected_output:
        threshold: 0
        coverage_pct: 0
        passes_threshold: true
        exit_code: 0
      references_constraints: ["C-36"]
      priority: critical

    - id: AC-50
      description: "A Tier 1 spec that omits coverage_threshold with 2 of 3 criteria covered still reports threshold 100 and passes_threshold false. A fix that treats every zero-valued field as a declared override would report 0 here and fail this criterion."
      inputs:
        spec: "tier 1, no coverage_threshold field, 3 criteria, 2 annotated"
      expected_output:
        threshold: 100
        coverage_pct: 66.7
        passes_threshold: false
      references_constraints: ["C-36"]
      priority: critical

    - id: AC-51
      description: "`settings.coverage.tier2: 0` in specter.yaml gives a Tier 2 spec an effective threshold of 0, so a spec with 2 of 3 criteria covered passes and `coverage --json` reports threshold 0. Before this change the manifest value of 0 fell through to the built-in default and the report read threshold 80."
      inputs:
        manifest: "settings.coverage.tier2: 0"
        spec: "tier 2, no coverage_threshold field, 3 criteria, 2 annotated"
      expected_output:
        threshold: 0
        passes_threshold: true
        exit_code: 0
      references_constraints: ["C-36"]
      priority: high

    - id: AC-52
      description: "Precedence holds when both override layers are present in one run. With `settings.coverage.tier2: 40` in the manifest, a Tier 2 spec declaring `coverage_threshold: 0` reports threshold 0 and a second Tier 2 spec declaring no override reports threshold 40. Both entries appear in the same report. Before this change the first spec reported 40."
      inputs:
        manifest: "settings.coverage.tier2: 40"
        spec_a: "tier 2, coverage_threshold: 0, 3 criteria, 2 annotated"
        spec_b: "tier 2, no coverage_threshold field, 3 criteria, 2 annotated"
      expected_output:
        spec_a_threshold: 0
        spec_a_passes_threshold: true
        spec_b_threshold: 40
        spec_b_passes_threshold: true
        entries_count: 2
      references_constraints: ["C-36"]
      priority: high

    - id: AC-53
      description: "A spec covered by eight test files named a_test.go through h_test.go emits `test_files` in ascending path order on every run, `tests/a_test.go` first and `tests/h_test.go` last. Five consecutive runs emit that same array."
      inputs:
        workspace: "one spec, AC-01 annotated in tests/a_test.go through tests/h_test.go"
        command: "specter coverage --json --strictness annotation"
      expected_output:
        test_files: ["tests/a_test.go", "tests/b_test.go", "tests/c_test.go", "tests/d_test.go", "tests/e_test.go", "tests/f_test.go", "tests/g_test.go", "tests/h_test.go"]
        identical_across_five_runs: true
      references_constraints: ["C-37"]
      priority: high

    - id: AC-54
      description: "A workspace of six schema-invalid specs, three missing `objective` and three declaring `tier: 9`, all six declaring empty constraints and criteria lists, emits parse_error_patterns in one fixed order over twenty consecutive runs. Ordering by count alone leaves the two tied pairs in map order, which varied run to run before this change."
      inputs:
        workspace: "specs/bado1..3.spec.yaml missing objective, specs/badc1..3.spec.yaml with tier: 9, all 6 with empty constraints and acceptance_criteria"
        command: "specter coverage --json --strictness annotation"
      expected_output:
        parse_error_patterns: '[{"type":"minItems","path":"spec.acceptance_criteria","count":6},{"type":"minItems","path":"spec.constraints","count":6},{"type":"required","path":"spec","count":3},{"type":"validation","path":"spec.tier","count":3}]'
        first_pattern_files: ["specs/badc1.spec.yaml", "specs/badc2.spec.yaml", "specs/badc3.spec.yaml", "specs/bado1.spec.yaml", "specs/bado2.spec.yaml", "specs/bado3.spec.yaml"]
        identical_across_twenty_runs: true
      references_constraints: ["C-37"]
      priority: high

    - id: AC-55
      description: "Five consecutive `specter coverage --json --strictness annotation` runs on one unchanged workspace holding both the eight annotated test files of AC-53 and the six invalid specs of AC-54 write five byte-identical documents. The assertion compares the SHA-256 of stdout across the five runs. Before this change five runs produced five different hashes."
      inputs:
        workspace: "one valid spec covered by 8 test files, plus 6 schema-invalid specs"
        runs: 5
      expected_output:
        distinct_stdout_hashes: 1
      references_constraints: ["C-37"]
      priority: critical

    - id: AC-56
      description: "`specter explain` prints the integer the coverage table prints because it calls the shared formatter, not because its own arithmetic happens to agree. On a workspace of two Tier 1 specs, one with 17 of 21 criteria annotated and one with 7 of 9, `specter explain wide-spec` prints `Coverage: 81% (17/21 ACs)` and `specter explain nine-spec` prints `Coverage: 77% (7/9 ACs)`, matching table cells of `81%` and `77%`. Two ratios are used because each one kills a different wrong formatter. 17 of 21 is 80.952, which stores as 81.0 and floors to 81, while the integer division this surface used before 1.16.0 gives 80; a formatter that rounds the stored value also gives 81 here and is not caught. 7 of 9 is 77.777, which stores as 77.8 and floors to 77, while a formatter rounding the stored value gives 78; integer division also gives 77 here and is not caught. AC-44's 2 of 3 cannot catch the integer division, because it and the floor of the rounded value both print 66 there, which is how this surface shipped unpinned. The workspace has no `.specter-results.json` and no `specter.yaml`, so `explain` and `coverage --strictness annotation` read the same structural input: this criterion pins which formatter runs, not which input it reads."
      inputs:
        workspace: "specs/wide.spec.yaml (tier 1, 21 criteria, AC-01 through AC-17 annotated) and specs/nine.spec.yaml (tier 1, 9 criteria, AC-01 through AC-07 annotated), each annotated in its own test file; no specter.yaml and no .specter-results.json"
        commands: ["specter explain wide-spec", "specter explain nine-spec", "specter coverage --strictness annotation"]
      expected_output:
        wide_explain_line_contains: "Coverage: 81% (17/21 ACs)"
        nine_explain_line_contains: "Coverage: 77% (7/9 ACs)"
        wide_table_cell: "81%"
        nine_table_cell: "77%"
        explain_exit_code: 0
        coverage_exit_code: 1
      references_constraints: ["C-35"]
      priority: critical

    - id: AC-57
      description: "The per-spec line `specter doctor` prints beneath a failing coverage check uses the shared formatter. On the AC-56 workspace, `specter doctor` prints `    nine-spec: 77% coverage (T1 requires 100%)` and `    wide-spec: 81% coverage (T1 requires 100%)`, both indented four spaces, and exits 1. The two ratios do the same two jobs here as in AC-56: the `%.0f` formatter this line used before 1.16.0 prints 78% for nine-spec, and a formatter dividing covered by total itself prints 80% for wide-spec, so one fixture kills both. No ratio in AC-44 reaches this line at all, because AC-44 does not run `doctor`. The workspace carries no `specter.yaml` and no `.specter-results.json`, so this criterion pins the formatter only. It makes no claim about which strictness `doctor` applies (`bugs/SP-SP-038`) and none about doctor's manifest health line, which stays with spec-doctor C-18."
      inputs:
        workspace: "the AC-56 workspace"
        command: "specter doctor"
      expected_output:
        stdout_contains: ["    nine-spec: 77% coverage (T1 requires 100%)", "    wide-spec: 81% coverage (T1 requires 100%)"]
        exit_code: 1
      references_constraints: ["C-35"]
      priority: high

    - id: AC-58
      description: "The approval-gate demotion emits a stored value the rest of the report could have produced. A Tier 3 spec declares three criteria, all three annotated and all three carrying a passing results entry, and AC-02 and AC-03 carry `approval_gate: true` with no `approval_date`. `specter coverage --json --strictness zero-tolerance` demotes both gated criteria, emits `coverage_pct` of exactly 33.3 for that entry, and exits 3. The ratio is 1 of 3 because its exact quotient is not representable in float64: a recompute doing its own division emits 33.333333333333336, which C-35(a) forbids. Nothing else reads that number, because the existing approval-gate criteria AC-29 and AC-34 assert exit codes and message text only."
      inputs:
        spec: "tier 3, three criteria, AC-02 and AC-03 declaring approval_gate: true with approval_date unset, all three annotated in one test file"
        results_file: '{"results":[{"spec_id":"gate-spec","ac_id":"AC-01","status":"passed"},{"spec_id":"gate-spec","ac_id":"AC-02","status":"passed"},{"spec_id":"gate-spec","ac_id":"AC-03","status":"passed"}]}'
        command: "specter coverage --json --strictness zero-tolerance"
      expected_output:
        coverage_pct: 33.3
        serialized_field: '"coverage_pct": 33.3'
        covered_acs: ["AC-01"]
        uncovered_acs: ["AC-02", "AC-03"]
        threshold: 50
        passes_threshold: false
        exit_code: 3
      references_constraints: ["C-35", "C-26"]
      priority: critical

    - id: AC-59
      description: "The summary header prints the floor of the exact mean, not the floor of a float sum. Three Tier 3 specs, each declaring `coverage_threshold: 30`, are covered 1 of 3, 4 of 9 and 1 of 3, so they store 33.3, 44.4 and 33.3. The exact mean is 37.0, and `specter coverage --strictness annotation` prints `Spec Coverage Report — 3 specs · 37% avg coverage` above a table whose alpha-spec and gamma-spec cells read `33%` and whose beta-spec cell reads `44%`, exiting 0. The row order among the three is not part of this claim, because all three sit in one sort bucket at one tier and C-15 does not order within that. Those ratios are chosen because accumulating the three values left to right in float64 gives 110.99999999999999, whose third reads 36.99999999999999 and floors to 36, which is what the 1.16.0 header printed. It is the smallest fixture of its kind: no three specs declaring fewer than fifteen criteria in total reproduce the error. The reported case, three specs at 2 of 49, 5 of 41 and 7 of 51 storing 4.1, 12.2 and 13.7 with an exact mean of 10.0 and a printed header of 9, is the same defect at 141 criteria. A header that rounds its mean also prints 37 here, so this criterion does not decide between rounding and an exact floor; AC-48 does, where a rounded mean prints 67 above a cell of 66."
      inputs:
        spec_a: "alpha-spec: tier 3, coverage_threshold: 30, 3 criteria, AC-01 annotated"
        spec_b: "beta-spec: tier 3, coverage_threshold: 30, 9 criteria, AC-01 through AC-04 annotated"
        spec_c: "gamma-spec: tier 3, coverage_threshold: 30, 3 criteria, AC-01 annotated"
        command: "specter coverage --strictness annotation"
      expected_output:
        header_line: "Spec Coverage Report — 3 specs · 37% avg coverage"
        tier_line: "  Tier 3: 3/3 passing (100%)"
        alpha_spec_cell: "33%"
        beta_spec_cell: "44%"
        gamma_spec_cell: "33%"
        exit_code: 0
      references_constraints: ["C-35", "C-16"]
      priority: high


    - id: AC-60
      description: "Rule 1 fails a criterion with no test, and the tier does not excuse it. Workspace: a Tier 3 spec with two acceptance criteria, threshold 50, where AC-01 carries a source annotation with a passing runner-visible result and AC-02 carries no annotation anywhere. A results file exists. With `settings.annotation.permissive: false` declared, `specter coverage` reports AC-02 as a rule-1 violation at error severity and exits 2. The same workspace under `settings.strictness: annotation` reports 1 of 2 covered, 50 percent, at or above the Tier 3 threshold, and exits 0. That contrast is the criterion: the tier arithmetic is unchanged and the verdict inverts, which is what part (b) requires."
      inputs:
        spec: "tier 3, two criteria, threshold 50"
        ac_01: "source annotation plus a passing result"
        ac_02: "no annotation anywhere"
        manifest: "settings.annotation.permissive: false"
      expected_output:
        rule1_violations_on_no_test_line: ["AC-02"]
        severity: "error"
        exit_code: 2
        same_workspace_under_strictness_annotation_exit: 0
      references_constraints: ["C-38"]
      priority: critical

    - id: AC-61
      description: "permissive decides rule 1 severity and nothing else. The AC-60 workspace, unchanged byte for byte except `permissive: true`, still reports AC-02 on the `no test:` line and exits 0. The pair is what pins part (c): the violation is still found and still reported as a rule-1 violation, so `permissive` is a severity switch rather than a scope switch, and an implementation that suppresses it under permissive fails. The assertion names the `no test:` line rather than the bare id, because under the ladder AC-02 already appears on the `uncovered:` line, so asserting the id alone would pass without the model being implemented at all."
      inputs:
        workspace: "identical to AC-60"
        manifest: "settings.annotation.permissive: true"
      expected_output:
        rule1_violations_on_no_test_line: ["AC-02"]
        severity: "warning"
        exit_code: 0
        violation_still_reported_as_rule1: true
      references_constraints: ["C-38"]
      priority: critical

    - id: AC-62
      description: "Rule 3 is a separate failure with a separate code. Workspace: a Tier 1 spec, threshold 100, with two criteria that BOTH carry source annotations, where AC-01 has a passing result and AC-02 has a failing one. So there is no rule-1 violation: every criterion has a test. With `settings.annotation.permissive: false`, `specter coverage` exits 1 and not 2, because the failure is a pass rate below the threshold rather than a missing test. An implementation that routes both failures to one code fails this criterion, which is the distinction part (e) exists to draw."
      inputs:
        spec: "tier 1, two criteria, threshold 100"
        ac_01: "annotation plus a passing result"
        ac_02: "annotation plus a failing result"
        manifest: "settings.annotation.permissive: false"
      expected_output:
        rule1_violations: []
        exit_code: 1
        not_exit_code: 2
      references_constraints: ["C-38"]
      priority: critical

    - id: AC-63
      description: "A declared annotation block requires a results file. On the AC-60 workspace with `.specter-results.json` deleted and `settings.annotation.permissive: false` declared, `specter coverage` fails rather than falling back to a structural check, and its message names the missing file. Part (f) is what this pins, and the reason is stated as a negative: without it, adding an `annotation` block to a manifest whose effective strictness was `threshold` would drop the results requirement, so a key that reads as stricter would produce a weaker gate."
      inputs:
        workspace: "AC-60's workspace with .specter-results.json removed"
        manifest: "settings.annotation.permissive: false"
      expected_output:
        exits_nonzero: true
        message_names_results_file: true
        falls_back_to_structural: false
      references_constraints: ["C-38"]
      priority: high
  changelog:
    - version: "1.18.0"
      date: "2026-08-22"
      author: "specter-team"
      type: minor
      description: "Roadmap item 1D-b. C-38 applies the SSRB-104 section 1 model when settings.annotation is declared, replacing the strictness ladder for that workspace. Rule 1, every criterion must have a test, is separated from rule 3, the pass rate among criteria that do, because the single ladder could not express them as different failures. They get different exit codes per SSRB-104 section 7.5, promoted from observation to decision: 2 for a missing test, 1 for a rate below the tier. permissive decides rule 1 severity and nothing else per section 7.4, since tier routing would emit info for a Tier 3 criterion and not fail, contradicting the rule. A declared block requires a results file per section 7.9, so a key that reads as stricter cannot produce a weaker gate. AC-60 through AC-63 pin the four parts, each with the contrast that makes it falsifiable."
    - version: "1.17.0"
      date: "2026-08-17"
      author: "specter-team"
      type: minor
      description: "v0.15 phase 1B loop-back, closing two findings against the 1.16.0 criteria. C-35 bound five percentage surfaces and 1.16.0 pinned two of them, so reverting `explain`, doctor's per-spec line or the approval-gate demotion shipped green (`bugs/SP-SP-041`). AC-56, AC-57 and AC-58 give the three a criterion each, at ratios where the wrong formatter and the right one differ: 17 of 21 separates the floor of the rounded value from integer division, 7 of 9 separates it from a rounding formatter, and 1 of 3 separates `CoveragePercent` from a recompute doing its own division. C-35 now names all five sites, and clause (a) states that every producer of `coverage_pct` calls `CoveragePercent`, the demotion recompute included. C-35(e) states the summary header's rule apart from the per-spec rule and fixes the regression 1.16.0 introduced (`bugs/SP-SP-040`): routing the header average through `FormatCoveragePct` floored a float sum, so three specs storing 4.1, 12.2 and 13.7 read 9 against an exact mean of 10.0. The header keeps the floor and gains an exact mean, computed as integer tenths, because rounding the mean would reinstate a header of 67 above a cell of 66. AC-59 pins the smallest fixture that reproduces the error and AC-48 is reworded to match, with its values unchanged."
    - version: "1.16.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: "v0.15 phase 1B, five prerequisite defect fixes in coverage. C-33 replaces first-match results lookup with worst-status-across-matches, so row order in `.specter-results.json` stops deciding the answer; two files describing identical facts reported 0% and 100% before. C-34 counts distinct pairs in the zero-tolerance message rather than entries, and pins InvalidStatuses as entry-counting so the dedupe is not applied too widely. C-35 settles the percentage contract: `coverage_pct` rounds half up to one decimal, human-readable surfaces floor it, and the gate compares the stored value, so the integer the table prints is an integer that passes as a threshold. C-36 makes a declared threshold of 0 mean zero at both the spec and manifest layers, by presence detection, per the decision of 2026-06-10. C-37 gives every map-derived array in `coverage --json` a total order, including the count tie in parse_error_patterns that the original report missed, so the document is byte-comparable across runs."
    - version: "1.15.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: "Strictness wiring parity with sync — add C-31 + C-32 and AC-36/AC-37. Pre-1.15.0 the strict coverage path keyed solely on the `--strict` boolean: `coverage --strictness threshold` (or the manifest default `threshold` with no flags) computed an effective strictness but never routed it into BuildCoverageReportStrict, so it tolerated a missing `.specter-results.json` and counted failed Tier 2/3 annotations as covered, while `sync --strictness threshold` on the same workspace demoted and failed — breaking AC-27's shortcut contract and spec-sync AC-09's parity promise. C-31 routes any effective strictness of `threshold`/`zero-tolerance` through the strict path regardless of source (flag or manifest). C-32 gives the no-flag missing-results failure a mode-aware message mirroring spec-sync C-08 (names the active mode, offers `specter ingest` or `--strictness annotation`), preserving the C-20 wording when `--strict` was explicitly passed. Found during the 2026-06-11 six-finding review (finding 2)."
    - version: "1.14.0"
      date: "2026-05-16"
      author: "specter-team"
      type: minor
      description: "v0.13 D2 — unrecognized `status` value diagnostic for .specter-results.json. Add C-30 + AC-35. Before this change, an entry with `status: \"pass\"` (typo missing `ed`) silently derived `Passed = false` in ParseResultsFile and demoted the AC under --strict with no diagnostic — operator chased a phantom strict failure. ParseResultsFile now tracks every unrecognized status value; ResultsFile.InvalidStatuses() returns a {value: count} map. The CLI emits one stderr warning per unique unrecognized value before the table (suppressed under --quiet) and surfaces the same data as an invalid_status_warnings array in --json output (always, regardless of --quiet). Parsing behavior is preserved — unrecognized values still treated as failed — so this is a pure-diagnostic addition with no behavior break."
    - version: "1.13.0"
      date: "2026-05-06"
      author: "specter-team"
      type: minor
      description: "v0.13 D3 — coverage --strict --json / text exit-code parity. Add C-29 + AC-34. Pre-v0.13 JSON mode returned nil whenever the report serialized successfully, so `coverage --strict --json` exited 0 on zero-tolerance non-passed (text-mode exit 2 per C-25) and zero-tolerance approval_gate violations (text-mode exit 3 per C-26). CI consumers reading --json could not gate on it. The JSON branch now runs the same zero-tolerance non-passed → os.Exit(2), approval_gate → os.Exit(3), and threshold-failure → errSilent checks text mode runs, AFTER emitting the JSON document so machine consumers see structured state in every state."
    - version: "1.12.0"
      date: "2026-04-27"
      author: "specter-team"
      type: minor
      description: "v0.12 GH #80 — source-only diagnostic hint under --strict. Add C-28 + AC-31/32/33: when an annotated AC has source-file `@ac` comments but no matching `.specter-results.json` entry, emit a per-AC stderr hint pointing the operator at the missing runtime channel (Convention A or B). Limited to first 5 affected pairs; suppressed by --quiet; surfaced as `diagnostic_hints` array under --json. Closes the GH #80 confusion where Python users with source-only `# @ac` comments saw 0% strict coverage with no signal. Implementation extends `AnnotationMatch` with line-number tracking so the hint can name `file:line` precisely."
    - version: "1.11.0"
      date: "2026-04-25"
      author: "specter-team"
      type: minor
      description: "v0.11 settings hardening (paired with spec-manifest 1.8.0). Add C-24/AC-27..28 and C-25/AC-28 for the three-level strictness gate (annotation rejects --strict; zero-tolerance fails on any non-passed annotated AC regardless of tier threshold). Add C-26/AC-29 for zero-tolerance approval_gate enforcement (exit code 3, distinct from strictness exit code 2). Add C-27/AC-30 for empty-test-discovery warning under --strict, upgraded to a hard error under zero-tolerance — closes GH #75 (silent 0% UX hole)."
    - version: "1.10.0"
      date: "2026-04-23"
      author: "specter-team"
      type: minor
      description: "Add C-22/AC-23 (empty-results warning under --strict — warn operator about missing runner-visible annotations BEFORE demotion report), C-23/AC-24/AC-25/AC-26 (--scope <domain> flag narrows --strict demand to one domain for staged adoption, non-scoped specs continue with boolean-passed logic, invalid scope/flag combos fail-fast). Adoption affordances for v0.10 — the eval gate works, but first-time users on a 250-spec workspace hit a Day-1 wave of 100% demotion with no signal about why; these close the documentation-failure gap."
    - version: "1.9.0"
      date: "2026-04-22"
      author: "specter-team"
      type: minor
      description: "Add C-19/AC-19 (--strict treats non-passed annotated ACs as uncovered across all tiers), C-20/AC-20 (missing results file under --strict is a hard fail), C-21/AC-21/AC-22 (extended .specter-results.json status enum with back-compat boolean). Closes the test-quality hole where annotated-but-failing or annotated-but-skipped tests silently counted as covered — eval phase enforcement for the SDD loop. Requires spec-ingest 1.0.0+ to produce results files."
    - version: "1.8.0"
      date: "2026-04-20"
      author: "specter-team"
      type: minor
      description: "Add C-15/AC-15 (table sort worst-first), C-16/AC-16 (summary header with per-tier breakdown), C-17/AC-17 (--failing filter), C-18/AC-18 (spec-ID truncation for column alignment). UX improvements driven by jwtms migration testing where 249 specs produced an unreadable wall of green."
    - version: "1.7.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: "Add C-14/AC-14: coverage --json emits `[]` (not `null`) for empty array fields without omitempty; fields with omitempty are absent rather than null. Eliminates a latent runtime-crash class on the TypeScript consumer side where types declare `string[]` but Go emits `null`."
    - version: "1.6.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: "Add C-12/AC-12 (spec_candidates_count field), C-13/AC-13 (parse_error_patterns summary). Together these let downstream consumers distinguish `no specs exist` from `schema drift`, and collapse N identical parse failures into one actionable diagnosis. Drives AC-29 sidebar messaging and specter doctor pattern analysis."
    - version: "1.5.0"
      date: "2026-04-18"
      author: "specter-team"
      type: minor
      description: "Add C-10/AC-10: `specter coverage --json` always emits a CoverageReport document, including on parse failure. Parse errors surface via a new `parse_errors` field. Unblocks the VS Code extension's three-state sidebar (no-specs / have-specs / parse-failed)."
    - version: "1.4.0"
      date: "2026-04-17"
      author: "specter-team"
      type: minor
      description: "BEHAVIOR CHANGE: gap: true ACs now count as uncovered (C-09/AC-09). Prior 1.3.x silently exempted 100%-gap specs from threshold enforcement, letting unreviewed reverse-compiled specs pass sync."
    - version: "1.3.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-06/AC-06 per-spec coverage_threshold override, C-07/AC-07 pass-rate-aware coverage for Tier 1, C-08/AC-08 dependency_coverage warnings"
