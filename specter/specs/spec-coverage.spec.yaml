        quiet_stderr_no_warning: true
        json_invalid_status_warnings: "[{status:\"pass\", count:1}]"
        exit_code_unchanged: "matches today's behavior (non-zero under --strict, since pass is treated as failed)"
      references_constraints: ["C-30"]
