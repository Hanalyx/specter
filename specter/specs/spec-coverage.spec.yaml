        count_is_independent_of_extracted: true
        zero_and_omitted_are_the_same_state: true
      references_constraints: ["C-42"]
      priority: high

    - id: AC-72
      description: "Stream validation refuses an inconsistent artifact and does so identically on every command that reads it. An entry naming a non-default stream absent from the block is refused, while an entry belonging to `default` is accepted whether it carries no label or names `default` outright. The exemption is from declaration and from nothing else: a block that declares `default` with an `extracted` count below the number of default entries is refused exactly as any other stream would be. Without that case an implementation could skip validation for `default` wholesale and pass. A block declaring one name twice is refused, and so is a block declaring an empty name. A stream whose `extracted` count is below the number of entries carrying its label is refused, while one whose count is above is accepted, because collapse and merge both legitimately leave extraction higher than surviving entries. Each refusal names the stream, and an index in a refusal points into the artifact as written rather than into the array after C-42's sort, asserted on a fixture whose offending row is not already at its normalized position. A refusal standing alone exits in the evidence band; a refusal beside a gate that shipped earlier leaves that gate's code in place and is still reported. The threshold case is the one that matters most to assert: the tier threshold is the last shipped gate, so a code inserted anywhere before it passes every other coexistence case here. Whichever code is chosen, it is the same on `coverage`, `coverage --json`, `sync` and `sync --json` alike, per `spec-sync` C-11. A file with no `streams` key at all is untouched by every rule here, because there is nothing to be inconsistent with and C-14 promises such a file behaves as it did. A file carrying `streams: []` is not that file: the key is present and declares nothing, so a labeled entry beside it is undeclared and refused. Under `--json` the refusal appears in the emitted report rather than replacing it, per C-10."
      inputs:
        undeclared_stream: "an entry labeled js with no js in the streams block"
        duplicate_name: "streams declaring go twice"
        empty_name: "streams declaring an entry whose name is empty"
        extracted_below_entries: "streams declaring go extracted 1 with two go entries"
        negative_count_scanned: "streams declaring go with scanned -1"
        negative_count_extracted: "streams declaring go with extracted -1"
        negative_count_zero_test_events: "streams declaring go with zero_test_event_packages -1"
        negative_count_several_fields: "one stream row with all three counts negative"
        extracted_above_entries: "streams declaring go extracted 5 with two go entries"
        no_block: "a legacy file with no streams block"
        empty_block_with_labels: "streams: [] beside an entry labeled go"
        null_block_with_labels: "streams: null beside an entry labeled go, which the JSON decoder gives the reader as the same nil slice an absent key does"
        unlabeled_beside_declared: "a block declaring go only, with go entries and unlabeled entries beside them"
        explicit_default_undeclared: "an entry naming default with no default in the block"
        default_declared_and_undercounted: "streams declaring default extracted 1 beside two default entries"
        multiple_violations: "one artifact reaching every tie-breaker: entries naming undeclared stream alpha at result positions 0 and 3, an entry naming undeclared stream zeta at result position 1, and empty-name rows at stream positions 1 and 2. Same-kind repeats on purpose, because violations of differing kinds sort on kind alone and never compare the later keys"
        expected_sequence: "empty_stream_name/stream_index 1, empty_stream_name/stream_index 2, undeclared_stream/alpha/result_index 0, undeclared_stream/alpha/result_index 3, undeclared_stream/zeta/result_index 1. Every element carries its one coordinate, zeta included, and the sequence shows stream ordering beating result position: zeta sits last though its entry precedes alpha's second"
        coordinate_at_zero: "the alpha entry at result position 0, whose coordinate is the value an omitempty encoder drops"
        unsorted_block: "an artifact whose offending row sits at a position the ascending-by-name sort moves it away from"
        alongside_rule_1: "an inconsistent artifact in a workspace that also has a criterion with no test"
        alongside_approval_gate: "an inconsistent artifact in a workspace that also has an unmet approval gate"
        alongside_zero_tolerance: "an inconsistent artifact in a workspace where an annotated criterion did not pass under zero-tolerance"
        alongside_threshold: "an inconsistent artifact in a workspace below its tier threshold and failing nothing else"
        alongside_permissive_warning: "an inconsistent artifact beside a rule-1 warning under permissive true"
      expected_output:
        undeclared_stream_refused: true
        duplicate_name_refused: true
        empty_name_refused: true
        extracted_below_entries_refused: true
        negative_count_refused_for_each_of_the_three_fields: true
        several_negative_fields_produce_one_violation: true
        the_message_names_every_negative_field_in_fixed_order: true
        negative_extracted_suppresses_extracted_below_entries: true
        extracted_above_entries_accepted: true
        no_block_accepted: true
        empty_block_with_labels_refused: true
        null_block_with_labels_refused: true
        unlabeled_beside_declared_accepted: true
        explicit_default_undeclared_accepted: true
        default_declared_and_undercounted_refused: true
        refusal_names_the_stream: true
        empty_name_refusal_gives_the_array_position: true
        json_refusal_still_emits_a_document: true
        json_document_carries_results_validation_errors: true
        every_violation_is_collected_not_the_first: true
        order_is_deterministic_across_runs: true
        no_two_violations_share_a_full_sort_key: true
        results_are_counted_once_not_per_stream: true
        order_matches_the_exact_sequence_c44_states: true
        ordered_tuples_match_expected_sequence_literally: true
        stream_tie_breaker_is_exercised_by_same_kind_violations: true
        result_index_tie_breaker_is_exercised: true
        stream_index_tie_breaker_is_exercised: true
        a_zero_coordinate_is_present_in_the_document: true
        index_points_into_the_file_not_the_sorted_array: true
        standalone_violation_exits_in_the_evidence_band: true
        alongside_rule_1_keeps_code_2: true
        alongside_approval_gate_keeps_code_3: true
        alongside_zero_tolerance_keeps_code_2: true
        alongside_threshold_keeps_code_1: true
        alongside_permissive_warning_exits_in_the_evidence_band: true
        coexisting_shipped_gate_still_reports_the_stream_error: true
        each_error_carries_kind_stream_message_and_one_coordinate: true
        same_code_on_every_surface: true
      references_constraints: ["C-44"]
      priority: critical

  changelog:
    - version: "1.26.0"
      date: "2026-08-30"
      author: "specter-team"
      type: minor
      description: "C-10 said `coverage --json` MUST always emit a document. The word was read as covering the parse case it names, and seven other early returns in coverageCmd write nothing: a rejected manifest, an invalid --strictness value, --scope without --strict, --strict against annotation strictness, an unknown --scope domain, zero-tolerance with no annotated test files, and an unmet results precondition. C-10 now names the boundary that makes always checkable: once Cobra has entered RunE, every JSON-mode return emits a document, and what Cobra itself rejects is outside the promise because the command never ran. The document gains stop_reason, distinct from parse_errors, because reporting a rejected manifest as a spec that failed to parse is a different fault with a different fix. The wire shape is additive by decision and not by inference: entries and summary stay required and carry an empty list and a zeroed summary on a refusal, as uncomputed placeholders. The discriminated union was considered and rejected as breaking for every consumer at once. The cost of that choice is stated rather than left to be discovered: a zeroed summary beside an empty entries list is exactly what a clean empty workspace looks like, so spec-vscode C-33 carries the consumer obligation to read stop_reason first. AC-74 binds all seven refusals independently, a control, and the four gates, each asserting its own cause before its exit code so an earlier gate cannot stand in for a later one. The wire type is fixed here rather than left open: stop_reason is an object with a non-empty kind and message, omitted when the run reached the report, with kind one of manifest_error, invalid_flag, unknown_scope or unmet_precondition. A bare string was rejected, because collapsing the machine-readable half into the human-readable one forces every consumer to parse prose to decide what happened. Saying only structured and non-empty permitted two conforming implementations no consumer could read at once. AC-74 previously said a refusal must not fabricate entries or a summary, which contradicted the required placeholder shape rather than describing it; it now states that entries [] and the zero summary are placeholders whose meaning is guarded by stop_reason. Additive per the classifier: specter diff reports [additive]."

    - version: "1.25.0"
      date: "2026-08-26"
      author: "specter-team"
      type: minor
      description: "C-17 states what `--failing` may change. It described the table and the empty-table line and then said nothing about exit codes, and AC-17 closed with `Exit code respects threshold, not the filter`, which is the reading the implementation took: the empty-table path carries its own threshold-only verdict and returns above the shared gates. Measured at 0e3e037: a workspace at 100 percent with an unmet approval gate under a declared annotation block exits 3 plain and 0 under the flag, and one with an inconsistent streams block exits 20 plain and 0 under the flag, both silently. The three gates that hold are the three that either fire on a spec already below 100 percent or demote one to get there, so the filter keeps a row and the early return never fires. The rule is now a property of the flag rather than a list of gates, because a list goes stale the next time a gate is added, which is how this one broke. AC-73 binds the two gates that can be skipped, a coexistence case so precedence and complete reporting survive the path, and a control so the fix cannot be a blanket refusal to return early. `bugs/SP-SP-074`."

    - version: "1.24.0"
      date: "2026-08-26"
      author: "specter-team"
      type: minor
      description: "C-44 names the third artifact shape. It said presence is the key and then explained the distinction with two shapes, an absent key and an explicit empty array, which left `streams: null` unstated. Go decodes an absent key and an explicit null to the same nil slice, so an implementation reading presence off the decoded value treats a null block as legacy and validates nothing. Measured on the 3A5 implementation: `{\"streams\": null}` beside a labeled entry produced zero violations where `{\"streams\": []}` beside the same entry produced one. The rule now requires presence to be read from the document as written rather than from the decoded value, and says why: the decoder erases exactly the distinction the rule turns on. Minor rather than patch, because AC-72 gains an input and an expected output and `spec-diff` C-05 classifies that as additive. Found in review of the implementation commit, not by the criteria, which is recorded here because the criteria are what should have found it."

    - version: "1.23.0"
      date: "2026-08-26"
      author: "specter-team"
      type: minor
      description: "Roadmap 3A5. C-44 states five consistency rules a `streams` block must satisfy and requires them in the shared pure builder rather than in a command, which is the point of the item: a rule wired into `coverage` alone is `bugs/done/SP-SP-058`, where `sync` returned a different verdict for the same workspace. The `extracted` rule is one-sided on purpose. Collapse within a stream per `spec-ingest` C-08, and `--merge` summing across inputs, both leave extraction legitimately higher than surviving entries, so only the lower direction is incoherent, and a two-sided rule would refuse honest files. A file with no `streams` key is untouched, because C-14 promises such a file behaves as it did; a file carrying `streams: []` is a present block declaring nothing and is not that file. `default` never requires declaration, since C-41 makes an unlabeled entry and one naming `default` the same stream, and that exemption is what lets a project adopt `--stream` one job at a time rather than across every job at once. It exempts declaration and nothing else. A refusal appears in the emitted `--json` document as a `results_validation_errors` array with a defined element shape, because asserting only that a document exists is satisfied by one that says nothing about the refusal."

    - version: "1.22.0"
      date: "2026-08-25"
      author: "specter-team"
      type: minor
      description: "C-42's streams object gains a third count, packages that produced zero test events, rehomed from roadmap item 3B5 because it belongs with the metadata that makes stream absence observable. Worded as observed rather than diagnosed: a runner emitting no test event for a package may have failed to build it, may have filtered every test out, or may have been handed a package with no tests, and `ingest` cannot tell those apart from runner output alone. Calling it a build failure would be a diagnosis the artifact cannot support. AC-71 asserts it, and binds that a zero count and an omitted one are the same state rather than only the round trip. Minor, not patch. The C-42 edit alone is description-only, but AC-71 is a new criterion and `spec-diff` C-05 classifies a new AC as additive. An earlier draft read the C-42 edit and called the whole change patch, which is overriding the classifier with a reading of one half of the diff."
    - version: "1.21.0"
      date: "2026-08-25"
      author: "specter-team"
      type: minor
      description: "Roadmap 3A1 to 3A3, the multi-stream evidence foundation, per SSRB-103. C-41 adds the optional `stream` opaque label with missing-means-default and fixes the merge key at `(spec_id, ac_id, stream)`. C-42 adds the top-level `streams` array, which is what separates a stream that ran and found nothing from one that never ran; a per-entry label cannot, because both leave zero entries. C-43 states the covered rule once for every strictness model. Additive rather than a rewrite, and that is a finding rather than a convenience: C-33 already resolves a pair across every matching entry with worst-status-wins, and two entries from two streams both match, so the multi-stream verdict IS the existing merge over criteria that have entries. That is why a split cannot move the number, and why C-21 and C-33 are untouched. What is genuinely new is the absent-entry half of C-43 and the stream metadata of C-42."
    - version: "1.20.0"
      date: "2026-08-25"
      author: "specter-team"
      type: minor
      description: "C-40 and AC-67 state the approval gate under `settings.annotation`, per `bugs/SP-SP-071`. SSRB-104 section 7.5 decided `approval gate unmet` maps to code 3 and that the trigger survives the ladder's retirement; roadmap item 1D-b shipped that table's code-2 row and not its code-3 row. C-26 is untouched and still true, which is the point: `GoverningStrictness()` returns `threshold` for a declared annotation block and C-26 makes `approval_gate` metadata-only under `threshold`, so the code was faithful to the spec and the spec was what never covered the model. `permissive` does not govern this gate. It was introduced for rule 1, whose subject is whether evidence exists, and an unmet approval gate is a human sign-off rather than missing evidence, so letting `permissive: true` downgrade it would turn an adoption switch into a blanket bypass. C-40(c) fixes the order at rule 1 first, matching the ladder's code-2-before-code-3 precedence and keeping ascending-code order, so `coverage` and `sync` cannot diverge on a workspace carrying both. C-40(d) requires both diagnostics to be written before the exit. That is a new requirement rather than a description: today each gate prints and exits inside its own branch, so a workspace with both violations names one. It is a MUST because (c) depends on it, the case for ascending-code order being that the integer is not the whole report."
    - version: "1.19.1"
      date: "2026-08-23"
      author: "specter-team"
      type: patch
      description: "C-35(a) named `DemoteApprovalGateViolations` as a second producer of coverage_pct. C-39 removed that pass, so the clause referenced a function that no longer exists. There is one producer now and the exception is gone. Text only."
    - version: "1.19.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-39/AC-64..66: the zero-tolerance approval-gate demotion is part of classifying a criterion rather than a second pass over a finished report. Roadmap item 1C. The behavior shipped as the GH #94 fix and was stated only in spec-sync C-09(b), which cited spec-coverage semantics spec-coverage never wrote down. Stating it here also pins two things the second pass got wrong: a demoted criterion was appended to the uncovered list rather than placed in declaration order, and an entry whose every covered criterion was demoted marshaled covered_acs as null (bugs/SP-SP-067)."
    - version: "1.18.0"
      date: "2026-08-22"
      author: "specter-team"
      type: minor
      description: "Roadmap item 1D-b. C-38 applies the SSRB-104 section 1 model when settings.annotation is declared, replacing the strictness ladder for that workspace. Rule 1, every criterion must have a test, is separated from rule 3, the pass rate among criteria that do, because the single ladder could not express them as different failures. They get different exit codes per SSRB-104 section 7.5, promoted from observation to decision: 2 for a missing test, 1 for a rate below the tier. permissive decides rule 1 severity and nothing else per section 7.4, since tier routing would emit info for a Tier 3 criterion and not fail, contradicting the rule. A declared block requires a results file per section 7.9, so a key that reads as stricter cannot produce a weaker gate. AC-60 through AC-63 pin the four parts, each with the contrast that makes it falsifiable."
    - version: "1.17.0"
      date: "2026-08-17"
      author: "specter-team"
      type: minor
      description: "v0.15 phase 1B loop-back, closing two findings against the 1.16.0 criteria. C-35 bound five percentage surfaces and 1.16.0 pinned two of them, so reverting `explain`, doctor's per-spec line or the approval-gate demotion shipped green (`bugs/SP-SP-041`). AC-56, AC-57 and AC-58 give the three a criterion each, at ratios where the wrong formatter and the right one differ: 17 of 21 separates the floor of the rounded value from integer division, 7 of 9 separates it from a rounding formatter, and 1 of 3 separates `CoveragePercent` from a recompute doing its own division. C-35 now names all five sites, and clause (a) states that every producer of `coverage_pct` calls `CoveragePercent`, the demotion recompute included. C-35(e) states the summary header's rule apart from the per-spec rule and fixes the regression 1.16.0 introduced (`bugs/SP-SP-040`): routing the header average through `FormatCoveragePct` floored a float sum, so three specs storing 4.1, 12.2 and 13.7 read 9 against an exact mean of 10.0. The header keeps the floor and gains an exact mean, computed as integer tenths, because rounding the mean would reinstate a header of 67 above a cell of 66. AC-59 pins the smallest fixture that reproduces the error and AC-48 is reworded to match, with its values unchanged."
    - version: "1.16.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: "v0.15 phase 1B, five prerequisite defect fixes in coverage. C-33 replaces first-match results lookup with worst-status-across-matches, so row order in `.specter-results.json` stops deciding the answer; two files describing identical facts reported 0% and 100% before. C-34 counts distinct pairs in the zero-tolerance message rather than entries, and pins InvalidStatuses as entry-counting so the dedupe is not applied too widely. C-35 settles the percentage contract: `coverage_pct` rounds half up to one decimal, human-readable surfaces floor it, and the gate compares the stored value, so the integer the table prints is an integer that passes as a threshold. C-36 makes a declared threshold of 0 mean zero at both the spec and manifest layers, by presence detection, per the decision of 2026-06-10. C-37 gives every map-derived array in `coverage --json` a total order, including the count tie in parse_error_patterns that the original report missed, so the document is byte-comparable across runs."
    - version: "1.15.0"
      date: "2026-06-11"
      author: "specter-team"
      type: minor
      description: "Strictness wiring parity with sync — add C-31 + C-32 and AC-36/AC-37. Pre-1.15.0 the strict coverage path keyed solely on the `--strict` boolean: `coverage --strictness threshold` (or the manifest default `threshold` with no flags) computed an effective strictness but never routed it into BuildCoverageReportStrict, so it tolerated a missing `.specter-results.json` and counted failed Tier 2/3 annotations as covered, while `sync --strictness threshold` on the same workspace demoted and failed — breaking AC-27's shortcut contract and spec-sync AC-09's parity promise. C-31 routes any effective strictness of `threshold`/`zero-tolerance` through the strict path regardless of source (flag or manifest). C-32 gives the no-flag missing-results failure a mode-aware message mirroring spec-sync C-08 (names the active mode, offers `specter ingest` or `--strictness annotation`), preserving the C-20 wording when `--strict` was explicitly passed. Found during the 2026-06-11 six-finding review (finding 2)."
    - version: "1.14.0"
      date: "2026-05-16"
      author: "specter-team"
      type: minor
      description: "v0.13 D2 — unrecognized `status` value diagnostic for .specter-results.json. Add C-30 + AC-35. Before this change, an entry with `status: \"pass\"` (typo missing `ed`) silently derived `Passed = false` in ParseResultsFile and demoted the AC under --strict with no diagnostic — operator chased a phantom strict failure. ParseResultsFile now tracks every unrecognized status value; ResultsFile.InvalidStatuses() returns a {value: count} map. The CLI emits one stderr warning per unique unrecognized value before the table (suppressed under --quiet) and surfaces the same data as an invalid_status_warnings array in --json output (always, regardless of --quiet). Parsing behavior is preserved — unrecognized values still treated as failed — so this is a pure-diagnostic addition with no behavior break."
    - version: "1.13.0"
      date: "2026-05-06"
      author: "specter-team"
      type: minor
      description: "v0.13 D3 — coverage --strict --json / text exit-code parity. Add C-29 + AC-34. Pre-v0.13 JSON mode returned nil whenever the report serialized successfully, so `coverage --strict --json` exited 0 on zero-tolerance non-passed (text-mode exit 2 per C-25) and zero-tolerance approval_gate violations (text-mode exit 3 per C-26). CI consumers reading --json could not gate on it. The JSON branch now runs the same zero-tolerance non-passed → os.Exit(2), approval_gate → os.Exit(3), and threshold-failure → errSilent checks text mode runs, AFTER emitting the JSON document so machine consumers see structured state in every state."
    - version: "1.12.0"
      date: "2026-04-27"
      author: "specter-team"
      type: minor
      description: "v0.12 GH #80 — source-only diagnostic hint under --strict. Add C-28 + AC-31/32/33: when an annotated AC has source-file `@ac` comments but no matching `.specter-results.json` entry, emit a per-AC stderr hint pointing the operator at the missing runtime channel (Convention A or B). Limited to first 5 affected pairs; suppressed by --quiet; surfaced as `diagnostic_hints` array under --json. Closes the GH #80 confusion where Python users with source-only `# @ac` comments saw 0% strict coverage with no signal. Implementation extends `AnnotationMatch` with line-number tracking so the hint can name `file:line` precisely."
    - version: "1.11.0"
      date: "2026-04-25"
      author: "specter-team"
      type: minor
      description: "v0.11 settings hardening (paired with spec-manifest 1.8.0). Add C-24/AC-27..28 and C-25/AC-28 for the three-level strictness gate (annotation rejects --strict; zero-tolerance fails on any non-passed annotated AC regardless of tier threshold). Add C-26/AC-29 for zero-tolerance approval_gate enforcement (exit code 3, distinct from strictness exit code 2). Add C-27/AC-30 for empty-test-discovery warning under --strict, upgraded to a hard error under zero-tolerance — closes GH #75 (silent 0% UX hole)."
    - version: "1.10.0"
      date: "2026-04-23"
      author: "specter-team"
      type: minor
      description: "Add C-22/AC-23 (empty-results warning under --strict — warn operator about missing runner-visible annotations BEFORE demotion report), C-23/AC-24/AC-25/AC-26 (--scope <domain> flag narrows --strict demand to one domain for staged adoption, non-scoped specs continue with boolean-passed logic, invalid scope/flag combos fail-fast). Adoption affordances for v0.10 — the eval gate works, but first-time users on a 250-spec workspace hit a Day-1 wave of 100% demotion with no signal about why; these close the documentation-failure gap."
    - version: "1.9.0"
      date: "2026-04-22"
      author: "specter-team"
      type: minor
      description: "Add C-19/AC-19 (--strict treats non-passed annotated ACs as uncovered across all tiers), C-20/AC-20 (missing results file under --strict is a hard fail), C-21/AC-21/AC-22 (extended .specter-results.json status enum with back-compat boolean). Closes the test-quality hole where annotated-but-failing or annotated-but-skipped tests silently counted as covered — eval phase enforcement for the SDD loop. Requires spec-ingest 1.0.0+ to produce results files."
    - version: "1.8.0"
      date: "2026-04-20"
      author: "specter-team"
      type: minor
      description: "Add C-15/AC-15 (table sort worst-first), C-16/AC-16 (summary header with per-tier breakdown), C-17/AC-17 (--failing filter), C-18/AC-18 (spec-ID truncation for column alignment). UX improvements driven by jwtms migration testing where 249 specs produced an unreadable wall of green."
    - version: "1.7.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: "Add C-14/AC-14: coverage --json emits `[]` (not `null`) for empty array fields without omitempty; fields with omitempty are absent rather than null. Eliminates a latent runtime-crash class on the TypeScript consumer side where types declare `string[]` but Go emits `null`."
    - version: "1.6.0"
      date: "2026-04-19"
      author: "specter-team"
      type: minor
      description: "Add C-12/AC-12 (spec_candidates_count field), C-13/AC-13 (parse_error_patterns summary). Together these let downstream consumers distinguish `no specs exist` from `schema drift`, and collapse N identical parse failures into one actionable diagnosis. Drives AC-29 sidebar messaging and specter doctor pattern analysis."
    - version: "1.5.0"
      date: "2026-04-18"
      author: "specter-team"
      type: minor
      description: "Add C-10/AC-10: `specter coverage --json` always emits a CoverageReport document, including on parse failure. Parse errors surface via a new `parse_errors` field. Unblocks the VS Code extension's three-state sidebar (no-specs / have-specs / parse-failed)."
    - version: "1.4.0"
      date: "2026-04-17"
      author: "specter-team"
      type: minor
      description: "BEHAVIOR CHANGE: gap: true ACs now count as uncovered (C-09/AC-09). Prior 1.3.x silently exempted 100%-gap specs from threshold enforcement, letting unreviewed reverse-compiled specs pass sync."
    - version: "1.3.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-06/AC-06 per-spec coverage_threshold override, C-07/AC-07 pass-rate-aware coverage for Tier 1, C-08/AC-08 dependency_coverage warnings"
    - version: "1.0.0"
      date: "2026-03-28"
      author: "specter-team"
      type: initial
      description: "Initial spec for the Specter coverage tool"
