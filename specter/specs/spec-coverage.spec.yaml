    - id: AC-67
      description: "The approval gate fires under the annotation model, and `permissive` does not soften it. A workspace declaring `settings.annotation` with one acceptance criterion carrying `approval_gate: true` and no `approval_date` exits 3 under `specter coverage`, with `permissive: true` and with `permissive: false` alike. The same workspace under `settings.strictness: zero-tolerance` also exits 3, so the amendment adds a path rather than moving one. A workspace carrying both an unmet approval gate and a criterion with no test exits 2 under `permissive: false`, because rule 1 is evaluated first per C-40(d), and names BOTH violations on stderr in that one run per C-40(e). Asserting the code alone would be satisfied by an implementation that exits inside the rule-1 branch and never reaches the gate, which is what every surface does today. Measured before the amendment on `release/v0.15.0`, on two workspaces identical but for the manifest: the ladder exited 3 with its error line, and the annotation model exited 0 with nothing on stderr. Every case is asserted under `--json` as well as in text mode, per C-40(c), and asserts the cause line and not only the integer, because the defect measured was a silent zero and a silent 3 would satisfy a code-only assertion."
