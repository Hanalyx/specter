spec:
  id: spec-coverage
  version: "1.26.0"
  status: approved
  tier: 2

  context:
    system: Specter toolchain
    feature: Spec-to-test traceability matrix
    description: >
      Measures how thoroughly specs are covered by tests. Scans test files for
      @spec and @ac annotations and produces a coverage matrix showing which
      ACs have tests and which are uncovered.
    dependencies:
      - "fast-glob (3.x)"
    related_specs:
      - "spec-parse.spec.yaml"
    assumptions:
      - "Test files use @spec and @ac annotations in comments or decorators"
      - "Annotation format: // @spec <spec-id> and // @ac <AC-id>"

  objective:
    summary: >
      Produce a traceability matrix mapping spec IDs to their acceptance criteria
      to test files. Report coverage percentage per spec and identify uncovered ACs.
    scope:
      includes:
        - "Scan test files for @spec and @ac annotations"
        - "Map annotations to specs parsed by spec-parse"
        - "Calculate coverage percentage per spec"
        - "Identify uncovered ACs (in spec but no test references them)"
        - "Identify specs with zero test coverage"
        - "Tier-aware coverage thresholds (Tier 1: 100%, Tier 2: 80%, Tier 3: 50%)"
      excludes:
        - "Code file mapping (spec to source files)"
        - "Automatic detection without explicit annotations"
        - "Test execution or validation of test correctness"
        - "Code coverage integration (Istanbul, coverage.py)"

  constraints:
    - id: C-01
      description: "MUST recognize @spec annotations in single-line comments (// @spec <id> and # @spec <id>)"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST recognize @ac annotations in single-line comments (// @ac <AC-id> and # @ac <AC-id>)"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST report coverage as a percentage: (covered ACs / total ACs) * 100"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST flag specs below their tier threshold as failing"
      type: business
      enforcement: error

    - id: C-05
      description: "MUST NOT depend on any CLI framework — pure function from SpecAST[] + file paths to CoverageReport"
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST support per-spec coverage_threshold override: when a spec declares coverage_threshold: N (0–100), that value overrides the tier-based threshold for that spec only"
      type: technical
      enforcement: error

    - id: C-07
      description: "MUST support pass-rate-aware coverage for Tier 1: when .specter-results.json is present, a Tier 1 AC is only counted as covered if the annotation exists AND the result entry has passed: true"
      type: technical
      enforcement: error

    - id: C-08
      description: "MUST emit dependency_coverage warnings when spec A depends_on spec B and spec B has uncovered ACs that fall below spec B's effective coverage threshold"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST count every declared acceptance criterion in the denominator of the coverage percentage, including ACs marked gap: true. An AC marked gap: true with no matching @ac annotation counts as uncovered. Rationale: a spec whose ACs are all gaps has no captured intent and must fail coverage rather than silently pass."
      type: business
      enforcement: error

    - id: C-10
      description: "`specter coverage --json` MUST always emit a CoverageReport JSON document to stdout, including when one or more spec files fail to parse. The report's parse_errors array carries per-file failures; pass/fail is signalled by process exit code, not by the presence or absence of JSON output. Rationale: downstream consumers (VS Code extension, CI jobs) need a structured document in every state to distinguish 'no specs yet' from 'specs present but failed to parse'. **The boundary of \"always\" is the command function.** Once Cobra has accepted the invocation and entered `coverageCmd`'s RunE, every return in JSON mode MUST emit a complete document. Failures Cobra itself rejects, an unknown flag or a malformed argument, are outside this promise, because the command never ran. Naming the boundary is what makes \"always\" checkable: without it the rule was read as covering the parse case alone, and seven other early returns wrote nothing. **The document MUST carry a structured field naming why the run stopped**, distinct from `parse_errors`. The field is `stop_reason`, and its wire type is fixed here rather than left to the implementation: an object carrying exactly `kind` and `message`, both non-empty strings, omitted entirely when the run reached the report. A bare string was rejected. `kind` is what a consumer branches on and `message` is what a person reads, and collapsing them forces every consumer to parse prose to decide what happened, which is the failure mode this project keeps recording. `kind` is one of `manifest_error`, `invalid_flag`, `unknown_scope`, or `unmet_precondition`, covering the four families the command refuses on: a rejected manifest; an invalid flag value or flag combination; an unknown `--scope` domain; and a precondition the run needs and does not have, which is both the missing results artifact and zero-tolerance with no annotated test file. Saying only \"structured\" and \"non-empty\" permits two conforming implementations that no consumer can read at once. Overloading `parse_errors` would report a rejected manifest or an invalid flag value as a spec that failed to parse, which is a different fault with a different fix, and a consumer grouping by parse-error pattern would group them together. **The shape is additive, and that is a decision rather than an inference.** `entries` and `summary` stay required and always present, so every existing consumer keeps parsing. On a refusal they carry `[]` and a zeroed summary, and those values are **uncomputed placeholders, not measurements**: the run never counted anything. `stop_reason` is what distinguishes them, so a consumer MUST read `stop_reason` before interpreting `entries` or `summary`, and MUST NOT report a refusal as an empty or fully covered workspace. The alternative considered and rejected was a discriminated union whose refusal arm omits the measurements. It is the cleaner shape and it is breaking: it would change a published document for every consumer at once, in a release closing on a defect this rule exists to fix. The cost of the additive choice is real and is named here rather than discovered later: a zeroed summary beside an empty entries list is exactly what a clean empty workspace looks like, so the placeholder is indistinguishable from a measurement unless `stop_reason` is read. That obligation does not live only in this constraint; `spec-vscode` carries the consumer half, because a rule stated for a consumer in the producer's spec is a rule nothing checks. The states the field MUST cover are the ones the command already refuses on: a manifest that fails to load, an invalid flag value or flag combination, an unknown `--scope` domain, and an unmet results precondition. **Every return MUST route through one rendering and verdict path**, for the reason spec-check C-14 gives: an emitter per early return satisfies every observable assertion while leaving the next early return to be forgotten. Text output and exit codes are unchanged by this rule, which governs what stdout carries in JSON mode and nothing else."
      type: technical
      enforcement: error

    - id: C-11
      description: "ExtractAnnotations MUST NOT treat comment-like lines appearing inside multi-line string literals as real annotations. Applies to backtick-delimited strings (TypeScript/JavaScript template literals, Go raw strings) and Python triple-quoted strings (''' and \"\"\"). Rationale: example fixtures and inline payloads frequently contain strings like \\`// @spec foo\\`; interpreting these as annotations produces phantom coverage entries."
      type: technical
      enforcement: error

    - id: C-12
      description: "`specter coverage --json` MUST emit spec_candidates_count (count of .spec.yaml files discovered on disk) so downstream consumers can distinguish `no specs exist` from `specs exist but failed to parse`. Rationale: without this field, a parse-failure workspace is indistinguishable from a greenfield one, so tools mistakenly suggest `specter init`."
      type: technical
      enforcement: error

    - id: C-13
      description: "`specter coverage --json` MUST emit parse_error_patterns — a list grouping parse_errors by (type, path) sorted by count descending. Enables downstream consumers to surface schema drift in one sentence (`20 specs: missing required field 'objective'`) instead of N individual messages."
      type: technical
      enforcement: error

    - id: C-14
      description: "Array-valued fields in the coverage JSON output MUST NOT be emitted as `null`. Fields without `omitempty` MUST emit `[]` when empty (the Go struct field is initialized as an empty slice, not left as nil). Fields with `omitempty` MUST be absent from the output when empty (Go's default behavior). Rationale: downstream TypeScript consumers declare these fields as `string[]` (non-nullable arrays); emitting `null` is a silent type contract violation that crashes any consumer iterating without a nullish-coalesce guard."
      type: technical
      enforcement: error

    - id: C-15
      description: "The default table output of `specter coverage` MUST sort entries worst-first — failing specs (below threshold AND not 100%) first, then partial coverage (below 100% but passing threshold), then 100%-covered. Within each bucket, sort by tier descending (T1 > T2 > T3) so higher-risk work surfaces first. Rationale: on a large workspace (100+ specs), the developer needs to see what requires attention at the top; hiding failures in a sea of PASS defeats the table's purpose."
      type: business
      enforcement: error

    - id: C-16
      description: "Every table output of `specter coverage` MUST include a summary header line above the table, formatted as `Spec Coverage Report — N specs · P% avg coverage` followed by per-tier breakdown lines (`  Tier K: X/Y passing (Z%)`) for each tier present in the report. The header MUST reflect the full report state, not a filtered view. Rationale: one-glance readability on workspaces where the table itself is long."
      type: business
      enforcement: error

    - id: C-17
      description: "`specter coverage --failing` MUST restrict the table to entries whose `passes_threshold == false` OR `coverage_pct < 100` (i.e. everything below 100% coverage, whether it's under threshold or just not complete). The summary header still reflects the full report, not the filtered view. When all entries are 100%, the filter produces an empty table with a single-line confirmation: `All N specs at 100% coverage.` **`--failing` MUST change only the table or empty-table presentation. It MUST NOT change which gates are evaluated, their diagnostics, or the exit code.** Stated as a property of the flag rather than as a list of gates, because a list goes stale the next time a gate is added and this one already did: the empty-table path carried its own threshold-only verdict and skipped every gate that reports without moving a coverage percentage. A presentation flag that decides an exit code is a second verdict, and `bugs/SP-SP-073` is what a second verdict costs."
      type: technical
      enforcement: error

    - id: C-18
      description: "In the default table output, spec IDs longer than 40 characters MUST be truncated in the `Spec ID` column with a trailing ellipsis (`…`) so subsequent columns remain aligned. The `--json` output is unaffected — it emits the full spec_id. Rationale: long path-derived IDs (e.g. `app-api-admin-appointments-id-service`) break the table in v0.9.0/v0.9.1; alignment is a legibility prerequisite for the sort + summary work to be useful."
      type: technical
      enforcement: error

    - id: C-19
      description: "`specter coverage --strict` MUST treat any annotated AC as uncovered unless a .specter-results.json entry for that (spec_id, ac_id) exists with status=passed. Applies to ALL tiers, not just Tier 1. A skipped, failed, or errored entry demotes the AC to uncovered regardless of annotation presence. Rationale: a green Specter gate must mean tests actually passed — eval phase enforcement for the SDD loop."
      type: business
      enforcement: error

    - id: C-20
      description: "Under `--strict`, a missing `.specter-results.json` file (or an empty results array) MUST produce a hard failure (non-zero exit, explanatory stderr message `--strict requires .specter-results.json — run 'specter ingest' first`). Rationale: --strict is a contract that test results were verified; no results means the contract can't be satisfied, and silently falling back to annotation-only would defeat the purpose."
      type: business
      enforcement: error

    - id: C-21
      description: "The .specter-results.json schema MUST accept entries with an explicit `status` field whose value is one of {passed, failed, skipped, errored}. For back-compat, entries without `status` but with `passed: true` are treated as status=passed; entries with `passed: false` and no status are treated as status=failed. The coverage package's result-lookup function uses status when present, falls back to passed otherwise."
      type: technical
      enforcement: error

    - id: C-22
      description: "Under `--strict`, when `.specter-results.json` parses successfully but contains zero entries, the coverage command MUST emit a stderr warning BEFORE computing demotions. The warning names the likely cause (`no (spec_id, ac_id) pairs were extracted from test output — tests likely don't carry runner-visible annotations`) and points at the conventions doc (`see docs/explainer/v0.10-ci-gated-coverage.md, Conventions A and B`). Rationale: a results file with zero entries will demote 100% of annotated ACs; that outcome is correct per C-19 but the Day-1 operator experience of silent mass demotion is a pure documentation failure — the tool has the signal to help the operator self-diagnose and must emit it."
      type: business
      enforcement: error

    - id: C-23
      description: "`specter coverage --scope <domain>` narrows `--strict`'s demand set to ACs of specs listed under the named domain in `specter.yaml`. Semantics: (a) ACs in the scoped domain behave per C-19 (must have status=passed entry, else demoted); (b) ACs outside the scoped domain use the pre-strict boolean-passed logic — annotation presence alone counts as coverage regardless of whether a passing entry exists in results; (c) the report includes ALL specs (not filtered), so the operator sees the full workspace, not a shrunken view. `--scope` without `--strict` is an error. `--scope` combines with `--tests <glob>` as AND (both filters apply). Rationale: staged adoption — a 250-spec workspace cannot migrate every test to runner-visible annotations in one wave; `--scope` lets CI enforce `--strict` on one domain per wave while the rest of the workspace continues with v0.9 semantics."
      type: business
      enforcement: error

    - id: C-24
      description: "When `settings.strictness == \"annotation\"` in `specter.yaml`, `specter coverage --strict` MUST exit non-zero with a clear error rejecting the flag combination: `--strict requires settings.strictness >= threshold; current strictness is annotation`. Rationale: `annotation` mode is for new adopters mid-migration; combining it with the strict flag is incoherent and almost always a misconfiguration."
      type: business
      enforcement: error

    - id: C-25
      description: "When `settings.strictness == \"zero-tolerance\"` (or `--strictness zero-tolerance`), `specter coverage` MUST exit non-zero whenever any annotated AC has a results-file status other than `passed`, regardless of tier coverage threshold. Under `threshold` (default), the same workspace may still pass if total demoted-coverage clears the tier threshold. Zero-tolerance is the strictest gate — one failing annotated test fails the entire run."
      type: business
      enforcement: error

    - id: C-26
      description: "Under `settings.strictness == \"zero-tolerance\"`, `specter coverage` MUST also exit non-zero when any AC carries `approval_gate: true` and an unset `approval_date`. The exit code is distinct from C-25's strictness violation (3 vs 2) so CI can differentiate. Under `threshold` mode `approval_gate` remains metadata-only (matches today's behavior — see spec-explain SPEC_SCHEMA_REFERENCE)."
      type: business
      enforcement: error

    - id: C-27
      description: "`specter coverage --strict` MUST emit a stderr warning before computing coverage when test discovery (after applying `--tests <glob>` or the manifest's `settings.tests_glob`, then falling back to `filepath.Walk(\".\")`) yields zero files containing `@spec` or `@ac` annotations. The warning names the likely cause (`no test files contained @spec/@ac annotations — coverage will report 0% for every spec`) and points at the configuration fix (`set settings.tests_glob in specter.yaml or pass --tests <glob>`). Under `strictness == zero-tolerance`, the warning is upgraded to a hard error (non-zero exit). Closes the silent-0% UX hole reported in GH #75."
      type: business
      enforcement: error

    - id: C-28
      description: "Under `--strict`, when an annotated AC has at least one matching `@ac` source-file annotation but no matching entry in `.specter-results.json` for that (spec_id, ac_id) pair, `specter coverage` MUST emit a per-AC stderr hint of the form `hint: <spec-id>/<AC-NN> has source annotation in <file>:<line> but no matching pass in .specter-results.json — did your test runner emit a runner-visible annotation (Convention A: spec-id/AC-NN in the test name; Convention B: print '// @spec'/'// @ac' from the test body)?`. One hint per affected (spec_id, ac_id) pair, printed before the coverage table. Limit to the first 5 affected pairs to keep CI logs compact. Suppress entirely with `--quiet`. Under `--json`, surface as a top-level `diagnostic_hints` array (no stderr hint). Closes the GH #80 confusion where Python users with source-only `# @ac` comments saw `--strict` exit non-zero with no signal about the missing runtime channel."
      type: business
      enforcement: error

    - id: C-29
      description: "`specter coverage --json` MUST exit with the same process exit code that `specter coverage` (text mode) would exit with for the same workspace state, flags, and strictness setting. Specifically: zero-tolerance non-passed annotated AC → exit 2 (matches C-25); zero-tolerance `approval_gate: true` with unset `approval_date` → exit 3 (matches C-26); threshold-mode failure (Summary.Failing > 0) → exit non-zero (errSilent path); parse failure → exit non-zero. The JSON document is always emitted to stdout BEFORE the exit-code decision runs, so machine consumers see structured state in every case. Rationale: pre-v0.13 JSON mode returned nil whenever the report serialized successfully, so `coverage --strict --json` exited 0 on the very strictness violations that `coverage --strict` (text mode) exited 2/3 on. CI consumers reading `--json` could not gate on it. The gap surfaced during v0.13.0 D3 audit."
      type: business
      enforcement: error

    - id: C-30
      description: "ParseResultsFile MUST track entries whose `status` field carries a value outside the documented enum declared in C-21 (`passed | failed | skipped | errored`). `ResultsFile.InvalidStatuses()` returns a map of unique unrecognized status values to their occurrence counts. `specter coverage` MUST emit a stderr warning enumerating these BEFORE the coverage table when present, of the form `warning: .specter-results.json contains N entries with status=\"<value>\" — not a recognized status (passed|failed|skipped|errored); treated as not-passed`. One warning per unique unrecognized value. Under `--json`, surface as a top-level `invalid_status_warnings` array (each entry `{status, count}`). Suppressed under `--quiet` (matches the C-28 hint suppression contract). Parsing behavior is unchanged: unrecognized statuses still derive `Passed = false`, so today's silent-failed behavior holds — but the operator now sees the typo. Rationale: the common case is `status: \"pass\"` (typo missing `ed`). Pre-v0.13 a typo silently demoted the AC under `--strict` with no diagnostic; the operator chased a phantom strict failure. The bug class generalizes to any value outside the documented enum (case differences, plural/singular slips, foreign-runtime statuses like `\"ok\"`). Limit the per-mode behavior to a warning (not an error) so legitimate value drift across runners doesn't fail a build; the operator still sees the signal."
      type: business
      enforcement: error

    - id: C-31
      description: "An effective strictness of `threshold` or `zero-tolerance` — whether set by the `--strictness` flag or by `settings.strictness` in the manifest (default `threshold`, per spec-manifest C-24) — MUST route `specter coverage` through the same strict path the `--strict` flag uses (`BuildCoverageReportStrict` with strict mode enabled): a missing `.specter-results.json` is a hard failure (C-20), annotated ACs without a `status: passed` results entry demote across all tiers (C-19), and the strict-path diagnostics (C-22 empty-results warning, C-27 empty-discovery warning, C-28 source-only hints) apply identically regardless of how the strict mode was enabled. An effective strictness of `annotation` preserves the annotation-counting path. This makes `--strict` and `--strictness threshold` behaviorally identical under the default manifest strictness (`threshold`), satisfying AC-27's shortcut contract; `--strict` enables the strict path but does NOT override a manifest-set strictness level (a manifest at `zero-tolerance` keeps its zero-tolerance gates under `--strict`, and `--strict` with `settings.strictness: annotation` remains a C-24 error). The routing matches what `sync`'s coverage phase has used since spec-sync 1.2.0 (C-07). Rationale: pre-1.15.0 the strict path keyed solely on the `--strict` boolean, so `coverage --strictness threshold` silently tolerated missing results and counted failed Tier 2/3 annotations as covered — `sync` and `coverage` disagreed on the same workspace, breaking spec-sync AC-09."
      type: technical
      enforcement: error

    - id: C-32
      description: "When the strict path is enabled without the operator passing `--strict` (i.e. via `--strictness` or the manifest setting), a missing `.specter-results.json` MUST fail with a message that (a) names the active strictness mode and (b) offers both remedies — run `specter ingest` first, or use `--strictness annotation` for structural coverage — mirroring spec-sync C-08. The message MUST NOT attribute the requirement to a `--strict` flag the operator never passed. When the operator DID pass `--strict`, the existing C-20 message (`--strict requires .specter-results.json — run 'specter ingest' first`) is preserved unchanged."
      type: business
      enforcement: error

    - id: C-33
      description: "The results lookup MUST resolve a (spec_id, ac_id) pair across every matching entry in `.specter-results.json`, not the first one found. `ResultsFile.status(specID, acID)` returns the status of the worst matching entry, ranked passed (best), then skipped, then failed, then errored (worst). `ResultsFile.passed(specID, acID)` returns true only when every matching entry resolves to passed. A status value outside the C-21 enum ranks at the failed level and never at passed, so a rank table that yields a zero value for an unknown key is not a correct implementation. Resolution runs after the C-21 derivation, so a back-compat entry carrying `passed: false` and no `status` participates as failed. With no matching entry the lookup still returns `unknown` (AC-22). The consequence that binds both call paths: reordering the rows of a results file MUST NOT change any value in the coverage report, under `--strict` and under the Tier 1 pass-rate path of C-07 alike. Rationale: first-match resolution let two files describing identical facts report 0% and 100% on one workspace. Duplicate pairs are legal input, because ParseResultsFile validates size and JSON shape and nothing about uniqueness."
      type: technical
      enforcement: error

    - id: C-34
      description: "The zero-tolerance non-passed count MUST count distinct (spec_id, ac_id) pairs whose resolved status is not passed, not result entries. The message `N annotated AC(s) did not pass` names criteria, so N is a number of criteria, and several entries for one pair contribute one. The exit code does not change, because `at least one non-passed entry` and `at least one non-passed pair` are the same condition. `ResultsFile.InvalidStatuses()` is out of scope for this change and keeps counting entries, because its C-30 warning text says entries. Rationale: an operator reading `2 annotated AC(s) did not pass` goes looking for a second failing criterion that does not exist."
      type: business
      enforcement: error

    - id: C-35
      description: "Coverage percentages MUST be computed once and shown consistently. (a) `CoveragePercent(covered, total)` returns covered divided by total times 100, rounded half up to one decimal place, and that value is emitted as `coverage_pct`. It returns 100.0 only when covered equals total; when rounding would otherwise reach 100.0 with at least one criterion uncovered it returns 99.9. A total of zero returns 0. Every producer of `coverage_pct` calls this function; a caller doing its own division emits values such as 33.333333333333336 where this clause requires 33.3. Before C-39 this clause had to name a second producer explicitly, a per-entry recompute inside the approval-gate demotion pass, because that pass rebuilt the percentage after the fact. There is now one producer, so the clause needs no exception. (b) `FormatCoveragePct(pct)` returns the integer floor of one stored per-spec value with a trailing percent sign, and every per-spec human-readable surface uses it. Those surfaces are the Coverage column of the coverage table, the `Coverage:` line of `specter explain`, and the per-spec line `specter doctor` prints beneath a failing coverage check. (c) `passes_threshold` compares `coverage_pct` against the effective threshold with a greater-than-or-equal test. (d) Together these give the invariant that matters to an operator: a `coverage_threshold` set to the integer the tool just printed always passes. (e) The average in the C-16 summary header is not a per-spec value and has its own rule: it is the integer floor of the exact arithmetic mean of the entries' stored `coverage_pct` values. Exact means the mean carries no float accumulation error. Clause (a) makes every stored value an exact multiple of one tenth, so the sanctioned method is to sum the values as integer tenths and divide once. Three specs storing 4.1, 12.2 and 13.7 have a mean of 10.0 and the header prints 10, where summing them in float64 reaches 29.999999999999996, whose third is 9.999999999999998 and floors to 9. Rationale: the previous expression truncated under a comment that said it rounds, so on one spec the table printed 67, `explain` printed 66, and the gate compared 66.6. Rounding the displayed integer rather than flooring it was rejected, because 199 of 200 criteria would then print 100 and pass a Tier 1 gate. The header is stated apart from (b) because the two floors have different reasons. A per-spec floor guarantees the printed integer never exceeds what the gate compared, which is what makes (d) hold; the header compares nothing, so it floors for the other reason, agreement with the column beneath it. Rounding the mean would print 67 above a row of 66 on a one-spec report at 66.7, which is the disagreement this constraint exists to remove. Routing the header through `FormatCoveragePct` in 1.16.0 got the direction right and the arithmetic wrong: the argument that the floor is exact holds for one value of the form k/10 and not for a sum of them (`bugs/SP-SP-040`)."
      type: technical
      enforcement: error

    - id: C-36
      description: "A declared coverage threshold of 0 MUST mean zero rather than the tier default. Presence detection decides whether an override applies, not a greater-than-zero test, per the decision of 2026-06-10. This binds both override layers: a spec declaring `coverage_threshold: 0` gets an effective threshold of 0, and a manifest declaring `settings.coverage.tierN: 0` gets 0 for that tier. Precedence is unchanged, spec value over manifest tier value over built-in default (Tier 1 100, Tier 2 80, Tier 3 50), and a spec that omits the field still inherits the tier value. The effective number is the `threshold` field of `coverage --json`, so it can be read rather than inferred. No schema change is required: the JSON schema already declares `minimum: 0` and negative values are rejected at parse, so 0 is the only value that surprises the author."
      type: technical
      enforcement: error

    - id: C-37
      description: "`specter coverage --json` MUST produce a byte-identical document across runs of one binary on an unchanged workspace. Every array built from a map carries a defined total order: `test_files` ascending by path, `parse_error_patterns` by count descending then type ascending then path ascending, and the `files` list inside each pattern ascending by path. Ordering by count alone is not sufficient, because patterns with equal counts then keep map iteration order. Rationale: five runs on one workspace produced five documents, so coverage snapshots cannot be byte-compared and a CI job diffing them sees churn that is not a change."
      type: technical
      enforcement: error


    - id: C-38
      description: "When `settings.annotation` is declared in the manifest, coverage MUST apply the model of docs/ssrb/SSRB-104.md section 1 instead of the strictness ladder. Six parts. (a) Rule 1, the annotation rule: every acceptance criterion MUST have a test, meaning a source annotation naming it exists. A criterion with none is a rule-1 violation, counted and reported separately from an uncovered criterion, because the two are different failures. The reporting distinction MUST be observable in the text output: a rule-1 violation is listed on a `no test:` line, distinct from the existing `uncovered:` line. Without a distinguishable marker a caller cannot tell the two apart, and a test asserting only that the criterion id appears somewhere passes vacuously under the ladder, where the same id is already listed as uncovered. (b) The tier threshold does not excuse a rule-1 violation. A Tier 3 spec at or above its threshold still fails if any criterion has no test. (c) Rule 1 severity is decided by `settings.annotation.permissive` and by nothing else: error when false, warning when true. Tier routing is wrong here because a Tier 3 criterion would emit info and not fail, contradicting (b); global escalation via settings.strict is wrong because it rebuilds the bundling this model dismantles. Both are rejected in SSRB-104 section 7.4. (d) A rule-1 violation exits 2 when permissive is false, per SSRB-104 section 7.5. Exit 2 thereby narrows from its ladder meaning, an annotated criterion that did not pass, to its model meaning, a criterion with no test at all. (e) Rule 3, the pass rate: among criteria that DO have an annotation, a criterion counts as covered when its annotation has a passing result, and the tier threshold applies to that rate. A rate below the threshold exits 1. Rules 1 and 3 are therefore different failures with different codes, which is the distinction the single ladder could not express. (f) A declared block requires `.specter-results.json`, exactly as `threshold` does, per SSRB-104 section 7.9. Rule 1 is structural and could be answered without results, but evaluating rule 1 alone would let a workspace move from an outcome-verified gate to a structural one by adding a key that reads as stricter."
      type: technical
      enforcement: error
    - id: C-39
      description: "Under an effective strictness of `zero-tolerance`, an acceptance criterion carrying `approval_gate: true` with an unset `approval_date` MUST be reported as uncovered, and the entry's coverage percentage, threshold verdict, and the report summary MUST reflect that. The demotion is part of classifying the criterion, not an edit applied to a finished report, so every surface that reports coverage sees the same verdict for the same criterion: `coverage`, `coverage --json`, and `sync` alike. Two consequences follow and are observable. A demoted criterion appears in the uncovered list in acceptance-criterion declaration order, alongside criteria uncovered for any other reason, because there is one list built once rather than a list edited afterward. And an entry whose every covered criterion is demoted reports an empty covered list, never a null one, which is the same JSON-shape guarantee C-14 makes for every other entry. Rationale: this behavior shipped as the GH #94 fix and was required only by spec-sync C-09(b), which cited `spec-coverage GH #94 semantics` for a rule spec-coverage never stated. It was implemented as a second pass over the report, which is what let its output diverge from the builder's own invariants."
      type: business
      enforcement: error

    - id: C-40
      description: "When `settings.annotation` is declared, `specter coverage` MUST exit 3 when any acceptance criterion carries `approval_gate: true` with an unset `approval_date`, and `settings.annotation.permissive` MUST NOT change that. Six parts. (a) The rule is unconditional on `permissive`. That key was introduced for rule 1, the annotation rule, whose subject is whether evidence exists at all, and SSRB-104 section 7.4 scopes it there and nowhere else. An unmet approval gate is not an evidence-presence failure. It is a human sign-off the spec author chose on that criterion, so a switch that exists to ease adoption of a missing-test rule must not silently downgrade it. Read the other way, `permissive: true` would mean ignore human approval gates rather than warn on missing tests, which is a far broader bypass than the key was given. (b) The code is 3, per SSRB-104 section 7.5, which assigns `approval gate unmet` to 3 and states that the trigger does not depend on the ladder and survives its retirement. The run MUST also name the cause on stderr. A silent 3 is not the contract: the measured defect was exit 0 with nothing on stderr, and an operator who gets a bare integer has to guess which of the coverage gates fired. `spec-sync` C-11 requires `sync` to name the same cause `coverage` names, and that rule is vacuous when neither names one. (c) The gate applies identically on every surface that reports coverage: `coverage`, `coverage --json`, `sync`, and `sync --json` alike, in exit code and in cause line. This is C-39's surface clause applied to the exit signal rather than to the report. It is stated rather than left to inheritance because `spec-coverage` C-29 binds `coverage --json` and nothing binds `sync --json` for a gate outside the ladder: `spec-sync` C-09's `--json` clause is scoped to `zero-tolerance`. Five recorded instances of the `--json` family, `bugs/done/SP-SP-021`, `bugs/done/SP-SP-022`, `bugs/SP-SP-044`, `bugs/done/SP-SP-061` and `bugs/done/SP-SP-066`, all have one cause: `--json` written as a branch that returns early rather than as a rendering choice over one verdict, so a gate added beside the branch never reached it. A text-only fix for this gate would be the sixth. (d) Order: rule 1 is evaluated before this gate, so a workspace carrying both a criterion with no test and an unmet approval gate exits 2 rather than 3, matching the ladder's code-2-before-code-3 precedence where both ladder gates exist. Rule 1 is not itself a ladder gate, so the match is to the precedence and not to the gate set. Two reasons for that order, and both matter. The gates are checked in ascending code order today, and an order that varied by strictness model would let `coverage` and `sync` disagree on one workspace, which is the failure `spec-sync` C-11 exists to prevent. (e) Both diagnostics MUST be written to stderr before the process exits, so a workspace carrying both violations names both in one run. This is a requirement and not a description: no surface does it today, because each gate prints its own line and exits inside its own branch, so an operator fixes the missing test, re-runs, and only then learns about the approval gate. It is stated as MUST because part (d) rests on it. The argument for ascending-code order over semantic directness is that the integer is not the whole report, and that argument holds only if the report is complete. If both diagnostics cannot be emitted, the precedence in (d) has to be re-decided rather than kept. (f) C-26 is unchanged and stays true while the ladder ships. It scopes the gate to `zero-tolerance` and makes `approval_gate` metadata-only under `threshold`, and `GoverningStrictness()` maps a declared annotation block to `threshold`, so the pre-amendment code was faithful to the spec rather than defective. This constraint is what was missing. Rationale, per `bugs/SP-SP-071`: SSRB-104 section 7.5 decided the mapping on 2026-08-22 and roadmap item 1D-b shipped its code-2 row and not its code-3 row, so an adopter moving to the model the docs steer them toward lost a checkpoint with nothing on stderr to say so."
      type: business
      enforcement: error

    - id: C-41
      description: "A `.specter-results.json` entry MAY carry an optional `stream` field, a non-empty string naming the body of evidence it came from. An entry with no `stream` reads as the stream named `default`, so every file written before this field existed keeps its exact meaning and no producer breaks. `stream` is an opaque label. Any non-empty string is valid, `unit` and `live` and `mutation` included, because those are the names operators actually reach for and forbidding them would make the foundation unusable for the requests that motivated it. What is forbidden is meaning, in two directions. Specter MUST NOT interpret a label: no value may cause different handling, so `baseline` is a stream named baseline and not a baseline, and a tool that special-cased it would be reading a policy out of a string a producer chose. And the artifact MUST NOT gain a sibling field that carries the role instead, whether spelled `role`, `kind`, `baseline`, `current` or anything equivalent. Those are decisions a consumer makes by invocation, and an artifact asserting one would commit the tool to a policy it has not adopted, per SSRB-103 section 7. The merge key becomes `(spec_id, ac_id, stream)`, so `ingest` collapses duplicates within a stream and keeps one entry per stream. C-33 is deliberately unchanged and stays exactly true. It resolves a pair across every matching entry and returns the worst status, and two entries from two streams both match, so the worst-status rule already spans them. That is why splitting one body of evidence into two labeled streams cannot move the coverage number: over criteria that have entries the multi-stream rule IS the existing merge. Rationale, per SSRB-103: the results model records one status per pair, so no policy over more than one body of evidence can be expressed until a pair can carry more than one labeled result."
      type: technical
      enforcement: error

    - id: C-42
      description: "A `.specter-results.json` file MAY carry a top-level `streams` array, one object per **named** stream that ran, each naming the stream and the counts the producer observed: how many inputs it scanned, how many results it extracted, and how many packages produced zero test events. The third count is worded as observed rather than diagnosed. A runner that emits no test event for a package may have failed to build it, may have had every test filtered out, or may have been handed a package with no tests at all, and the artifact cannot tell those apart from runner output alone, so it reports what it saw and leaves the reading to a human. A per-entry label alone cannot express this, and the gap it leaves is the one that matters. A stream that ran and found nothing and a stream that never ran both leave zero entries, and the second is a broken pipeline reported as a clean one. The array MUST carry a defined total order, ascending by stream name, for the same reason C-37 orders the coverage document: an array built from a map otherwise keeps map iteration order, and a CI job diffing two runs sees churn that is not a change. A stream present in `streams` with zero entries is visible as such. A **named** stream absent from `streams` never ran. The implicit `default` stream is the exception and is outside this rule entirely: an unlabeled entry belongs to it and requires no declaration, per C-44(a), so `default` being absent from the block says nothing about whether it ran. That is what keeps a legacy file legal and lets a project adopt `--stream` one job at a time. Rationale, per SSRB-103 section 4: a second stream that silently failed to run must not read as success, and the failure direction matters, because a missing stream defaulting to satisfied produces maximum confidence exactly when the evidence is most broken."
      type: technical
      enforcement: error

    - id: C-43
      description: "A criterion is covered when at least one stream holds an entry for it AND every stream holding an entry reports `passed`. A criterion no stream reported on is NOT covered. Both clauses are load-bearing and the first is the one that is easy to drop. Written as `every stream holding an entry reports passed` alone, the condition is vacuously true over an empty set, so a criterion nothing reported on becomes covered and the outcome-verified path collapses toward annotation counting. Over criteria that have entries this rule is the existing worst-status merge of C-33, which is why the coverage number does not move when a project splits one stream into two. Over criteria with no entries it is not a merge at all: it is the absent-entry rule the strict path already applies, generalized. This constraint states the rule once for every strictness model rather than per model, because the rule does not depend on one: C-38(e) states the pass-rate arithmetic under the annotation model and C-07 states it for the tier path, and both consume this definition of covered rather than restating it."
      type: business
      enforcement: error

    - id: C-44
      description: "A results file carrying a `streams` block MUST be internally consistent, and the check MUST live in the shared pure builder that classifies coverage, so every command consuming the artifact as coverage evidence inherits it. That is `coverage` and `sync` today. It deliberately does not reach `ingest --merge`, which reads the same file as a producer assembling a new one rather than as a consumer judging a workspace, and which has its own contract in `spec-ingest` C-15 and C-17. Whether a merge should refuse an inconsistent input is a real question and it is not this one; deciding it here would be scoping a second command from the constraint that governs the first. The block is present when the key is present. Three shapes reach the reader and only two of them are legacy-compatible: an absent key, `streams: null`, and `streams: []`. The last two are present blocks declaring nothing, and both are refused rather than treated as legacy, because a producer that wrote the key made a claim about what ran. **Presence MUST be determined from the document as written and not from the decoded value**, because Go decodes an absent key and an explicit `null` to the same nil slice, so a reader that infers presence from the slice cannot tell a legacy file from one asserting that no stream ran. That is the whole distinction the rule turns on, and it is the one the decoder erases. Five rules. (a) Every stream an entry names MUST be declared in `streams`, **except `default`**, which never requires declaration whether an entry reaches it by carrying no label or by naming it outright. C-41 makes those two the same stream, so a rule that demanded declaration for one and not the other would split it. An entry labeled from any other undeclared stream is evidence a consumer cannot place, and the block exists precisely so a reader can enumerate what ran. **The `default` exemption is what lets a project adopt `--stream` one job at a time.** Merging a legacy unlabeled file with a labeled one yields unlabeled entries beside declared ones, and without the exemption that artifact would be refused, so `--stream` would be all or nothing across every job at once. The alternative considered and rejected was refusing mixed inputs in `ingest --merge`. It is sound on its own terms, since truthful counts for a synthesized default stream cannot be reconstructed, but it buys that soundness by forbidding the incremental adoption C-14's back-compat promise exists to enable, and it does so for a stream whose counts a legacy file never carried anyway. (b) A stream name MUST NOT be empty, and a **non-empty** name MUST NOT repeat within the block. The repeat rule is scoped to non-empty names because an empty one is not a label, which is the same reading (c) states: an empty name is refused as empty and never enters the repeat comparison. Read the other way the rule is unsatisfiable, because AC-72's fixture declares empty-name rows at two positions and pins a five-element sequence with no `duplicate_stream` element in it. (c) A violation MUST identify the stream it concerns, and for an empty name, where there is no name to print, it MUST identify the array position and say the name is empty. A repeated name leaves two counts for one stream with no rule for which wins, and an empty one is not a label. (d) No count in the block may be negative. `scanned`, `extracted` and `zero_test_event_packages` each report something a producer observed, and there is no run that scans minus one input. These are untrusted values read from a file Specter did not write, so a shape the domain cannot produce is refused rather than carried into arithmetic that would then be quietly wrong. The kind is `negative_count` and it carries `stream_index`. **One violation per stream row, not one per negative field.** Three negative fields in one row would otherwise produce three elements sharing a kind, a stream and a `stream_index`, which is a tie the total order cannot break, so the element names every negative field in one message, in the fixed order `scanned`, `extracted`, `zero_test_event_packages`. **A negative `extracted` suppresses the `extracted_below_entries` violation for that row**, because the second is derived from the first: a count below zero is below any entry count, and reporting both would tell an operator to fix a consequence beside its cause. (e) A stream's declared `extracted` count MUST NOT be lower than the number of entries carrying that label. It may be higher, because `spec-ingest` C-08 collapses duplicates within a stream and `--merge` sums counts across inputs that may both have reported one criterion, so extraction legitimately exceeds surviving entries. Lower is incoherent: the metadata under-reports the evidence sitting beside it in the same file. A violation selects an exit code **conditionally, and the two halves of that rule are not in tension once stated in order**. When stream validation is the only thing wrong, the run exits with a code from the evidence-stream band. When a gate that shipped before it has also failed, that gate's code wins and the stream violations are still reported. So the band's code is what a workspace exits with in the standalone case and never what it exits with in a coexisting one, which is how a new gate takes a number of its own without preempting one that shipped. Validation runs during report construction and the coverage gates run after, so the naive wiring returns the new code first and takes precedence from codes 2, 3 and 1, which `docs/EXIT_CODES.md` section 4 forbids for exactly this reason: a new gate that preempts a shipped one changes what an existing caller sees for a workspace whose old failure has not gone away.

Three consequences follow, each a requirement rather than an implementation note. **Validation MUST run in time linear in the artifact plus the sort of what it finds.** That is `O(streams + results + violations log violations)`, with no scan of `results` per stream. The obvious nesting, walking every entry to count a stream's own, is `O(streams x results)`, and the artifact is untrusted and may sit just under the 16 MiB cap `spec-ingest` C-17 sets. A size limit bounds memory and not work, so a file that passes the cap can still buy an operator's CPU with a shape no runner would produce. Counting by map costs the same to write and removes the amplification. AC-72 binds this rather than leaving it to review, because every other expected output here is satisfied by a nested implementation: the answers are identical and only the work differs. The binding has to be something a mutation reintroducing the per-stream scan fails, which a behavioral assertion over a small fixture cannot be.

**Validation MUST NOT abort report construction.** It records its findings on the report, so C-10's document still exists and the gates still have something to run on.

**The code MUST be chosen by the same shared verdict the other gates use, ordered last**, after rule 1, after the zero-tolerance gates, after the approval gate and after the tier threshold. A private branch in `coverage` or in `sync` that returned the code directly would reintroduce both the precedence bug and the two-copies bug this constraint exists to prevent. Under `--json` it MUST also appear in the emitted document rather than replacing it: C-10 requires `coverage --json` to emit a report in every state, so a validation refusal that produced an empty stdout would trade one false-confidence failure for the `bugs/SP-SP-032` shape, where a machine consumer gets a code and nothing to read. The document carries a top-level `results_validation_errors` array, present and non-empty exactly when stream validation found one or more violations, and absent otherwise. Tied to the validation and not to the verdict: a run failing only its tier threshold or only an approval gate refuses without any stream violation, and a run whose artifact is inconsistent reports these whichever gate ends up choosing the code.

**Every violation is collected, not the first.** An array that stopped at one would make a caller fix, re-run and discover the next, which is the sequencing C-40(e) already refuses for the coverage gates.

**The order is total and deterministic**, ascending by `kind`, then by `stream`, then by `stream_index`, then by `result_index`, with an absent index sorting before a present one. A criterion asserting only that two runs agree is satisfied by any consistent order, a reversal included, so the exact sequence is what must be pinned. Two runs over one artifact therefore emit identical bytes, which is the same reason C-37 orders the rest of the document.

Each element carries `kind`, one of `undeclared_stream`, `duplicate_stream`, `empty_stream_name`, `negative_count` or `extracted_below_entries`; `stream`, the name, empty for the empty-name kind; `message`; and **exactly one of `stream_index` or `result_index`**, with the other absent. `undeclared_stream` carries `result_index`, because the entry naming an undeclared stream is the thing to look at. The other four kinds carry `stream_index`, because each concerns a row of the block. **Both indexes reference the arrays as they appear in the file on disk, before any normalization Specter applies.** C-42 sorts the `streams` array ascending by name on read, so a row sitting at position 4 in the artifact can be at position 0 by the time a validator sees it, and an index taken after that sort points at a row the operator cannot find. The source position MUST therefore be preserved through parsing, or validation MUST run before the sort. Preserving it is the better of the two, because it keeps the check where C-44 puts it and does not make the order of two unrelated operations load-bearing. The preserved position is not part of the artifact and MUST NOT be serialized: it describes where something was read from, not what the file says. **A coordinate of zero MUST serialize.** A first row and a first entry are ordinary positions, so a field that drops its zero, which `int` with `omitempty` does, would emit an element whose only coordinate has silently vanished, and `exactly one of` would be violated by the encoder rather than by the validator. The field is therefore optional by nullability and not by emptiness. Exactly one rather than at most one: a rule permitting neither would let an element arrive with no coordinate at all, which is the case a consumer cannot act on. Two coordinates rather than one `index`, because the position an `undeclared_stream` violation points at is in `results` while every other kind points into `streams`, and one field meaning two things is a field a consumer has to branch on the kind to read. `empty_stream_name` carries `stream_index`, which is what identifies an entry that has no name to print.

A shape is required rather than left to the implementation because asserting only that a document was emitted is satisfied by a normal report saying nothing about the refusal, and a caller reading the code alone is the failure this whole clause exists to prevent. Rationale, per SSRB-103 section 4: Specter gates on a file it cannot verify was generated by the run it claims to describe, so internal consistency is the only thing it can check. These are integrity checks and not authentication: they catch an artifact that contradicts itself, and they cannot tell whether the run it describes ever happened. The direction that matters is whichever one lets a broken pipeline read as a clean one. Placing this in the command rather than the builder is the defect `bugs/done/SP-SP-058` records: a rule wired into `coverage` alone left `sync` returning a different verdict for the same workspace."
      type: business
      enforcement: error

  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires

  acceptance_criteria:
    - id: AC-01
      description: "Test file with @spec user-auth and @ac AC-01, AC-02 maps correctly"
      inputs:
        test_file: "user-auth.test.ts with // @spec user-auth and // @ac AC-01 and // @ac AC-02"
        spec: "user-auth with AC-01, AC-02, AC-03"
      expected_output:
        spec_id: "user-auth"
        covered_acs: ["AC-01", "AC-02"]
        uncovered_acs: ["AC-03"]
        coverage_pct: 66.7
      references_constraints: ["C-01", "C-02", "C-03"]
      priority: critical

    - id: AC-02
      description: "Spec with no matching test files reports 0% coverage"
      inputs:
        spec: "orphan-spec with AC-01, AC-02"
        test_files: "none match"
      expected_output:
        coverage_pct: 0
        status: "SPEC ONLY"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-03
      description: "Tier 1 spec at 80% coverage is flagged as failing (threshold is 100%)"
      inputs:
        spec: "tier 1, 4 of 5 ACs covered"
      expected_output:
        coverage_pct: 80
        passes_threshold: false
        required_threshold: 100
      references_constraints: ["C-04"]
      priority: high

    - id: AC-04
      description: "Tier 3 spec at 60% coverage passes (threshold is 50%)"
      inputs:
        spec: "tier 3, 3 of 5 ACs covered"
      expected_output:
        coverage_pct: 60
        passes_threshold: true
        required_threshold: 50
      references_constraints: ["C-04"]
      priority: medium

    - id: AC-05
      description: "Python-style annotations (# @spec, # @ac) are recognized"
      inputs:
        test_file: "test_auth.py with # @spec user-auth and # @ac AC-01"
      expected_output:
        spec_id: "user-auth"
        covered_acs: ["AC-01"]
      references_constraints: ["C-01", "C-02", "C-05"]
      priority: medium

    - id: AC-06
      description: "Per-spec coverage_threshold: 75 overrides tier threshold — a Tier 1 spec with coverage_threshold: 75 passes at 80% (not the default 100%)"
      references_constraints: ["C-06"]
      priority: high

    - id: AC-07
      description: "Tier 1 spec with annotation but failed .specter-results.json entry is NOT counted as covered"
      references_constraints: ["C-07"]
      priority: high

    - id: AC-08
      description: "spec A depends_on spec B; spec B has uncovered ACs; CheckDependencyCoverage emits dependency_coverage warning for spec A"
      references_constraints: ["C-08"]
      priority: high

    - id: AC-09
      description: "A Tier 3 spec with 3 ACs all marked gap: true and no @ac annotations reports total_acs=3, covered=0, coverage_pct=0, passes_threshold=false. A 100%-gap spec fails regardless of tier."
      inputs:
        spec: "tier 3, 3 ACs, all gap: true, no annotations"
      expected_output:
        total_acs: 3
        covered_acs: []
        uncovered_acs: ["AC-01", "AC-02", "AC-03"]
        coverage_pct: 0
        passes_threshold: false
      references_constraints: ["C-09"]
      priority: critical

    - id: AC-10
      description: "`specter coverage --json` run in a workspace where every spec file has a schema violation emits valid JSON containing an empty entries array, a zeroed summary, and a parse_errors array with at least one entry (file + message populated). Process exits non-zero."
      inputs:
        workspace: "one .spec.yaml present, missing required field `objective`"
        command: "specter coverage --json"
      expected_output:
        stdout: "valid CoverageReport JSON"
        entries: []
        parse_errors_count: ">= 1"
        exit_code: "non-zero"
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-74
      description: >-
        Every return from `coverage --json` emits a complete document, in each
        state the command refuses on and in each state it succeeds on. The
        states are asserted individually rather than as a family, because they
        are separate returns and a fix applied to one is the defect this
        criterion exists to catch. Each refusal carries `stop_reason`, distinct from
        `parse_errors`, with a non-empty `kind` and `message`. `entries` is `[]`
        and the summary is zeroed, and those are placeholders rather than
        measurements: the run counted nothing. Their meaning is guarded by
        `stop_reason`, which is the only field separating a refusal from a clean
        empty workspace, so a consumer that reads them without reading it
        reports the wrong thing. A run that reaches the report is required beside
        them, so the criterion cannot be met by a command that emits an empty
        document and never measures anything. The gates keep their codes: a
        document is emitted at 1, 2, 3 and 20 alike, and the code is unchanged
        by this rule.

        Each gate asserts its own cause before it reads its exit code. The gates
        are ordered, so a fixture that trips an earlier one reports that gate's
        code and reads as a pass for the gate it names: a below-threshold
        workspace with no results artifact is refused for the missing artifact
        and never reaches the threshold gate at all. This is the precedence
        lesson already recorded for the streams gate.

        Text compatibility is asserted against a baseline pinned in the
        repository, not by comparing two builds by hand. A manual comparison
        binds nothing once the person who ran it moves on.
      inputs:
        manifest_failure: "a specter.yaml the manifest loader rejects"
        invalid_strictness: "--strictness bogus"
        scope_without_strict: "--scope core with no --strict"
        unknown_domain: "--scope no-such-domain --strict"
        missing_results: "strictness threshold with no .specter-results.json"
        zero_tolerance_no_annotations: "--strictness zero-tolerance over a workspace whose test files carry no annotations"
        strict_against_annotation: "--strict with settings.strictness annotation, the seventh refusal"
        control_success: "a workspace that parses and meets its tier threshold"
        gate_1: "a spec below its tier threshold, WITH a results artifact covering one of its two criteria, so the run reaches the threshold gate instead of the missing-results refusal"
        gate_2: "settings.annotation declared, a results artifact present, and one criterion carrying no test at all"
        gate_3: "zero-tolerance, every annotated criterion passing in the results artifact so code 2 does not precede code 3, plus one approval_gate criterion with no approval_date"
        gate_20: "a results artifact whose streams block is inconsistent, over a workspace otherwise at threshold so no earlier gate fires"
      expected_output:
        every_state_emits_a_parseable_document: true
        all_seven_refusals_bound_independently: true
        refusal_reason_field_is_present_and_non_empty: true
        refusal_reason_is_not_parse_errors: true
        refusal_entries_is_empty_and_summary_is_zeroed: true
        refusal_reason_names_the_state_that_stopped_the_run: true
        control_emits_entries: true
        control_has_no_stop_reason: true
        each_gate_asserts_its_own_cause_before_its_exit_code: true
        gate_exit_codes_unchanged: "1, 2, 3, 20"
        text_output_byte_identical_to_a_pinned_baseline: true
        render_owner_functions: 1
        command_encodes_directly_at_zero_sites: true
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-11
      description: "A TypeScript test file that contains a template literal whose body includes the literal text `// @spec ghost-spec` produces zero annotations for `ghost-spec`. The same file's real `// @spec real-spec` on an actual comment line is still detected."
      inputs:
        file: |
          // @spec real-spec
          const payload = `
            // @spec ghost-spec
            // @ac AC-99
          `;
      expected_output:
        spec_ids_extracted: ["real-spec"]
        ghost_spec_present: false
      references_constraints: ["C-11"]
      priority: high

    - id: AC-12
      description: "`specter coverage --json` run in a workspace with 3 .spec.yaml files (all schema-invalid) emits spec_candidates_count: 3, entries: [], parse_errors populated. Run in an empty workspace emits spec_candidates_count: 0, entries: [], parse_errors absent or empty."
      references_constraints: ["C-12"]
      priority: high

    - id: AC-13
      description: "SummarizeParseErrors, given 20 ParseErrorEntry values all with Type=\"required\" and Path=\"spec.objective\", returns one ParseErrorPattern with Count=20, Type=\"required\", Path=\"spec.objective\", Files containing all 20 unique file paths. When mixed with one entry of Type=\"enum\", the \"required\"/\"spec.objective\" pattern sorts first by count."
      references_constraints: ["C-13"]
      priority: high

    - id: AC-14
      description: "`specter coverage --json` run on a workspace where every AC is covered emits `\"uncovered_acs\": []` for the covered entries (not `null`). Run on a workspace with no parse failures, the top-level `parse_errors` and `parse_error_patterns` fields are absent entirely (Go's `omitempty` behavior) rather than emitted as `null`. No field declared as `[]T` in a downstream TypeScript consumer ever receives `null` from the CLI."
      inputs:
        case_a: "spec with 100% coverage → uncovered_acs should be []"
        case_b: "run with no parse failures → parse_errors should be absent"
      expected_output:
        case_a_value: "[]"
        case_a_type: "array"
        case_b_present: false
      references_constraints: ["C-14"]
      priority: high

    - id: AC-15
      description: "Given a report with three entries — one failing below threshold (40%, tier 2), one partial passing (60% coverage on tier 3 with 50% threshold → passes), and one 100% covered (tier 1) — the default table output orders them: failing first, partial second, 100% third. A pure sort function SortCoverageEntriesForDisplay over []SpecCoverageEntry MUST produce this order deterministically."
      inputs:
        entries: "3 entries (40%/T2/FAIL, 60%/T3/PASS-partial, 100%/T1/PASS)"
      expected_output:
        order: ["failing-t2", "partial-t3", "complete-t1"]
      references_constraints: ["C-15"]
      priority: high

    - id: AC-16
      description: "Given a report with 14 specs across tiers (T1: 4, T2: 8, T3: 2), a pure function BuildSummaryHeader(report) returns a multi-line string starting with `Spec Coverage Report — 14 specs · {avg_pct}% avg coverage` and containing three `  Tier K: X/Y passing (Z%)` lines (one per tier present). Tiers with zero specs are omitted. Format is stable for regression pinning."
      inputs:
        report: "14 specs: 4xT1 (all passing), 8xT2 (6 passing), 2xT3 (1 passing)"
      expected_output:
        header_contains: "Spec Coverage Report — 14 specs"
        tier_lines:
          - "Tier 1: 4/4 passing"
          - "Tier 2: 6/8 passing"
          - "Tier 3: 1/2 passing"
      references_constraints: ["C-16"]
      priority: high

    - id: AC-17
      description: "`specter coverage --failing` on a 14-spec workspace where 2 specs are below 100% (1 failing, 1 partial) prints the summary header (reflecting all 14), then a table containing only those 2 entries. On a workspace where all 14 are 100%, the flag produces no table and a single line: `All 14 specs at 100% coverage.` The exit code is whatever the run would return without the flag."
      inputs:
