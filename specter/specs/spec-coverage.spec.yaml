    - id: AC-69
      description: "A stream that ran and produced nothing is distinguishable from one that never ran. A results file declaring a stream in `streams` with a scanned count above zero and an extracted count of zero reports that stream as present and empty. A results file that never names the stream reports it as absent. The two MUST NOT resolve to the same state, because they are a stream that found nothing and a pipeline that did not execute, and reading the second as the first is the failure direction SSRB-103 section 4 names. The `streams` array is emitted in ascending name order, and two runs over an unchanged workspace produce byte-identical arrays."
