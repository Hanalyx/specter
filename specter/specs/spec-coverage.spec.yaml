      description: "Two results files holding the same entries in different row order produce a byte-identical `coverage --strict --json` document and the same exit code. On a Tier 1 spec whose AC-01 and AC-02 are both annotated and both carry one passed and one failed entry, both orderings report coverage_pct 0 and uncovered_acs [AC-01, AC-02] and exit 1. Before this change the two orderings reported 0% exit 1 and 100% exit 0."
