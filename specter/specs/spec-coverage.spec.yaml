      description: "ResultsFile.status resolves a pair to its worst matching entry whatever the row order. Given four entries covering two pairs, status(demo-spec, AC-01) returns `failed` and status(demo-spec, AC-02) returns `errored`, and passed() returns false for both. The same four entries with each pair's `passed` row first return the same four answers."
