    - id: AC-35
      description: "Workspace with `.specter-results.json` containing one entry `{spec_id: my-spec, ac_id: AC-01, status: \"pass\"}` (typo missing `ed`) for an annotated AC: running `specter coverage --strict` emits a stderr line containing the literal `\"pass\"` AND the documented enum (`passed|failed|skipped|errored`), printed BEFORE the coverage table. Parsing behavior is unchanged — the AC remains demoted as not-passed, so exit code matches today (non-zero under --strict). Under `--quiet`, the stderr warning is suppressed but exit behavior is unchanged. Under `--json`, the warning appears as a top-level `invalid_status_warnings` array entry `{status: \"pass\", count: 1}` regardless of `--quiet`. Multiple distinct unrecognized values produce one warning line per unique value (counts aggregated)."
