    - id: AC-68
      description: "The stream label is optional and back-compatible. A results file whose entries carry no `stream` field produces exactly the report it produces today, field for field. A file whose entries all carry `stream: default` produces the same report as that file with the field removed, because missing means `default`. A file split into two labeled streams, holding the same facts, produces the same coverage verdict as the unsplit file, per C-41: the worst-status resolution of C-33 already spans streams. The split file and the unsplit file are compared field for field rather than by percentage, because a percentage can agree by accident."
      inputs:
