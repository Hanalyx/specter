      description: "A pair carrying one `passed` entry and one entry whose status is `ok` resolves as not passed, so under `--strict` the criterion is uncovered and the run exits non-zero. A rank table that yields a zero value for an unrecognized key resolves this pair as passed and leaves the criterion covered, which is the trap this criterion exists to catch."
      inputs:
