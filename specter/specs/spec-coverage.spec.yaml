    - id: AC-71
      description: "The streams object reports packages that produced zero test events. A results file whose stream declares that count carries it through a parse and a marshal, and the count is independent of the extracted count: a stream can extract results and still hold packages that emitted nothing. A stream declaring zero for it and a stream omitting it are the same state, because the count is a number and zero is its absence. The field is named for what was observed and the criterion says so: the assertion is on the count reaching the artifact, not on any claim about why a package was silent."
