      description: "Workspace with a Tier 2 spec, two annotated ACs, and a `.specter-results.json` where AC-01 is `failed` and AC-02 is `passed`: `specter coverage --strictness threshold` (no `--strict` flag) demotes AC-01 to uncovered, exactly as `specter coverage --strict` does on the same workspace — same report, same exit code. The same applies when the strictness comes from `settings.strictness: threshold` in the manifest with no flags at all. Under `--strictness zero-tolerance` (no `--strict`), the report demotes identically AND the run exits 2 per C-25 — the report and the exit code agree."
