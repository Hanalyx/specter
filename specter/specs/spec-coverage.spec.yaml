        results_a: '{"results":[{"spec_id":"demo-spec","ac_id":"AC-01","passed":false},{"spec_id":"demo-spec","ac_id":"AC-01","passed":true},{"spec_id":"demo-spec","ac_id":"AC-02","passed":false},{"spec_id":"demo-spec","ac_id":"AC-02","passed":true}]}'
