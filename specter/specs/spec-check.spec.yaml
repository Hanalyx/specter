spec:
  id: spec-check
  version: "4.0.0"
  status: approved
  tier: 1

  context:
    system: Specter toolchain
    feature: Spec type checker
    description: >
      The core analysis tool. Walks the dependency graph produced by spec-resolve
      and validates semantic consistency across specs. MVP focuses on deterministic,
      structural checks. AI-assisted semantic checks are deferred to a later phase.
    related_specs:
      - "spec-parse.spec.yaml"
      - "spec-resolve.spec.yaml"
    assumptions:
      - "Input is a validated SpecGraph from spec-resolve"
      - "Constraints with validation rules enable deterministic checking"
      - "Free-text constraints are checked by AI in a later phase"

  objective:
    summary: >
      Perform structural type-checking across the spec dependency graph.
      Detect orphan constraints, structural conflicts between connected specs,
      and (opt-in) test-annotation references that do not match any parsed spec.
      Version-change classification is not part of this spec: `spec-diff` owns
      it.
    scope:
      includes:
        - "Orphan constraint detection (constraints not referenced by any AC)"
        - "Duplicate acceptance criterion ID detection within a single spec"
        - "Structural conflict detection between dependent specs"
        - "Tier-aware severity (Tier 1 = error, Tier 3 = warning)"
        - "Diagnostic output with spec ID, constraint ID, and explanation"
        - "Test-annotation cross-reference (opt-in via --test / -t): scan test files, flag @spec and @ac references that do not match any parsed spec"
        - "Unreachable annotation detection (opt-in via --test / -t): scan test files, flag source-comment @ac annotations whose runner-visible test title or runtime output does not carry the corresponding `spec-id/AC-NN` pair (would silently demote under `coverage --strict`)"
        - "Exit-code parity between the default output and `--json`: the verdict follows the diagnostics, not the rendering"
      excludes:
        - "Semantic conflict detection (AI-assisted, Phase 8)"
        - "Gap detection (uncovered input paths, Phase 8)"
        - "Cross-project analysis"
        - "Auto-fixing or auto-resolution of conflicts"

  constraints:
    - id: C-01
      description: "MUST detect all orphan constraints in every spec (constraints with no AC reference)"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST respect tier-based severity: Tier 1 orphans are errors, Tier 3 are info"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST detect structural conflicts where a downstream spec contradicts an upstream constraint, and MUST report them advisorily per C-15 rather than as a build failure"
      type: technical
      enforcement: error

    - id: C-05
      description: "Orphan-constraint, duplicate-id, dangling-reference, version-mismatch and duplicate-AC-id detection MUST NOT produce false positives on valid specs. Structural-conflict detection is excluded from that promise and carries the weaker one stated in C-15, because the promise is unsatisfiable for it. Two reasons, each sufficient. C-03 in this spec requires the check to detect conflicts at all, and the only implementation literally producing zero false positives emits nothing, so C-05 as originally written contradicted C-03. And no lexical rule can separate a conflict from an enforcement: `Process checkout when email is absent` and `Registration fails when email is absent` share subject, absence expression and clause structure, and differ only in the polarity of the outcome verb, which lies outside everything the rule examines. Measured 2026-08-23: 40 of this repository's 408 acceptance criteria are enforcement-shaped, carrying both an absence keyword and a failure verb. Rationale: the original text promised zero and the shipped scan produced false positives that failed builds (`SP-SP-004`, P0). A promise no implementation can keep is not a constraint."
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST NOT depend on any CLI framework — pure function from SpecGraph to Diagnostic[]"
      type: technical
      enforcement: error

    - id: C-07
      description: "MUST support strict mode (CheckOptions.Strict=true) that upgrades all warning-severity and info-severity diagnostics to error severity, with a **named set of non-promotable kinds**: `structural_conflict` per C-15, and `unreachable_annotation_unknown` per C-10. The set is enumerated in this constraint rather than decided per call site, so adding a kind to it is a deliberate amendment here and not a local choice. Without the first the advisory posture would hold only until someone passed --strict, which is what CI passes. The second is stated in C-10's own terms, that the soft form is always a warning regardless of strictness mode, and this constraint agrees with it rather than overriding it: a scanner that could not recognize a test shape has found no defect to report, so promoting it would fail a build on the checker's own blind spot. **The upgrade MUST apply to every diagnostic the run reports, whatever stage assembled it, and exactly one place MUST apply it.** A diagnostic added to the result after the upgrade has run is silently exempt, and nothing fails when that happens: the kind keeps its own severity, the summary counts it as a warning, and `--strict` returns 0 on a workspace this constraint says it should fail. That is not a hypothetical. `tier_conflict` and `domain_tier_conflict` are computed from the manifest, and `unreachable_annotation` and the other `--test` diagnostics from test file contents, and all of them were appended by the command after the checker returned. What that cost differed by kind, and the accurate account is narrower than the route suggests. The two tier kinds escaped the rule outright and were fixed on 2026-08-28. Of the `--test` diagnostics, only `unreachable_annotation` at threshold severity did: the reference kinds are error severity, so promotion was a no-op for them and they failed the run either way, and `unreachable_annotation_unknown` is in the non-promotable set by design. That one case was fixed on 2026-08-29. The route was wrong for all of them, which is why the fix is structural rather than per-kind, but only two kinds ever reported the wrong severity because of it. One owner rather than a promotion step per assembly site, because a second site is how the non-promotable set drifts, and a private copy elsewhere would not know what the set contains. **The summary is computed once, from the final diagnostics, in the same place.** Counting at each assembly site is the same defect wearing different clothes: a count taken before the upgrade reports as a warning what the run reports as an error."
      type: technical
      enforcement: error

    - id: C-08
      description: "MUST support warn_on_draft mode (CheckOptions.WarnOnDraft=true) that emits a warning diagnostic for every spec with status: draft"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST support opt-in test-annotation cross-reference mode (`check --test` / `-t`) that scans test files for `@spec <id>` and `@ac AC-NN` source comments, and emits diagnostics for references that do not resolve. Diagnostic kinds: `unknown_spec_ref` (no spec with that id), `unknown_ac_ref` (spec exists but AC id is not declared), `malformed_ac_id` (AC id fails `^AC-\\d{2,}$`). Scanner skips lines inside multi-line string literals (TS/JS template, Python triple-quote) — annotations there are payload. Cascade rule: when `@spec` is unknown, child `@ac` lines under it are not separately checked. Ordering rule: `@ac` lines before any `@spec` are not checked. Repeat `@ac` mentions of the same id emit one diagnostic per occurrence (no dedup)."
      type: technical
      enforcement: error

    - id: C-10
      description: "Under `check --test` / `-t`, MUST detect source-comment `@ac` annotations that will NOT be visible to `specter ingest`'s runner-output regex and emit an `unreachable_annotation` diagnostic naming `file:line`. A source annotation is unreachable when the test in which it lives produces no runner-visible token matching `<spec-id>/<AC-NN>` — either in the runner-visible test title (Convention A) or in a runtime-emitted `// @spec` / `// @ac` line (Convention B). Language-aware reachability MUST be implemented for Go (`testing.T.Run` subtest names, `t.Log` / `fmt.Println` calls inside the test body), TS/Jest/Vitest (`describe` / `it` / `test` titles, `console.log` calls), and Python (function names cannot carry `/` or `:`; reachability inferred from `print` / `logging` calls inside the function body). For unsupported test shapes (custom runners, non-standard test helpers), the checker MUST emit `unreachable_annotation_unknown` (a softer diagnostic) rather than a false-positive `unreachable_annotation`. Severity routing: under `settings.strictness: zero-tolerance`, `unreachable_annotation` is `error`; under `threshold`, `warning`; under `annotation`, suppressed. `unreachable_annotation_unknown` is always `warning` regardless of strictness mode."
      type: technical
      enforcement: error

    - id: C-11
      description: "Per-file off-switch for unreachable_annotation. A test file containing a `// @reachable manual` marker (or `# @reachable manual` for Python, matching the language's existing annotation comment convention) at any line MUST suppress BOTH `unreachable_annotation` AND `unreachable_annotation_unknown` diagnostics for every `@ac` source comment in that file. Rationale: when the runner shape is custom (test framework not in the supported set, dynamically-generated tests, or tests that emit pairs via a non-standard channel), the operator asserts they've manually verified the tests cover the annotated ACs. The marker is file-level scope (one declaration per file). The marker MUST follow the existing `// @<keyword> <value>` grammar shared with `@spec` and `@ac` — no new equals-sign or namespace syntax. Future values for `@reachable` (e.g., `disabled`) are reserved; `manual` is the only value v0.13 ships."
      type: technical
      enforcement: error

    - id: C-12
      description: "When reading test files for the annotation scanners (`CheckTestAnnotations` per C-09 and `CheckUnreachableAnnotations` per C-10), the CLI MUST refuse to read any test file whose on-disk size exceeds `MaxTestFileBytes` (4 MiB). The check MUST use `os.Stat` BEFORE `os.ReadFile`, so an oversized file is never buffered into memory. Files at or under the cap continue to scan as before. Oversized files MUST be skipped (not fatal — `check --test` proceeds with the remaining files) and the skip MUST emit a stderr warning naming the file path and byte count so the operator knows that file was not scanned. Rationale: the unreachable scanner reads every discovered test file via `os.ReadFile` and passes the full string to `go/parser.ParseFile` (Go), `strings.Split` over regex (TS / Python). A 4 GiB malicious or accidental test file OOMs Specter; `go/parser` allocates an AST proportional to file size. The 4 MiB cap is conservative — real test files are well under that. Mirrors the existing `parser.maxSpecBytes` (1 MiB) and `coverage.MaxResultsFileBytes` (16 MiB) pattern; v0.13 security audit surfaced this as the H5 gap because the unreachable scanner was the only v0.13 surface that didn't inherit a size cap."
      type: business
      enforcement: error

    - id: C-13
      description: "MUST detect duplicate acceptance criterion IDs within a single spec and emit a `duplicate_ac_id` diagnostic. Uniqueness is scoped to one spec. Two specs may each declare `AC-01`, and that is not a duplicate. Comparison is exact string equality, so `AC-01` and `AC-001` are distinct IDs. Severity is `error` at every tier. An AC ID is the join key between a spec and its tests, and no tier makes two criteria answering to one key correct. The check runs in the default `check` pass and requires no flag, so `sync` inherits it. One diagnostic is emitted per duplicated ID, not per occurrence. The message MUST name the spec ID, the duplicated AC ID, the number of occurrences, and the 1-based position of each occurrence in declaration order, so the author can find every offending criterion. This dedup rule is the opposite of the C-09 rule for repeated `@ac` mentions in test files, and that is deliberate: there each mention is a separate broken reference, while here the occurrences are one broken declaration. Rationale: one `@ac AC-01` annotation credits every criterion declared as `AC-01`, so the spec reports coverage it has not earned. JSON Schema cannot express uniqueness over a property of array items, so parse cannot catch this."
      type: technical
      enforcement: error

    - id: C-14
      description: "`specter check --json` MUST exit with the same process exit code that `specter check` produces for the same workspace, the same flags, and the same manifest settings. The exit code is a function of the diagnostics the run produced, not of how they are rendered. Per the documented check contract, the code is 1 when the run reports one or more error-severity diagnostics, counted after tier routing (C-02) and after any `--strict` upgrade (C-07), and 0 otherwise. A run whose worst severity is warning or info therefore exits 0 in both formats, and a `--strict` run that upgrades those warnings to errors exits 1 in both. No diagnostic kind is exempt, including kinds added later. The JSON document MUST be written to stdout in full before the exit-code decision runs, and stdout MUST carry that document alone, so one invocation gives a caller both the diagnostics and a usable verdict. Human-readable notices stay on stderr. This is the `check` instance of the parity rule spec-coverage C-29 states for `coverage`, where the same defect was found in the v0.13 D3 audit. Rationale: a CI job that uses `--json` to capture structured diagnostics has a check gate that never fails, at any severity, for any kind. The document is correct and the exit code, which is the one thing an automated caller reads, reports a passing run. **A run that cannot reach the structural rules still writes the document.** Three states end a run early: one or more specs fail to parse, the resolver reports an error, or the manifest fails to load. In each of them `--json` MUST still write one complete document to stdout, carrying diagnostics that say why the run stopped, and MUST take its exit code from the same verdict the ordinary path uses. Writing nothing is this constraint's own failure one step earlier: a caller reading stdout gets an empty stream and cannot distinguish a broken workspace from a crashed process, which is the state `bugs/SP-SP-032` records. The document MUST be assembled and rendered on one path rather than by adding an emitter to each early return, because three emitters are three places for the next early return to be forgotten, and this defect began as exactly that omission."
      type: business
      enforcement: error

    - id: C-15
      description: "`structural_conflict` MUST be advisory. Three parts, and all three are required for the posture to hold. (a) Its severity is always `info`, whatever the upstream constraint's `enforcement` field says. That field expresses how strictly the constraint binds the system, not how confident this scan is about a sentence, and reading it here let a Tier 1 constraint make a heuristic match fail a build. (b) `--strict` does not upgrade it, exempting it from C-07. (c) It never contributes to a non-zero exit code from `specter check`. Rationale: the detector is a lexical heuristic and cannot be made sound, per C-05. An unsound gate that fails builds is worse than no gate, because the failure lands on correct work and the operator's only recourse is to reword a criterion until the tool stops complaining. The diagnostic still names a real tension worth a human glance, which is why it is retained rather than removed. Reconsideration trigger: an implementation that distinguishes a conflict from an enforcement, which needs the outcome clause and is therefore semantic analysis rather than a lexical rule."
      type: business
      enforcement: error

    - id: C-16
      description: "`specter check --concrete` MUST report every acceptance criterion that carries neither `inputs` nor `expected_output`, as a `vague_criterion` diagnostic naming the spec and the criterion. Severity follows the tier: error at Tier 1, warning at Tier 2, info at Tier 3. The rule reads fields that already exist and needs no schema change. It checks presence only. Whether `completes within budget` is a checkable assertion is semantic reading, and a rule that rejects the word `gracefully` is theater; this constraint makes no attempt at it."
      type: technical
      enforcement: error

    - id: C-17
      description: "The concreteness rule of C-16 MUST be opt-in and MUST NOT run without `--concrete`. Rationale, and it is the whole of the design. `inputs` and `expected_output` are optional in the canonical schema, whose `required` list for an acceptance criterion is `id` and `description`. A criterion carrying neither is therefore valid, and failing a build on it is a gate failing on correct input, which is the priority framework's P0 row and the defect `SP-SP-004` spent this cycle removing. The tier gradient makes the rule survivable for **this** repository, whose Tier 1 gaps were backfilled before the rule shipped; it says nothing about an adopter whose Tier 1 specs have the same gaps and who upgrades. The precedent is `settings.annotation` in this same cycle, which introduced a comparable new demand on previously valid workspaces and shipped opt-in for the same reason. A flag rather than a manifest key because a manifest key is a schema change and would need its own brief, and the flag costs nothing the key would have bought. Reconsideration trigger: a v0.18 pre-lock pass that makes concreteness unconditional, which is where the roadmap already places enforcement across all tiers."
      type: business
      enforcement: error


    - id: C-18
      description: "A `structural_conflict` diagnostic MUST NOT present the downstream spec id beside the upstream spec's constraint id as though the two belonged together. The header line reads `<spec> <constraint-id>`, and today the spec is the downstream one while the constraint id belongs to the upstream spec, so a reader looking up that id in the named spec finds nothing, or finds a different constraint that happens to share it. The constraint id MUST therefore be qualified with its owning spec wherever the two appear together. Rationale: the header is what a terminal scan and an editor problem list show, and both truncate the message body that names the specs correctly (`SP-SP-014`)."
      type: technical
      enforcement: error

    - id: C-19
      description: "The required-keyword list used by structural-conflict detection MUST contain only keywords that can yield a subject. `required`, `MUST be present`, `MUST exist` and `mandatory` set the required flag and then produce an empty subject, because subject extraction reads the text before the literal ` MUST` and nothing else, so a constraint matching one of them is discarded a few lines later. They are dead rather than merely imprecise. They MUST be removed rather than made to work: activating them widens a false-positive surface that C-05 already declines to bound, and the detector is advisory under C-15, so the value of matching more constraints is low and the cost is more noise. The case sensitivity of ` MUST` is left as it is and documented: a constraint written with a lowercase `must` is invisible to the detector, which is a false negative in an advisory check and not worth a second matching rule."
      type: technical
      enforcement: error

    - id: C-20
      description: "Structural-conflict detection MUST scan every dependency edge, not only those whose relationship is `requires`. `extends` and `conflicts_with` edges are skipped today. Rationale: a `conflicts_with` edge is the one place a contradiction check has the strongest reason to look, and it is the one place it does not look at all. The corpus has no such edges today, so this changes no current output; it is a gap that would surface silently the first time an adopter declared one."
      type: technical
      enforcement: error


    - id: C-21
      description: "Structural-conflict detection MUST NOT fire on mere co-occurrence. It fires only when the absence expression attaches to the required subject, in one of two shapes. Forward: the subject, then at most three intervening words with no sentence punctuation between them, then a copula (`is`, `are`, `was`, `were`, `be`, `being`, `been`), then an optional `not`, then an absence predicate (`absent`, `missing`, `empty`, `null`, `provided`, `present`, `supplied`, `set`, `defined`). Backward: `without`, `missing`, `lacking` or `absent`, then an optional article, then the subject. The subject MUST match on whole-token boundaries, so `ci` does not match inside `producing`. A leading article on the extracted subject MUST be stripped before matching, because extraction keeps everything before ` MUST` and a criterion saying `an audit record` cannot otherwise match a subject of `The audit record`. Rationale: the shipped rule asked whether the subject appeared anywhere and whether an absence word appeared anywhere, with nothing binding the two, which produced 34 fires on this repository's own specs and not one of them a genuine conflict. Implementation note, recorded because the next implementer would otherwise rediscover it: **Go's RE2 has no lookaround**, so the prototype that established these numbers cannot be ported directly. `\\b` is available and covers the boundary half, but the intervening-word window and the optional article are not expressible without it, so the whole rule is a token scanner rather than a mix of two mechanisms."
      type: technical
      enforcement: error

    - id: C-22
      description: "C-21 MUST NOT be described as eliminating false positives, and any measurement of it MUST be taken against three corpora rather than two: genuine conflicts, criteria that must not fire, and this repository's own specs. Rationale: the rule reaches zero fires on this repository and keeps every genuine conflict, and it still fires on five of the nine written-down non-conflicts, counting both the near-miss set and the proximity survivors as AC-44 does, because a conflict and an enforcement are lexically identical. `Process checkout when email is absent` and `Registration fails when email is absent` share subject, absence expression and clause structure and differ only in the polarity of the outcome verb, which the rule never reads. Roughly one criterion in ten in this repository is enforcement-shaped. The zero is a property of this corpus, not of the rule, which is why C-15 keeps the diagnostic advisory and C-05 declines to promise zero."
      type: business
      enforcement: error


  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires
    - spec_id: spec-resolve
      version_range: "^1.0.0"
      relationship: requires

  acceptance_criteria:
    - id: AC-01
      description: "Spec with constraint C-03 not referenced by any AC produces OrphanConstraint diagnostic"
      inputs:
        spec: "spec with C-01 (ref by AC-01), C-02 (ref by AC-02), C-03 (not referenced)"
      expected_output:
        type: "Diagnostic"
        kind: "orphan_constraint"
        constraint_id: "C-03"
      references_constraints: ["C-01"]
      priority: critical

    - id: AC-02
      description: "Tier 1 orphan constraint is reported as error; Tier 3 as info"
      inputs:
        tier_1_spec: "tier 1, orphan C-03"
        tier_3_spec: "tier 3, orphan C-03"
      expected_output:
        tier_1_severity: "error"
        tier_3_severity: "info"
      references_constraints: ["C-01", "C-02"]
      priority: high

    - id: AC-03
      description: "Spec A requires field X (C-01: MUST), Spec B (depends on A) AC handles X being absent = structural conflict"
      inputs:
        spec_a: "constraint C-01: email MUST be required"
        spec_b: "depends on A, AC-01 handles case where email is absent"
      expected_output:
        type: "Diagnostic"
        kind: "structural_conflict"
      references_constraints: ["C-03"]
      priority: critical

    - id: AC-06
      description: "Spec where all constraints are referenced by ACs produces zero orphan diagnostics"
      inputs:
        spec: "all constraints referenced"
      expected_output:
        orphan_count: 0
      references_constraints: ["C-05", "C-06"]
      priority: critical

    - id: AC-07
      description: "CheckOptions.Strict=true upgrades all warning-severity orphan diagnostics to error"
      inputs:
        spec: "tier 2 spec (orphans are normally warnings)"
        opts: "CheckOptions{Strict: true}"
      expected_output:
        orphan_severity: "error"
        summary_errors_gt_zero: true
      references_constraints: ["C-07"]
      priority: high

    - id: AC-08
      description: "CheckOptions.WarnOnDraft=true emits draft_spec warning for specs with status: draft"
      inputs:
        spec: "spec with status: draft"
        opts: "CheckOptions{WarnOnDraft: true}"
      expected_output:
        diagnostic_kind: "draft_spec"
        severity: "warning"
      references_constraints: ["C-08"]
      priority: high

    - id: AC-09
      description: "`specter check --test` on a workspace whose test file carries `// @spec bogus-spec` (no such spec exists) emits one `unknown_spec_ref` diagnostic naming the offending spec id and the test file"
      inputs:
        test_file: "contains '// @spec bogus-spec'"
        workspace_specs: "no spec with id bogus-spec"
      expected_output:
        diagnostic_kind: "unknown_spec_ref"
        contains_spec_id: "bogus-spec"
        contains_file_path: true
        exit_code_nonzero: true
      references_constraints: ["C-09"]
      priority: critical

    - id: AC-10
      description: "`specter check --test` on a workspace where a test file carries `// @spec real-spec` + `// @ac AC-99` but real-spec declares no AC-99 emits one `unknown_ac_ref` diagnostic"
      inputs:
        test_file: "contains '// @spec real-spec' and '// @ac AC-99'"
        workspace_specs: "real-spec declares AC-01 only"
      expected_output:
        diagnostic_kind: "unknown_ac_ref"
        contains_ac_id: "AC-99"
        contains_spec_id: "real-spec"
        exit_code_nonzero: true
      references_constraints: ["C-09"]
      priority: critical

    - id: AC-11
      description: "`specter check --test` on a test file carrying malformed AC ids (`// @ac AC-1` or `// @ac ac-01`) emits `malformed_ac_id` diagnostics for each"
      inputs:
        test_file: "contains '// @ac AC-1' and '// @ac ac-01'"
      expected_output:
        diagnostic_kind: "malformed_ac_id"
        malformed_count: 2
        exit_code_nonzero: true
      references_constraints: ["C-09"]
      priority: high

    - id: AC-12
      description: "`specter sync --strict` routes strict mode through to the check phase, including the `check --test` cross-reference pass; a workspace with an unknown_spec_ref fails `sync --strict`"
      inputs:
        test_file: "contains '// @spec bogus-spec'"
        invocation: "specter sync --strict"
      expected_output:
        sync_phase_check_fails: true
        exit_code_nonzero: true
      references_constraints: ["C-09"]
      priority: high

    - id: AC-13
      description: "`specter check --test` on a test file that declares `// @spec foo-spec` and `// @ac AC-01` in source comments but produces no runner-visible `foo-spec/AC-01` token in either the test title (Convention A) or runtime output (Convention B) emits an `unreachable_annotation` diagnostic naming `file:line` of the `@ac` line."
      inputs:
        test_file: "Go test function with `// @spec foo-spec` + `// @ac AC-01` source comments; subtest name does not include `foo-spec/AC-01`; no runtime `// @spec` / `// @ac` prints"
      expected_output:
        diagnostic_kind: "unreachable_annotation"
        names_file_line: true
        exit_code_nonzero_under_zero_tolerance: true
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-14
      description: "Go: a test that uses `t.Run(\"foo-spec/AC-01 ...\", ...)` is reachable (no diagnostic emitted). A Go test that declares `// @ac AC-01` but uses a subtest name without `foo-spec/AC-01` AND does NOT print `// @spec` / `// @ac` from the body is unreachable."
      inputs:
        reachable_via_subtest: "test body: t.Run(\"foo-spec/AC-01 valid input\", ...)"
        reachable_via_runtime_print: "test body: fmt.Println(\"// @spec foo-spec\"); fmt.Println(\"// @ac AC-01\")"
        unreachable: "source comments only; subtest name does not carry the pair; no body prints"
      expected_output:
        reachable_cases_no_diagnostic: true
        unreachable_case_emits_unreachable_annotation: true
      references_constraints: ["C-10"]
      priority: high

    - id: AC-15
      description: "Python: a test that prints `// @spec foo-spec` and `// @ac AC-01` to stdout (Convention B) is reachable when JUnit XML is generated with `-o junit_logging=all`. A Python test declaring source comments only (no runtime prints) is unreachable — pytest function names cannot carry `/` or `:` so Convention A is structurally unavailable for Python."
      inputs:
        reachable: "Python test function body: print('// @spec foo-spec'); print('// @ac AC-01')"
        unreachable: "Python test with source `# @ac AC-01` comment only, no print calls"
      expected_output:
        reachable_case_no_diagnostic: true
        unreachable_case_emits_unreachable_annotation: true
      references_constraints: ["C-10"]
      priority: high

    - id: AC-16
      description: "TS/Jest/Vitest: a test that uses `it('[foo-spec/AC-01] desc', ...)` or `describe('foo-spec/AC-01', ...)` is reachable. A TS test declaring `// @ac AC-01` in source comments but using a title that does not carry the pair AND no `console.log('// @spec ...')` body call is unreachable."
      inputs:
        reachable_via_title: "it('[foo-spec/AC-01] valid input returns 200', ...)"
        reachable_via_runtime_log: "console.log('// @spec foo-spec'); console.log('// @ac AC-01')"
        unreachable: "source comments only; title does not carry the pair; no body logs"
      expected_output:
        reachable_cases_no_diagnostic: true
        unreachable_case_emits_unreachable_annotation: true
      references_constraints: ["C-10"]
      priority: high

    - id: AC-17
      description: "For test shapes the language-aware parsers do not recognize (custom test runners, non-standard helper functions, dynamically-generated tests), `check --test` emits `unreachable_annotation_unknown` (severity: warning, always) rather than `unreachable_annotation` (which would be a false positive)."
      inputs:
        test_file: "uses a custom test runner that registers tests dynamically via reflection; no recognizable subtest call pattern"
      expected_output:
        diagnostic_kind: "unreachable_annotation_unknown"
        severity: "warning"
        no_unreachable_annotation_diagnostic: true
      references_constraints: ["C-10"]
      priority: medium

    - id: AC-18
      description: "Severity routing through strictness modes: an unreachable_annotation under `settings.strictness: zero-tolerance` is `error` and fails the command; under `threshold`, `warning` (exits 0); under `annotation`, suppressed entirely. `unreachable_annotation_unknown` is `warning` in all three modes."
      inputs:
        unreachable_under_zero_tolerance: "settings.strictness: zero-tolerance + unreachable annotation"
        unreachable_under_threshold: "settings.strictness: threshold + unreachable annotation"
        unreachable_under_annotation: "settings.strictness: annotation + unreachable annotation"
      expected_output:
        zero_tolerance: { severity: "error", exit_code_nonzero: true }
        threshold: { severity: "warning", exit_code_zero: true }
        annotation: { diagnostic_suppressed: true, exit_code_zero: true }
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-19
      description: "A test file containing the `// @reachable manual` marker (or `# @reachable manual` for Python) at any line MUST suppress BOTH `unreachable_annotation` AND `unreachable_annotation_unknown` diagnostics for every `@ac` source comment in that file, regardless of strictness mode. The marker is file-level scope — one declaration anywhere in the file opts the whole file out. Files WITHOUT the marker behave per C-10 (existing reachability + strictness routing)."
      inputs:
        with_marker: "Go test file containing `// @reachable manual` near the top; has source-only @ac that would otherwise be flagged"
        without_marker: "Identical file but without the marker"
      expected_output:
        with_marker:
          unreachable_annotation_emitted: false
          unreachable_annotation_unknown_emitted: false
          regardless_of_strictness: true
        without_marker:
          baseline_C10_behavior_preserved: true
      references_constraints: ["C-11"]
      priority: high

    - id: AC-20
      description: "A test file larger than `MaxTestFileBytes` (4 MiB) discovered during `check --test` MUST be skipped — the file is NOT read into memory (size check via `os.Stat` precedes `os.ReadFile`), no diagnostics are produced for any `@ac` it contains, and a stderr warning names the file path and byte count. The check MUST NOT exit non-zero on the skip alone; remaining test files continue to scan. Files at or under the cap behave unchanged."
      inputs:
        scenario_oversize: "test file of 5 MiB (1 MiB over the cap)"
        scenario_at_cap: "test file of exactly 4 MiB"
      expected_output:
        oversize_skipped: true
        oversize_no_diagnostics: true
        oversize_stderr_contains: ["exceeds", "skipping"]
        oversize_exit_code: 0
        at_cap_scanned: true
      references_constraints: ["C-12"]
      priority: critical

    - id: AC-21
      description: "A spec that declares AC-01 at two positions produces exactly one `duplicate_ac_id` diagnostic at error severity, naming the spec id, the duplicated id, the occurrence count, and the 1-based position of each occurrence"
      inputs:
        spec: "id payment-charge, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01"
        invocation: "specter check"
      expected_output:
        diagnostic_count: 1
        diagnostic_kind: "duplicate_ac_id"
        severity: "error"
        spec_id: "payment-charge"
        ac_id: "AC-01"
        message_names_occurrence_count: 2
        message_names_positions: [1, 3]
        exit_code_nonzero: true
      references_constraints: ["C-13"]
      priority: critical

    - id: AC-22
      description: "Duplicate AC id severity does not route through tier: a tier 3 spec with a duplicated id reports error, not info"
      inputs:
        tier_3_spec: "id ledger-export, tier 3, acceptance_criteria in declaration order: AC-01, AC-01"
        invocation: "specter check"
      expected_output:
        diagnostic_kind: "duplicate_ac_id"
        severity: "error"
        severity_is_not: "info"
        exit_code_nonzero: true
      references_constraints: ["C-13"]
      priority: critical

    - id: AC-23
      description: "An AC id declared three times in one spec produces one diagnostic reporting three occurrences, not one diagnostic per occurrence and not one per duplicate pair"
      inputs:
        spec: "id payment-charge, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01, AC-01"
        invocation: "specter check"
      expected_output:
        diagnostic_count: 1
        diagnostic_kind: "duplicate_ac_id"
        severity: "error"
        ac_id: "AC-01"
        message_names_occurrence_count: 3
        message_names_positions: [1, 3, 4]
        exit_code_nonzero: true
      references_constraints: ["C-13"]
      priority: high

    - id: AC-24
      description: "Two different ids each duplicated in one spec produce two diagnostics, one per duplicated id, and the id declared once produces none"
      inputs:
        spec: "id payment-charge, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01, AC-02, AC-03"
        invocation: "specter check"
      expected_output:
        diagnostic_count: 2
        diagnostic_kind: "duplicate_ac_id"
        severity: "error"
        diagnostic_1: { ac_id: "AC-01", message_names_positions: [1, 3] }
        diagnostic_2: { ac_id: "AC-02", message_names_positions: [2, 4] }
        no_diagnostic_for_ac_id: "AC-03"
        exit_code_nonzero: true
      references_constraints: ["C-13"]
      priority: high

    - id: AC-25
      description: "The same AC id declared in two different specs of one workspace is not a duplicate and produces no diagnostic"
      inputs:
        spec_a: "id payment-charge, tier 1, acceptance_criteria: AC-01, AC-02"
        spec_b: "id payment-refund, depends on payment-charge, tier 1, acceptance_criteria: AC-01, AC-02"
        invocation: "specter check"
      expected_output:
        duplicate_ac_id_count: 0
        exit_code_zero: true
      references_constraints: ["C-13"]
      priority: critical

    - id: AC-26
      description: "Ids are compared as exact strings, so AC-01 and AC-001 declared in the same spec are distinct and produce no diagnostic"
      inputs:
        spec: "id payment-charge, tier 1, acceptance_criteria in declaration order: AC-01, AC-001"
        invocation: "specter check"
      expected_output:
        duplicate_ac_id_count: 0
        exit_code_zero: true
      references_constraints: ["C-13"]
      priority: medium

    - id: AC-27
      description: "The duplicate id check runs in the default check pass: a plain `specter check` with no `--test` flag reports the diagnostic and exits non-zero"
      inputs:
        spec: "id payment-charge, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01"
        invocation: "specter check (no --test flag, no --strict flag)"
      expected_output:
        diagnostic_count: 1
        diagnostic_kind: "duplicate_ac_id"
        severity: "error"
        requires_test_flag: false
        exit_code_nonzero: true
