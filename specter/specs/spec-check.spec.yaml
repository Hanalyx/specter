      priority: critical

    - id: AC-28
      description: "A workspace whose only defect is a spec declaring AC-01 twice exits 1 under `specter check` and 1 under `specter check --json`. The two invocations differ only in output format, so they agree on the exit code"
      inputs:
        spec: "id dup, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01"
        invocation_text: "specter check"
        invocation_json: "specter check --json"
      expected_output:
        text_exit_code: 1
        json_exit_code: 1
        json_document_reports_duplicate_ac_id: true
      references_constraints: ["C-14"]
      priority: critical

    - id: AC-29
      description: "Exit-code parity holds for every diagnostic kind, not only the kind that surfaced the defect. Each workspace below is run twice, once as `specter check` and once with `--json` added, and the two runs report the same exit code"
      inputs:
        row_orphan: "tier 1 spec with orphan constraint C-03, error severity"
        row_unknown_spec_ref: "test file carrying `// @spec bogus-spec`, run with `--test`"
        row_malformed_ac_id: "test file carrying `// @ac AC-1`, run with `--test`"
        row_clean: "workspace with no diagnostics of any severity"
      expected_output:
        row_orphan: { text_exit_code: 1, json_exit_code: 1 }
        row_unknown_spec_ref: { text_exit_code: 1, json_exit_code: 1 }
        row_malformed_ac_id: { text_exit_code: 1, json_exit_code: 1 }
        row_clean: { text_exit_code: 0, json_exit_code: 0 }
      references_constraints: ["C-14"]
      priority: critical

    - id: AC-30
      description: "A run whose worst severity is warning exits 0 under `--json`, matching text mode. Warnings do not fail the check in either format"
      inputs:
        spec: "tier 2 spec with orphan constraint C-03, which routes to warning severity"
        invocation_text: "specter check"
        invocation_json: "specter check --json"
      expected_output:
        text_exit_code: 0
        json_exit_code: 0
        json_document_reports_orphan_constraint_at_warning: true
      references_constraints: ["C-14"]
      priority: high

    - id: AC-31
      description: "`specter check --strict --json` on the tier 2 orphan of AC-30 exits 1, because `--strict` upgrades the warning to an error and the exit code follows severity after that upgrade. Text mode on the same workspace also exits 1"
      inputs:
        spec: "tier 2 spec with orphan constraint C-03"
        invocation_text: "specter check --strict"
        invocation_json: "specter check --strict --json"
      expected_output:
        text_exit_code: 1
        json_exit_code: 1
      references_constraints: ["C-14", "C-07"]
      priority: high

    - id: AC-32
      description: "A run whose worst severity is info exits 0 under `--json`, matching text mode. Info diagnostics are reported in the document and change no verdict"
      inputs:
        spec: "tier 3 spec with orphan constraint C-03, which routes to info severity"
        invocation_text: "specter check"
        invocation_json: "specter check --json"
      expected_output:
        text_exit_code: 0
        json_exit_code: 0
        json_document_reports_orphan_constraint_at_info: true
      references_constraints: ["C-14", "C-02"]
      priority: medium

    - id: AC-33
      description: "When `specter check --json` exits non-zero, stdout still holds one complete JSON document and nothing else. The document parses, and it carries every diagnostic the same run reports in text mode, each with its kind and its severity. A caller that reads the exit code can then read the reason from the same output"
      inputs:
        spec: "id dup, tier 1, acceptance_criteria in declaration order: AC-01, AC-02, AC-01"
        invocation: "specter check --json"
      expected_output:
        exit_code: 1
        stdout_parses_as_json: true
        stdout_contains_only_the_document: true
        diagnostics_match_text_mode: true
        each_diagnostic_carries_kind_and_severity: true
      references_constraints: ["C-14"]
      priority: critical

    - id: AC-34
      description: "A workspace whose only finding is a structural conflict exits 0, and exits 0 under `--strict` as well. The diagnostic is present in both runs at info severity."
      inputs:
        workspace: "upstream constraint requiring a subject, downstream criterion mentioning it beside an absence word, joined by a requires edge"
        commands: ["check", "check --strict"]
      expected_output:
        exit_code: 0
        diagnostic_present: true
        diagnostic_severity: "info"
      references_constraints: ["C-15"]
      priority: high

    - id: AC-35
      description: "An upstream constraint carrying `enforcement: error` does not raise the severity of a structural conflict it produces. The enforcement field says how strictly the constraint binds the system, not how much to trust a lexical match."
      inputs:
        upstream_constraint_enforcement: "error"
      expected_output:
        diagnostic_severity: "info"
        exit_code: 0
      references_constraints: ["C-15"]
      priority: high

    - id: AC-45
      description: "Strictness reaches diagnostics the command assembles, not only those the checker produced. Workspace: a manifest declaring `settings.tier_overrides` for a spec whose declared `tier` disagrees, and a domain declaring a `tier` that also disagrees, so one run carries both a `tier_conflict` and a `domain_tier_conflict` and no other diagnostic. Plain `specter check` reports both at `warning` and exits 0. `specter check --strict` reports both at `error` and exits 1. `specter check --strict --json` agrees: every diagnostic in the document carries `severity: error`, the summary reports zero warnings, and the exit code is 1. Both kinds are computed from the manifest and appended after the checker returns, which is why they are the case this criterion binds: an implementation that promotes inside the checker alone passes AC-07, AC-31 and AC-36 and fails here. The `--test` diagnostics are the second half of this criterion, and they are the half that separates the rule from the two kinds that prompted it. On a workspace declaring `settings.strictness: threshold` with a source annotation whose test produces no runner-visible token, `specter check --test` reports `unreachable_annotation` at `warning` and exits 0, and `specter check --test --strict` reports it at `error` and exits 1. These diagnostics are computed from test file contents, which the checker does not read, so they arrive by the same route the tier kinds do. And the non-promotable set holds: on a workspace whose test shape the reachability scanner cannot recognize, `unreachable_annotation_unknown` stays at `warning` under `--strict` and does not by itself make the run exit non-zero, per C-10. A run carrying only that diagnostic exits 0 with or without the flag. This is the case that stops the rule being implemented as promote everything that arrives late. **The rule binds every command that builds a check result, not the `check` command alone.** `sync` runs the same checker and assembles its own test-annotation diagnostics, so the same route exists there and the same criterion covers it. It reported no wrong severity while every diagnostic on that path was error severity, which is the condition that makes a structural violation invisible: the route is wrong and the output happens to be right, so nothing fails until a warning-severity kind is added. A guard that reads only one command cannot see the second, so the ownership assertion covers `cmd/specter` and `internal/sync` together. Whether a command may write through the `CheckOptions` pointer it was handed is not this criterion's business. `spec-sync` C-13 owns that boundary, because `RunSync` is the API that takes the pointer."
      inputs:
        workspace_tier: "one spec whose declared tier disagrees with both settings.tier_overrides and its domain tier"
        workspace_annotation: "settings.strictness: threshold, one source annotation with no runner-visible token"
        workspace_unknown: "a test shape the reachability scanner cannot recognize"
        invocations: "check, check --strict, check --strict --json, check --test, check --test --strict"
        commands_bound: "cmd/specter and internal/sync"
      expected_output:
        plain_severities: "warning, warning"
        plain_exit_code: 0
        strict_severities: "error, error"
        strict_exit_code: 1
        strict_json_warning_count: 0
        strict_json_exit_code: 1
        unreachable_annotation_plain_severity: "warning"
        unreachable_annotation_strict_severity: "error"
        unreachable_annotation_strict_exit_code: 1
        unreachable_annotation_unknown_strict_severity: "warning"
        unreachable_annotation_unknown_strict_exit_code: 0
        promotion_sites_across_both_commands: 1
        summary_computation_sites: 1
      references_constraints: ["C-07", "C-10"]
      priority: critical

    - id: AC-46
      description: >-
        `check --json` writes one complete document in each of the three states
        that end a run before the structural rules execute. A spec that fails to
        parse, a resolver error, and a manifest that fails to load each leave
        stdout carrying a parseable document and nothing else, and each takes its
        exit code from the same verdict the ordinary path uses. The three are
        asserted separately rather than as one case, because they are three
        separate early returns and a fix applied to one is the defect this
        criterion exists to catch. A control run that reaches the checker
        normally is required beside them, so the criterion cannot be satisfied by
        a command that emits a document and never checks anything.

        Each state binds the diagnostic it produces: its kind, error severity, a
        non-empty message, and a summary error count of at least one. A document
        carrying an empty diagnostics list satisfies every structural assertion
        about the document while telling a caller nothing, and its summary counts
        zero errors so both modes exit 0. That is a worse failure than writing
        nothing at all, because an empty stream is at least obviously broken. The
        exit code is therefore asserted as 1 in its own right, not only as
        agreeing with text mode, since the two agree at 0 when the document is
        empty.

        Rendering is bound as ownership rather than as placement. One named
        function owns encoding and the verdict, the command encodes at no site of
        its own, and every path out of the command routes through that owner.
        Asserting instead that the encoder sits lexically inside the command
        would fail a valid extraction of the renderer into a helper, which is a
        refactor that preserves the property this criterion is about.
      inputs:
        parse_failure: "a workspace where one spec is not valid against the schema"
        resolver_error: "a schema-valid spec depending on a spec id that does not exist"
        manifest_failure: "a specter.yaml the manifest loader rejects"
        control: "a workspace whose specs parse, resolve, and produce one orphan_constraint"
        invocation: "specter check --json"
      expected_output:
        parse_failure_stdout_parses_as_json: true
        resolver_error_stdout_parses_as_json: true
        manifest_failure_stdout_parses_as_json: true
        stdout_contains_only_the_document: true
        human_readable_notices_on_stderr: true
        exit_code_matches_text_mode_in_all_three: true
        exit_code_in_all_three: 1
        parse_failure_diagnostic_kind: "parse_error"
        resolver_error_diagnostic_kind: "dangling_reference"
        manifest_failure_diagnostic_kind: "manifest_error"
        every_early_diagnostic_severity: "error"
        every_early_diagnostic_message_non_empty: true
        summary_errors_at_least_one_in_all_three: true
        control_reaches_the_checker_and_reports_its_diagnostic: true
        render_owner_functions: 1
        command_encodes_directly_at_zero_sites: true
        command_routes_to_the_owner_at_every_exit: true
      references_constraints: ["C-14"]
      priority: critical

    - id: AC-36
      description: "The advisory posture does not weaken the other structural checks. A workspace carrying an orphan constraint on a Tier 1 spec still fails, and `--strict` still upgrades a Tier 3 orphan to an error, in the same run that reports a structural conflict at info."
      inputs:
        workspace: "one Tier 1 orphan constraint and one structural conflict"
      expected_output:
        exit_code_nonzero: true
        failing_diagnostic_kind: "orphan_constraint"
        structural_conflict_severity: "info"
      references_constraints: ["C-15", "C-07"]
      priority: high

    - id: AC-37
      description: "`specter check --concrete` reports a criterion carrying neither `inputs` nor `expected_output` as `vague_criterion`, at error for a Tier 1 spec, warning for Tier 2 and info for Tier 3. A criterion carrying either field is not reported."
      inputs:
        specs: ["Tier 1 with one bare criterion", "Tier 2 with one bare criterion", "Tier 3 with one bare criterion", "Tier 1 with a criterion carrying inputs only"]
        command: "check --concrete"
      expected_output:
        diagnostic_kind: "vague_criterion"
        severity_by_tier: {"1": "error", "2": "warning", "3": "info"}
        reported_when_either_field_present: false
      references_constraints: ["C-16"]
      priority: high

    - id: AC-38
      description: "Without `--concrete`, the same workspace produces no `vague_criterion` diagnostic and exits 0. The rule is opt-in and a workspace that never passes the flag cannot be failed by it."
      inputs:
        specs: ["Tier 1 with one bare criterion"]
        commands: ["check", "check --strict"]
      expected_output:
        diagnostic_present: false
        exit_code: 0
      references_constraints: ["C-17"]
      priority: high


    - id: AC-39
      description: "A structural conflict between two specs renders a header that does not attribute the upstream constraint id to the downstream spec. The constraint id appears qualified with the spec that owns it."
      inputs:
        upstream: "spec-core, constraint C-01"
        downstream: "spec-app, criterion AC-01"
      expected_output:
        header_attributes_constraint_to_owner: true
        header_pairs_downstream_spec_with_upstream_constraint_id: false
      references_constraints: ["C-18"]
      priority: medium

    - id: AC-40
      description: "A constraint whose text uses `required` or `mandatory` rather than ` MUST` produces no structural-conflict diagnostic, and does so because the keyword is no longer in the required list rather than because the subject came out empty. The observable behavior is unchanged; the dead branch is gone."
      inputs:
        constraints: ["The system required to log every request", "Logging by the system is mandatory"]
      expected_output:
        diagnostics: 0
      references_constraints: ["C-19"]
      priority: medium

    - id: AC-41
      description: "A `conflicts_with` edge is scanned for structural conflicts, as is an `extends` edge. A workspace whose only edge is `conflicts_with` and whose text conflicts produces the diagnostic."
      inputs:
        edge_relationship: "conflicts_with"
        upstream_constraint: "email MUST be required"
        downstream_criterion: "Process checkout when email is absent"
      expected_output:
        diagnostic_emitted: true
      references_constraints: ["C-20"]
      priority: medium


    - id: AC-42
      description: "The subject matches on whole-token boundaries. A constraint whose subject is `CI` produces no diagnostic against a criterion containing `producing` or `exercises`, and does produce one against `in a ci environment without a controlling terminal` only if the absence expression attaches, which it does not."
      inputs:
        subject: "CI"
        criteria: ["a step producing artifacts", "the suite exercises the path", "in a ci environment without a controlling terminal"]
      expected_output:
        diagnostics: 0
      references_constraints: ["C-21"]
      priority: high

    - id: AC-43
      description: "Both attachment shapes are detected. Forward: `email is absent`, `email is not provided`, `the email is empty`. Backward: `without email`, `without the refresh token`, `without an audit record` against a subject of `The audit record`."
      inputs:
        forward_criteria: ["Process checkout when email is absent", "Submit the form when email is not provided", "Checkout proceeds when the email is empty"]
        backward_criteria: ["Order is accepted without email", "Renewal succeeds without the refresh token", "Deletion completes without an audit record"]
      expected_output:
        all_detected: true
      references_constraints: ["C-21"]
      priority: high

    - id: AC-44
      description: "Accuracy is measured against all three corpora and the numbers are recorded rather than described. On this repository's specs the rule fires zero times over every ordered pair. Of twelve genuine conflicts it detects twelve. Of nine written-down non-conflicts it wrongly fires on five, all of which are the enforcement class C-22 names."
      inputs:
        corpora: ["this repository, all ordered pairs", "12 genuine conflicts", "9 non-conflicts"]
      expected_output:
        corpus_fires: 0
        true_conflicts_detected: 12
        non_conflicts_wrongly_fired: 5
      references_constraints: ["C-21", "C-22"]
      priority: high


  changelog:
    - version: "4.0.0"
      date: "2026-08-30"
      author: "specter-team"
      type: major
      description: "AC-46 was satisfiable by a document that says nothing. It asserted the diagnostics key exists and that the two modes agree on the exit code, and both hold for an empty list: the summary counts zero errors, so both modes exit 0. Measured rather than argued. Dropping the diagnostic from all three early returns leaves AC-46 green; the kill came from an unrelated criterion, spec-manifest AC-51, which covers the manifest state only, so the parse and resolver states were unbound. An empty document with a zero exit is worse than writing nothing, because an empty stream is at least obviously broken while a successful-looking empty document is not. AC-46 now binds each state's diagnostic kind, error severity, a non-empty message, a summary error count of at least one, and exit 1 in its own right rather than only as parity. The ownership half is restated as ownership rather than placement: it asserted the encoder appears lexically inside the command, which would fail a valid extraction of the renderer into a named helper while the single-owner property still held. It now asserts one named owner, no encoding in the command, and every exit routed through the owner. Major, and taken from the classifier rather than from a reading of the diff: expected_output gains keys on one criterion, and spec-diff C-05 counts a change to any of the six concrete fields as breaking. specter diff over this change reports [breaking]. This repository has twice recorded overriding that classifier with a judgment about half the diff, so it is followed here. Two specs do depend on spec-check, and this claim was wrong when written: spec-sync and spec-vscode both required ^3.0.0, and `check` reported two version_mismatch errors after the bump. Both ranges are raised to ^4.0.0 and both specs take a patch bump. The absence of dependents was asserted rather than resolved; running `check` is what found it."

    - version: "3.2.0"
      date: "2026-08-30"
      author: "specter-team"
      type: minor
      description: "C-14 gains the three states that end a `check` run before any structural rule executes, and AC-46 binds them. Measured at b3d02c9: a schema-valid spec depending on a spec that does not exist gives `check --json` rc=1 with zero bytes on stdout, and a parse failure and a rejected manifest do the same. C-14 already required the document to be written in full before the exit-code decision, so this is a conformance failure rather than a gap, and the constraint now says so instead of leaving it to be inferred from a rule about severity routing. The cost is not limited to CI: the VS Code extension's jsonDocumentFrom throws on an empty stream, and extension.ts runs parse and check through Promise.all, so one unparseable spec discards the parse result that succeeded and freezes on-save diagnostics and the coverage tree for every file in the workspace. A workspace with a broken cross-spec reference gets no Problems-panel entry for it at all. AC-46 asserts one render site rather than three emitters, because the defect is an omission at an early return and adding an emitter per branch leaves the next early return to be forgotten the same way. Minor: a new clause and a new criterion, with no criterion removed and no `inputs` changed on an existing one. `bugs/SP-SP-032`."

    - version: "3.1.0"
      date: "2026-08-30"
      author: "specter-team"
      type: minor
      description: "AC-45 binds C-07 over every command that builds a check result, not `check` alone. `sync` runs the same checker and assembles its own test-annotation diagnostics after it returns, counting them into the summary itself, which is the route C-07 forbids. It reported no wrong severity, because every diagnostic on that path is error severity and `sync` does not run the unreachable scan, and that is exactly the condition that makes a structural violation invisible: the route is wrong and the output happens to be right, so nothing fails until a warning-severity kind is added there. The ownership guard reads `cmd/specter` and `internal/sync` together, because a guard over one command cannot see the other. Whether a command may write through the `CheckOptions` pointer it is handed is not this spec's business: `spec-sync` C-13 owns that boundary, because `RunSync` is the API that takes the pointer. Minor: the criterion widens to see a violation that was always there, C-07's rule is unchanged, and no conforming implementation breaks."
    - version: "3.0.0"
      date: "2026-08-29"
      author: "specter-team"
      type: major
      description: "Reconcile C-07 with C-10 and finish the boundary 2.1.0 opened. 2.1.0 generalized the rule to every assembled diagnostic and moved only the two manifest-derived kinds across it. The `--test` diagnostics are still appended after the checker returns, each with its own summary accounting, so a threshold-severity `unreachable_annotation` stays a warning and `check --test --strict` exits 0. Same false-green class, in the flag CI reaches for. C-07 stated one exemption, `structural_conflict`; C-10 states that `unreachable_annotation_unknown` is always a warning regardless of strictness. Feeding every late diagnostic through the shared owner would have fixed one bypass and broken that guarantee. C-07 now names a set of non-promotable kinds rather than one exemption, enumerated in the constraint so adding to it is an amendment and not a local choice, and defers to C-10's wording rather than overriding it: a scanner that could not recognize a test shape has found no defect, so promoting it would fail a build on the checker's blind spot. C-07 also states that the summary is computed once in the same place, because a count taken at an assembly site reports as a warning what the run reports as an error. AC-45 gains the two `--test` cases, one that must promote and one that must not. Major, not the minor first written: an implementation conforming to 2.1.0 promoted `unreachable_annotation_unknown`, because that version named `structural_conflict` as the sole exemption, and this version forbids promoting it. `docs/SPEC_SCHEMA_REFERENCE.md` sets MAJOR for a change that could break implementations, and widening the non-promotable set does exactly that. `spec-sync` and `spec-vscode` pin `^2.0.0` and move with it."
    - version: "2.1.0"
      date: "2026-08-28"
      author: "specter-team"
      type: minor
      description: "C-07 now says what it always meant: the strict upgrade applies to every diagnostic a run reports, whatever stage assembled it, and exactly one place applies it. `tier_conflict` and `domain_tier_conflict` are computed from the manifest and appended by the command after the checker returns, so both sat past the upgrade loop and stayed warnings under `--strict`. `check --strict` returned 0 on a workspace `spec-manifest` C-35 says it should fail, which is a false green in the command CI runs. AC-45 binds it across plain, strict and strict JSON, and is written on the two kinds that escaped rather than on the orphan diagnostics AC-07, AC-31 and AC-36 already cover, because an implementation that promotes inside the checker alone passes all three of those and still fails this one. Minor: a new criterion, and C-07's rule is unchanged in what it requires."
    - version: "2.0.0"
      date: "2026-08-27"
      author: "specter-team"
      type: major
      description: "Retract version-change classification from this spec. Remove C-04, AC-04 and AC-05, the objective summary's promise to detect breaking changes between spec versions, the matching `scope.includes` entry, and the `deep-diff` differ dependency that existed only for them. `bugs/SP-SP-018`: no production caller populates `CheckOptions.PreviousVersions`, so the branch calling `ClassifyChanges` was unreachable and `check` emitted no change diagnostic on a constraint rewritten to the opposite meaning. The three criteria nonetheless reported covered, because the only callers were tests invoking the pure function directly, which is why the record is graded P1 false confidence rather than a lower defect. Retracted rather than reworded: `spec-diff` owns version comparison and carries the constraints, the corpora and the tests for it, so a rewritten checker-owned criterion would invent a second version policy and recreate the defect under new wording. Any future previous-version feature reuses `internal/diff`. Major because constraints and criteria are removed."
    - version: "1.11.1"
      date: "2026-08-23"
      author: "specter-team"
      type: patch
      description: "Correct two records, no behavior change. C-22 said the rule fires on five of seven written-down non-conflicts while AC-44 said five of nine, using the same phrase for two different sets: seven counts the near-miss table alone, nine adds the two proximity survivors. C-22 now states nine and names what it counts. And C-05's measurement was stamped 2026-08-24, a day after the commit that took it; every amendment in this cycle carried the same wrong date and all are corrected in place, because a bump would record a fake amendment to fix a typo in a real one. Bug citations drop their lifecycle folder: a spec is permanent and `bugs/doing/` changes every time an item moves, so a pathed citation is broken by design."
    - version: "1.11.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-21/C-22 and AC-42..44, roadmap 2A2. Structural-conflict detection binds the absence expression to the required subject rather than testing co-occurrence, in two shapes, on whole-token boundaries, with a leading article stripped from the extracted subject. C-22 records that Go's RE2 has no lookaround so the implementation is a token scanner. C-22 forbids describing the rule as eliminating false positives and requires three corpora for any measurement, because the zero it reaches on this repository is a property of the corpus rather than of the rule."
    - version: "1.10.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-18/C-19/C-20 and AC-39..41, roadmap 2A4. The structural-conflict header stops attributing the upstream constraint id to the downstream spec (SP-SP-014). The dead required-keywords are removed rather than activated, because activating them widens a false-positive surface C-05 declines to bound on a check that is advisory under C-15. And detection scans every dependency edge rather than only `requires`, because a conflicts_with edge is where a contradiction check has the strongest reason to look and the one place it did not."
    - version: "1.9.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-16/C-17 and AC-37/AC-38: `check --concrete` reports criteria carrying neither inputs nor expected_output, severity by tier. Roadmap 2C2. The rule is opt-in, and C-17 records why: both fields are optional in the canonical schema, so erroring on their absence by default would fail a build on a valid spec, which is the P0 row this cycle spent itself removing. The tier gradient protects this repository, whose Tier 1 gaps were backfilled first; it does not protect an adopter upgrading."
    - version: "1.8.0"
      date: "2026-08-23"
      author: "specter-team"
      type: minor
      description: "Add C-15/AC-34..36 and amend C-03, C-05 and C-07: `structural_conflict` becomes advisory. Always info, `--strict` does not upgrade it, the upstream enforcement field does not raise it, and it never contributes to a non-zero exit. C-05 no longer promises zero false positives for it, because that promise contradicted C-03 and because no lexical rule separates a conflict from an enforcement. Roadmap 2A1, closing the build-failure half of bugs/SP-SP-004."
    - version: "1.7.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: "v0.15, exit-code parity between `check` and `check --json` (bugs/SP-SP-021). Add C-14 and AC-28 through AC-33. On a workspace with one error, `specter check` exits 1 and `specter check --json` exits 0. The diagnostics are present and correct in the document, so only the verdict is lost, and the verdict is the part an automated caller reads. A CI job that uses `--json` for structured diagnostics has a check gate that never fails, for any kind, at any severity. Three decisions are recorded here. First, the existing `exit_code_nonzero` criteria did not already cover this. Each of them names its invocation in `inputs`, and none of those invocations carries `--json`. The current binary satisfies all of them as written, so the contract was silent. This is a gap rather than a conformance failure. That reading matches how the identical case was settled for `coverage` in the v0.13 D3 audit, which added spec-coverage C-29 instead of declaring the older criteria violated. Second, the rule is scoped to `check`. Per-command parity constraints are the existing house form (spec-coverage C-29, spec-sync C-07). A constraint in this spec also cannot bind a command this spec does not describe. A format-parity rule would not catch the separate `diff` defect either, because that exit code is wrong in both formats. Third, C-14 defines the JSON exit code as the code text mode produces, so it never restates severity routing. Warning-only and info-only runs exit 0 in both formats, and a `--strict` run that upgrades warnings to errors exits 1 in both. AC-33 states what the document must hold on a non-zero exit, in terms of the diagnostics and stdout, and mandates no new field."
    - version: "1.6.0"
      date: "2026-08-16"
      author: "specter-team"
      type: minor
      description: "v0.15 phase 2C1, duplicate acceptance criterion IDs. Add C-13 and AC-21 through AC-27. A spec that declares the same AC id twice passes parse and check today, and one `@ac` annotation then credits every criterion carrying that id, so the spec reports coverage it has not earned. JSON Schema cannot express uniqueness over a property of array items, so the rule belongs in the checker. Four decisions are recorded here because a reader may expect otherwise. Severity is error at every tier, since no tier makes two criteria sharing a join key correct. One diagnostic is emitted per duplicated id rather than per occurrence, which is the opposite of the C-09 no-dedup rule for repeated `@ac` mentions and is deliberate. The check runs with no flag, so `sync` inherits it. Ids are compared as exact strings, so `AC-01` and `AC-001` stay distinct. Error at every tier means an adopter shipping a duplicate today fails `check` on upgrade, which is the intent, because the defect is silent coverage inflation."
    - version: "1.5.0"
      date: "2026-05-16"
      author: "specter-team"
      type: minor
      description: "v0.13 security audit H5 fix — test-file size cap for the annotation scanners. Add C-12 + AC-20. The v0.13 F3 work introduced `CheckUnreachableAnnotations`, which is invoked under `check --test` and reads every discovered test file via `os.ReadFile` before passing the full string to `go/parser.ParseFile` (Go), regex+state-machine (TS/JS), or regex+indentation (Python). A 4 GiB malicious test file OOMs Specter. C-12 mandates a 4 MiB cap (`MaxTestFileBytes`) checked via `os.Stat` BEFORE `os.ReadFile`. Oversized files are SKIPPED (not fatal); a stderr warning names the file. Real test files are well under 4 MiB. Mirrors the existing `parser.maxSpecBytes` (1 MiB) and `coverage.MaxResultsFileBytes` (16 MiB) defense-in-depth pattern."
    - version: "1.4.0"
      date: "2026-05-15"
      author: "specter-team"
      type: minor
      description: "v0.13 A4 — `// @reachable manual` per-file off-switch for unreachable_annotation. Add C-11/AC-19. A test file declaring the marker suppresses BOTH `unreachable_annotation` AND `unreachable_annotation_unknown` for every @ac in that file, regardless of strictness mode. Follows the existing `// @<keyword> <value>` grammar shared with `@spec` and `@ac` — no new syntax. Used when the runner shape is custom or the operator has manually verified coverage."
    - version: "1.3.0"
      date: "2026-05-15"
      author: "specter-team"
      type: minor
      description: "Add C-10 and AC-13..AC-18 — `unreachable_annotation` diagnostic for v0.13 cycle. Detects source-comment `@ac` annotations whose corresponding test produces no runner-visible `<spec-id>/<AC-NN>` token (via test title or runtime print), which would silently demote under `coverage --strict`. Language-aware reachability for Go/TS/Jest/Vitest/Python; unsupported test shapes emit `unreachable_annotation_unknown` (always warning) rather than false-positive `unreachable_annotation`. Severity routes through `settings.strictness`: zero-tolerance=error, threshold=warning, annotation=suppressed. Per-file off-switch syntax (originally A4 in v0.13.0.md) deferred to a follow-up spec change once the marker form is decided."
    - version: "1.2.0"
      date: "2026-04-25"
      author: "specter-team"
      type: minor
      description: "Add C-09 and AC-09..AC-12 — opt-in test-annotation cross-reference (`check --test` / `-t`). Three diagnostic kinds: unknown_spec_ref, unknown_ac_ref, malformed_ac_id. `sync --strict` routes the flag through so CI catches broken test annotations."
    - version: "1.1.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-07/AC-07 strict mode (warnings-as-errors) and C-08/AC-08 warn_on_draft mode"
    - version: "1.0.0"
      date: "2026-03-28"
      author: "specter-team"
      type: initial
      description: "Initial spec for the Specter type checker (structural checks only)"
