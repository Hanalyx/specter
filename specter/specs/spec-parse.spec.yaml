spec:
  id: spec-parse
  version: "1.3.0"
  status: approved
  tier: 1

  context:
    system: Specter toolchain
    feature: YAML-to-AST parser
    description: >
      The foundational tool in the Specter toolchain. Parses .spec.yaml files,
      validates them against the canonical JSON Schema, and produces typed SpecAST
      objects. Every other tool depends on spec-parse producing correct, validated output.
    dependencies:
      - "yaml (eemeli/yaml 2.x)"
      - "ajv (8.x)"
    assumptions:
      - "Input files are UTF-8 encoded YAML"
      - "The canonical JSON Schema is the source of truth for spec structure"

  objective:
    summary: >
      Parse .spec.yaml files into validated, typed SpecAST objects.
      Reject malformed specs with actionable error messages that include
      line numbers and field paths.
    scope:
      includes:
        - "YAML parsing with syntax error handling"
        - "JSON Schema validation against the canonical spec-schema.json"
        - "Typed AST construction from validated YAML"
        - "Error reporting with line numbers and JSON field paths"
        - "Batch parsing of multiple spec files"
      excludes:
        - "Dependency resolution (that is spec-resolve)"
        - "Semantic validation across specs (that is spec-check)"
        - "File discovery and glob patterns (that is the registry)"
        - "YAML generation or spec authoring"

  constraints:
    - id: C-01
      description: "MUST validate against the canonical JSON Schema (spec-schema.json)"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST report errors with the YAML line number and JSON path of the failing field"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST NOT silently ignore unknown fields (additionalProperties enforcement)"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST produce a typed SpecAST object on success, never raw YAML or untyped objects"
      type: technical
      enforcement: error

    - id: C-05
      description: "MUST handle YAML syntax errors gracefully (return structured error, not crash)"
      type: technical
      enforcement: error

    - id: C-06
      description: "SHOULD support YAML anchors and aliases (&anchor / *alias)"
      type: technical
      enforcement: warning

    - id: C-07
      description: "MUST collect all validation errors before returning (not fail-fast on first error)"
      type: technical
      enforcement: error

    - id: C-08
      description: "MUST NOT depend on any CLI framework or I/O — pure function from string/buffer to SpecAST|ParseError[]"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST produce human-readable error messages that name the invalid field and describe the fix, not raw JSON Schema paths or validator internals"
      type: technical
      enforcement: error

    - id: C-10
      description: "MUST validate, at parse time, that every entry in `acceptance_criteria[].references_constraints[]` names a constraint id declared in the same spec's `constraints[]` block. Dangling references (e.g., `references_constraints: [\"C-99\"]` when no `C-99` constraint exists) MUST produce a `dangling_reference` ParseError naming the AC id and the offending constraint id. Rationale: a spec whose AC claims to reference a constraint that doesn't exist is internally inconsistent; catching this at parse time prevents the contradiction from reaching the coverage pipeline. JSON Schema cannot express the cross-reference (it sees `references_constraints` as a string array, not as ids that must match siblings), so the parser enforces it after schema validation succeeds."
      type: technical
      enforcement: error

    - id: C-11
      description: "`specter parse --json` MUST exit with the same process exit code that `specter parse` produces for the same files. The exit code is a function of the parse result and not of how it is rendered: non-zero when any file failed to parse or could not be read, and 0 otherwise. The JSON document for each file MUST be written to stdout in full before the exit-code decision runs, so one invocation gives a caller both the diagnostics and a usable verdict. This is the `parse` instance of the parity rule `spec-coverage` C-29 states for `coverage` and `spec-check` C-15 states for `check`. Rationale, per `bugs/SP-SP-022`: the JSON branch encoded its document and continued the loop without recording the failure, so the accumulator the exit code reads was never set. The document was correct and only the code was wrong, which is the worst shape this defect takes, because a caller inspecting the output sees the errors and a caller reading the code sees success. `parse` is the validation entry point, so a CI job collecting structured errors from it passed on a workspace that does not parse, and every later phase then ran against a workspace the gate had declared good. The same fix landed in `coverage` in v0.13 and in `check` as `bugs/done/SP-SP-021`, and was not swept here either time."
      type: business
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: "Valid spec file is parsed into a SpecAST with all required fields populated"
      inputs:
        file: "fixtures/valid/simple.spec.yaml"
      expected_output:
        type: "SpecAST"
        fields_present: ["id", "version", "status", "tier", "context", "objective", "constraints", "acceptance_criteria"]
      references_constraints: ["C-01", "C-04", "C-08"]
      priority: critical

    - id: AC-02
      description: "Spec missing required field 'id' returns ParseError with field path 'spec.id'"
      inputs:
        file: "fixtures/invalid/missing-id.spec.yaml"
      expected_output:
        type: "ParseError"
        error_path: "spec.id"
        error_type: "required"
      references_constraints: ["C-01", "C-02"]
      priority: critical

    - id: AC-03
      description: "Spec with unknown field returns ParseError identifying the extra field"
      inputs:
        file: "fixtures/invalid/extra-field.spec.yaml"
      expected_output:
        type: "ParseError"
        error_type: "additionalProperties"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-04
      description: "Malformed YAML (bad indentation) returns ParseError with line number"
      inputs:
        file: "fixtures/invalid/bad-yaml.spec.yaml"
      expected_output:
        type: "ParseError"
        has_line_number: true
      references_constraints: ["C-02", "C-05"]
      priority: critical

    - id: AC-05
      description: "Spec with invalid version format (e.g., 'v1.0' instead of '1.0.0') returns error"
      inputs:
        file: "fixtures/invalid/bad-version.spec.yaml"
      expected_output:
        type: "ParseError"
        error_path: "spec.version"
        error_type: "pattern"
      references_constraints: ["C-01"]
      priority: high

    - id: AC-06
      description: "Spec with all optional fields omitted parses successfully"
      inputs:
        file: "fixtures/valid/minimal.spec.yaml"
      expected_output:
        type: "SpecAST"
        optional_fields_absent: ["depends_on", "environment", "tags", "changelog", "generated_from"]
      references_constraints: ["C-01", "C-04"]
      priority: high

    - id: AC-07
      description: "Spec using YAML anchors and aliases is parsed with anchors resolved"
      inputs:
        file: "fixtures/valid/with-anchors.spec.yaml"
      expected_output:
        type: "SpecAST"
        anchors_resolved: true
      references_constraints: ["C-06"]
      priority: medium

    - id: AC-08
      description: "Spec with multiple errors returns all errors, not just the first"
      inputs:
        file: "fixtures/invalid/multiple-errors.spec.yaml"
      expected_output:
        type: "ParseError[]"
        min_error_count: 2
      references_constraints: ["C-02", "C-07"]
      priority: high

    - id: AC-09
      description: "Invalid constraint ID format (e.g., 'c1' instead of 'C-01') returns error"
      inputs:
        file: "fixtures/invalid/bad-constraint-id.spec.yaml"
      expected_output:
        type: "ParseError"
        error_path: "spec.constraints[0].id"
        error_type: "pattern"
      references_constraints: ["C-01"]
      priority: medium

    - id: AC-10
      description: "Invalid AC ID format (e.g., 'ac1' instead of 'AC-01') returns error"
      inputs:
        file: "fixtures/invalid/bad-ac-id.spec.yaml"
      expected_output:
        type: "ParseError"
        error_path: "spec.acceptance_criteria[0].id"
        error_type: "pattern"
      references_constraints: ["C-01"]
      priority: medium

    - id: AC-11
      description: "Invalid constraint ID 'c1' returns a message mentioning the C-NN pattern, not a raw JSON Schema path"
      inputs:
        file: "fixtures/invalid/bad-constraint-id.spec.yaml"
      expected_output:
        message_contains: "C-NN"
      references_constraints: ["C-09"]
      priority: high

    - id: AC-12
      description: "Missing required field 'id' returns a message explaining what to add, not 'missing property'"
      inputs:
        file: "fixtures/invalid/missing-id.spec.yaml"
      expected_output:
        message_contains: "kebab-case"
      references_constraints: ["C-09"]
      priority: high

    - id: AC-13
      description: "Unknown field returns a message naming the field and suggesting it be removed"
      inputs:
        file: "fixtures/invalid/extra-field.spec.yaml"
      expected_output:
        message_does_not_contain: "additionalProperties"
      references_constraints: ["C-09"]
      priority: high

    - id: AC-14
      description: "Spec with an unknown field inside the `context:` block (e.g., `context.platform: foo`) returns a ParseError. additionalProperties enforcement extends beyond the top-level spec object into every nested mapping the schema declares. Regression guard for the v0.7.0 tightening that closed a hole where unknown sub-fields silently parsed."
      inputs:
        yaml: "valid spec with `context.platform: not-a-field` added"
      expected_output:
        parse_errors_count: ">= 1"
        path_contains: "context"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-15
      description: "Spec whose AC declares the metadata fields `notes`, `approval_gate`, and `approval_date` parses successfully (the fields are preserved on the resulting SpecAST). When `approval_date` carries a non-ISO-8601 value (e.g., `\"yesterday\"`), the parse MUST return a ParseError naming the AC id and the field; the schema's `format: date` keyword backs the validation."
      inputs:
        case_valid: "AC with notes='x', approval_gate: true, approval_date: '2026-01-15'"
        case_invalid: "AC with approval_date: 'yesterday'"
      expected_output:
        valid_parses: true
        invalid_parse_errors_count: ">= 1"
      references_constraints: ["C-01"]
      priority: high

    - id: AC-16
      description: "Spec with an AC that declares `references_constraints: [\"C-99\"]` while no `C-99` constraint exists in the same spec's `constraints[]` block MUST return a `dangling_reference` ParseError naming both the AC id and the offending constraint id. JSON Schema cannot express the cross-reference; the parser runs `validateReferencedConstraints` after schema validation succeeds. Valid references (every `C-NN` in `references_constraints` matches a declared constraint) MUST pass."
      inputs:
        yaml: "spec with constraints C-01..C-03 and an AC referencing C-99"
      expected_output:
        parse_errors_count: ">= 1"
        error_type: "dangling_reference"
        message_contains: "C-99"
      references_constraints: ["C-10"]
      priority: critical

    - id: AC-17
      description: "Spec MAY declare an optional `title:` string at the top level (sibling of `id`, `version`, `status`). When present, it parses and is preserved on the SpecAST; when absent, the parse succeeds without error. Title is a free-form human-readable name, distinct from the kebab-case `id`. Schema enforces `title` is a string when present; no constraint on length or pattern beyond that."
      inputs:
        case_with: "spec with `title: \"My Custom Title\"`"
        case_without: "spec with no `title` field"
      expected_output:
        with_title_value: "My Custom Title"
        without_title_parse_ok: true
      references_constraints: ["C-01"]
      priority: medium

    - id: AC-18
      description: "The SpecAST `ValidateEnums()` helper validates enum-typed fields (status / tier-shape / constraint.type / constraint.enforcement / AC.priority) at the Go layer in addition to JSON Schema's enum keyword. A valid spec passes `ValidateEnums()` with nil error; a spec whose `status` is outside `{draft, approved, deprecated}` (etc.) returns an error naming the field. Rationale: defense in depth — schema validation runs at parse, enum re-validation runs at every code path that constructs a SpecAST so internal mutations (e.g., reverse compiler synthesis) can't produce schema-invalid output that bypasses the parser."
      inputs:
        case_valid: "valid SpecAST → ValidateEnums returns nil"
        case_invalid_status: "SpecAST with status=`banana` → returns error mentioning `status`"
      expected_output:
        valid_returns_nil: true
        invalid_returns_error_containing: "status"
      references_constraints: ["C-01"]
      priority: high

    - id: AC-19
      description: "Exit-code parity between `parse` and `parse --json`. A workspace holding one spec that is missing `status` and `tier` and carries an unknown field exits 1 under `specter parse` and 1 under `specter parse --json`. The JSON run MUST still write its document to stdout, reporting `ok: false` and the same errors the text run wrote to stderr, so the change is to the verdict and not to the output. A workspace whose specs all parse exits 0 in both modes, so the parity is not satisfied by failing everything. Measured before the fix on `release/v0.15.0`: text exited 1, JSON exited 0, and the JSON document already carried `ok: false` with both errors."
      inputs:
        invalid_workspace: "one spec missing status and tier and carrying an unknown field"
        valid_workspace: "one spec that parses cleanly"
      expected_output:
        invalid_text_exit_code: 1
        invalid_json_exit_code: 1
        invalid_json_document_reports_not_ok: true
        valid_exit_code_in_both_modes: 0
      references_constraints: ["C-11"]
      priority: critical

  changelog:
    - version: "1.3.0"
      date: "2026-08-25"
      author: "specter-team"
      type: minor
      description: "C-11 and AC-19 state exit-code parity between `parse` and `parse --json`, per `bugs/SP-SP-022`. The rule already existed for `coverage` as C-29 and for `check` as C-15, and `parse` is the third instance of one defect: the JSON branch renders the document and returns without carrying the verdict. AC-19 also pins the clean workspace at 0 in both modes, so parity cannot be satisfied by failing everything."
    - version: "1.2.0"
      date: "2026-05-16"
      author: "specter-team"
      type: minor
      description: "v0.13 pre-release follow-up — lift v0.7.0 parse behaviors into the spec. Add C-10 (dangling references_constraints rejected at parse time, error type `dangling_reference`; the check runs after JSON Schema validation because the schema can't express the cross-reference). Add AC-14..AC-18 documenting parse behaviors that were tested in `parse_test.go` and `validate_test.go` since v0.7.0 but never lifted to the spec: AC-14 (additionalProperties enforcement in nested `context:` block), AC-15 (AC metadata fields + approval_date format), AC-16 (dangling references_constraints check, refs C-10), AC-17 (optional `title:` at spec root), AC-18 (Go-side `ValidateEnums()` helper as defense-in-depth alongside schema validation). Surfaced by v0.13 pre-release `check --test` runs which flagged the source-comment `@ac AC-14..AC-18` references as `unknown_ac_ref` — the tests were referencing real, implemented behavior; the spec was just behind."
    - version: "1.1.0"
      date: "2026-04-14"
      author: "specter-team"
      type: minor
      description: "Add C-09/AC-11-13: human-readable parse error messages"
    - version: "1.0.0"
      date: "2026-03-28"
      author: "specter-team"
      type: initial
      description: "Initial spec for the Specter YAML parser"
