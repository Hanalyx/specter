    - id: AC-51
      description: "The commands that already reject a bad manifest keep rejecting it, and the rejection is the only thing that can make them fail. This criterion runs on its own workspace, not the AC-47 one: the same manifest, but every declared criterion is annotated, so a run that merely ignored the manifest and continued against defaults exits 0. On that workspace `specter check`, `specter coverage --strictness annotation`, `specter sync --strictness annotation`, and `specter init --refresh` each exit non-zero with the parser's reason on stderr, and `init --refresh` leaves `specter.yaml` byte-unchanged. Turning any of these into a warn-and-continue path fails this criterion. The exit code is the discriminator, because the warning line a warn-and-continue path prints names `settings.test_glob` itself and satisfies the stderr check by another route. The AC-47 workspace cannot serve here: it declares two specs and no annotated tests, so under warn-and-continue `coverage` and `sync` still exit non-zero at 0 percent coverage, and both commands pass the criterion while doing the thing it forbids (`bugs/SP-SP-041`). AC-47 through AC-50 keep that workspace, which their own claims rest on."
      inputs:
        manifest: "schema_version: 1, system.name: demo, settings.specs_dir: customSpecs, settings.test_glob: 'tests/**/*.go' (the same rejected manifest AC-47 uses)"
        workspace: "customSpecs/demo.spec.yaml (spec id demo-spec, tier 3, AC-01 and AC-02) and specs/decoy.spec.yaml (spec id decoy-spec, tier 3, AC-01 and AC-02), plus tests/all_test.go annotating all four criteria"
        precondition: "with specter.yaml removed, `specter check`, `specter coverage --strictness annotation` and `specter sync --strictness annotation` each exit 0 on this workspace, because the default walk finds both specs and every criterion is annotated. `init --refresh` is the one command whose exit code is not the discriminator, since it reports a missing manifest as its own error; the byte-unchanged clause is what forbids it from refreshing against defaults."
        commands: ["specter check", "specter coverage --strictness annotation", "specter sync --strictness annotation", "specter init --refresh"]
      expected_output:
        each_exit_code: "non-zero"
        each_stderr_contains: "settings.test_glob"
        manifest_byte_unchanged_after_init_refresh: true
        precondition_exit_code_without_manifest: "0 for check, coverage and sync; init --refresh reports the missing manifest as its own error"
      references_constraints: ["C-31"]
      priority: high

    - id: AC-52
      description: "ParseManifest on `settings.annotation.permissive: true` returns a Manifest whose `Settings.Annotation` is non-nil with `Permissive == true`. On `settings.annotation.permissive: false` it returns non-nil with `Permissive == false`. On a manifest carrying no `annotation` key at all it returns `Settings.Annotation == nil`. The two empty forms, `annotation: {}` and a bare `annotation:` with no sub-keys, both return non-nil with `Permissive == false`, so a declared block is distinguishable from an absent one no matter how the operator wrote it. The bare form is the discriminating case: gopkg.in/yaml.v3 leaves the pointer nil there, so an implementation that reads declaredness from the decoded pointer alone fails this criterion while passing every other case."
      inputs:
        case_true: "settings.annotation.permissive: true"
        case_false: "settings.annotation.permissive: false"
        case_empty_map: "settings.annotation: {}"
        case_bare_key: "settings.annotation: (no sub-keys, null value)"
        case_absent: "settings with no annotation key"
      expected_output:
        true_annotation_non_nil: true
        true_permissive: true
        false_annotation_non_nil: true
        false_permissive: false
        empty_map_non_nil_permissive_false: true
        bare_key_non_nil_permissive_false: true
        absent_annotation_is_nil: true
      references_constraints: ["C-32"]
      priority: critical

    - id: AC-53
      description: "An unknown sub-key under `settings.annotation` is rejected with the C-26 error shape. `settings.annotation.permisive: true` (one s) returns an error naming `permisive`, suggesting `permissive`, and listing the valid sub-keys at that level. `settings.annotation.bogus: 1` returns an error naming `bogus` and listing the valid sub-keys. Both return a nil Manifest. This is the generic shape that AC-55 requires `scope` NOT to receive, so the two criteria together separate the special case from the general one."
      inputs:
        case_typo: "settings:\n  annotation:\n    permisive: true"
        case_unrelated: "settings:\n  annotation:\n    bogus: 1"
      expected_output:
        typo_error_contains: "permisive"
        typo_error_did_you_mean: "permissive"
        unrelated_error_contains: "bogus"
        both_list_valid_subkeys: true
        both_return_nil_manifest: true
      references_constraints: ["C-32"]
      priority: high

    - id: AC-54
      description: "No command registers an `--annotation` flag. `specter check --annotation`, `specter coverage --annotation`, and `specter sync --annotation` each exit non-zero with an unknown-flag error from the CLI framework, and so does the value form `--annotation=true` on each. The assertion runs the three commands and reads their exit codes and stderr; it is not a source scan. Registering the flag later, in either the boolean or the string form, fails this criterion, which is the point: SSRB-104 section 7.3 makes flag-and-manifest divergence unreachable by having no flag."
      inputs:
        commands: ["specter check --annotation", "specter coverage --annotation", "specter sync --annotation"]
        value_form: "--annotation=true on each of the three"
      expected_output:
        each_exit_code: "non-zero"
        each_stderr_contains: "unknown flag"
      references_constraints: ["C-32"]
      priority: high

    - id: AC-55
      description: "ParseManifest rejects `settings.annotation.scope: test` and `settings.annotation.scope: all`, each with an error and a nil Manifest. Both values produce the same message, and that message contains `settings.annotation.scope`, `SSRB-104`, `not implemented in v0.15.0`, `test-only`, and `remove the key`. An implementation that routes `scope` through the generic unknown-key path of C-26 fails this criterion, because the AC-53 message contains none of those five substrings."
      inputs:
        case_test: "settings:\n  annotation:\n    scope: test"
        case_all: "settings:\n  annotation:\n    scope: all"
      expected_output:
        both_return_error_and_nil_manifest: true
        both_messages_identical: true
        message_contains: ["settings.annotation.scope", "SSRB-104", "not implemented in v0.15.0", "test-only", "remove the key"]
      references_constraints: ["C-33"]
      priority: critical

    - id: AC-56
      description: "The conflict detector keys on declaredness, not on value. `CheckAnnotationStrictnessConflict` returns a warning for a manifest declaring both `settings.strictness: threshold` and `settings.annotation.permissive: false`. It returns nil for a manifest declaring the annotation block and no `strictness` key, and nil for a manifest declaring `settings.strictness: threshold` and no annotation block. The three manifests are one variable apart each. `threshold` is the chosen value on purpose: C-24 applies it as the default when the key is absent, so an implementation reading the parsed string rather than the raw key set returns a warning for the block-only manifest and fails here. The returned warning names `settings.strictness`, the declared value, and `settings.annotation`."
      inputs:
        case_both: "settings.strictness: threshold + settings.annotation.permissive: false"
        case_block_only: "settings.annotation.permissive: false"
        case_strictness_only: "settings.strictness: threshold"
      expected_output:
        both_returns_warning: true
        block_only_returns_nil: true
        strictness_only_returns_nil: true
        warning_names: ["settings.strictness", "threshold", "settings.annotation"]
      references_constraints: ["C-34"]
      priority: critical

    - id: AC-57
      description: "The warning reaches the operator, and it changes no exit code. On a workspace whose manifest declares both `settings.strictness: annotation` and `settings.annotation.permissive: true`, `specter check`, `specter coverage`, and `specter sync` each write a stderr line containing `settings.strictness`, the declared value `annotation`, and `settings.annotation`. Each command is then run on the same workspace with only the `settings.strictness` line removed: no such stderr line appears, and the exit code matches the run that produced the warning, command by command. The second half is what pins the exit code to the ignored key rather than to the warning, and it also fails an implementation that prints the warning and then still applies the ladder. Each `sync` run is given a freshly written manifest. That is defensive rather than required: C-06 says `sync` auto-updates the registry section, but no command performs that update (`bugs/SP-SP-054`), and a passing `sync` leaves `specter.yaml` byte-identical. Rewriting keeps the criterion true of its named input if C-06 is ever implemented."
      inputs:
        workspace: "one spec, one criterion, one annotated test file"
        manifest_with_conflict: "settings.strictness: annotation + settings.annotation.permissive: true"
        manifest_block_only: "settings.annotation.permissive: true"
        commands: ["specter check", "specter coverage", "specter sync"]
      expected_output:
        conflict_run_stderr_contains: ["settings.strictness", "annotation", "settings.annotation"]
        block_only_run_stderr_has_no_conflict_line: true
        exit_codes_match_per_command: true
      references_constraints: ["C-34"]
      priority: critical

    - id: AC-58
      description: "While the annotation block is declared, the run does not vary with the `settings.strictness` value. Workspace: one spec with one acceptance criterion, one test file annotating it, and no `.specter-results.json`. Precondition, with no annotation block in the manifest, `specter coverage` exits 0 under `settings.strictness: annotation` and exits non-zero under `settings.strictness: threshold` with a message naming the results file, so the two values demonstrably diverge on this workspace. Assertion, with `settings.annotation.permissive: true` added and held byte-identical across the runs, `specter coverage` produces the same exit code and byte-identical stdout under `settings.strictness: annotation`, `threshold`, and `zero-tolerance`. Stdout is the comparison and stderr is not, because the C-34 warning names the declared value and therefore differs across the three runs by design. This criterion does not say what the common result is; the coverage rule in roadmap item 1D-b sets that."
      inputs:
        workspace: "one spec, one criterion, one annotated test file, no .specter-results.json"
        precondition_runs: "no annotation block; settings.strictness: annotation, then threshold"
        assertion_runs: "settings.annotation.permissive: true held constant; settings.strictness: annotation, then threshold, then zero-tolerance"
      expected_output:
        precondition_annotation_exit_code: 0
        precondition_threshold_exit_code: "non-zero, message names .specter-results.json"
        assertion_exit_codes_identical_across_three: true
        assertion_stdout_byte_identical_across_three: true
      references_constraints: ["C-34"]
      priority: critical

    - id: AC-59
      description: "The conflict rule reads manifest keys only. On a workspace whose manifest declares `settings.annotation.permissive: true` and no `settings.strictness` key, `specter coverage --strictness threshold` writes no conflict warning to stderr. An implementation that computes the conflict from the effective strictness, after the flag has been merged with the manifest value, emits one here and fails. The criterion claims nothing about what the flag does to the run, only that it cannot trigger the warning: SSRB-104 section 1 preserves the flag's behavior until v1.0.0."
      inputs:
        manifest: "settings.annotation.permissive: true, no settings.strictness key"
        command: "specter coverage --strictness threshold"
      expected_output:
        stderr_has_no_conflict_warning: true
      references_constraints: ["C-34"]
      priority: high

    - id: AC-60
      description: "The tier_conflict warning states that the declared tier governs and does not claim the override is applied. On a workspace whose spec declares `tier: 3` and whose manifest sets `tier_overrides: {lo: 1}`, `specter check` writes a tier_conflict warning naming both values, and that message does NOT contain the substring `using override`. It states that the declared tier governs. The negative half is the point: the prior message ended `using override (1)` while `coverage --json` reported `\"tier\": 3` for the same spec on the same run, so the two surfaces contradicted each other and only one of them was true."
      inputs:
        spec: "declares tier: 3"
        manifest: "settings.tier_overrides: {lo: 1}"
        command: "specter check"
      expected_output:
        warning_names_declared_tier: 3
        warning_names_override_tier: 1
        message_contains_using_override: false
        message_states_declared_tier_governs: true
        coverage_json_tier_unchanged: 3
      references_constraints: ["C-14"]
      priority: high

  depends_on:
    - spec_id: spec-parse
      version_range: "^1.0.0"
      relationship: requires
    - spec_id: spec-sync
      version_range: "^1.0.0"
