spec:
  id: spec-manifest
  version: "1.15.0"
  status: draft
  tier: 2

  context:
    system: Specter toolchain
    feature: Project manifest, spec registry, and domain grouping
    description: >
      Adds a project-level manifest (specter.yaml) that defines the system,
      groups specs into domains with tier inheritance, maintains an auto-updated
      spec registry, and provides configurable coverage thresholds. This is the
      missing layer that connects individual specs into a coherent system —
      analogous to tsconfig.json for TypeScript or go.mod for Go.
    dependencies:
      - "gopkg.in/yaml.v3 (YAML parsing)"
    related_specs:
      - "spec-parse"
      - "spec-sync"
    assumptions:
      - "specter.yaml is discovered by walking up from CWD"
      - "All commands work without a specter.yaml (backward compatible)"
      - "The registry section is auto-maintained, not manually edited"
      - "Domain info lives in the manifest, not in individual spec files"

  objective:
    summary: >
      Parse and validate specter.yaml project manifests. Provide tier
      inheritance (spec -> domain -> system -> default), domain-level coverage
      aggregation, auto-maintained spec registry, and a scaffold command for
      first-run experience.
    scope:
      includes:
        - "Parse specter.yaml into typed Manifest structure"
        - "Validate manifest fields (system.name required, tiers 1-3, etc.)"
        - "Discover specter.yaml by walking up from CWD"
        - "Resolve spec tiers via cascade: spec -> domain -> system -> default(2)"
        - "Group specs by domain for coverage reporting"
        - "Auto-update registry from parsed specs on every sync run"
        - "Scaffold specter.yaml from existing specs via specter init"
        - "Configurable coverage thresholds per tier"
        - "Backward compatibility — all commands work without manifest"
      excludes:
        - "Changes to spec-schema.json"
        - "Interactive specter init (flags only)"
        - "Nested domains or domain hierarchies"
        - "Remote registry or spec publishing"
        - "Domain-level dependency rules"

  constraints:
    - id: C-01
      description: "MUST parse valid specter.yaml into a typed Manifest structure with system, domains, settings, and registry sections"
      type: technical
      enforcement: error

    - id: C-02
      description: "MUST require system.name field — return validation error if missing"
      type: technical
      enforcement: error

    - id: C-03
      description: "MUST validate tier values as 1, 2, or 3 in system.tier and domain tiers"
      type: technical
      enforcement: error

    - id: C-04
      description: "MUST resolve spec tiers via cascade: explicit spec tier -> domain tier -> system tier -> default 2"
      type: business
      enforcement: error

    - id: C-05
      description: "MUST return sensible defaults when no specter.yaml exists (specs_dir=specs, coverage T1=100 T2=80 T3=50)"
      type: technical
      enforcement: error

    - id: C-06
      description: "MUST auto-update the registry section from the current set of parsed specs"
      type: business
      enforcement: error

    - id: C-07
      description: "MUST aggregate spec-level coverage into domain-level summaries"
      type: business
      enforcement: error

    - id: C-08
      description: "MUST generate a valid specter.yaml scaffold from existing spec IDs"
      type: technical
      enforcement: error

    - id: C-09
      description: "MUST NOT break existing commands when no specter.yaml is present"
      type: technical
      enforcement: error

    - id: C-10
      description: "MUST NOT depend on any CLI framework — pure functions from YAML string to typed structures"
      type: technical
      enforcement: error

    - id: C-11
      description: "MUST parse settings.strict (bool): when true, all warning-severity check diagnostics are treated as errors"
      type: technical
      enforcement: error

    - id: C-12
      description: "MUST parse settings.warn_on_draft (bool): when true, specter check emits a warning for every spec with status: draft"
      type: technical
      enforcement: error

    - id: C-13
      description: "MUST provide spec file templates (api-endpoint, service, auth, data-model) via specter init --template that produce valid draft .spec.yaml files passing ParseSpec()"
      type: technical
      enforcement: error

    - id: C-14
      description: "MUST parse settings.tier_overrides (map[spec-id]int) and emit a tier_conflict warning when a spec's declared tier disagrees with its override value. The override is NOT applied: the tier declared in the spec governs every downstream decision, and no command consults the override value. The warning MUST therefore state that the declared tier governs, and MUST NOT assert that the override is in use. Rationale, per docs/ssrb/SSRB-106.md section 7.3: the setting is deprecated and removed at v1.0.0, but the message is corrected now and independently, because a program that misdescribes itself defeats the reviewer who checks the program. The prior wording ended `using override (N)`, which is false on every run, and it was the only evidence behind a near-miss documentation fix that would have asserted the override wins."
      type: technical
      enforcement: error

    - id: C-15
      description: "ScaffoldManifest MUST emit a comment pointing at the canonical Specter GitHub repository. The URL MUST be https://github.com/Hanalyx/specter (not spec-dd, not another slug). The URL lives in the scaffold header and is the only external link shipped in fresh manifests — users clicking it must land on the right repo."
      type: business
      enforcement: error

    - id: C-16
      description: "ScaffoldManifest MUST always emit a `domains:` section. When the caller provides at least one spec ID, a default domain carries those IDs. When the caller provides zero spec IDs, the scaffolder MUST emit an empty default-domain placeholder with a description explaining the shape — either `Add spec IDs here` (greenfield) or `N spec files were discovered but could not be parsed` (drift). Rationale: a manifest with no `domains:` silently excludes every subsequent spec from sync, so the operator's first `specter sync` looks green while ignoring their work."
      type: business
      enforcement: error

    - id: C-17
      description: "`specter init --refresh` MUST update only `domains.default.specs` in an existing `specter.yaml`, leaving every other manifest field untouched: `system`, `settings`, `registry`, `settings.tier_overrides`, and any custom domains the operator declared (anything under `domains.*` that isn't `default`). Rationale: after adding new specs, the operator needs a deterministic, non-destructive way to refresh the manifest; `--force` rewrites everything, losing manual configuration."
      type: business
      enforcement: error

    - id: C-18
      description: "`specter init --refresh` MUST rescan `settings.specs_dir` (or the default `specs/`) for parseable spec files, collect their IDs, and replace `domains.default.specs` with the resulting set. Specs that previously appeared in `domains.default.specs` but no longer exist on disk (or fail to parse) MUST be removed from the list. The command MUST print a summary line of the form `updated specter.yaml: +A added, -B removed` where A and B are counts. Parse-failing specs are skipped with the v0.9.0 pattern-analysis warning."
      type: technical
      enforcement: error

    - id: C-19
      description: "`specter init --refresh` MUST NOT touch custom domains. If `domains.auth.specs` contains spec IDs, --refresh leaves the `auth` domain entirely alone. Specs that are discovered on disk but already claimed by a non-default domain MUST NOT be added to `domains.default.specs`. Rationale: a spec can only belong to one domain; refresh is about the 'catch-all' default domain, not about redistribution."
      type: business
      enforcement: error

    - id: C-20
      description: "`specter init --refresh --dry-run` MUST print the proposed diff (which specs would be added, which removed from `domains.default.specs`) to stdout and exit 0 WITHOUT writing any file changes to disk. The manifest on disk is unchanged after the command exits. Rationale: lets operators review before committing; matches `git add -p` / `terraform plan` discipline."
      type: business
      enforcement: error

    - id: C-21
      description: "`--refresh` and `--force` MUST be mutually exclusive. `specter init --refresh --force` MUST exit non-zero with a clear error message naming the conflict. Rationale: `--force` rewrites everything (operator accepts loss); `--refresh` preserves everything except `domains.default.specs` (operator wants a surgical update). Combining them is incoherent and almost always a mistake."
      type: technical
      enforcement: error

    - id: C-22
      description: "`specter init --install-hook` MUST write a `.git/hooks/pre-push` shell script (mode 0755) that blocks pushes whose diff changes implementation files but adds or updates no `@spec` / `@ac` annotations. The hook MUST exit 0 on changes that include either an annotation delta or only doc/spec/test files; MUST exit non-zero with a clear message otherwise; and MUST be bypassable via `git push --no-verify`. The hook script body is wrapped in shell-comment markers `# specter:begin v1` / `# specter:end` (HTML-comment markers would be invalid shell syntax — `<!--` parses as a redirection token), and re-runs replace only the fenced region. The installed hook MUST parse cleanly under `sh -n`."
      type: technical
      enforcement: error

    - id: C-23
      description: "`specter init --ai <tool>` MUST write a per-tool AI instruction file with a `<!-- specter:begin v1 --> ... <!-- specter:end -->` fenced region containing the v0.11 instruction template (preflight, Convention A, validation gate, on-demand explain references). The fenced region's tool-target path is: `claude` → `CLAUDE.md`, `codex` → `AGENTS.md`, `cursor` → `.cursor/rules/specter.md`, `copilot` → `.github/copilot-instructions.md` (body capped at 4KB), `gemini` → `GEMINI.md`. Re-runs MUST replace only the fenced region; out-of-fence content is preserved byte-for-byte. `--ai claude` checks for an existing `AGENTS.md` and writes `@AGENTS.md` import directive instead of inlining the body when one exists."
      type: technical
      enforcement: error

    - id: C-24
      description: "MUST parse `settings.strictness` (string enum: `annotation` | `threshold` | `zero-tolerance`) with default `threshold`. The level governs `coverage --strict` semantics in spec-coverage; spec-manifest's role is parse-only — accept the three values, default when unset, reject any other string with a clear error naming the valid options."
      type: technical
      enforcement: error

    - id: C-25
      description: "MUST parse `settings.tests_glob` as either a string (single glob) or a list of strings (multiple globs) into a normalized `[]string`. Used by `coverage` and `sync` as the default test-discovery pattern when `--tests` is unset. Closes the silent-0% UX hole where users running `coverage --strict` on a Python/Node project with no `--tests` flag see all ACs reported as uncovered because `filepath.Walk(\".\")` misses their `tests/**/*.py` layout."
      type: technical
      enforcement: error

    - id: C-26
      description: "ParseManifest MUST reject any unknown key under the `settings:` block (and at the top level of the manifest) with a clear error naming the offending key, the closest valid key by Levenshtein distance ≤ 3 (`did you mean: <key>?`), and the full list of valid keys at that level. Rationale: today `settings.tests_glob:` (a plausible-but-misspelled-or-not-yet-existing key) parses cleanly and is silently ignored, leading users to believe their manifest is configured when in fact the key did nothing. The same silent-acceptance footgun threatens any new settings key (e.g., the v0.11 `strictness` field) — making the rejection a parse-level invariant closes the class."
      type: technical
      enforcement: error

    - id: C-27
      description: "The Manifest struct MUST accept an optional top-level integer field `schema_version`. ParseManifest accepts YAML with or without the field; absence defaults to 1. Rationale: records the spec-schema draft this project commits to. Lives at the project level (one per repository) rather than on every spec — specs stay content-focused. During v0.x the value is a placeholder (always 1; the schema is draft pre-1.0). Locks to the canonical v1 shape at Specter v1.0.0, after which breaking schema changes bump the integer and require a doctor --fix migration path. The key MUST be added to the validTopLevelKeys list so v0.11's unknown-key rejection (C-26) accepts it."
      type: technical
      enforcement: error

    - id: C-28
      description: "`specter init` (scaffold mode, no `--refresh`) MUST write `schema_version: 1` as the first field in the emitted specter.yaml — ahead of `system:`. `specter init --refresh` MUST leave any existing `schema_version` value byte-unchanged (per C-19 non-destructive refresh, only `domains.default.specs` is touched). Rationale: makes the project's schema commitment visible at the top of the file where operators read first, and aligns with the schema-stability policy that activates the moment `doctor --fix` ships."
      type: business
      enforcement: error

    - id: C-29
      description: "`settings.exclude` patterns MUST support glob matching when the pattern contains any glob metacharacter (`*`, `?`). Glob patterns match against the relative path of each candidate directory using the same `**`/`*`/`?` semantics as `settings.tests_glob` (cmd/specter/glob.go matchGlob). Patterns WITHOUT glob metacharacters continue to match by directory name exactly (back-compat with v0.x). Examples: `node_modules` matches any dir named `node_modules` at any depth (back-compat); `.claude/**` matches `.claude/` and everything under it; `**/worktrees` matches any `worktrees` dir at any depth; `tests/fixtures/*` matches direct children of `tests/fixtures/`. Walk implementation MUST exit a matched directory (filepath.SkipDir) the same way as a bare-name match — both forms behave identically in terms of stopping recursion when the matched node is a directory."
      type: technical
      enforcement: error

    - id: C-30
      description: "`settings.specs_dir` MUST be a workspace-relative path that cannot escape the manifest's directory. ParseManifest MUST reject any of the following with a clear error naming the offending field and the offending value: (a) absolute paths (`filepath.IsAbs(s) == true`), including Windows drive-prefixed and UNC paths; (b) paths containing any `..` segment when split on the OS path separator (forward slash on Unix, backslash or forward slash on Windows); (c) values resolving to outside the manifest's containing directory after lexical cleaning. The empty value is treated as the default (`specs`) and is allowed. The check happens at parse time so every downstream consumer — `discoverSpecs`, `doctor --fix`, `coverage`, `sync` — inherits the guarantee without per-call validation. Rationale: v0.13 security audit H1 surfaced that `discoverSpecs` set `root = m.SpecsDir()` and called `filepath.Walk(root, ...)` with no boundary check; `doctor --fix` then wrote back to absolute paths returned by Walk. A malicious workspace dropping `specter.yaml` with `settings.specs_dir: /home/victim/private` could trigger arbitrary-file overwrite when the operator ran `doctor --fix`. Closing this at parse time is the smallest, most general fix."
      type: business
      enforcement: error

    - id: C-31
      description: "A command that loads `specter.yaml` MUST surface a rejection rather than discard it. When the manifest file exists and ParseManifest returns an error, the command writes two lines to stderr, the first naming the manifest path and the parser's reason, the second stating that the manifest was ignored and default settings are in effect, and then continues with defaults. This binds `parse`, `resolve`, and `explain`, which discard the error today and run against defaults with no signal. It does not bind the commands that already fail on a rejected manifest, `check`, `coverage`, `sync`, and `init --refresh`, which keep their current non-zero exit; this constraint may not be used to downgrade them to a warning. For those four the rejection must be the cause of the failure and not merely coincident with it, so the criterion pinning them runs on a workspace that succeeds once the manifest is removed. The exit code of the warn-and-continue commands is unchanged by the warning itself. Rationale, from the decision of 2026-06-10: silent fallback is the worst available behavior for a configuration error, because every later result is computed against settings the operator did not choose and cannot see. A manifest setting `specs_dir: customSpecs` and carrying one bad key made `parse` report two specs from a recursive walk instead of the one spec the operator configured, and exit 0."
      type: business
      enforcement: error

    - id: C-32
      description: "MUST parse `settings.annotation` as a block carrying one sub-key, `permissive` (bool, default `false`). `annotation` joins the valid settings keys so C-26 stops rejecting it. The parsed Manifest MUST distinguish a declared block from an absent one: `Settings.Annotation` is non-nil whenever the manifest carries the `annotation` key, and nil when it does not. Every declared form counts, including the two empty ones, `annotation: {}` and a bare `annotation:` with no sub-keys. Both empty forms carry `Permissive == false`, so declaredness and value stay separate facts. Declaredness MUST be read from the raw key set rather than from the decoded pointer, because gopkg.in/yaml.v3 leaves the pointer nil for a bare `annotation:` while allocating it for `annotation: {}` (measured 2026-08-22). An unknown sub-key under `settings.annotation` MUST be rejected with the C-26 error shape: the offending key, the closest valid sub-key by Levenshtein distance ≤ 3, and the valid sub-keys at that level. The block is manifest only. No command registers an `--annotation` flag, per SSRB-104 section 7.3, so `check`, `coverage`, and `sync` MUST reject `--annotation` as an unknown flag. Rationale: a manifest with no `annotation` block must behave exactly as it did in v0.14, and the coverage rule that consumes `permissive` can only stay opt-in if absence is observable at the manifest layer."
      type: technical
      enforcement: error

    - id: C-33
      description: "ParseManifest MUST reject a manifest carrying `settings.annotation.scope` with the staging message from SSRB-104 section 7.7, not with the generic unknown-key error of C-26. Every value is rejected, `test` and `all` alike, and the function returns an error and a nil Manifest. The message MUST state that the key is accepted in SSRB-104, that it is not implemented in v0.15.0, that annotation scope is test-only, and that the operator should remove the key. `scope` is not a valid sub-key and is not a schema field, so this is a validation rule and it adds nothing inert to the manifest surface. Rationale: SSRB-104 is public and its section 1 shows `scope: all` in the v1.0.0 target shape, so an adopter will write the key. A bare unknown-key error reads as a typo and sends that operator looking for the correct spelling of a key that does not exist yet."
      type: technical
      enforcement: error

    - id: C-34
      description: "When a manifest declares both `settings.strictness` and a `settings.annotation` block, the annotation block takes precedence and a warning names the ignored `settings.strictness`. Four parts. (a) The trigger is declaredness of both keys, not their values. C-24 rewrites an absent `strictness` to the default `threshold` at parse time, so a detector reading the parsed string cannot tell an absent key from an explicit `threshold`; declaredness of both keys must be recorded from the raw key set. (b) The detector is a pure function in the manifest package, `CheckAnnotationStrictnessConflict(m *Manifest)`, returning the warning or nil, with no I/O per C-10. The precedent is `CheckTierConflicts` (C-14). (c) `check`, `coverage`, and `sync` MUST write the warning to stderr. Those are the three commands that read a strictness level. The warning names `settings.strictness`, its declared value, and `settings.annotation` as the key that takes precedence. The exit code is not changed by the warning itself. (d) While the block is declared, no observable result may vary with the `settings.strictness` value. This constraint pins only that `strictness` stops mattering; what governs instead is set by the coverage rule in roadmap item 1D-b and is deliberately not decided here. The rule reads manifest keys only. The `--strictness` flag keeps its current behavior until v1.0.0 per SSRB-104 section 1, and this constraint does not define a conflict between that flag and the block. Rationale, from SSRB-104 section 7.1: `strictness: annotation` says markers alone are sufficient evidence, while an `annotation` block says every criterion must have a test. That is a lenient posture and a strict one in the same file. Silence is the worst available option, because the manifest would read as though `strictness` still applied."
      type: business
      enforcement: error

  acceptance_criteria:
    - id: AC-01
      description: "Valid specter.yaml with all sections parses into Manifest struct"
      inputs:
        yaml: "system.name + domains + settings + registry"
      expected_output:
        manifest: "fully populated Manifest struct"
      references_constraints: ["C-01"]
      priority: critical

    - id: AC-02
      description: "Missing system.name returns validation error"
      inputs:
        yaml: "specter.yaml without system.name"
      expected_output:
        error: "system.name is required"
      references_constraints: ["C-02"]
      priority: critical

    - id: AC-03
      description: "Invalid tier (0, 4, -1) returns validation error"
      inputs:
        yaml: "system.tier: 4"
      expected_output:
        error: "tier must be 1, 2, or 3"
      references_constraints: ["C-03"]
      priority: high

    - id: AC-04
      description: "Spec with explicit tier ignores domain and system tier"
      inputs:
        spec_tier: 3
        domain_tier: 1
        system_tier: 2
      expected_output:
        resolved_tier: 3
      references_constraints: ["C-04"]
      priority: critical

    - id: AC-05
      description: "Spec without tier inherits domain tier"
      inputs:
        spec_tier: 0
        domain_tier: 1
      expected_output:
        resolved_tier: 1
      references_constraints: ["C-04"]
      priority: critical

    - id: AC-06
      description: "Spec without tier or domain inherits system tier"
      inputs:
        spec_tier: 0
        domain_tier: 0
        system_tier: 2
      expected_output:
        resolved_tier: 2
      references_constraints: ["C-04"]
      priority: high

    - id: AC-07
      description: "Spec without any tier info defaults to 2"
      inputs:
        spec_tier: 0
        domain_tier: 0
        system_tier: 0
      expected_output:
        resolved_tier: 2
      references_constraints: ["C-04"]
      priority: high

    - id: AC-08
      description: "Defaults() returns sensible manifest when no specter.yaml exists"
      expected_output:
        specs_dir: "specs"
        coverage_t1: 100
        coverage_t2: 80
        coverage_t3: 50
      references_constraints: ["C-05"]
      priority: high

    - id: AC-09
      description: "BuildRegistryFromSpecs produces entries for all parsed specs"
      inputs:
        specs: "3 specs with IDs checkout, login, blog"
      expected_output:
        registry_count: 3
      references_constraints: ["C-06"]
      priority: critical

    - id: AC-10
      description: "Specs in domains get correct domain field in registry"
      inputs:
        spec_id: "checkout"
        domain: "payments"
      expected_output:
        registry_domain: "payments"
      references_constraints: ["C-06"]
      priority: high

    - id: AC-11
      description: "DomainCoverage aggregates per-spec coverage into per-domain summary"
      inputs:
        domain: "payments"
        specs_in_domain: 3
        coverage_pcts: [100, 90, 80]
      expected_output:
        avg_coverage: 90
        passing: 3
      references_constraints: ["C-07"]
      priority: high

    - id: AC-12
      description: "ScaffoldManifest produces valid YAML that round-trips through ParseManifest"
      inputs:
        name: "my-app"
        spec_ids: ["auth", "payments"]
      expected_output:
        parse_ok: true
      references_constraints: ["C-08"]
      priority: high

    - id: AC-13
      description: "All existing commands produce identical output without specter.yaml"
      references_constraints: ["C-09"]
      priority: critical

    - id: AC-14
      description: "Manifest package has zero CLI or I/O dependencies"
      references_constraints: ["C-10"]
      priority: high

    - id: AC-15
      description: "Manifest with settings.strict: true parses with Strict=true in Settings struct"
      inputs:
        yaml: "settings:\n  strict: true"
      expected_output:
        settings_strict: true
      references_constraints: ["C-11"]
      priority: high

    - id: AC-16
      description: "Manifest with settings.warn_on_draft: true parses with WarnOnDraft=true in Settings struct"
      inputs:
        yaml: "settings:\n  warn_on_draft: true"
      expected_output:
        settings_warn_on_draft: true
      references_constraints: ["C-12"]
      priority: high

    - id: AC-17
      description: "SpecTemplate('api-endpoint') returns valid YAML that passes ParseSpec()"
      inputs:
        template: "api-endpoint"
      expected_output:
        parse_ok: true
        status: "draft"
      references_constraints: ["C-13"]
      priority: high

    - id: AC-18
      description: "SpecTemplate returns error for unknown template type"
      inputs:
        template: "nonexistent"
      expected_output:
        error_non_nil: true
      references_constraints: ["C-13"]
      priority: high

    - id: AC-19
      description: "settings.tier_overrides parses into Settings.TierOverrides as a map of spec id to tier. A manifest declaring payment-intent: 1 and auth-login: 3 yields both entries with those values. This criterion pins parsing only. It does NOT assert that the override resolves a tier, because no command applies it; the prior wording claimed ResolveTier returns the override value, which it never has."
      inputs:
        yaml: "settings:\n  tier_overrides:\n    payment-intent: 1\n    auth-login: 3"
      expected_output:
        parsed_payment_intent: 1
        parsed_auth_login: 3
        resolution_asserted: false
      references_constraints: ["C-14"]
      priority: high

    - id: AC-20
      description: "When spec declares tier: 2 and tier_overrides assigns tier: 1 for that spec, a tier_conflict warning is emitted listing both values"
      inputs:
        spec_tier: 2
        tier_overrides: "payment-intent: 1"
        spec_id: "payment-intent"
      expected_output:
        warning_type: "tier_conflict"
        warning_lists_both_values: true
      references_constraints: ["C-14"]
      priority: high

    - id: AC-21
      description: "ScaffoldManifest output contains the literal string 'https://github.com/Hanalyx/specter' in the header comment. It does NOT contain 'spec-dd' or any other repo slug. The URL is verifiable with a substring check against the full scaffold YAML."
      inputs:
        name: "my-app"
        spec_ids: []
      expected_output:
        contains_url: "https://github.com/Hanalyx/specter"
        does_not_contain: "spec-dd"
      references_constraints: ["C-15"]
      priority: high

    - id: AC-22
      description: "ScaffoldManifest called with an empty spec_ids slice and candidatesCount=0 (greenfield) still emits `domains:` with a `default` entry whose description guides the operator to add spec IDs. Called with empty spec_ids but candidatesCount > 0 (drift), the default domain description names the discovery-but-parse-failure mismatch and points at `specter doctor`."
      inputs:
        case_greenfield: "spec_ids=[], candidates=0"
        case_drift: "spec_ids=[], candidates=3"
      expected_output:
        greenfield_has_domains_default: true
        greenfield_description_contains: "Add spec IDs"
        drift_description_contains: "could not be parsed"
      references_constraints: ["C-16"]
      priority: high

    - id: AC-23
      description: "Running `specter init --refresh` on a workspace with an existing `specter.yaml` that has `domains.default.specs: [\"spec-a\"]`, `settings.strict: true`, and a custom `domains.auth.specs: [\"spec-b\"]` — after adding spec-c to specs/ on disk — produces: `domains.default.specs: [\"spec-a\", \"spec-c\"]`, unchanged `settings.strict`, unchanged `domains.auth`. A pure helper RefreshManifestDomains(existing, discoveredIDs) returns the updated Manifest deterministically."
      inputs:
        existing: "domains.default.specs=[spec-a], domains.auth.specs=[spec-b], settings.strict=true"
        discovered: "[spec-a, spec-b, spec-c]"
      expected_output:
        default_specs: ["spec-a", "spec-c"]
        auth_specs: ["spec-b"]
        strict_preserved: true
      references_constraints: ["C-17", "C-18", "C-19"]
      priority: critical

    - id: AC-24
