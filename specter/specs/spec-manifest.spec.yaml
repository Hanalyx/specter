      references_constraints: ["C-30"]
      priority: critical

    - id: AC-47
      description: "`specter parse` in a workspace whose `specter.yaml` declares `specs_dir: customSpecs` and one unknown settings key writes a stderr warning naming the manifest path and the unknown key, plus a second line saying default settings are in effect, and then parses with defaults. Stdout still lists both `customSpecs/demo.spec.yaml` and `specs/decoy.spec.yaml`, because the default walk finds both, and the exit code is 0. Before this change the same run printed both files with nothing on stderr."
