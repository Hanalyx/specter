    - id: AC-46
      description: "ParseManifest MUST reject `settings.specs_dir` values that could escape the workspace: absolute paths, paths containing any `..` segment, and lexically-cleaned paths that resolve outside the manifest's directory. The empty value (default) MUST continue to parse and resolve to `specs`. Error message MUST name `specs_dir` and the offending value so the operator can correct it. Closes the v0.13 security audit H1 finding — a malicious workspace dropping `specter.yaml` with `settings.specs_dir: /home/victim` previously caused `filepath.Walk` to scan outside the workspace, and `doctor --fix` to write back to absolute paths."
      inputs:
        case_absolute_unix: "settings.specs_dir: /etc"
        case_absolute_windows: "settings.specs_dir: C:\\\\Users\\\\victim"
        case_parent_traversal: "settings.specs_dir: ../../../home/victim"
        case_clean_escape: "settings.specs_dir: foo/../../../home/victim"
        case_relative_ok: "settings.specs_dir: specs"
        case_nested_ok: "settings.specs_dir: src/specs"
        case_default: "settings absent"
      expected_output:
        absolute_unix_parse_error: true
        absolute_windows_parse_error: true
        parent_traversal_parse_error: true
        clean_escape_parse_error: true
        relative_ok_parses: true
        nested_ok_parses: true
        default_parses_with_specs: true
