    - id: AC-50
      description: "A valid manifest produces no warning. With the unknown key removed and `specs_dir: customSpecs` kept, `specter parse` lists only `customSpecs/demo.spec.yaml`, writes nothing to stderr, and exits 0. A fix that warns unconditionally, or that ignores the manifest whether or not it parsed, fails this criterion."
      inputs:
        manifest: "schema_version: 1, system.name: demo, settings.specs_dir: customSpecs"
        workspace: "customSpecs/demo.spec.yaml and specs/decoy.spec.yaml, both valid"
