    - id: AC-51
      description: "The commands that already reject a bad manifest keep rejecting it, and the rejection is the only thing that can make them fail. This criterion runs on its own workspace, not the AC-47 one: the same manifest, but every declared criterion is annotated, so a run that merely ignored the manifest and continued against defaults exits 0. On that workspace `specter check`, `specter coverage --strictness annotation`, `specter sync --strictness annotation`, and `specter init --refresh` each exit non-zero with the parser's reason on stderr, and `init --refresh` leaves `specter.yaml` byte-unchanged. Turning any of these into a warn-and-continue path fails this criterion. The exit code is the discriminator, because the warning line a warn-and-continue path prints names `settings.test_glob` itself and satisfies the stderr check by another route. The AC-47 workspace cannot serve here: it declares two specs and no annotated tests, so under warn-and-continue `coverage` and `sync` still exit non-zero at 0 percent coverage, and both commands pass the criterion while doing the thing it forbids (`bugs/SP-SP-041`). AC-47 through AC-50 keep that workspace, which their own claims rest on."
      inputs:
        manifest: "schema_version: 1, system.name: demo, settings.specs_dir: customSpecs, settings.test_glob: 'tests/**/*.go' (the same rejected manifest AC-47 uses)"
        workspace: "customSpecs/demo.spec.yaml (spec id demo-spec, tier 3, AC-01 and AC-02) and specs/decoy.spec.yaml (spec id decoy-spec, tier 3, AC-01 and AC-02), plus tests/all_test.go annotating all four criteria"
        precondition: "with specter.yaml removed, `specter check`, `specter coverage --strictness annotation` and `specter sync --strictness annotation` each exit 0 on this workspace, because the default walk finds both specs and every criterion is annotated. `init --refresh` is the one command whose exit code is not the discriminator, since it reports a missing manifest as its own error; the byte-unchanged clause is what forbids it from refreshing against defaults."
        commands: ["specter check", "specter coverage --strictness annotation", "specter sync --strictness annotation", "specter init --refresh"]
      expected_output:
        each_exit_code: "non-zero"
        each_stderr_contains: "settings.test_glob"
        manifest_byte_unchanged_after_init_refresh: true
        precondition_exit_code_without_manifest: "0 for check, coverage and sync; init --refresh reports the missing manifest as its own error"
      references_constraints: ["C-31"]
      priority: high

    - id: AC-52
      description: "ParseManifest on `settings.annotation.permissive: true` returns a Manifest whose `Settings.Annotation` is non-nil with `Permissive == true`. On `settings.annotation.permissive: false` it returns non-nil with `Permissive == false`. On a manifest carrying no `annotation` key at all it returns `Settings.Annotation == nil`. The two empty forms, `annotation: {}` and a bare `annotation:` with no sub-keys, both return non-nil with `Permissive == false`, so a declared block is distinguishable from an absent one no matter how the operator wrote it. The bare form is the discriminating case: gopkg.in/yaml.v3 leaves the pointer nil there, so an implementation that reads declaredness from the decoded pointer alone fails this criterion while passing every other case."
      inputs:
        case_true: "settings.annotation.permissive: true"
        case_false: "settings.annotation.permissive: false"
        case_empty_map: "settings.annotation: {}"
        case_bare_key: "settings.annotation: (no sub-keys, null value)"
        case_absent: "settings with no annotation key"
      expected_output:
        true_annotation_non_nil: true
        true_permissive: true
        false_annotation_non_nil: true
        false_permissive: false
        empty_map_non_nil_permissive_false: true
        bare_key_non_nil_permissive_false: true
        absent_annotation_is_nil: true
      references_constraints: ["C-32"]
      priority: critical

    - id: AC-53
      description: "An unknown sub-key under `settings.annotation` is rejected with the C-26 error shape. `settings.annotation.permisive: true` (one s) returns an error naming `permisive`, suggesting `permissive`, and listing the valid sub-keys at that level. `settings.annotation.bogus: 1` returns an error naming `bogus` and listing the valid sub-keys. Both return a nil Manifest. This is the generic shape that AC-55 requires `scope` NOT to receive, so the two criteria together separate the special case from the general one."
      inputs:
        case_typo: "settings:\n  annotation:\n    permisive: true"
        case_unrelated: "settings:\n  annotation:\n    bogus: 1"
      expected_output:
        typo_error_contains: "permisive"
        typo_error_did_you_mean: "permissive"
        unrelated_error_contains: "bogus"
